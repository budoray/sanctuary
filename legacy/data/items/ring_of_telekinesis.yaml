name: Ring of Telekinesis
classes: any
description: Allows the wearer to use telekinesis, similar to the 5th level magic user spell, with a 1 segment casting time. The ring comes in five different strengths; roll d100 and consult the table below. This is a very powerful item and the GM may wish to give the ring of telekinesis a limited number of charges. D100 MAXIMUM WEIGHT IN LBS D100 MAXIMUM WEIGHT IN LBS 01–25 25 90–99 200 26–50 50 00 400 51–89 100
source: OSRIC_3.0_Gamemaster_Guide.pdf
