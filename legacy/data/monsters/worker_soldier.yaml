description: Giant honeybees live in hives. These lairs will contain non-com- batant queens (10 HD but no effective attack) and 2d3 non-com- batant drones (2 HD and no effective attack). Giant honeybees  will flee from smoke or fire unless their lair is threatened. Giant bee hives will always contain honey worth 10d10 gold  pieces. There is a 15% chance that a hive will contain royal jel - ly. If it does, the royal jelly can be fashioned into 2d3 potions  of extra healing by a magic-user of 7th or higher level—or a  magic-user of 12th level or higher may make it into an unguent  which preserves the appearance of youth. Regular application  of this unguent for 1 year makes the user appear 2d3 years  younger. Such an unguent is typically worth 3d6x1,000 gp to  wealthy nobles.
abilities:
- heading: Special Attacks
  text: One Poison Sting. A giant bee can only sting once per encoun - ter; it has a 25% chance of dying after stinging, otherwise the  stinger will slowly regrow. The sting is poisonous; if it hits, the  target must make a saving throw vs. poison or take additional  points of poison damage. For worker bees the saving throw is  made with no penalty and the additional damage is 2d4. For  soldier bees, the saving throw is made at a -1 penalty and the  additional damage is 5d4. BEE, GIANT (BUMBLEBEE)
