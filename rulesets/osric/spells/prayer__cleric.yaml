name: Prayer
slug: prayer
reversible: false
class: cleric
level: 3
school: Clerical Conjuration/Summoning
range: '0'
duration: 1 round/caster level
area_of_effect: 60-ft radius
components: V,S,M
casting_time: 6 segments
saving_throw: None
text: Casting prayer is a matter of intoning an invocation to the cleric's god(s), following which any of the cleric's allies who were in the spell's area of effect will gain, for the duration of the spell, the same benefits as if they were affected by an ongoing chant spell. Note that the cleric is able to move and take other actions while the prayer spell is in effect, which is not the case with the more restricted chant spell.
source: wiki2_spells.txt
