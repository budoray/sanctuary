name: Dragon Control
classes: any
description: Drinking this potion grants power equivalent to a charm monster upon a dragon of a type determined by the table below. Each potion affects only one type of dragon unless otherwise indicated. The drinker is able to control a dragon within 60ft for the duration of 5d4 rounds. Roll on the table below for the specific type of dragon control potion. D20 RESULT VALUE (GP) 1–2 Black dragon control 12,000 3–4 Blue dragon control 14,000 5–6 Brass dragon control 12,000 7 Bronze dragon control 14,000 8–9 Copper dragon control 13,000 10 Gold dragon control 16,000 11–13 Green dragon control 13,000 14 Red dragon control 15,000 15 Silver dragon control 15,000 16–17 White dragon control 10,000 18–19 All evil dragons 20,000 20 All good dragons 20,000 A saving throw is allowed, and if only one dragon is to be affected it receives -4 to this roll. If two dragons are to be affected they receive +2 to this roll.
source: OSRIC_3.0_Gamemaster_Guide.pdf
