name: Animal Growth
slug: animal_growth
reversible: true
class: magic-user
level: 5
school: Arcane Transmutation/Alteration
range: 60-ft
duration: 1 round/level
area_of_effect: Up to 8 animals in a 20-ft square area
components: V,S
casting_time: 5 segments
saving_throw: None
text: This spell causes up to 8 animals in the area of effect to grow to twice normal size, doubling their hit dice and the damage they inflict. The spell does not influence the animals' attitude toward the caster, so it is advisable to ensure ahead of time that they are friendly. The reverse of the spell halves their size and damage inflicted.
source: wiki2_spells.txt
