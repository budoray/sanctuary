name: Ring of Spell Turning
classes: any
description: 'This magic ring creates a powerful magic aura around the wearer that will partially reflect any spells cast at him or her back onto the spell caster. There are three exceptions to the spell turning ability the ring bestows: • Area effect spells which are not directly targeted upon the ring-bearer cannot be turned. • Touch-based spells cannot be turned. • Spell effects delivered by devices are not turned. Examples include: rods, staves, wands, rings. Note: spell scrolls are not considered devices. When a spell is cast at the wearer of the ring of spell turning, they roll a d10 and multiply the result by 10. When damage from the spell attack is determined, the number generated by this roll indicates what percentage of the damage is reflected back upon the attacker. Thus if “6” appears on the d10, 60% of the damage rolled would be deducted from the attacking spell-caster’s hit points and 40% from the target. Further, for each 10% of difference between the damage percentage rolled
  and 100%, the ring-bearer gains +1 to their saving throw. Going back to the example above, the spell’s target would get a +6 to their saving throw and the spell caster would gain a +4. The ring of spell turning also grants a saving throw against spells which normally do not allow one. In such a case, the save will be half of the percentage die roll for spell reflection. Returning once again to the example above, the ring wearer rolling a 60% chance of reflecting an attacking spell would gain a 30% saving throw, reducing or negating effects as appropriate to the spell. Spells that only affect a certain number of levels must be able to affect the target’s and caster’s levels combined, otherwise the spell has no effect on either party. If the ring’s wearer wishes to receive the effects of a targeted spell, they must first remove the ring. (Healing spells are exempt, since they are touch-based.) If both caster and target are wearing rings of spell turning, roll d100 and consult the table below.
  D100 RESULT 01–70 Spell fails completely, no effect on target or caster 71–80 Spell takes full effect on both target and caster 81–97 Spell fails and both rings are destroyed 98–00 A rift into another plane or dimension opens, both target and caster are sucked in'
source: OSRIC_3.0_Gamemaster_Guide.pdf
