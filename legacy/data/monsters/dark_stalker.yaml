name: Dark Stalker
frequency: very rare
no_encountered: 1 (see below)
size: medium
alignment: chaotic neutral
move: 90ft
armour_class: 0 [20] (or 8 [12]; see below
hit_dice: 2+1
melee_attacks: 1 short sword (1d6)
senses: Infravision 120ft
lair_chance: 20%
intelligence: average (8-10)
morale: 60
loot: See below
experience: 200 +3/hp
description: 'Dark stalkers are the leaders of the dark creepers, though it  is not known whether they are dark creepers altered through  some means either genetic or magical, or if they are a breed  apart. What is known for certain is the dark stalker is much tall- er than its dark creeper followers and one will be found as the  leader of any dark creeper village. In an area settled by at least  25 solitary dark creepers there is a 90% chance there will be a  dark stalker in the area, increased by 2% for every 5 additional  creepers. A dark stalker is rarely encountered away from their  clan, but if such an encounter occurs the stalker is probably on  some mysterious personal mission and will not engage in com- bat unless forced to do so. Dark stalkers carry their treasure in their robes like dark creep- ers: 30% chance of magic short sword, 10% of magical rings  (worn if possible), 10% chance of either 2d4 gems or 1d2 items  of jewellery to be determined randomly by GM.'
abilities:
- heading: Special Features
  text: 'Thief Abilities. Dark stalkers have all the skills of a 4th level thief. Spell-Like Abilities. 3/day: Detect magic and create darkness.  In both cases, duration is 1 hour, and the effect is in a 50ft  radius around the target point. Any magical sources of light  have a 20% chance to avoid the effects of darkness upon  that item only. If an item is affected, it will resume normal  function after 1 hour. 2/day: wall of fog Death Fire. When a dark stalker dies, it explodes in a sickly blue  3d8 fireball blast with a radius of 10ft. Magic items carried by  the stalker have a 75% chance of surviving the blast in usable  condition. Deadly in Darkness: In darkness, the dark stalker’s armour class  is 0 [20]. In light, the armour class is 8 [12].'
- heading: Special Attacks
  text: 'Ranged Attack. Dark stalkers can attack with ranged weapons as  humans can. Unarmed Combat.  Dark stalkers can make grappling or over - bearing attacks. If not fended off, they score an unarmed hit  with a 2+ on 1d20. Hit Mods: ATK/DEF +6/-6. Overbear Results  Mods: ATK/DEF +0/+0. Grappling Result Mods: ATK/DEF +0/+0. DEMONS Demonologists have identified several classes of demon. Each  class of demon possesses a variety of powerful, supernatural  abilities. Those abilities common to all demons are noted be - low. For further information on both the classified and unclassi- fied demons, see the individual demon listings. Note that most  demons do not actually fall into the six listed categories. Many demons possess the following magical abilities: infravision  (as the 3rd level magic-user spell), teleport (with no chance of  error) (as the 5th level magic-user spell), darkness and gate (as  the 9th level magic-user spell). See individual listings for details. Demons can freely travel
    between their own home planes and  Tartarus, Pandemonium and Hades. They may also travel the  Astral Plane at will. However, they are only able to enter the  Prime Material Plane if summoned with a spell ( conjuration,  gate, wish, etc.) or certain magical items. Demons are all extremely and decidedly chaotic evil (see “Align- ment”). Demonic society is highly competitive and always fa - vours the strong over the weak. In combat, demons are fearless and the less intelligent among  them will attack mindlessly until slain. They are immune to subdual attacks and may simultaneously  attack as many opponents as their abilities allow. Being supremely chaotic, demons will never willingly serve an - other. If compelled into service through magical or other means,  they will always seek a way to either kill or enslave their master,  or at the very least, subvert the terms of their summoning. While  demons may be summoned by higher-level PCs, they will prove  highly difficult to control. Thaumaturgic
    circles are proof against  demons, but require increasingly complex preparation and ma- terials for the more powerful sorts. Often summoning will entail  either a threat of punishment or a reward. These should be con- sidered carefully by the GM during play and should always carry  an element of risk for the summoner. Demons are repulsed by good artifacts or other powerful holy  items. On the Prime Material Plane, demons may be turned by clerics  of levels 8+ and paladins of levels 11+. Summary of Resistances: ATTACK FORM DAMAGE ROLLED Acid Full damage Cold Half damage Electricity (lightning bolt) Half damage Fire (dragon breath, fireball) Half damage Gas, poisonous (cloudkill) Half damage Iron Weapons Full damage'
