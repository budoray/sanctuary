description: 'Jackals are small mammals, 2ft to 3ft long and weighing about 25 lbs. They  are muzzle-snouted, fur-covered, four-legged and long-tailed nocturnal  scavengers and occasional predators. They generally hunt and forage  singly or in mated pairs, but occasionally gather in  small packs to bring down difficult prey. Jackals can  be found in subtropical grasslands, woodlands and  wastelands, and occasionally in more mountainous  terrain. They are most active at dawn and dusk, which  has occasionally led to them being revered by death  cults. The small size of the jackal makes it cautious and an  unlikely combatant, but they can bite if necessary,  such as when defending their cubs. Huge jackals are  larger, more aggressive and have a stronger bite, but  are otherwise similar. Giant jackals are almost cer - tainly unnatural and are known to often be associ - ated with religious groups. Though they are thought  to usually behave as other Jackals, there are rumours  that some possess
  a greater degree of intelligence  and an evil will. Unarmed Combat (Normal and Big):  Normal and Huge  jackals cannot be targeted with grappling or over - bearing attacks, but they may overbear. If not fend - ed off, they score an unarmed hit with a 2+ on 1d20.  Hit Mods: ATK/DEF +8/na. Overbear Results Mods:  ATK/DEF +0/na. Unarmed Combat (Giant):  Giant jackals cannot be tar - geted with grappling or overbearing attacks, but they  may overbear. If not fended off, they score an un - armed hit with a 2+ on 1d20. Hit Mods: ATK/DEF +10/ na. Overbear Results Mods: ATK/DEF +2/na.'
