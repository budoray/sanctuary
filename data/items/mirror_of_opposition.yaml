name: Mirror of Opposition
classes: M
description: Upon activation by command word, this 4ft tall by 3ft wide mirror can create a hostile duplicate of anyone looking into the mirror. The duplicate will step through and immediately engage the original in a fight to the death. The opposite will have all the equipment, ability and knowledge of the original. When the fight is over, and whether the duplicate won or lost, the reflected opponent and items disappear. The mirror can function up to four times per day.
source: OSRIC_3.0_Gamemaster_Guide.pdf
