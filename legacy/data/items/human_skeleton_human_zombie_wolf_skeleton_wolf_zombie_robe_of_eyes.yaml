name: Human skeleton Human zombie Wolf skeleton Wolf zombie Robe of Eyes
classes: IM
description: The wearer of this magical clothing is able to see in all directions at once. The robe also grants infravision to 120ft, and can see invisible and ethereal objects within the same distance. The wearer gains a 1 in 6 better chance to locate secret or concealed doors, never loses their dexterity bonus to AC, and cannot be surprised—but also cannot avert their eyes to avoid a gaze attack from a creature such as a medusa. Light or continual light cast at the robe blinds the wearer for 1d3 rounds.
source: OSRIC_3.0_Gamemaster_Guide.pdf
