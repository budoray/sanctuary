id: 1.3.13a
name: ATTACK RATE WITH SPECIALISED WEAPON
source: OSRIC-3.0-Player-Guide-FINAL.v.7.pdf
lines:
- LEVEL OF
- SPECIALIST
- MELEE
- WEAPON
- PULLED BOW
- (LONG OR SHORT)  LIGHT CROSSBOW HEAVY CROSSBOW
- 1-6 3/2 RoF 2 (normal) RoF 1 (normal) RoF 0.5 (normal)
- 7-12 2/1 RoF 3 RoF 2 in odd numbered rounds only RoF 1
- 13+ 5/2 RoF 4 RoF 2 RoF 2 in odd numbered rounds only
- “RoF” means “rate of fire.” Specialising in a missile weapon does
- not increase your attack rate, but it does increase the number
- of shots you can take during your combat segment when at -
- tacking with the specialised weapon.
- The difference between “RoF” and “attack rate” is that RoF may
- give you extra attacks in your normal initiative segment (the ini-
- tiative die roll, possibly modified by a Dex modifier). A better
- attack rate changes the initiative segment in which you attack
- (usually segments 1 and 10).
- A melee attack combination of 5/2 means you are able to make
- a repeating pattern of 3 attacks in round 1, and 2 attacks in
- round 2. The three attacks in round 1 take place (regardless of
- initiative roll) in segments 1, 5, and 10. The two attacks in round
- 2 take place (regardless of initiative roll) in segments 1 and 10.
- 'Double Specialisation (optional): For melee weapons that are'
- not pole arms or two-handed swords, a third weapon proficien-
- cy may be used to specialise further; this increases combat bo -
- nuses to +3 “to hit” and +3 damage with the weapon. This rule
- was added to AD&D in a later supplement, so it can be disal -
- lowed by the GM.
- 1.3.13. WEAPON SPECIALISATION
- 'OPTIONAL RULE: Fighters, rangers, and paladins can take pro -'
- ficiency in the same weapon twice (see below for cost). This is
- called your Specialised Weapon. You can only take a specialised
- weapon during character creation (unless a wish spell or similar
- boon allows it later).
- Specialising in a weapon costs two of your proficiencies (for me-
- lee weapons and crossbows), or three of your proficiencies for
- missile weapons other than crossbows. The weapon type must
- 'be exact: you cannot specialise in “swords”; you must specialise'
- in “longsword”, “short sword”, etc.
- When you attack with your Specialised Weapon, you can add
- '+1 to your roll to hit and +2 to your damage roll. Note: These'
- bonuses aren’t magical, so they don’t let you hit a creature that
- can only be hit by magical weapons.
- Using a Specialised Weapon also increases the number of at -
- 'tacks you can make:'
