name: Unguent of Timelessness
classes: any
description: When applied to any formerly living matter, this unguent slows the effect of time upon that object, such that a year’s passing ages the item but a day. The item gains +1 to all saving throws. The unguent does not wear off, though its magic can be dispelled. One vial of unguent of timelessness can coat 8 normal-sized objects.
source: OSRIC_3.0_Gamemaster_Guide.pdf
