name: Strand of Prayer Beads
classes: C
description: 'A cleric carrying or holding the prayer beads will intuitively know the powers they grant and how to use the beads as soon as they cast a spell. Each strand has at least two beads on it, granting a different power according to the table below. BEAD TYPE ABILITY GRANTED Blessing Cast bless spell Healing Cast choice of cure serious wounds, cure blindness or deafness, or cure disease Karma Cast spells at +4 user level of ability for 10 rounds Smiting Cast spiritual weapon, flame strike, or cause blindness Summons Summons extra-planar ally appropriate to caster’s alignment* Wind Walking Cast wind walk * Creatures summoned might be demons or devils but never a deity. Misusing this bead by summoning a divine ally for trivial reasons may incur the wrath of the cleric’s deity, along with a geas to teach the character humility and wisdom. Lesser Strand of Prayer Beads: Bead of blessing, bead of healing. Strand of Prayer Beads: Beads of healing, karma and smiting. Greater Strand of Prayer
  Beads: Beads of healing, karma, summons, and wind walking. The following beads are activated by a command word: blessing, healing, smiting, and wind walking. The beads of karma and summons can be activated by any character capable of casting divine magic spells simply by willing it. All beads except for the bead of summons can be used once per day. The bead of summons disappears after 1 use. If a bead is removed from the strand it immediately and forever loses its power. The beads need not be worn by the cleric but they must have them somewhere on their person.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
