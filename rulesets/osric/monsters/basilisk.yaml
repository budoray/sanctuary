description: The basilisk is an eight-legged, reptilian creature with baleful  eyes and a deadly gaze.
abilities:
- heading: Immunities and Resistances
  text: Reflected Gaze.  The basilisk is vulnerable to its own reflected  gaze. If confronted with a reflective surface, it must make a  saving throw vs petrifaction (with a bonus of +4) or be turned  to stone.
- heading: Special Features
  text: Petrifying Gaze. Any creature meeting the gaze of a basilisk must  successfully save vs petrifaction or instantly be turned to stone  (save each time the gaze is met). The gaze effects of the basilisk  extend into both the astral and ethereal planes. This applies  to anyone who is generally in front of the basilisk, and not us - ing an indirect method of sight such as a mirror. Attacking the  creature by looking at a reflection incurs a to-hit penalty of -2.  Attacking blindly incurs a to-hit penalty of -4. Unarmed Combat.  Basilisks cannot be overborne or grappled,  and do not employ these tactics. BAT
