name: Zombies Axe of Hurling
classes: AFPR
description: 'A +2 magic hand axe specially made for throwing up to 60ft and retaining both its “to hit” and damage bonus when used as a missile weapon. Crossbow of Accuracy (AFPRT): Besides a +3 bonus on “to hit” and damage rolls, all attacks with this weapon are considered short range. 10% of these weapons are heavy crossbows. Crossbow of Range (AFPRT): This +1 crossbow has double the range in all categories of standard crossbows. 20% of these weapons are heavy crossbows. Crossbow of Speed (AFPRT): This +1 weapon allows double the normal firing rate of normal crossbows. When determining randomly, 10% of these weapons are heavy crossbows.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
