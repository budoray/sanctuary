name: Silversheen
classes: any
description: A viscous liquid. When applied to a weapon, silversheen bestows the ability for the weapon to hit any creature, negating any immunities (a werewolf may be hit with a regular sword, for instance). One application lasts for 1 hour and a vial contains enough to coat a single melee weapon or 20 units of ammunition.
source: OSRIC_3.0_Gamemaster_Guide.pdf
