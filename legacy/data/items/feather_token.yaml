name: Feather Token
classes: any
description: 'A small feather ensorcelled to provide a specific item suitable for a special need. A feather token is a single-use item. • Anchor: Becomes a magical anchor which will render a water craft immobile for 1 day. Market value is 50 gp. • Bird: Transforms into a magical carrier pigeon capable of unerringly bearing a message to its intended recipient. The transformation lasts until the message is delivered. Market value is 300 gp. • Fan: Creates a huge fan which generates a breeze sufficient to propel one ship at approx 25 mph. Though this wind is not cumulative with existing winds, the fan can be used to decrease existing wind to create an area of calm. Note that such a usage will not decrease wave size. The fan can be used for up to 8 hours and will not function on land. Market value is 200 gp. • Swan Boat: Creates a swan-like boat capable of sailing at 60ft and carrying 8 mounted troops and their gear or up to 32 medium-sized characters. The boat lasts for 1 day. Market value
  is 450 gp. • Tree: Causes a great oak to spring into being. The tree has a 5ft diameter trunk, is 60ft tall, and has a 40ft diameter of branches at its widest point. This is a permanent transformation. Market value is 400 gp. • Whip: Forms a dancing weapon that will wield itself against any opponent designated by the user, attacking as a 10th level fighter and doing 1d6+1 damage. The whip is a +1 weapon and lasts for 1 hour. Market value is 500 gp.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
