name: Scarab of Death
classes: any
description: 'Though this small oval pin appears to be any one of the many beneficial jewellery items known to exist, it is actually very dangerous. If carried, held, or worn for more than 1 round by any living creature the pin turns into a burrowing beetle-like monster. The beetle will immediately rip through the wearer’s clothing and into the flesh, burrowing its way into the heart in 1 round and killing the victim. The victim has one chance to grab this burrowing horror by saving vs death magic but even if successful 3d6 points of damage are caused by the attack. If the victim successfully tears the beetle away before it burrows out of sight it will revert to its scarab form. For long term storage the scarab can be prevented from coming to life by placing it in a container of bone, ceramic, ivory, metal, or wood. Shield -1, Missile Attractor (CDFPR): This shield’s armour penalty negates the advantage to AC carrying a shield gives. Worse, the bearer of the shield is twice as likely to
  attract missile fire when the group they are in is subjected to non-directed missile fire. Spear, Cursed Backbiter (ADFPR): This +2 weapon is suitable for either melee or use as a missile. If the user rolls a natural “1” when attacking a foe in anger, however, the cursed nature of the backbiter causes the shaft of the spear to curve back upon the wielder and strike him or her for damage, instead. If the backbiter was thrown and the attack roll was a natural “1” the missile will double back in mid-flight and unerringly strike the thrower for double damage. After the first time the nature of the cursed backbiter becomes obvious, a small inscription reading “L. LaFleur, Master Smith” will be visible on the weapon’s shaft, close to the spearhead.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
