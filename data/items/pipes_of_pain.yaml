name: Pipes of Pain
classes: any
description: A magic instrument which will cause all hearing it to save vs wands or become enraptured, stopping all actions and listening to the music. When the music stops the victims are cursed with an extreme sensitivity to sound and will immediately take 1d4 points of damage for 2d4 rounds unless in a completely sound-free area. After this time and until the curse is removed, the least noise will cause the victim to be at -1 to AC, to hit, and saving throws.
source: OSRIC_3.0_Gamemaster_Guide.pdf
