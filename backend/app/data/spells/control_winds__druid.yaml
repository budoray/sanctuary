name: Control Winds
slug: control_winds
reversible: false
class: druid
level: 5
school: Druidic Transmutation/Alteration
range: Caster
duration: 1 turn/caster level (see below)
area_of_effect: 40-ft radius/caster level
components: V,S,M
casting_time: 7 segments
saving_throw: None
text: By the power of this spell, the druid can increase or decrease the force of the winds. For every caster level, the druid may change the speed of the wind by 3 miles per hour. An eye of calm with a radius of 40-ft remains around the druid and travels with him or her. The wind force increases (or decreases) at a rate of 3 miles per hour every round until the end of the spell's duration, at which time it will return to normal, also at a rate of 3 miles per hour per turn. Winds can be extremely destructive; ships are at great risk of sinking if wind speed reaches 60 miles per hour, and wind speeds of 75+ mph are as a full-fledged hurricane.
source: wiki2_spells.txt
