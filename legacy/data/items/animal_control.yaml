name: Animal Control
classes: any
description: 'Anyone taking this potion gains the ability to relate to, understand, and manipulate the emotions of a particular type of animal. The type of animal is determined by a die roll (see below). The number of animals affected depends on the size of the animal. The following general sizes and quantities apply: wolf size or smaller, 5d4; up to human size, 3d4; animals up to 1,000 lbs, 1d4. D20 RESULT 1–4 Avian 5–7 Fish 8–11 Mammal, including marsupial 12–13 Any mammal and avian 14–17 Amphibians and reptiles 18–19 Amphibians, reptiles, and fish 20 All listed above Note that unless the potion-drinker has some other means of directly communicating with the animals influenced by the potion, only general emotions or inclinations may be manipulated. Humanoids are unaffected by this potion, and any creature with low intelligence (5) or higher may make a saving throw to resist its effects.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
