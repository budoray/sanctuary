name: Drums of Panic
classes: any
description: A pair of kettle drums about 18-in around, mounted on stands. A simply-scribed “K” can be seen on both drum–heads when light hits the skin from a certain angle. When both drums are sounded all creatures more than 20ft and less than 120ft away are affected by a fear spell, saving throw for reduced effects. Creatures in the 20ft safe zone are completely unaffected. The drums of panic can be sounded once per day.
source: OSRIC_3.0_Gamemaster_Guide.pdf
