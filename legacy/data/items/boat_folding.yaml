name: Boat, Folding
classes: any
description: 'A 12-in×12-in×6-in wooden box which can be used as an ordinary storage container. The box is capable of unfolding itself into two different-sized water vessels, depending upon the command word used. The first type of vessel is a boat 10ft×4ft×2ft and comes complete with: 1 pair of oars, anchor, mast, and lateen sail. The second form, a ship, is 24ft ×8ft×6ft and comes equipped with 5 pairs of oars, anchor, mast, square sail, a deck and hold, a deck cabin, and single rowing seats. Any objects stored in the box before transformation are now stowed in the vessel. The boat can comfortably hold four human-sized passengers and the ship can easily accommodate 15. Upon command, the boat or ship will fold back into a box. Note Regarding Magic Footwear: These items will magically resize to fit any player character class from the OSRIC core rulebook, unless otherwise noted in the item description. The rule of thumb for size limitation is: halfling size at the small end and the very largest
  of humans at the other. As always, however, this may not apply in your campaign at your GM’s discretion. In all cases, both boots must be worn before any magical effect takes place.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
