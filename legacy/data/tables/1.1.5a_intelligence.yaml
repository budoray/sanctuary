- 1.1.6.  WISDOM
- Your character’s wisdom is their alertness, in -
- stincts, willpower, self-control, task focus, and
- empathy. Wisdom is the prime requisite for
- clerics and druids.
- A character with high wisdom might be mature
- and kindly, but could also be an aloof, inscru -
- table hermit or even a manipulative person
- good at tempting others into doing the dirty
- work. You can decide how your character’s
- wisdom score comes across to others.
- High wisdom helps your character to resist
- spells and other magics that affect their de -
- cisions or memory. It’s up to your GM exactly
- which magics are affected, but most GMs ap -
- ply the wisdom modifier to spells and magical
- effects that charm or scare your character.
- This is called a “mental saving throw” in the ta-
- ble to the right.
