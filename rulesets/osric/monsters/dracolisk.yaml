name: Dracolisk
frequency: very rare
no_encountered: 1d2
size: huge
alignment: chaotic evil
move: 90ft; 150ft flying (AA:II)
armour_class: 3 [17]
hit_dice: 7+3
melee_attacks: 3 (1d6/1d6/3d4)
senses: Infravision 60ft
lair_chance: 60%
intelligence: low to average (5-10)
morale: 85
loot: Hoard 3 and 9
experience: 1,000 +10/hp
description: Dracolisks are surmised to be the result of the mating of a black  dragon and a basilisk, though rumours persist of the existence  of other sorts. These fearsome creatures most resemble their  draconic sires, being armoured with thick black scales and hav- ing the horns and sharp toothed maws of their forebears; they  also have six powerful clawed limbs and two large wings.  Although capable of flight, dracolisks are limited to only short  durations, ten or twenty minutes at the most, before they have  to rest, so they principally use this form of movement to swoop  down upon or escape from foes.
abilities:
- heading: Special Features
  text: Additionally, anybody unfortunate enough to be within 30ft of  a dracolisk and meet its gaze must make a saving throw vs pet- rifaction or be turned to stone. As with its basilisk parent, the  gaze attack of the dracolisk extends into the astral and ethereal  planes and those who seek to avoid looking directly at the beast  attack with a -4 penalty.
- heading: Special Attacks
  text: Breath Weapon (3/day). Up to thrice a day, a dracolisk is capable  of shooting an acid stream out of its mouth up to 30ft and with  a width of 5ft; this causes 4d6 damage to anybody caught in  its path, though a successful saving throw vs breath weapons  reduces this by half. Unarmed Combat. Dracolisks cannot be overborne or grappled,  and do not employ these tactics.
- heading: Languages
  text: 'If a dracolisk speaks a language at all, it is usually draconic,  though it may be that some can understand other languages. DRAGONS Dragons are, in many ways, the archetypal adversaries in OS - RIC-compatible games. Some dragons are weak enough that even  a relatively low level party can have a chance to fight a dragon— while others are powerful enough to pose a challenge even to a  high-level party. Even parties of very high average level may well  struggle to defeat a mated pair, or family group, of elder dragons! Dragons come in various colours. In many campaigns, these co- lours are literal—fire-breathing dragons really do always have  red scales—but in others, they may be metaphorical, allowing  (for example) a green or brown “red” dragon. Some campaigns  also allow the possibility of dragons with more than 8 hp per die  and dragons with d10, d12 or even larger Hit Dice are possible. There are some traits that are generally common to all dragons,  no matter the colour or alignment.
    First, if issued with a formal  challenge, a dragon will sometimes agree to fight until subdued  rather than to the death. The GM should rule about the likeli - hood of the dragon’s acceptance and the conditions that apply,  since these will depend on the nature of the challenge and the  alignment of the dragon. Second, dragons grow more powerful  as they age (see Age Categories, below). Dragons do not roll dice  for their hit points or breath weapons; these are determined by  age category, which also influences a saving throw bonus and  the ability to perceive invisible opponents. Third, dragons radi - ate an aura of fear (as the 4th level magic-user spell) affecting  creatures of less than 5th level unless they save vs magic.  Unarmed Combat. Dragons cannot be overborne or grappled. A  dragon might choose to overbear. Stats for unarmed combat  vary by size, so the GM will have to calculate those. (Although  the to-hit number will be 2+). Size and Hit Dice Most dragon types have 3 possibilities
    for their hit dice (Exam - ple: Black dragons have 6 to 8 HD). Roll a d8 to determine a  dragon’s hit dice, with 1-2 indicating the smallest (a black drag - on with 6 hit dice), 3-7 indicating the middle number (a black  dragon with 7 hit dice), and an 8 indicating the highest number  (a black dragon with 8 hit dice). For a dragon with the smallest HD number (our 6HD black drag- on), the dragon’s size will be approximately 4ft of body length  (not including the neck or tail) per age category (see below). The  middle HD number will have a body length of 5ft per age cat - egory, and the highest HD number will have a body length of  6ft per age category. The tails and necks of dragons vary, but  a dragon’s full length is usually about 3-4 times its body length.  Any dragon with a body length of 9ft or less is considered Medi- um, a body length of 10-20ft is Large, and a body length larger  than 20ft is Huge.  Age Categories Roll 1d8 to determine the age category of a randomly-encoun - tered
    dragon. Dragon hit points and breath weapon damage  are determined by the dragon’s age category, and older drag - ons have a bonus to all saving throws.  AGE CATEGORY  AGE HIT POINTS  PER HIT DIE SAVING THROW  BONUS RADIUS OF  INVISIBILITY  DETECTION 1 Hatchling, Younger than 6 years. 1 +0 10ft 2 Young dragon, 6 years to 15 years 2 +0 20ft 3 Adolescent dragon, 16 years to 25 years 3 +0 30ft 4 Young adult dragon, 26 to 50 years 4 +0 40ft 5 Adult dragon, 51 to 100 years 5 +1 50ft 6 Old dragon, 101 to 200 years 6 +2 60ft 7 Very old dragon, 201 to 400 years 7 +3 70ft 8 Ancient, 401 years and older 8 +4 80ft'
