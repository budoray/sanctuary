name: Dragon, Gold
frequency: very rare
no_encountered: 1d3
size: varies by age
alignment: lawful good
move: 120ft; 300ft flying (AA:II)
armour_class: -2 [22]
hit_dice: 10 to 12
melee_attacks: 2 claws (1d8) and 1 bite (6d6)
senses: Infravision 60ft, Detect invisibility by  age category
lair_chance: 65%
intelligence: genius (17-18)
morale: 95, 100 or 105 (by HD)
loot: Hoard 8, Cache 4, 5, and 6
experience: Varies by hit dice and age
description: Often shaped like the sinuous dragons of Asian myth, gold  dragons epitomise law and goodness, and are typically just  and kindly. They are interested in the ways of man and often  use shape-changing powers to watch, observe and help peo - ple. They prefer to have their lairs in places isolated from prying  eyes, however, and thus often place their entrances in lakes or  ponds. They have found that their treasure hordes are tempting  targets for evil or even neutral adventurers.
abilities:
- heading: Special Features
  text: Sleeping Dragon. A gold dragon encountered in its lair has a 10%  chance to be sleeping when the adventurers approach. If the  dragon is asleep, there is a 1 in 6 chance that it will awaken  from the mere presence of adventurers. Dragons also some - times feign sleep. Spellcasting Dragon. Roughly 90% of gold dragons are spellcast - ers. If it can cast spells, it does so as a magic-user with a level  equal to the dragon’s age category. Polymorph. A gold dragon can cast polymorph self as an innate  ability three times per day.
- heading: Special Attacks
  text: Breath Weapon. Gold dragon breath is a blast of fire (like that of  a red dragon) or a cloud of poison gas (like a green dragon), at  the dragon’s option. The dragon may use breath weapons up  to three times per day.
- heading: Languages
  text: All dragons speak the draconic tongue, and there is a 90%  chance that a gold dragon will also be able to speak common.
