name: Medallion of Thought Projection
classes: any
description: This cursed medallion appears both to be proof against detection by scrying or magical thought reading and a device for reading the thoughts of others. Instead of reading the thoughts of all creatures within the area of effect, the medallion instead transmits illusory thoughts of a muddled and confusing nature, requiring a save vs spells to focus into coherent thoughts. The false information gained will always seem plausible to the wearer but may, in fact, be dangerously misleading. Unfortunately, while the medallion of thought projection is tricking the user it is also broadcasting the user’s thoughts to all creatures within a cone shaped emanation up to 60ft in front of the user and alerting them to their presence. Thought transmissions can penetrate barriers, but 1ft of stone, 1 inch of common metal, a thin sheet of lead, or 3ft of wood or dirt will block it.
source: OSRIC_3.0_Gamemaster_Guide.pdf
