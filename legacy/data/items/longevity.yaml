name: Longevity
classes: any
description: This potion makes the drinker 1d12 years younger. This restored youth is possible not only for natural ageing, but also for ageing from magic or creature effects. There is some small danger however, since each time a potion of longevity is consumed there is a cumulative 1% probability that all previous age reversals from potions of this type will be negated, raising the character’s age to the age they would be without the effects of the potions. It is not possible to drink this potion in increments.
source: OSRIC_3.0_Gamemaster_Guide.pdf
