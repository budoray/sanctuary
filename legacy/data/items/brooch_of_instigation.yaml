name: Brooch of Instigation
classes: any
description: This shoulder pin grants the wearer a +1 to AC and saving throws, and also has the affect of sending a silent boast to all living creatures in the area. This boast is a mental effect much like ESP, touting the wearer’s prowess in battle, and therefore does not work on the undead or mindless creatures. The boast has the result of doubling the chances of wandering monsters, a +10% to any opponent’s morale checks, and a -10% to reaction bonus checks. Once a person touches the brooch, they will be unable to rid themselves of it until a remove curse or atonement is cast upon the unfortunate victim.
source: OSRIC_3.0_Gamemaster_Guide.pdf
