name: Oil of Famishing
classes: any
description: This item appears as a container of standard lamp oil. When burned the aroma given off will cause all creatures within 60ft to become famished. The smoke must have a chance to accumulate in order to work, so if the oil is burned outside it will be of little effect beyond giving the user a robust hunger. In subterranean settings, however, the oil of famishing will work its insidious magic. Within 1d4+1 rounds of lighting the oil, the adventurers will ignore everything but the most dire of threats in order to break out their field rations or iron rations and sate their hunger. Nearby monsters will rush toward the humans and demi-humans in order to feast up on the intruders. All living creatures within the area of effect will be compelled to eat for at least 1 round, and each round thereafter an affected creature will gain a saving throw.
source: OSRIC_3.0_Gamemaster_Guide.pdf
