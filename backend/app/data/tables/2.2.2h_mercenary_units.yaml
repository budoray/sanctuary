- The majority of regular men-at-arms are zero level characters
- with 1d6 hit points; if more experienced soldiers are desired,
- then the game master must decide with what frequency they are
- available and what payment they require in accordance with the
- campaign milieu. Similarly, the prospect of raising militias and
- levies is not addressed here, their quality depending on many
- factors, but in most cases being inferior to that of professional
- soldiery.
- As with most standard hirelings, very few men-at-arms will
- agree to serve for periods of less than a month and sergeants,
- lieutenants, and captains will never agree to serve for such a
- limited duration. Mercenaries retained on a short term basis
- will rarely agree to perform dangerous duties unless paid con -
- siderably more than the standard sum; indeed, thirty times the
- daily wage is typically demanded.
