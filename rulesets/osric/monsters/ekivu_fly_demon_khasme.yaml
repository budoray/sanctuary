name: Ekivu (fly Demon) (khasme)
frequency: common
no_encountered: 1d3 or 1d6 (in the Abyss)
size: medium
alignment: chaotic evil
move: 50ft; 210ft flying (AA:III)
armour_class: -1 [21]
hit_dice: 7+2
melee_attacks: 2 claws (2d4) and 1 bite (1d4)
senses: Infravision 60ft
lair_chance: 5%
intelligence: average (8-10)
morale: 85
loot: Hoard 2
experience: 1,275 +10/hp
description: Ekivu resemble a hideous crossbreed between a giant fly and  a human. Their hind legs are insect-like and their fore-limbs  resemble human arms, but with bony, sharp claws. Like flies,  their bodies are covered in blueish-black chitin with bristling  hair. Their heads are vaguely human, but with bulbous, faceted  eyes like those of a fly. Their mouths are ringed with sharp teeth  and their long noses are actually a sharp proboscis for drawing  blood from their victims. Ekivu have a long standing hatred of most other classes of de - mons, especially classes A and B. Ekivu have managed to en - slave a number of shub, which they use for their own nefarious  ends.
abilities:
- heading: Immunities and Resistances
  text: 'Magic Resistance (40%).  Any magic spell or effect has a 40%  chance (at caster level 11) to have no effect on this creature;  but if it does, the magic takes full effect. Poison Immunity. These demons are immune to poison and poi- son damage (including gases). Damage Resistances (all half damage): Cold, Electricity, Fire.'
- heading: Special Features
  text: 'Spell-Like Abilities. At Will: Darkness, 5ft radius, detect good (as the 1st level cler - ic spell), detect invisibility (as the 2nd level magic-user spell),  telekinesis (as the 5th level magic-user spell, up to 150 lbs),  fear (touch only, otherwise as the 4th level magic-user spell)  or gate (as the 9th level magic-user spell) another ekivu (15%  chance of success).'
- heading: Special Attacks
  text: Drone. When not using one of their other special abilities, ek - ivu constantly make an insidious buzzing drone which has  the power to lull listeners into a comatose state. The ekivu  can drone while engaged in melee combat. If a save vs spells  (unlisted categories) is not made, the victim will sleep for 2d4  hours or until the demon has drawn 1d4 hp of their blood. Unarmed Combat. Ekivu demons cannot be overborne or grap - pled, and do not employ these tactics.
