description: One of the most common domesticated animals, horses are  almost ubiquitous in most human societies. They are insuffi - ciently sure-footed to take into most dungeon environments  (this requires a mule). “Heavy”, “Medium” and “Light” refer to  warhorses. Only about 10% of horses can be trained as war - horses, even by an expert, and warhorse training requires very  specialised knowledge on the part of the trainer. Unarmed Combat. Horses cannot be targeted with grappling or  overbearing attacks, and do not use such tactics. A warhorse  might be trained to overbear.
