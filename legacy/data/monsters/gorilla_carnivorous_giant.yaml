abilities:
- heading: Special Attacks
  text: 'Mangle. When both of the gorilla’s fist attacks make a success - ful hit against the same target, the gorilla automatically inflicts  an additional 1d6 points of blunt damage from mangling the  target. The target is not held or immobilised by this, and can  continue to act normally in combat. Ranged Attack. Gorillas can throw rocks for 1d6 blunt damage.  The range increment is 20ft (-2 beyond 20ft, -4 beyond 40ft). Unarmed Combat.  Gorillas can choose to overbear instead of  making a regular melee attack. If not fended off, they score an  unarmed hit with a 2+ on 1d20. Hit Mods: ATK/DEF +8/-8. Over- bear Results Mods: ATK/DEF +1/-1. Grappling Result Mods:  ATK/DEF +0/-0.'
- heading: Languages
  text: Usually none. In some campaigns there may exist colonies of  Awakened Apes that speak either their own language or Com - mon, wear simple clothes, and use simple tools and weapons. CARNIVOROUS APE OSRIC’s source literature has a tradition of aggressive ape-like  creatures, such as the White Apes of Barsoom or Thak in Robert  E. Howard’s Rogues in the House . In OSRIC, certain humanoids,  and particularly hobgoblins, form alliances with carnivorous  apes and share lairs with them.
- heading: Special Attacks
  text: 'Mangle. When both of the carnivorous ape’s fist attacks make  a successful hit against the same target, the carnivorous ape  automatically inflicts an additional 1d8 points of blunt damage  from mangling the target. The target is not held or immobilised  by this, and can continue to act normally in combat. Ranged Attack. Carnivorous apes can throw rocks for 1d8 blunt  damage. The range increment is 20ft (-2 beyond 20ft, -4 be - yond 40ft). Unarmed Combat. Carnivorous apes can choose to overbear in- stead of making a regular melee attack. If not fended off, they  score an unarmed hit with a 2+ on 1d20. Hit Mods: ATK/DEF  +8/-8. Overbear Results Mods: ATK/DEF +3/-3. Grappling Result  Mods: ATK/DEF +2/-2.'
- heading: Languages
  text: 'The carnivorous ape doesn’t speak any languages, but may un - derstand a few simple words in a human or humanoid language. GIANT APE The giant ape is enormous: King Kong scale.'
- heading: Special Attacks
  text: 'Trample. On its move, as a charge, or as part of a move into  combat, the giant ape can tread on any creature smaller than  size Huge. If the smaller creature can move and isn’t prone,  then it can immediately (during the giant ape’s turn) choose  to move to an unoccupied space within 5ft of it. This 5ft move  doesn’t cost the smaller creature any of its movement. If the  smaller creature is prone, can’t move for any other reason, or  if there’s no unoccupied space within 5ft of it, then the smaller  creature takes 3d6+12 blunt damage as the giant ape treads  on it. This doesn’t count as one of the giant ape’s attacks; it is  just part of movement. Melee Attack: Grasp and Squeeze.  Grasp: When one of the giant ape’s fists attacks hits a target,  and the giant ape’s attack roll is 4 or more higher than the min- imum it would need to hit the creature, the target is grasped if  its size is large or smaller. The grasp ends when the creature  escapes, when either the giant ape or the
    grasped creature is  killed, or when something moves the grasped creature such  that it’s no longer within 5ft of the giant ape. • While it’s grasped, the seized creature can’t attack, move, or  use its arms and legs. When the giant ape moves, the grasped  creature moves with it. The giant ape’s movement speed isn’t  affected by seizing creatures. Each giant ape can only grasp  one creature in each fist at a time, and two or more giant apes  can’t grasp the same creature. • A creature that’s grasped can try to escape on its  initiative.  It attempts a Major Test of Strength. If the creature passes,  then it escapes the giant ape. It can then choose to move up  to its speed away from the giant ape, but it can’t take any  other action that round. If it fails, then it remains grasped and  can’t take any other action that round. • Other creatures can help the grasped creature to escape by  attempting a Major Test of Strength. If they pass, they wrestle  the creature away from the giant ape,
    so the creature is no  longer grasped. They can’t take any other action that round. If  they fail, then the grasped creature remains grasped and the  other creature can’t take any other action that round. Squeeze: If the giant ape has grasped a creature, then on its  initiative, instead of one fist attack, the giant ape can squeeze  the creature it’s grasped. The creature takes 3d6+12 points  of blunt damage. The giant ape can then choose whether to  keep the creature grasped, or to drop it, ending the grasp.  A dropped creature takes 3d6 blunt damage from the fall. It  must then attempt a saving throw vs death, and must add its  Dexterity saving throw modifier to this saving throw. If it fails,  it lands prone. Range Attack: Throw Tree. If the giant ape doesn’t have any crea- tures grasped, then instead of all its attacks, it can throw a  nearby tree or boulder. It can uproot a tree or lift a boulder as  part of this action. The giant ape then throws the tree or boul- der at a point
    within 180ft of it that it can see. Each creature  within 5ft of that point (either scale) must attempt a saving  throw vs death and must add its Dexterity saving throw mod - ifier to this saving throw. If it fails this saving throw, it takes  2d6+12 points of blunt damage. Stomp. Instead of using its bite attack in combat, the giant ape  can choose to stomp. When it does so, it jumps with both feet,  and lands, making the ground shake. Creatures within 10ft of  the giant ape must attempt a saving throw vs death, and must  add their Dexterity saving throw modifier to this saving throw.  If they’re flying, they automatically pass this saving throw. If  they fail, they fall prone (they don’t die; death is just the saving  throw category used). Unarmed Combat. Giant apes cannot be overborne or grappled,  and do not employ these tactics.'
- heading: Languages
  text: The giant ape doesn’t speak any languages, but may under - stand a few simple words in a human or humanoid language.
