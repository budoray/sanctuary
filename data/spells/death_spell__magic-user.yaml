name: Death Spell
slug: death_spell
reversible: false
class: magic-user
level: 6
school: Arcane Necromancy
range: 10-ft/level
duration: Instantaneous
area_of_effect: 5-ft×5-ft/level
components: V,S,M
casting_time: 6 segments
saving_throw: None
text: Within its limit as to hit dice, this spell slays living creatures in the area of effect. Creatures of 9 or higher hit dice are not affected. The spell kills 4d20 “points” worth of creatures, where (for the purposes of this spell) any creature of fewer than 2 HD counts as one point, creatures of 2 to less than 4 HD count as 4 points, creatures of 4 to less than 7 HD count as 8 points, and creatures from 7 to less than 9 HD count as 10 points. Creatures of the lowest hit dice die first, and fractional “kills” (where insufficient points remain completely to slay the creature) have no effect. Material components for the spell cost 1,000 gp.
source: wiki2_spells.txt
