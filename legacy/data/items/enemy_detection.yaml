name: Enemy Detection
classes: any
description: A wand of enemy detection can, at the expenditure of 1 charge, detect any being with harmful or unkind intentions toward the wand wielder, within 60ft. The wand will throb in the user’s hand and point in the direction of such a being. The being need not be in obvious sight, and the wand can detect it even if it is hiding, invisible, or otherwise outside of normal space, such as when in astral or ethereal form. A wand of enemy detection may be recharged.
source: OSRIC_3.0_Gamemaster_Guide.pdf
