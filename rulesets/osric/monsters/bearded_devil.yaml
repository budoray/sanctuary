name: Bearded Devil
frequency: common
no_encountered: 1d2 or 1d6+4
size: medium (7ft)
alignment: lawful evil
move: 150ft
armour_class: 1 [19]
hit_dice: 6+6
melee_attacks: 1 glaive (1d3 + entangle) or 2 claws  (1d2) and 1 beardburn (1d8)
senses: Infravision 60ft
lair_chance: 15%
intelligence: average (8-10)
morale: 80
loot: Nil
experience: 1,125 +10/hp
description: Bearded devils make their home on the 3rd plane of Hell. They  are renowned for both their bloodthirstiness and their mali - cious cruelty. For this reason, they are often seen serving as  shock troops in the legions of Hell. Bearded devils do not value  treasure, although they may be influenced by offers of warm  meat.
abilities:
- heading: Immunities and Resistances
  text: 'Magic Resistance (45%).  Any magic spell or effect has a 45%  chance (at caster level 11) to have no effect on this creature;  but if it does, the magic takes full effect. Immunities. This creature is immune to fire damage. Damage Resistances  (all half damage): Cold, Poison (including  gases).'
- heading: Special Features
  text: 'Spell-Like Abilities. At Will: animate dead (as the 5th level magic-user spell), charm  person (as the 1st level magic-user spell), fear (effect varies, as  the 4th level magic-user spell), know alignment (as the 2nd lev- el cleric spell), spectral force (as the 3rd level illusionist spell),  suggestion (as the 3rd level magic-user spell), teleport (no  chance of error, otherwise as the 5th level magic-user spell),  affect normal fires (as the 1st level magic-user spell), command  (as the 1st level cleric spell), fear (touch only, otherwise as the  4th level magic-user spell), produce flame (as the 2nd level  druid spell), or summon another bearded devil (35% chance  of success).'
- heading: Special Attacks
  text: 'Glaive. In combat, bearded devils prefer to use a wickedly  barbed and hooked glaive, which can entangle an opponent  intent on escape (1d3 damage plus the victim is immobilised  and cannot attack. A successful Minor Test of Strength check is  required to escape from the glaive. Beards. If unarmed, these devils will grab victims in their claws  and use their bristly beards to scrape and burn. If they manage  to hit with both claws, they will also score maximum damage  with their beards (8 hp). Any victim struck for maximum dam - age from these “beard-burns” must make a save vs poison or be  afflicted with a painful, itching rash (-1 dexterity every 4 rounds;  duration 3d8 turns). Unarmed Combat. Bearded devils can make grappling or over - bearing attacks, although they usually don’t. If not fended off,  they score an unarmed hit with a 2+ on 1d20. Hit Mods: ATK/ DEF +10/-10. Overbear Results Mods: ATK/DEF +1/-1. Grap - pling Result Mods: ATK/DEF +0/+0.'
