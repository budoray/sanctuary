id: d-14
name: CAVES
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- 'Note: The lowest levels of dungeons are often composed of'
- caves and caverns. Use this table for caves and roll for exits on
- Table D-5.
- D20 CAVE
- 1–5 Cave 40ft×60ft
- 6–7 Cave 50ft×75ft
- '8–9 Double Cave: 30ft×30ft, 60ft×60ft'
- '10–11 Double Cave: 30ft×50ft, 80ft×100ft*'
- 12–14 Cavern 100ft×125ft*
- 15–16 Cavern 125ft×150ft
- 17–18 Cavern 150ft×200ft*
- 19–20 Cavern 300ft×400ft**
