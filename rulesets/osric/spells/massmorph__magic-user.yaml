name: Massmorph
slug: massmorph
reversible: false
class: magic-user
level: 4
school: Arcane Illusion/ Phantasm
range: 10-ft/level
duration: See below
area_of_effect: 10-ft×10-ft square/level
components: V,S,M
casting_time: 1 turn
saving_throw: None (willing creatures only)
text: This spell causes creatures of man size or smaller to appear like an innocent grove of trees to any observers. Up to 10 creatures may be enchanted in this manner. The illusion is so powerful that it is maintained even if the massmorphed creatures are touched. The “tree's” reaction to being stabbed or hacked at is fairly likely to indicate that it is no normal tree, of course, although the illusion is not actually dispelled by a successful attack. The illusion persists until the caster dies or dismisses it (or it is dispelled).
source: wiki2_spells.txt
