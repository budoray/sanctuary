id: 2.2.2e
name: WEAPON PRODUCTION
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- WEAPON TYPE DAYS TO PRODUCE
- Arrow Head 1
- Quarrel Tip 1
- Spear 2
- Morning Star 2
- Flail 5
- Pole Arm 5
- A dwarf blacksmith is three times as efficient as a human, but
- will demand ten times the ordinary pay. A gnome blacksmith is
- twice as efficient as a human, but will demand four times the
- usual wage.
