id: 2.2.2m
name: INFORMATION DISCOVERY TIME AND COST
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- 'QUESTION IS: GENERAL SPECIFIC EXACTING COST (GP)'
- Out of Fields 1d6 rounds 2d6 days — 100/day
- In Minor Field 1d4 rounds 2d10 days 5d8 days 1,000/day
- In Major Field 1d3 rounds 1d12 days 3d10 days 500/day
- In Special Category 1d2 rounds 1d10 hours 2d6 days 200/day
- 'Rest and Recuperation:  For every day spent in research the'
- sage must spend 3 days resting. Interruptions during this down-
- time will result in additional days of rest and maximum costs
- and research times for any questions they are compelled to an-
- swer.
- 'Demi-Human or Half-Human Sages:  Most sages are human'
- but sometimes sages of other ancestries will be encountered.
- Chances are they will not be interested in consulting with player
- characters—especially human PCs. As always, this rule depends
- 'upon their reaction to the players (Table 1.6.2.8a: NPC and Mon-'
- ster Reaction) and the circumstances of the encounter.
