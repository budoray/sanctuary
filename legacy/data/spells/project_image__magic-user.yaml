name: Project Image
slug: project_image
reversible: false
class: magic-user
level: 6
school: Arcane Illusion/Phantasm
range: 10-ft/level
duration: 1 round/level
area_of_effect: See below
components: V,S,M
casting_time: 6 segments
saving_throw: None
text: This spell creates an illusory duplicate of the magic user in another place within the spell's range. The image must remain visible to the caster or the spell will end. Much like mirror image, the projected image mimics all the caster's movements, but it is not affected by attacks of any kind. The image possesses an arcane link to the caster; if desired, the magic user can cast spells that originate at the image rather than at the caster, as if the image, rather than the magic user, cast the spell. Thus, the effective range of an attack spell can be increased, or a spell that would ordinarily centre on the caster could be brought into effect around the projected image.
source: wiki2_spells.txt
