name: Robe of Blending
classes: IM
description: Magical robes which communicate to the wearer its power. Anyone wearing the robe of blending is 75% unlikely to be detected if stationary, 50% in motion. The robe also allows the wearer to change self at will, as per the spell. Any person or creature friendly to the and after 1 round the swirling colours create an effect similar to a gaze attack; anyone within 30ft of the robe’s wearer will be dazed 1d4+1 rounds (saving throw vs staves allowed to negate effects). Undead and mindless creatures are immune to this effect. The scintillation effect can be used a total of 10 rounds per day.
source: OSRIC_3.0_Gamemaster_Guide.pdf
