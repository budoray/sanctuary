description: Immune to Non-Silver Mundane Weapons.  This creature is im - mune to piercing, blunt, and slashing damage from weapons  and unarmed attacks, unless the weapon causing that damage  has a magical bonus of +1 or more, or is a silver weapon. Cold  iron weapons also affect this creature. Immunities. Sea hags are immune to charm, fear, sleep and fire- or  cold-based spells.
abilities:
- heading: Special Features
  text: Change Self (At Will). A sea hag can change self at will, with un - limited duration. Evil Gaze. A sea hag can employ an evil gaze up to three times  per day that subjects one creature within thirty feet to a saving  throw vs poison; failure results in immediate collapse and paral- ysis for three days, though for 1 in 4 victims the effect is stronger  and causes instant death.
- heading: Special Attacks
  text: 'Horrific Appearance. Should a sea hag’s true appearance ever be  revealed, then the horror causes anyone within thirty feet to be  subject to a saving throw versus spells to avoid losing half their  strength score for 1d6 turns. Unarmed Combat.  Sea hags can engage in grappling or over - bearing attacks if not in the water. If not fended off, they score  an unarmed hit with a 2+ on 1d20. Hit Mods: ATK/DEF +6/- 6. Overbear Results Mods: ATK/DEF +0/-0. Grappling Result  Mods: ATK/DEF +0/-0.'
