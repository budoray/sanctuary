name: Elemental Gem
classes: DM
description: An enchanted gem keyed to one of the four major Elemental Planes. Its appearance varies by plane. Air elemental gems are crystal clear, earth elemental gems are brown, fire elemental gems are bright red, water elemental gems are turquoise. Smashing the gem releases a 16 hit dice elemental which will serve the player of its own free will and follow their commands to the best of its ability, including fighting any foe the player designates. The elemental lasts for 2 hours or until dispelled or destroyed.
source: OSRIC_3.0_Gamemaster_Guide.pdf
