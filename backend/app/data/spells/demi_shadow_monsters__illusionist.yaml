name: Demi-Shadow Monsters
slug: demi_shadow_monsters
reversible: false
class: illusionist
level: 5
school: Phantasmal Illusion
range: 30-ft
duration: 1 round/level
area_of_effect: 20-ft×20-ft
components: V,S
casting_time: 5 segments
saving_throw: See below
text: This spell creates partially-real illusory monsters in the same manner as the spell shadow monsters, but the demi-shadow monsters have 40% of normal hit points rather than 20%; if they are detected as only quasi-real, they inflict 40% of normal damage and are AC 8.
