name: Iron Bands of Binding
classes: any
description: A 3-in diameter rusty iron sphere wrapped about with iron bands. To use this object, the command word is spoken and the sphere thrown at a target of up to 10ft long or tall. A successful attack causes the target to be held fast in bands of iron. The bands can be broken, but only by a creature of great strength (19 or higher). Usable once per day.
source: OSRIC_3.0_Gamemaster_Guide.pdf
