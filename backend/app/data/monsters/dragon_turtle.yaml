description: Dragon turtles are not true dragons, but they are clearly relat - ed, looking much like a dragon with a turtle shell.
abilities:
- heading: Special Attacks
  text: Breath Weapon.  Dragon turtles can breathe a cone of steam,  60ft long and 40ft wide at the base. It does damage equal to  the dragon turtle’s (uninjured) hit points to all in the area of  effect, but a save vs breath weapons reduces the damage to  half. The dragon turtle may use this breath weapon up to three  times per day. Unarmed Combat. Dragon turtles cannot be overborne or grap - pled, and do not employ these tactics.
- heading: Languages
  text: Dragon turtles speak their own language and that of the Neu - tral alignment. There is a 20% chance that a dragon turtle will  also be able to speak common.
