name: Cloak of Displacement, Major
classes: any
description: This cloak blurs the wearer’s outline. The cloak can be used in this manner up to a cumulative 15 rounds per day, divided as the wearer chooses. While the blurring effect is in operation, all physical attacks against the cloak’s wearer are at -4 and they gain +2 on saving throws vs magic.
source: OSRIC_3.0_Gamemaster_Guide.pdf
