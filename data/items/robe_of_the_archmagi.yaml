name: Robe of the Archmagi
classes: IM
description: 'A magical garment which grants various powers to arcane and phantasmal spell casters. The wearer’s alignment must match that of the robe, as indicated by colour. Type of robe and probability (d100) of appearance: white for good alignment (01–45); grey for true neutrals (46–75); black for evil mages (76–100). A good or evil character wearing a robe of the opposite alignment incurs permanent level loss of -2 (give the character sufficient xp to place him or her at the very beginning of the level two levels below their current one). A good or evil character wearing a neutral robe, or a neutral character wearing a black or white robe incurs a temporary 2 level penalty (only while the robe is worn). Any arcane spell caster wearing any robe of the archmagi gains the powers listed below. • AC improved by 5 points • 05% magic resistance • +4 to saving throws • The wearer is treated as if they were one level higher for the purposes of overcoming a target’s magic resistance.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
