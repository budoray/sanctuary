description: 'Normal hyenas are medium-sized mammals, 4–5ft long and weighing up  to around 100 lbs. They are muzzle-snouted, fur-covered, four-legged and  long-tailed predators and scavengers that hunt in packs and live in dens in  sub-tropical grasslands, woodlands and waste-lands. Many find their haunt - ing, laugh-like bark unnerving and their tendency to raid shallow graves has  sometimes earned them an evil reputation. The jaws of a hyena are very powerful for their size. Unarmed Combat (Normal and Big):  Normal and Big Hyenas cannot be tar - geted with grappling or overbearing attacks, but they may overbear. If not  fended off, they score an unarmed hit with a 2+ on 1d20. Hit Mods: ATK/DEF  +8/na. Overbear Results Mods: ATK/DEF +2/na. Grappling Result Mods: ATK/ DEF na/na. Unarmed Combat (Giant): Giant Hyenas cannot be targeted with grappling or  overbearing attacks, but they may overbear. If not fended off, they score an  unarmed hit with a 2+ on 1d20. Hit Mods: ATK/DEF +10/na. Overbear
  Results  Mods: ATK/DEF +4/na.'
