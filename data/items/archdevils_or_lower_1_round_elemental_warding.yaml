name: Archdevils or lower 1 round Elemental Warding
classes: CDIM
description: This scroll takes 6 segments to read and wards against elementals for 5d8 rounds. If the scroll wards against only one type of elemental, it is effective against 24 HD of elementals. If the scroll is effective against all forms of elementals, it repels 16 HD. If more elementals are present than can be warded off, these additional beings may enter the area of protection and attack anyone within. Roll on the table below to determine which elementals are warded off by a specific scroll. Note that some creatures that are closely connected with elements, or are a particular form of elemental monster, may also be warded off at the GM’s discretion. D20 ELEMENTAL TYPE 1–3 Air 4–6 Earth 7–9 Fire 10–12 Water 13–20
source: OSRIC_3.0_Gamemaster_Guide.pdf
