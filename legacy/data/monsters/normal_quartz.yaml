description: Unarmed Combat.  Ropers cannot effectively be targeted with  grappling or overbearing attacks, and do not use these tactics. ROPERS Ropers are cavern-dwelling monsters and are frequently mis - taken for stalagmites. These monsters are grey-green in colour,  standing around 8ft to 12ft tall, with a hide that mimics the  smooth limestone formations of a natural cavern. Ropers are about 3ft to 4ft at the base and approximately 1ft  wide at the apex. These monsters are almost always encoun - tered in their stalagmite shape but can alter their appearance to  some degree. A roper can assume the shape of a pillar, a boul - der, or flatten themselves and lie flat to appear as no more than  an irregularity on the walking surface of the cavern floor. It can  also cling to a cavern ceiling (or wall) and appear as a stalactite.  Through means of tiny adhesive cilia on its underside, the roper  can move slowly and these cilia are what allow it to cling upside  down to the ceiling. Ropers
  are predators and attack by means of  the 6 rope-like appendages that give these monsters their name.  Ropers do not hoard treasure, but their acidic bile cannot dis - solve platinum or gemstones. Cutting open the gizzard of a rop- er has a 40% chance of yielding 3d6 (3–18) platinum pieces and  30% chance of 4d6 (4–24) gems.
abilities:
- heading: Immunities and Resistances
  text: Magic Resistance (80%).  Any magic spell or effect has an 80%  chance (at caster level 11) to have no effect on this creature;  but if it does, the magic takes full effect. Damage Resistance.  Ropers take only half damage from elec - tricity and cold, even if such an attack gets past the creature’s  magic resistance. Vulnerability to Fire. Ropers are vulnerable to fire, although mag- ical fire must still overcome the creature’s magic resistance to  inflict damage. The roper’s saving throw against fire is at -4.
- heading: Special Attacks
  text: 'Adhesive Tentacles. The tentacles of a roper are 50ft long and se- crete a powerful and poisonous adhesive. A successful “to hit”  roll grabs and weakens the target (no saving throw), decreas - ing its strength ability score by 50% (rounded down) within 1d3  rounds and lasting 2d4 turns. Multiple hits have a cumulative  strength drain effect.  • The victim is not prevented from attacking (arms are not pin- ioned), but is dragged closer to the roper by 10ft per round. • An ensnared victim can break the strand by performing a Mi- nor Test of Strength (using the reduced strength score).  • A strand can be sliced with an edged weapon but the attack  must do a minimum of 6 points of damage in a single attack  to the AC 0 [20] tentacle to sever it.  • Creatures within 10ft of the roper are close enough for the  roper to bite. The bite attack automatically hits any victim  held by the strands of the roper.  QUARTZ ROPERS To adventurers familiar with ropers, a quartz roper appears as  a
    5ft tall and 2ft wide (at the base) statue of a roper, hewn from  some brownish or smoky grey crystalline mineral. The quartz  roper is actually a monster with a rocky hide composed of liv - ing quartz. Quartz ropers are very sensitive to motion and are  able to sense movement up to 225ft away. They do not have the  magic or damage resistances of normal ropers. In combat, quartz ropers fight in the same way as normal rop - ers, although the quartz roper can inject a venom and the ten - tacles are not as strong. Treasure: A quartz roper’s gizzard has the same percentage  chance of containing platinum pieces and gemstones as the  standard variety of roper.'
- heading: Immunities and Resistances
  text: Immune to Missile Weapons.  Due to its stone-like skin, the crea - ture takes no damage from missile weapons (including magical  ones). Magic missile and other spells affect the creature nor - mally.
- heading: Special Attacks
  text: Charm-Venom Injection (2/day). If the quartz roper hits with a ten- tacle, it can inject a strange venom twice per day. This venom  allows no saving throw and causes the victim to freeze in place,  looking as if they have been turned to stone. One round after  this apparent petrifaction, the victim recovers, but is under the  delusion the quartz roper is a close friend and valued ally. These  influenced adventurers will fight to protect the monster to the  utmost of their abilities for the duration of effect of the venom  (10 turns). If the quartz roper is killed before the venom expires,  the deluded defenders will cease attacking and wander about  aimlessly until the venom expires. Adhesive Tentacles. The quartz roper attacks with adhesive ten - tacles as a roper does. The only difference is the ability to inject  charm venom (see above) and that the tentacles are not quite  as strong as a normal roper’s. An ensnared victim can break the  strand by performing a Minor Test of Strength
    (with the reduced  score) but the chance of success is doubled. Thus, if the target  number for a Minor Test of Strength is 1-2, the attempt succeeds  on a 1-4. If the target number is 1-3, the attempt succeeds on a  1-6 (automatically). The tentacle’s hit points for severing are the  same as for a normal roper.
