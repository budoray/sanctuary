description: Rhinoceroses are aggressive herbivores that will charge any  creature they can detect. Rhinos have poor eyesight but have  a very good sense of smell and excellent hearing. There are 2  common types of rhinos, single horn and double horned. Dou - ble horned rhinos are larger, having 9 HD and doing 2d6 dam - age. The single horn variety has 8 HD and does 2d4 damage. A woolly rhinoceros is a larger version of the rhino that roams  Arctic areas of “lost world” settings, though they can also be en- countered in the wild.
abilities:
- heading: Special Attacks
  text: Charge. In combat a rhino will charge, doing double damage on  a successful attack.  Trample. Any opponent on the ground (prone) may be tram - pled. Roll to hit for 2 foreleg attacks (2d4 blunt damage). Unarmed Combat. Rhinoceroses cannot effectively be targeted  with grappling or overbearing attacks, and do not use these  tactics.
