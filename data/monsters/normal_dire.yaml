description: Wolves are predators that hunt in packs of up to 30. They are  normally 26 to 30 inches tall at the shoulder, and males weigh  80 to 100 lbs. A wolf pack will encircle prey, seeking to attack  from behind. Once a pack has identified possible prey, they  usually (75%) follow the group, waiting for the chance to attack. Dire wolves are massive wolves, prehistoric ancestors of the  normal species. Like normal wolves, they hunt in packs and  their howl has a 50% chance to panic herbivores such as horses.
