name: Lyre of Building
classes: any
description: The music of this stringed instrument negates all attacks which deal damage to inanimate construction (such as castle walls) within 300ft. This includes magic-based attacks like disintegrate or horn of blasting as well as physical attacks from a battering ram or catapult missile. This function can be used once per day for up to 30 minutes. In addition to defence, once per week the lyre can also be used for construction. Once per week the music of the lyre of building can magically build walls, tunnels, mines, ditches, even complete buildings. Playing 30 minutes of magical music from the lyre is equal to 100 human beings working for 3 days. After an hour of playing in this manner 1d20 is rolled and the player must roll 18–20 to continue playing, with an additional check every hour.
source: OSRIC_3.0_Gamemaster_Guide.pdf
