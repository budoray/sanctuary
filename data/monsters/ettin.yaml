description: Ettins are two-headed giants, nocturnal creatures that live be - low ground. Each of an ettin’s heads controls one arm. The right  side is slightly dominant, and can cause 3d6 damage whereas  the left can inflict 2d8. Ettins are seldom surprised because one  head or the other is usually keeping watch.
abilities:
- heading: Surprise and Initiative
  text: 'Surprise. Ettins are only surprised on a 1 in 6. Unarmed Combat. Ettins can attack and be targeted with grap - pling or overbearing attacks. If not fended off, they score an  unarmed hit with a 2+ on 1d20. Hit Mods: ATK/DEF +8/-8. Over- bear Results Mods: ATK/DEF +4/-4. Grappling Result Mods:  ATK/DEF +2/-2.'
- heading: Languages
  text: Ettins speak giantish, and each head has a 20% chance to speak  common.
