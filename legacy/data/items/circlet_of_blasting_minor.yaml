name: Circlet of Blasting, Minor
classes: M
description: A simple golden headband with a small red ruby set in the middle. Once per day the ruby can emit a 60ft beam of searing light that causes 3d8 points of damage. The circlet and the ruby are tuned to each other; removing the ruby destroys the magic.
source: OSRIC_3.0_Gamemaster_Guide.pdf
