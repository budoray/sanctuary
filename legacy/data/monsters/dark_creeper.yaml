name: Dark Creeper
frequency: rare
no_encountered: 1 (or 20d4)
size: small (4ft)
alignment: chaotic neutral
move: 90ft
armour_class: 0 [20] (or 8 [12]; see below
hit_dice: 1+1
melee_attacks: 1 dagger (1d4)
senses: Infravision 120ft
lair_chance: 20%
intelligence: average (8-10)
morale: 55
loot: See below
experience: 50 +2/hp
description: Dark creepers are short, spindly humanoids with pale skin who  like to wrap themselves in loose, dark clothing, leaving little ex - posed save their eyes and hands. These beings are in some way  a manifestation of the eldritch powers of darkness, although  they are not individually powerful. Dark creepers detest sun - light and avoid any light as best they can, dwelling alone in dun- geons or profane villages even deeper underground. These vil - lages are always governed by a dark stalker. Solitary dark creepers tend to carry their treasure with them,  concealed within the many loose folds of their dark clothing.  There is a 20% chance a dark creeper will carry a magic dagger,  15% chance of a magic ring, and 10% chance of either 1d4 gems  of random value or 1d3 items of random jewellery. Lair trea - sure probabilities for a lone dark creeper are 50% for a mag - ic dagger, 10% for a magic ring, 30% for gems or jewellery. To  generate treasure for a dark creeper village, multiply
  individual  treasure chances by the number of creepers, adding 5d20 pp  and 5d12 gp.
abilities:
- heading: Special Features
  text: 'Thief Abilities. Dark creepers have all the skills of a 4th level thief. Spell-Like Abilities. 3/day: Detect magic and create darkness.  In both cases, duration is 1 hour, and the effect is in a 50ft radius  around the target point. Any magical sources of light have a 20%  chance to avoid the effects of darkness upon that item only. If  an item is affected, it will resume normal function after 1 hour. Death Fire. When a creeper dies, its body magically immolates  in a fiercely hot blaze of disgusting purple and green flames.  Metal items, including magical items of metal, carried as part  of the creeper’s treasure hoard have an 80% of surviving this  magical fire undamaged. Any magic item damaged by the  creeper’s death fire will lose its enchantment. Deadly in Darkness:  In darkness, the dark creeper’s armour  class is 0 [20]. In light, the armour class is 8 [12].'
- heading: Special Attacks
  text: 'Ranged Attack. Dark creepers can attack with ranged weapons  as humans can. Unarmed Combat. Dark creepers do not make grappling or over- bearing attacks, but can be attacked in this way. If not fended  off, they score an unarmed hit with a 2+ on 1d20. Hit Mods:  ATK/DEF +6/-6. Overbear Results Mods: ATK/DEF -2/+2. Grap - pling Result Mods: ATK/DEF -2/+2.'
