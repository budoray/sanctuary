name: Elixir of Truth
classes: any
description: 'Drinking this elixir will cause one to answer any question truthfully for a period of 10 minutes, though a resisting imbiber is allowed a save vs magic to negate. While under the influence of the potion a person will answer 1 question per round and a secondary save for each question is rolled. The secondary save, if successful, allows the drinker of the potion to decline to answer that question but does not negate the elixir’s effects. The law courts and city patrols in more lawful areas favour use of this potion. Note: This potion does not give the drinker any knowledge they would not otherwise possess—so some questions will elicit the answer, “I don’t know.”'
source: OSRIC_3.0_Gamemaster_Guide.pdf
