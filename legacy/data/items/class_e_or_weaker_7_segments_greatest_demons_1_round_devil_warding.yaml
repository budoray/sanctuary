name: Class E or weaker 7 segments Greatest demons 1 round Devil Warding
classes: CP
description: This scroll is effective for warding against all devils for 5d4 rounds. If the scroll is read for 1 round, it will repel all devil types. Otherwise, the scroll may be read for a variable amount of time to offer protection only against some devils. DEVIL TYPE TIME TO READ Lesser devils or lower 3 segments Greater devils or lower 7 segments
source: OSRIC_3.0_Gamemaster_Guide.pdf
