    - "1000000000000001"
    - "1000000000000001"
    - "1000000000000001"
    - "1000000000000001"
    - "1000000000000001"
    - "1000000000000001"
    - "1000000000000001"
    - "1000000000000001"
    - "1111111111111111"
player_start:
  x: 2
  y: 2
monsters:
  - id: goblin_1
    name: Goblin
    monster: goblin
    x: 12
    y: 8
    color: "#2ecc71"
