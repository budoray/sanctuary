name: Hold Person
slug: hold_person
reversible: false
class: cleric
level: 2
school: Clerical Enchantment/Charm
range: 60-ft
duration: 4 rounds+1 round/level
area_of_effect: 1-3 creatures
components: V,S,M
casting_time: 5 segments
saving_throw: Negates
text: A hold person spell completely immobilises up to three medium-sized or smaller persons for the spell's duration. The cleric decides how many of his or her foes he or she will target with the spell. If there is only one target, the saving throw is made at -2; if two, each makes the saving throw at -1; and if the cleric seeks to hold three enemies, each makes its saving throw with no penalty. If a magic item or spell operates partially to negate the effects of paralysis, failing the save will have the effect of a slow spell rather than completely immobilising the target. Creatures affected by this spell include humans, Demi-humans and humanoids. Ultimately, it is in the discretion of the GM to decide if a creature is considered a “person” for the purposes of this spell. Persons held by this spell may be killed or bound at a rate of one per round, or, if the attacker chooses, may be attacked at twice the normal rate with an automatic hit, for maximum damage.
source: wiki2_spells.txt
