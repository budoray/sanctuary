name: Dark Skull
classes: C
description: 'This likeness of a human skull is artfully and cunningly carved from a block of darkest ebony, and it is unrelentingly and entirely evil. The presence of the dark skull makes any site, building, or structure an unholy site and gains 3 major effects in a 40ft radius around the skull. First, the structure or site is guarded by a magic circle of protection from good (as the 1st level cleric spell). Next, all turning attempts by good-aligned or neutral characters within the structure or site are made at -4, while evil characters gain a +4 bonus to their own turning attempts. Magic resistance does not apply to this effect. Third, the user of the skull may choose to fix a single spell effect to the unhallowed site. Regardless of the normal parameters for the spell, this usage will last for 1 full year and will be effective throughout the entire site or structure. The user can further designate whether the spell effects will apply to all creatures or creatures of a particular faith
  or alignment. Though the spell effects lapse after 1 year, they are quickly and easily renewed using the dark skull, often as part of an unholy annual ritual. Commonly favoured spells for binding include: cause blindness, chant, curse, detect good, know alignment and true seeing; though the choice is up to the user. Saving throws and magic resistance apply normally for these fixed spells. The skull will negate but not dispel a hallowed site with its presence; removing the dark skull will restore a holy place to its rightful status. Only one dark skull may operate in an area at any given time.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
