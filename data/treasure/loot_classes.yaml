id: 2.12.1
name: LOOT CLASSES
source: OSRIC_3.0_Gamemaster_Guide.pdf
note: >
  For any Loot Class, roll each line independently on d100. If the roll is
  equal to or less than the percent chance, that line's treasure is present
  (in addition to whatever else rolled true on the other lines) - a hoard
  with every line failing is empty. Individual classes have no chance line;
  they always produce their amount. qty is a Dice-module expression
  (sanctuary.dice.Dice.roll); a x1000/x100/x10 multiplier is applied to the
  roll's total after rolling, never folded into the dice expression itself.
classes:
  hoard_1:
    label: HOARD 1
    lines:
      - {percent: 25, qty: "1d6", multiplier: 1000, kind: cp}
      - {percent: 30, qty: "1d6", multiplier: 1000, kind: sp}
      - {percent: 35, qty: "1d6", multiplier: 1000, kind: ep}
      - {percent: 40, qty: "1d10", multiplier: 1000, kind: gp}
      - {percent: 25, qty: "1d4", multiplier: 100, kind: pp}
      - {percent: 60, qty: "4d10", multiplier: 1, kind: gems}
      - {percent: 60, qty: "3d10", multiplier: 1, kind: jewellery}
      - {percent: 30, qty: "3", multiplier: 1, kind: magic_item, spec: "any type"}
  hoard_2:
    label: HOARD 2
    lines:
      - {percent: 50, qty: "1d8", multiplier: 1000, kind: cp}
      - {percent: 25, qty: "1d6", multiplier: 1000, kind: sp}
      - {percent: 25, qty: "1d4", multiplier: 1000, kind: ep}
      - {percent: 25, qty: "1d3", multiplier: 1000, kind: gp}
      - {percent: 30, qty: "1d8", multiplier: 1, kind: gems}
      - {percent: 20, qty: "1d4", multiplier: 1, kind: jewellery}
      - {percent: 10, qty: "1", multiplier: 1, kind: magic_item, spec: "sword, armour, or weapon"}
  hoard_3:
    label: HOARD 3
