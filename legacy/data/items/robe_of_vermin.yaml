name: Robe of Vermin
classes: IM
description: This robe radiates strong protective magic, as a robe of protection +4, until the curse is revealed. When the person wearing the robe attempts to concentrate in order to cast a spell against an opponent, the wearer is assaulted by a multitude of bites and stings from the vermin magically infesting the robe. The pain and distraction of the biting insects render all attempts at spell-casting unsuccessful unless a save vs spells is made and the wearer takes a -3 on initiative and -2 to attacks, damage, and saves.
source: OSRIC_3.0_Gamemaster_Guide.pdf
