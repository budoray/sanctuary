name: Speed
classes: any
description: This potion doubles combat and movement ability for 5d4 rounds. Thus, if the imbiber can normally move at 90ft, for the duration of this potion’s effect the imbiber can move at 180ft. The number of attacks available double as well, but this potion does not decrease spell-casting time. This heightened ability does not come without cost, for the strain it puts on the imbiber’s body ages him or her by 1 year permanently. Super–
source: OSRIC_3.0_Gamemaster_Guide.pdf
