id: 2.2.2m
name: INFORMATION DISCOVERY TIME AND COST
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- 'QUESTION IS: GENERAL SPECIFIC EXACTING COST (GP)'
- Out of Fields 1d6 rounds 2d6 days — 100/day
- In Minor Field 1d4 rounds 2d10 days 5d8 days 1,000/day
- In Major Field 1d3 rounds 1d12 days 3d10 days 500/day
- In Special Category 1d2 rounds 1d10 hours 2d6 days 200/day
- 'Rest and Recuperation:  For every day spent in research the'
- sage must spend 3 days resting. Interruptions during this down-
- time will result in additional days of rest and maximum costs
- and research times for any questions they are compelled to an-
- swer.
- 'Demi-Human or Half-Human Sages:  Most sages are human'
- but sometimes sages of other ancestries will be encountered.
- Chances are they will not be interested in consulting with player
- characters—especially human PCs. As always, this rule depends
- 'upon their reaction to the players (Table 1.6.2.8a: NPC and Mon-'
- ster Reaction) and the circumstances of the encounter.
- SCRIBE
- Practiced in the art of writing, a typical scribe is expected to keep
- records, write letters and copy documents. Others may possess
- additional skills, such as cartography, counterfeiting, cryptogra-
- phy, illuminating or the ability to write, read or otherwise com -
- prehend more than one language. Such accomplished individu-
- als might command ten times the standard wage.
- SHIP CREW
- The availability of crews and ships in a given port willing to take
- service with a player character is at the discretion of the game
- master. A vessel must normally be suited to the waters into
- which it will venture and the crew recruited appropriate to the
- ship, as well as familiar with its handling; a mixed crew, for in -
- stance, is required for vessels that employ both sail and oar. A
- vessel and crew intended for river travel will be unsuitable for
- coastal voyages, just as a ship built for coastal trading will be of
- little use on the open sea. If any of these criteria are left unmet,
- there will be a significant chance of mishap.
- Every ship, no matter the size, requires a master, at least one
- lieutenant, and a mate. In all respects other than those outlined
- below, these officers correspond to the mercenary captain,
