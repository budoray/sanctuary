name: Necklace of Fireballs
classes: DM
description: The beads of this necklace can easily be detached by the wearer only and hurled up to 70ft. Upon reaching its target the bead explodes as a fireball; the target is allowed a saving throw vs spells for half damage. The fireball beads come in a variety of strengths and most necklaces have a combination of different strength fireballs. If the wearer suffers damage from a magical fire attack they must immediately save vs breath weapon at +5 or all remaining beads on the necklace spontaneously detonate with the area of effect centred on the wearer. NECKLACE 10D6 9D6 8D6 7D6 6D6 5D6 4D6 3D6 2D6 VALUE (GP) Type I — — — — — 1 — 2 — 1,650 Type II — — — — 1 — 2 — 2 2,700 Type III — — — 1 — 2 — 4 — 4,350 Type IV — — 1 — 2 — 2 — 4 5,400 Type V — 1 — 2 — 2 — 2 — 5,850 Type VI 1 — 2 — 2 — 4 — — 8,100 Type VII 1 2 — 2 — 2 — 2 — 8,700
source: OSRIC_3.0_Gamemaster_Guide.pdf
