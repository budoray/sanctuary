name: Cloak of the Manta Ray
classes: any
description: A magical garment which appears as an ordinary leather cloak until the wearer enters salt water. At that time the cloak adheres to the wearer, making him or her 90% identical in appearance to a manta ray. The cloak’s owner is AC 6 [14] but gains any AC bonuses from magic items or magic armour worn, and can release their arms from the cloak to attack normally with carried weapons. The wearer also gains the ability to breathe underwater and a swimming speed of 60ft, plus an extra tail-spine attack for 1d6 points of damage.
source: OSRIC_3.0_Gamemaster_Guide.pdf
