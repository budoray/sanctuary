name: Ring of Protection
classes: any
description: 'This useful item improves the wearer’s AC and saving throw vs all forms of attack. The protective properties of the ring are cumulative with other forms of protection (bless, for instance) subject to the following limitations: if magic armour is worn the wearer’s AC will not be improved, though the saving throw bonus will still apply. Also, only one ring of protection may be worn at a time. If two are worn, the stronger of the two will function. Various types of rings of protection are listed below, with dice throws to determine type randomly if the GM desires. D100 RESULT VALUE (GP) 01–68 +1 2,000 69–70 +1, 5ft radius* 6,000 71–92 +2 8,000 93 +2, 5ft radius* 14,000 94–97 +3 18,000 98 +3, 5ft radius* 24,000 99 +4 AC, +3 saving throw 32,000 00 +5 AC, +3 saving throw 50,000 * Saving throw bonus only extends to all creatures within 5ft radius of wearer, only the ring bearer gains the AC bonus.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
