name: Illusion
classes: IM
description: This wand is capable of producing both visual and audible illusions, each requiring a charge per round the illusion is maintained. The illusory effect worked by the wielder manifests in 3 segments, and requires full concentration to maintain. The wielder may not engage in any combat or complex action, but may move at normal speed. This wand is rechargeable.
source: OSRIC_3.0_Gamemaster_Guide.pdf
