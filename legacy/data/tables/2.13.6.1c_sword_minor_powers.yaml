id: 2.13.6.1c
name: SWORD  MINOR POWERS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- Minor powers only function when the weapon is drawn and the
- owner is concentrating on the desired power. A sword can only
- perform one special ability at a time, and the sword cannot fight
- and perform an ability. If the same ability is rolled more than
- once, double or triple the range of ability as appropriate.
- D100 MINOR POWER
- 01–11 Detect evil/good within 10ft radius
- 12–22 Detect gold or silver within 20ft radius
- 23–33 Detect shifting rooms or walls within 10ft radius
- 34–44 Detect sloping passages within 10ft radius
- 45–55 Detect traps 10ft within radius
- 56–66 Detect type and number of  gems within 5ft radius
- 67–77 Detect magic within 10ft radius
- 78–82 Detect secret doors within 5ft radius
- 83–87 See invisible within 10ft radius
- 88–92 Locate object with 120ft range
- 93–98 Roll twice on this table, ignoring results 93–100
- 99–00 Roll once on major power table instead
