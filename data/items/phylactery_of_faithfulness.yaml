name: Phylactery of Faithfulness
classes: CP
description: This sacred headband enables the wearer to know whether any action they are contemplating will adversely affect their alignment and their standing with their deity. The phylactery will even allow him or her to detect magical items which could change their alignment. To use the phylactery, the user must first take a moment to contemplate their proposed actions.
source: OSRIC_3.0_Gamemaster_Guide.pdf
