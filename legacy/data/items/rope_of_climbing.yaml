name: Rope of Climbing
classes: any
description: 'A thin and strong 60ft length of rope that can support up to 3,000 lbs. The rope will become animated upon command, climbing or otherwise moving at a rate of 10ft per round and attaching itself to any point the user commands. The rope can also be commanded to detach itself and return to its owner. The rope also has the ability to knot itself at 10ft intervals to permit non-thieves to climb it but doing so shortens the available length of rope to 50ft. At least one end of the rope must be held for the rope’s magic to work. Rope of Entanglement (AFPRT): This item appears as an ordinary 30ft long hemp rope. The rope can be commanded to entangle any victim up to 20ft away or 10ft above. It attacks to hit as a 4HD monster. The entangled victim must succeed at a Major Test of Strength roll to escape. The rope has an AC of -2 [22] and 12 hp. The rope of entanglement resists the first 5 points of damage from all slashing attacks and can repair itself at a rate of 1 hp every 5 minutes.
  If the rope reaches zero hit points it is permanently destroyed. Sagacious Volume (any, see below): This magical book grants the reader one complete level of experience, provided they are of the correct class. Determine which class the volume enhances according to the following table: D10 CLASS D10 CLASS 1 Assassin 6 Magic user 2 Cleric 7 Paladin 3 Druid 8 Ranger 4 Fighter 9 Thief 5 Illusionist 10 Re-roll The experience gained is sufficient to put the character at the start point of their next level. If a character of the incorrect class reads a sagacious volume, they lose 20,000 to 50,000 xp (1d4+1×10,000).'
source: OSRIC_3.0_Gamemaster_Guide.pdf
