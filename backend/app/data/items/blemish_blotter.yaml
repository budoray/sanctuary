name: Blemish Blotter
classes: any
description: A blue crystalline object about the size and shape of a sling bullet, the blemish blotter soaks up imperfections from gemstones. Any gemstone within 6 inches of a blemish blotter for more than 1 minute has a 20% chance of increasing in value by 20%. Improving a jewel costs the blotter 1 charge and every blotter has (1d6×10)+40 charges. As charges are expended, the heart of the blotter turns scarlet and this area grows with each expended charge. When the last charge is expended the scarlet blotter crumbles into dust. This item can affect no jewel more than once.
source: OSRIC_3.0_Gamemaster_Guide.pdf
