description: Giant two-headed trolls are the vicious offspring of trolls and et- tins. In appearance they look most like trolls, though they have  two heads like an ettin and prefer wearing filthy animal skins  as ettins do. Giant two–headed trolls are nocturnal and prefer  underground dwellings such as dungeons or caverns. In combat the giant two–headed troll can direct claw attacks at  two different opponents, but both bite attacks must be directed  at the same opponent.
abilities:
- heading: Surprise and Initiative
  text: Alert. Giant two-headed trolls can only be surprised on a die roll  of 1 (on a 1d6).
- heading: Immunities and Resistances
  text: Effect of Regeneration.  Giant two-headed trolls regenerate all  damage except fire damage and corrosive damage (acid) while  they are alive. Unlike true trolls, they do not regenerate once  killed. It is thus possible to kill these creatures without using  acid or fire, but the creature will be regenerating damage up  until the point it dies.
- heading: Special Features
  text: Regeneration. Giant trolls regenerate 1 hit point per round (ex - cept acid and fire damage) but unlike their smaller cousins,  they are not capable of rebonding severed limbs, and severed  limbs will not attack independently. Unarmed Combat. Giant two-headed trolls cannot be targeted  with overbearing or grappling attacks, and do not use these  tactics.
