name: Helm of Opposite Alignment
classes: any
description: This helm appears as a finely made piece of armoured headgear fashioned by a master smith, even to one who knows little about armour. If detected for magic, the helm radiates a faint dweomer of indeterminate origin. Once placed upon the head the wearer must save vs polymorph on the spot or immediately change to the alignment diametrically opposed to the wearer’s current alignment. Therefore LG becomes CE, LE becomes CG, and so on. Truly neutral characters will roll 1d4 with 1=LG, 2=CG, 3=LE, 4=CE. This shift in alignment is a complete metamorphosis of heart, mind, and soul and any character undergoing this change will feel as if they have just “seen the light” and will strive to the utmost to live life according to this new philosophy. Any attempt to return the character to the original alignment will be viewed with revulsion and resisted by any and all means available. Any character making the saving throw can wear the helm without effect as long as they wish, but if removed
  and subsequently re-worn another save is required. The helm of opposite alignment loses all magical properties after successfully cursing a character, which means the helm cannot be used to return to one’s original alignment.
source: OSRIC_3.0_Gamemaster_Guide.pdf
