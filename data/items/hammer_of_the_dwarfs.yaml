name: Hammer of the Dwarfs
classes: F
description: Usually functions as a +2 hammer. In the hands of a dwarfish fighter who knows the command word, however, this weapon is a full +3 warhammer with additional capabilities. In this case, the hammer of the dwarfs retains its attack and damage bonus when hurled as a missile weapon, doing double damage if it hits and boomeranging back to its owner. If thrown at a giant opponent (including ogres, trolls, and ettin) the hammer will cause triple damage if it hits.
source: OSRIC_3.0_Gamemaster_Guide.pdf
