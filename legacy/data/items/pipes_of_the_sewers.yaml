name: Pipes of the Sewers
classes: any
description: This magical instrument can be used to summon up to 101 normal rats, if any are within 400ft. The rats have a movement rate of 50ft and the pipes must be played continuously. When the rats arrive at the player’s location they will be able to command them telepathically but only so long as they continue to play. When the music stops the rats leave immediately.
source: OSRIC_3.0_Gamemaster_Guide.pdf
