name: Crystal Ball
classes: IM
description: This magic crystal sphere of about 6-in diameter allows the user to see over any distance and even into other planes. The more well known to the user the person or place sought is, the higher the chance of success. Some crystal balls grant additional powers (see table, below). This item requires careful adjudication by the GM. D100 CRYSTAL BALL ADDITIONAL ABILITIES 01-75 None 76-85 Clairaudience 86-90
source: OSRIC_3.0_Gamemaster_Guide.pdf
