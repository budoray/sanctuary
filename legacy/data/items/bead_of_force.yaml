name: Bead of Force
classes: any
description: A tiny bead of what appears to be made of dull, black glass. This item can be hurled up to 60ft with no range penalty incurred, exploding on impact and dealing 5d6 points of damage to all creatures within 10ft of the point of impact. The explosion also creates a resilient sphere with a radius of 10ft and a duration of 10 minutes. The bead’s target will be imprisoned within a sphere of energy that can only be dispelled by a rod of cancellation, a rod of negation, disintegrate, or a targeted dispel magic spell. A dispelled resilient sphere will vanish harmlessly. Nothing can pass into or out of the sphere, though there is enough air contained within the sphere to prevent the prisoner from suffocating. The sphere is immovable from its initial location by any magical or physical means.
source: OSRIC_3.0_Gamemaster_Guide.pdf
