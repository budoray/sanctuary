name: Illusion of Deck’s Owner with gender reversed Dimensional Shackles
classes: CDIM
description: Sturdy shackles forged of cold iron with runes traced in gold upon the surface. Any creature restrained with the shackles will be bound to the Prime Material Plane, no save allowed, until the shackles are removed. The imprisoned creature will be unable to use any spells or spell-like abilities, including summoning spells, which require contact with any plane of existence besides the Prime Material. The shackles will size to fit any creature.
source: OSRIC_3.0_Gamemaster_Guide.pdf
