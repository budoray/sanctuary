- ‡ Heavy crossbows can’t be used from horseback. Only a footman can
- 'brace them correctly before firing. Hands: The number of hands'
- needed to use the weapon. If it’s 2, you can’t use a shield.
- 'Use: Missile weapons are either Hurled (H) or Launched (L).'
- You can add your Strength bonus to damage you deal with a
- Hurled weapon, but not with a Launched one. In some cam -
- paigns, specially-made bows might let you add your Strength
- bonus to damage you deal with arrows. These bows are sold
- at special cost if at all.
- Range Increment.  Missile weapon accuracy decreases with
- range. You take a -2 penalty on your to hit roll for each incre -
- 'ment after the first. Example: if your target is 60ft away, you'
- would get no penalty if you were using a longbow (70ft incre -
- ment), but you would have a -2 penalty if using a shortbow
- (50ft increment).
- If your target is more than five full range increments away, you
- can’t hit it at all. Longbows can’t reach beyond 350ft and short
- bows can’t reach beyond 250ft.
