description: Agile and proud, cats are found everywhere. Because of their  size, domestic cats have very ineffective attacks. When a black  cat is found as a magic-user’s familiar, the cat confers excellent  hearing and night vision on its master or mistress. See also, Lynx, Giant.
abilities:
- heading: Surprise and Initiative
  text: Surprise. Cats are only surprised on a 1 (of a d6), and they sur- prise opponents on a 1–3 (of a d6).
- heading: Special Attacks
  text: Rear Claws.  A cat exceeding its needed “to hit” score by 4 or  more can rake with its rear claws as well as its front, so roll the  listed damage twice. Unarmed Combat. Cats cannot be overborne or grappled, and  do not employ these tactics.
