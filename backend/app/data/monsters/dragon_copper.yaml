name: Dragon, Copper
frequency: uncommon to rare
no_encountered: 1d4
size: varies by age
alignment: chaotic good
move: 90ft; 240ft flying (AA:II)
armour_class: 1 [19]
hit_dice: 7 to 9
melee_attacks: 2 claws (1d4) and 1 bite (3d6+2)
senses: Infravision 60ft, Detect invisibility by  age category
lair_chance: 35%
intelligence: high (13-14)
morale: 80, 85, or 90 (by HD)
loot: Hoard 8, Cache 5
experience: Varies by hit dice and age
description: Copper dragons live in wild and rugged places. They do not seek  out the company of humans and are quite reclusive. However,  they have a strong sense of morality, and will occasionally assist  humans in need. When they do, they are happy to accept any  reward offered, for they are as greedy as most other dragon  types.
abilities:
- heading: Special Features
  text: Sleeping Dragon. A copper dragon encountered in its lair has a  40% chance to be sleeping when the adventurers approach. If  the dragon is asleep, there is a 1 in 6 chance that it will awaken  from the mere presence of adventurers. Dragons also some - times feign sleep. Spellcasting Dragon. Roughly 40% of bronze dragons are spell - casters. If it can cast spells, it does so as a magic-user with a  level equal to the dragon’s age category.
- heading: Special Attacks
  text: Breath Weapon. Copper dragon breath is a blast of acid, like a  black dragon’s breath, that does damage equal to the dragon’s  hit points (but a save vs dragon breath halves this amount); or  it may breathe a cloud of slowing gas (20ft ×30ft×30ft) which  requires all subjects to save vs breath weapon or be slowed (as  the spell) for 6 minutes. The dragon may use breath weapons  up to three times per day.
- heading: Languages
  text: All dragons speak the draconic tongue, and there is a 45%  chance that a copper dragon will also be able to speak common.
