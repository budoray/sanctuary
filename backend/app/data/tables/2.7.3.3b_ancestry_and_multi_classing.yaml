id: 2.7.3.3b
name: ANCESTRY AND  MULTI-CLASSING
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100  ANCESTRY % MULTI–CLASS
- 01–25 Dwarf 15%
- 26–50 Elf 80%
- 51–65 Gnome 25%
- 66–75 Half–elf 80%
- 76–85 Halfling 15%
- 86–00 Half–orc 50%
- 'Hirelings and Henchmen: Hirelings and men–at–arms will only'
- accompany their employers when encountered on the 1st–3rd
- dungeon levels. On deeper expeditions, the entourage will be
- made up only of henchmen, with no hirelings. Determine the
- class of henchmen using Table 2.2.3A. They will have one third
- the level of their employer plus 1 level for every 3 of their em -
- ployer’s levels. For example, a 9th level magic-user NPC may be
- accompanied by a 6th level magic-user henchman.
- 'Equipment: NPC parties should be equipped with arms, ar-'
- mour and supplies typical to a party of dungeon delvers.
- Henchmen should be assumed to have equipment appropri -
- ate to their level. Hirelings will only possess lower quality arms
- and armour and few supplies.
- 'Spells: The GM should assume NPC and henchmen spellcasters'
- will have memorised a full assortment of spells appropriate to
- their party as a whole.
- 'Notes on Play: When a player party encounters a party of NPCs'
- and their henchmen, the GM should carefully consider the
- alignment and makeup of the NPC party before determining
- their course of action. A relatively weaker NPC party than the
- players’ may use alternate means to resolve the situation. Trick-
- ery, parley, bluffing, and fleeing are all important possibilities to
- consider before finally resorting to combat. Unless they are sur-
- prised, the GM should always treat them as alert and prepared
- for anything. Once actual contact has been made with an NPC
- party, the GM should check for reaction. Whatever the result
- of the negotiations, NPC parties will NEVER choose to join the
- PCs unless it is to their immediate advantage. This should also
- involve few if any rewards for the players’ party. Unlike monster
- encounters, the GM should personally direct the actions of the
- NPCs as if they were player characters. Rather than checking
- morale as usual, the GM should favour the course of action that
- is likely to bring the NPCs the greatest benefit.
- If the NPC party bests the players they need not kill them. Ran -
- som, slavery, imprisonment, or sacrifice are interesting alterna-
- tives to simple execution.
- Finally, it is highly recommended that the GM prepare for en -
- counters with random NPC groups before actual play begins. By
- generating a list of such parties in advance, the GM can quickly
- refer to them without stopping play. After the encounter the
- GM can either cross–off the NPC party from their list or make
- additional notations for future reference.
