description: Unarmed Combat.  Nagas cannot effectively be targeted with  grappling or overbearing attacks, and do not use these tactics. GUARDIAN NAGA A guardian naga appears as a long, snake-like creature with a  human head, golden eyes, and green-gold scales. The scales  along its spine are triangular and silvery. Guardian naga are mostly found in holy places. They serve as  sentinels over some ancient evil or treasure belonging to the  cause of good.
abilities:
- heading: Special Features
  text: 'Spells. The guardian naga casts clerical spells as a 6th level caster: • 1st level: 3 • 2nd Level: 3 • 3rd level: 2'
- heading: Special Attacks
  text: Poison Bite.  In addition to piercing damage, the naga’s bite is  poisonous. Anyone hit by the naga’s bite must make a saving  throw vs. poison or die. Spit Poison. The naga can spit poison up to 30ft at any single  target (to-hit roll required), and the target must save vs poison  or die. SPIRIT NAGA The evil and corrupt spirit naga dwells in deep ruins and other  subterranean places. Its scales are black with blood red bands,  and its human-like head is large and misshapen.
- heading: Special Features
  text: 'Spells. A spirit naga can use divine and arcane spells to 4th and  5th levels respectively: DIVINE ARCANE 1st level: 3 1st level: 4 2nd level: 2 2nd level: 2 3rd level: 1'
- heading: Special Attacks
  text: Poison Bite.  In addition to piercing damage, the naga’s bite is  poisonous. Anyone hit by the naga’s bite must make a saving  throw vs. poison or die. Gaze Attack (Charm). Any creature meeting the naga’s gaze must  successfully save vs paralysation or be charmed (as per a  charm person spell). A saving throw is required each time the  gaze is met. This applies to anyone who is generally in front of  the naga, and not using an indirect method of sight such as a  mirror. Attacking the creature by looking at a reflection incurs  a to-hit penalty of -2. Attacking blindly incurs a to-hit penalty  of -4. WATER NAGA The water naga’s scales range from deep green to turquoise  and its eye colour varies from light green to brilliant amber. It  dwells deep below the surface of fresh water lakes ponds and  rivers. The water naga is typically quite curious and harmless  unless provoked.
