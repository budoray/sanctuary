id: 2.2.2b
name: SOLDIERS CONTINUED
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- ALCHEMIST
- Learned in the admixture and creation of the
- various powders, elixirs, unguents, salves, oint -
- ments, oils, essences, and other arcane ingredi -
- ents. A level seven magic-user requires the aid
- of an alchemist to create magical potions; by
- level eleven such assistance is no longer need -
- ed, but will reduce the cost and time involved
- by half if available. In general, alchemists must
- be sought in cities. It is very unlikely that they
- will take service with a player character unless
- retained for a year or more, provided with a well
- stocked laboratory and an initial incentive of up
- to one hundred gold pieces.
