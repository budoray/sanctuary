id: 2.13.10a
name: COMMON ITEM CURSES
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100 CURSE
- 01–15 Delusion
- 16–35 Opposite effect or target
- 36–45 Intermittent functioning
- 46–60 Requirement
- 61–75 Drawback
- 76–90 Different effect than intended
- 91–00 Substitute specific cursed item
- 'Delusion: In the user’s mind the item is exactly what they be -'
- lieve it to be when picked up or used. The device actually is a
- mundane item with powerful deception magics placed upon it
- and absolutely no special powers. The user is absolutely con -
- vinced this item is a beneficial magical item of some sort and
- only a remove curse will allow him or her to be convinced oth -
- erwise.
- 'Opposite Effect or Target: These items are normally beneficial'
- items that malfunction under certain circumstances, causing
- damage to the user, or, to a different target instead of the in -
- tended target. They can also take the form of a weapon or item
- that appears to grant an attack and damage bonus but instead
- inflicts a penalty. Once the cursed nature of the item reveals
- itself the user may sometimes be able to discard it. At other
- times a strong compulsion is placed upon the user and they
- will not be able to rid him- or herself of it except by means of
- a remove curse spell.
- 'Intermittent Functioning:  Intermittently-functioning items'
- 'tend to fall into three broad categories: unreliable, intermit -'
- tent, and uncontrolled. Unreliable items have a small chance
- of malfunctioning or not functioning at all each time they are
- activated, usually a natural 1 on a d20. Uncontrolled items,
- on the other hand, have an unfortunate tendency to activate
- at completely random times. On a roll of 1 on 1d20 the item
- will activate at some random point during the day. Dependent
- items must have a specific condition or situation met or they
- will not function. A table of possible situations is included be -
- low for GM inspiration. Feel free to modify and add to this list
- as need dictates.
- D100 SITUATION
- 01–05 Day
- 06–10 Night
- 11–15 Temperature above freezing
- 16–20 Temperature below freezing
- 21–25 Above ground
- 26–30 Below ground
- 31–35 Within 10ft of a goblinoid monster
- 36–40 Within 10ft of an elf
- 41–45 Within 10ft of a cleric
- 46–50 Within 10ft of a magic user
- 51–55 Wielded by a spell-caster
- 56–60 Wielded by a non-spell-caster
- 61–65 Wielded by a specific  alignment (determined
- randomly)
- 66–70 Wielded by a specific gender (determined
- randomly)
- 71–75  Underwater
- 76–80 At least 10 miles from a major body of water
- 81–85 In direct sunlight
- 86–90 Out of direct sunlight
- 91–95 User must be wearing metal  armour
- 96–00 User must not be wearing any  armour at all
- 'Requirement: Some items have a requirement that must be'
- met before being rendered usable. This is not a simple com -
- mand word, which is considered to be a normal requirement
- for most magic items. Instead, the item requires a specific sort
- of condition to be met to trigger its function. Some require -
- ments are a one time type of event; others are monthly, daily,
- or even per usage or continuous. To inspire the GM, a list of
- requirements are included, but in order to provide the right
- flavour to the cursed item, the requirement should always fit
- the specific item and should never be determined randomly.
