name: Fumble
slug: fumble
reversible: false
class: magic-user
level: 4
school: Arcane Enchantment/Charm
range: 10-ft/level
duration: 1 round/level
area_of_effect: One creature
components: V,S,M
casting_time: 4 segments
saving_throw: Half
text: This enchantment causes intense clumsiness in the affected creature. Attempting to run will result in an immediate fall to a prone position, and anything held in hand (or claw, etc.) will be dropped. A successful saving throw allows the affected creature to act as if under the influence of a slow spell in order to avoid the spell's full effects.
source: wiki2_spells.txt
