name: Gauntlets of Fumbling
classes: any
description: These appear to be gauntlets of two differing types, suitable for use with heavy armour or made for use with leather armour or clothing. These obviously magicked articles detect for ability bonuses depending upon type. Heavy armour gauntlets of fumbling appear to increase strength to 18.99 or sometimes to increase ability +3 with a bladed weapon. Lighter versions will appear to increase the wearer’s AC by +2 or increase dexterity to 18. These gloves will perform as whatever item they are disguised as until the wearer is engaged in combat with a hostile foe or other lifeor-death type situation, at which time the curse manifests itself. The wearer becomes butter–fingered, losing -2 dexterity, and has a 50% chance each round of dropping anything held in either hand (check separately), which continues even after combat ends. Any beneficial effects of wearing the gauntlets disappear forever then the curse appears. Gauntlets of fumbling can only be removed by means of a remove curse,
  or wish spell.
source: OSRIC_3.0_Gamemaster_Guide.pdf
