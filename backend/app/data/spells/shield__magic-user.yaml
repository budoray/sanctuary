name: Shield
slug: shield
reversible: false
class: magic-user
level: 1
school: Arcane Evocation
range: Caster
duration: 5 rounds/level
area_of_effect: See below
components: V,S
casting_time: 1 segment
saving_throw: None
text: By means of this spell, the caster creates an invisible barrier of magical force. Magic missiles cannot penetrate the barrier at all. The magic user gains an armour class of 2 against any hurled weapon, armour class of 3 against propelled weapons such as arrows, and armour class of 4 against all other attacks. All saving throws against frontal attacks (by wands, dragon breath, etc.) are made at +1 during the spell's duration. The shield is a frontal defence and grants no benefits against attacks from behind or from the rear flanks.
source: wiki2_spells.txt
