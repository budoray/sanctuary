name: Belt of Giant Strength
classes: FPR
description: This wide leather belt grants the wearer a strength bonus of +3 to +6 (1d4+2) on “to hit” rolls and +7 to +12 (1d6+6) on damage, except that it does not enhance “to hit” or damage rolls with missile weapons. However, while wearing the belt, a character may throw rocks as a hill giant does. Determine gp value by squaring the strength bonus (i.e., +3 = 9,000gp, +4 = 16,000gp, etc.)
source: OSRIC_3.0_Gamemaster_Guide.pdf
