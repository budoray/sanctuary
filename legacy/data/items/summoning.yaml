name: Summoning
classes: CDIM
description: The wielder of this wand, when holding the wand by hand (not when it is packed away) is able to instantly identify spells of a conjuration or summoning nature, either when seen written or actively cast. The wielder may spend a charge to cast the spells unseen servant or monster summoning. To cast monster summoning, the wielder must be of sufficient level to cast the version employed (I, II, III, IV, V or VI), and it requires 5 segments. When casting monster summoning, the wielder may spend up to 6 charges, to stack the effects as if more than one spell were cast. For example, the 6 charges could be spent to cast monster summoning VI, or they could be used to cast monster summoning I six times, monster summoning II and IV, or any other combination totalling 6. A wand of summoning can produce the effects of a prismatic sphere (it may be formed into a wall). However, unlike the spell, the wand may only produce a single colour type at a time, per use each round. Each use costs 1
  charge, and takes 5 segments to appear. The wand is also capable of bringing into existence a veil of darkness, by spending 2 charges. This effect takes 5 segments to cast. This veil can occupy a space equal to 600ft squared, and can take any dimensions equalling this amount (20ft×30ft, 15ft×40ft, etc.) No light may pass through the veil, but other magical effects and physical objects may pass through it normally. A wand of summoning is rechargeable.
source: OSRIC_3.0_Gamemaster_Guide.pdf
