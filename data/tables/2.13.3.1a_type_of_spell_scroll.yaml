id: 2.13.3.1a
name: TYPE OF  SPELL SCROLL
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D10 CLASS
- 1–6 Magic user
- 7 Illusionist
- 8–9 Cleric
- 10 Druid
- For the purposes of spell casting, all spells function as if cast by
- a spell user with one more level of experience than is necessary
- to cast the spell. However, all spells cast from a scroll are cast as
- the minimum equivalent of a 6th level spell caster. Thus, even a
- 1st level spell will be cast as if by a 6th level spell caster.
- Note that if a spell caster uses a scroll spell for a spell which they
- would normally be unable to cast due to being of insufficient
- level, there is a cumulative 5% probability that the spell fails for
- each level the caster is lower than the level required. For in -
- stance, if a 2nd level cleric attempts to use a spell that normally
- must be cast by a cleric of 4th level, there is a 10% chance of
- spell failure. In addition, if a roll indicates that a spell fails, there
- is an equal probability that the spell affects the caster, produces
- some other unfortunate effect, or creates some other effect at
- the GM’s discretion.
- Once a scroll spell is cast, the magical writings for that spell van-
- ish. This also applies even when a scroll spell is read for the
- purpose of memorisation or to be added to a spell book.
- 2.13.3.2.  SCROLLS OF WARDING
- Unless otherwise noted, all scrolls of warding produce an area
- of protection within a 10ft radius of the reader, and the area
- moves with the affected character. No creature of the type in-
- dicated by the warding may enter the area of protection by any
- means, but if the affected character forces a creature of the af-
- fected type into this radius, the effects of the scroll are cancelled.
- Scroll effects may be “stacked” in that several different scrolls of
- warding may be active on one being at once, but scrolls of the
- same type do not stack for the purposes of increased duration
- or potency.
- 'Acid Warding (All):  This warding scroll takes 4 segments to'
- read and its effects last for 5d6 rounds. The reader of the scroll
- is immune to acid (corrosion damage) for the duration.
- 'Demon Warding (CP): All demons are unable to enter the pro -'
- tected area for 5d4 rounds. This scroll takes a variable amount
- of time to read, to be determined by the power level of the de-
- mon.
- DEMON TYPE TIME TO READ
- Class C or weaker 3 segments
- Class E or weaker 7 segments
- Greatest demons 1 round
- 'Devil Warding (CP): This scroll is effective for warding against'
- all devils for 5d4 rounds. If the scroll is read for 1 round, it will
- repel all devil types. Otherwise, the scroll may be read for a
- variable amount of time to offer protection only against some
- devils.
- DEVIL TYPE TIME TO READ
- Lesser devils or lower 3 segments
- Greater devils or lower 7 segments
- Archdevils or lower 1 round
- 'Elemental Warding (CDIM):  This scroll takes 6 segments to'
- read and wards against elementals for 5d8 rounds. If the scroll
- wards against only one type of elemental, it is effective against
- 24 HD of elementals. If the scroll is effective against all forms
- of elementals, it repels 16 HD. If more elementals are present
- than can be warded off, these additional beings may enter the
- area of protection and attack anyone within. Roll on the ta -
- ble below to determine which elementals are warded off by a
- specific scroll. Note that some creatures that are closely con -
- nected with elements, or are a particular form of elemental
- monster, may also be warded off at the GM’s discretion.
- D20 ELEMENTAL TYPE
- 1–3 Air
- 4–6 Earth
- 7–9 Fire
- 10–12 Water
- 13–20 All
- 'Lycanthrope Warding (any):  This warding scroll takes 4 seg -'
- ments to read and its effects last for 5d6 rounds. A total of 49
- HD of creatures are warded off, and for this calculation any
- “+” is rounded up if 3 or more, or down if 2 or fewer. Any crea-
- tures above these HD may enter the protected area and attack
- characters within. Roll on the table below to determine which
- specific creature type a scroll of warding is effective against.
- Note that if all shape-changers is indicated, this includes any
- creature that is capable of taking a human form, as well as
- creatures under the effects of a polymorph spell or creatures
- with an innate ability to shape-change or polymorph (including
- druids of high level).
- D20 CREATURE TYPE
- 1 Werebears
- 2 Wereboars
- 3–4 Wererats
- 5 Weretigers
- D20 CREATURE TYPE
- 6–8 Werewolves
- 9–19 All lycanthropes
- 20 All shape-changers
- 'Magic Warding (any): This scroll of warding takes 8 segments'
- to read and has a duration of 5d6 rounds. Unlike other scrolls
- of warding, the protection offered by this scroll is confined to a
- 5ft radius of the scroll reader. This area of protection prevents
- any magical effects from passing through. Should a magic item
- pass through the area, there is a 50% probability that the item
- 'loses all magical properties (exception: major artifacts will not'
- be so affected). When more than one magic item makes con -
- tact with this anti-magic barrier at the same time, the barrier
- is severely taxed. The GM will roll to check whether an item
- is drained of its magical properties, in the same approximate
- order that each item makes contact with the barrier (or in ran-
- dom order). In this circumstance, should a check indicate an
- item is drained of magic, the barrier is immediately overloaded
- and dissolves.
- 'Petrifaction Warding (any):  This scroll of warding is read in'
- 5 segments and lasts for 5d4 rounds. All characters within
- the area of protection are immune to all sources of petrifac -
- tion, whether from spells, gaze, breath weapons, or any other
- source.
- 'Polymorph Warding (any):  This scroll may be read in 2 seg -'
- ments. It reverses any polymorph effects within 10ft of the
- place where the scroll is read, and for 6 full turns the reader of
- the scroll becomes immune to polymorph or shape-changing
- magic.
- 'Possession Warding (CP):  This scroll is read in 1 round. Most'
- of these scrolls (1–9 on 1d10) have a duration of 10d6 rounds.
- The remaining scrolls have a duration of 10d6 turns, but the
- protection is rooted to one 10ft radius location when cast from
- the scroll. This scroll wards off all effects that can control the
- mind, including spells such as magic jar . This scroll prevents
- any form of mental energy drain, whether magical or some
- other form. The protection offered by this scroll of warding is
- extended to all beings, living or dead, within the radius.
- 'Undead Warding (CP): This scroll of warding takes 4 segments'
- to read, and has a duration of 10d8 rounds. The area of effect
- is a 5ft radius from the scroll reader. It wards off 35 HD (or lev-
- els) of undead, but any excess creatures are able to pass into
- the protected area and attack creatures within. Otherwise un-
- dead cannot pass through the protective barrier, but can em -
- ploy ranged attacks or spells into the area from outside. Most
- scrolls that ward off undead are effective against all forms of
- undead, but the GM may decide to make some scrolls specific
- to a form of undead. Refer to the potion of undead control for
- a table to determine an undead type if this option is used.
