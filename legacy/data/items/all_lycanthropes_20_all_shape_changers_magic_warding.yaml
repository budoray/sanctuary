name: All lycanthropes 20 All shape-changers Magic Warding
classes: any
description: 'This scroll of warding takes 8 segments to read and has a duration of 5d6 rounds. Unlike other scrolls of warding, the protection offered by this scroll is confined to a 5ft radius of the scroll reader. This area of protection prevents any magical effects from passing through. Should a magic item pass through the area, there is a 50% probability that the item loses all magical properties (exception: major artifacts will not be so affected). When more than one magic item makes contact with this anti-magic barrier at the same time, the barrier is severely taxed. The GM will roll to check whether an item is drained of its magical properties, in the same approximate order that each item makes contact with the barrier (or in random order). In this circumstance, should a check indicate an item is drained of magic, the barrier is immediately overloaded and dissolves.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
