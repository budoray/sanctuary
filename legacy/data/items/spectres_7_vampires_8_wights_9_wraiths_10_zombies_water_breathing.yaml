name: Spectres 7 Vampires 8 Wights 9 Wraiths 10 Zombies Water Breathing
classes: any
description: 'The imbiber of this potion is granted the ability to breathe when submerged in any liquid that contains oxygen (rivers, lakes, oceans, etc.). The duration is 1 hour+1d10 rounds per dose. There is a 75% probability that a potion will contain 4 doses, and a 25% probability it will contain 2 doses. 2.13.3. SCROLLS 2.13.3.1. SPELL SCROLLS Scrolls can be found rolled up in any number of decorative or plain tubes. A scroll tube may be magically sealed such that a character must cast read magic to read the magical words that open it. Reading the writing on the tube will also reveal whether the tube has been cursed or protected with a magical trap. Once opened, if an arcane spell scroll, a further read magic spell must be used to comprehend the magical script. (Note that once read magic has been used on a scroll, the same user does not need to cast it again to comprehend the same scroll at a later time.) A cursed scroll is triggered by the use of read magic, but other scrolls are not.
  At the GM’s option, a scroll may have up to a 3 in 10 chance of its magical writing vanishing if left in a scroll tube for an extended amount of time without casting read magic on the scroll to learn its nature. When spell scrolls are found, use the following table to determine what class of spells is present. Only characters of the appropriate class may use the spells. TABLE 2.13.3.1A: TYPE OF SPELL SCROLL D10 CLASS 1–6 Magic user 7 Illusionist 8–9 Cleric 10 Druid For the purposes of spell casting, all spells function as if cast by a spell user with one more level of experience than is necessary to cast the spell. However, all spells cast from a scroll are cast as the minimum equivalent of a 6th level spell caster. Thus, even a 1st level spell will be cast as if by a 6th level spell caster. Note that if a spell caster uses a scroll spell for a spell which they would normally be unable to cast due to being of insufficient level, there is a cumulative 5% probability that the spell fails
  for each level the caster is lower than the level required. For instance, if a 2nd level cleric attempts to use a spell that normally must be cast by a cleric of 4th level, there is a 10% chance of spell failure. In addition, if a roll indicates that a spell fails, there is an equal probability that the spell affects the caster, produces some other unfortunate effect, or creates some other effect at the GM’s discretion. Once a scroll spell is cast, the magical writings for that spell vanish. This also applies even when a scroll spell is read for the purpose of memorisation or to be added to a spell book. 2.13.3.2. SCROLLS OF WARDING Unless otherwise noted, all scrolls of warding produce an area of protection within a 10ft radius of the reader, and the area moves with the affected character. No creature of the type indicated by the warding may enter the area of protection by any means, but if the affected character forces a creature of the affected type into this radius, the effects of
  the scroll are cancelled. Scroll effects may be “stacked” in that several different scrolls of warding may be active on one being at once, but scrolls of the same type do not stack for the purposes of increased duration or potency. Acid Warding (All): This warding scroll takes 4 segments to read and its effects last for 5d6 rounds. The reader of the scroll is immune to acid (corrosion damage) for the duration.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
