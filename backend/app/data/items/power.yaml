name: Power
classes: IM
description: 'The staff of power is a very potent magic item, with offensive and defensive abilities. Each of the following spelllike powers cost 1 charge: magic missile, ray of enfeeblement , continual light, darkness 15ft radius , levitate, lightning bolt, fireball, and cone of cold. The staff of power has the following additional spell-like powers, each of which costs 2 charges: paralysation, globe of invulnerability, and shield (5ft radius). The wielder of a staff of power gains a +2 bonus to AC and saving throws. The staff is also a +2 quarterstaff, and its wielder may use it to smite opponents. If 1 charge is expended, the staff causes double damage for 1 round. This effect may not be stacked. • A staff of power can be used for a retributive strike, as the staff of wizardry. • A staff of power may be recharged.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
