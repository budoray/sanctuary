description: 'GUARDIAN NAGA A guardian naga appears as a long, snake-like creature
  with a  human head, golden eyes, and green-gold scales. The scales  along its spine
  are triangular and silvery. Guardian naga are mostly found in holy places. They
  serve as  sentinels over some ancient evil or treasure belonging to the  cause of
  good. Spells. The guardian naga casts clerical spells as a 6th level caster: • 1st
  level: 3 • 2nd Level: 3 • 3rd level: 2 Poison Bite.  In addition to piercing damage,
  the naga’s bite is  poisonous. Anyone hit by the naga’s bite must make a saving  throw
  vs. poison or die. Spit Poison. The naga can spit poison up to 30ft at any single  target
  (to-hit roll required), and the target must save vs poison  or die.'
