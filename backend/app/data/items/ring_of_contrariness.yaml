name: Ring of Contrariness
classes: any
description: 'A cursed item that renders the victim unable to agree with any suggestion or order. The ring can only be removed with a remove curse spell but, naturally, the ring’s influence will cause the wearer to resist any such attempts. The ring of contrariness will also grant the wearer one of the following abilities from the table at the end of this entry. “Reverse psychology” type commands given in an attempt to get the wearer to remove the ring (example: Do NOT, under any circumstances, remove that ring!) or harm him- or herself will not succeed. If the ring of contrariness grants the secondary ability of spell-turning (see the following table), casting a successful remove curse upon the wearer can be a formidable task. D12 RESULT 1–2 Flying 3–4 Invisibility 5–6 Levitation 7–8 Shocking Grasp 9–10 Spell Turning 11–12 Strength (18.99)'
source: OSRIC_3.0_Gamemaster_Guide.pdf
