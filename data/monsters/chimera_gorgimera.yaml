description: CHIMERA A chimera has the hind quarters of a goat, the forequarters of a  lion, the wings of a dragon and 3 heads, one each of the afore - mentioned creatures. The creature may make up to 6 natural  attacks per round, two with clawed lion paws, one with each of  the goat head’s 2 horns, the mighty bite of the lion’s maw and  another powerful bite by the dragon.
abilities:
- heading: Special Attacks
  text: Breath Weapon. The chimera’s dragon head is capable of breath- ing fire to a 60ft distance, inflicting 3d8 points of damage. Nor- mal saving throws vs breath weapon apply (save for half dam- age). GORGIMERA The gorgimera looks much like a chimera, but it has gorgon’s  head rather than a goat’s head beside the lion and dragon  heads.
- heading: Special Attacks
  text: Breath Weapons. The gorgon head breathes a cloud of petrifying  gas in a cone 30ft long and 10ft radius at the base (save or be  turned to stone). The dragon head is capable of breathing fire  to a 60ft distance, inflicting 3d8 points of damage (save for half  damage). Unarmed Combat.  Chimeras and gorgimeras cannot be over - borne or grappled, and do not employ these tactics.
- heading: Languages
  text: Chimeric is an imperfect form of the red dragon tongue, and is  spoken by both chimeras and gorgimeras. It is also often used  as a code by those familiar with the language.
