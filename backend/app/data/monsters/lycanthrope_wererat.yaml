description: 'WERERAT The horrid ratmen infest the underground sewers and cata - combs
  under large cities. They can assume any of three forms:  human, giant rat, or man-rat.
  In human or man-rat form, they  often arm themselves with swords, but prefer to
  lure unsus - pecting individuals into traps where the victim may be held for  ransom
  or later meals. Rumours persist of a city of black wer - erats on a remote shore;
  the more fanciful tales suggest the  black wererats may have powerful spell casters
  among their  number who can magically affect the phases of the moon. Stealth. Wererats
  surprise on a 1-4 on 1d6. Immune to Non-Silver Mundane Weapons.  This creature is
  im - mune to piercing, blunt, and slashing damage from weapons  and unarmed attacks,
  unless the weapon causing that damage  has a magical bonus of +1 or more, or is
  made of silver. Summon Rats. A wererat may summon 2d6 giant rats and con - trol
  them. They appear in 1d4 rounds. Lycanthropy. See general description for all lycanthropes
  (shape- shifting and transmission).'
