name: RODS Absorption
classes: any
description: This rod acts as a magnet, drawing spells into itself. The magic absorbed must be a single-target spell or a ray directed at either the character possessing the rod or their gear. The rod then nullifies the spell effects and stores their potential until the wielder releases this energy in the form of spells of their own. They can instantly detect the level of the spell as the rod absorbs its energy. Absorption requires no action on the part of the user if the rod is in hand at the time. The player must keep a running total of absorbed (and used) spell levels. The wielder of the rod can use captured spell energy to cast any spell they have prepared in 1 segment without expending the preparation itself (i.e. still have the spell in memory). The only restrictions are that the levels of spell energy stored in the rod must be equal to or greater than the level of the spell the wielder wants to cast, that any material components required for the spell be present, and that the rod
  be in hand when casting. A rod of absorption absorbs a maximum of 50 spell levels and can thereafter only discharge any remaining potential it might have. The rod cannot be recharged. The wielder knows the remaining absorbing potential of the rod and current amount of stored energy.
source: OSRIC_3.0_Gamemaster_Guide.pdf
