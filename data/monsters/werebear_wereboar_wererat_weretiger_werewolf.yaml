- heading: Special Features
  text: 'Lycanthropy. See general description for all lycanthropes (shape- shifting and transmission). WERERAT The horrid ratmen infest the underground sewers and cata - combs under large cities. They can assume any of three forms:  human, giant rat, or man-rat. In human or man-rat form, they  often arm themselves with swords, but prefer to lure unsus - pecting individuals into traps where the victim may be held for  ransom or later meals. Rumours persist of a city of black wer - erats on a remote shore; the more fanciful tales suggest the  black wererats may have powerful spell casters among their  number who can magically affect the phases of the moon.'
