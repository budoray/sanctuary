name: Chime of Opening
classes: any
description: Striking this magical chime causes whatever it is pointed at to open. The sound of the chime of opening affects all doors, lids, locks, portals, and valves. The magic of the chime will even dispel a hold portal or wizard lock if cast by a magic user below 15th level. It should be noted the device only affects 1 form of locking per use, so a locked door with a hold portal cast upon it will require 2 soundings of the chime. A silence, 15ft radius spell will render the device useless for the duration of the spell. A new chime of opening comes with 10 uses; the chime cracks in half with the last use.
source: OSRIC_3.0_Gamemaster_Guide.pdf
