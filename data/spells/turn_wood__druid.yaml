name: Turn Wood
slug: turn_wood
reversible: false
class: druid
level: 6
school: Druidic Transmutation/Alteration
range: '0'
duration: 4 rounds/caster level
area_of_effect: 120-ft wide path, 20-ft long/caster level
components: V,S,M
casting_time: 8 segments
saving_throw: None
text: At the completion of this spell, the druid holds his or her palm outstretched, and with the final word of the spell a tremendous burst of power rolls forth, forcing back all wooden objects. Even very large wooden structures that are not affixed to the ground will be affected, although objects fixed to the ground will manage to withstand the spell's awesome power. A sapling-sized or smaller piece of wood will splinter and break even if it is firmly affixed. The druid need not concentrate on maintaining the waves of force and cannot change the direction of the flow of eldritch power once it is set.
source: wiki2_spells.txt
