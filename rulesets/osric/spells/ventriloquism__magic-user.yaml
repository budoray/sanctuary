name: Ventriloquism
slug: ventriloquism
reversible: false
class: magic-user
level: 1
school: Arcane Illusion/Phantasm
range: 10-ft/level (max. 60-ft)
duration: 2 rounds+1 round/level
area_of_effect: One object
components: V,M
casting_time: 1 segment
saving_throw: See below
text: The caster makes his or her voice (or any sound he or she can vocalize) seem to issue from someplace else, such as from another creature, a statue, from behind a door, down a passage, etc. For each point of intelligence of the listener over 12, there is a cumulative 10% chance to correctly perceive the source of the sound.
source: wiki2_spells.txt
