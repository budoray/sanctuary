name: Boots of Striding and Springing
classes: any
description: This magical footwear increases the wearer’s base speed to 120ft and grants the ability to spring vertically 15ft, backward 9ft and forward 30ft. This springing movement can be used in combat to attack and spring away if the wearer has initiative but under such conditions the wearer has a base 20% chance to stumble, decreased by 1% for every point of dexterity over 12. Carved into the side of the left boot heel is the name “Jak”.
source: OSRIC_3.0_Gamemaster_Guide.pdf
