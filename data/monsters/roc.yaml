loot: Hoard 3
experience: 3,010 +25/hp
description: 'Rocs are enormous birds of prey living in high elevations, usual- ly in warmer environments. They will sometimes be found with  giants, who keep them as pets. The immense size of a roc is ac- companied by an equally immense appetite: rocs hunt for large  mammals including horses, cattle, and even elephants.  Any treasure found in the gigantic nest of a roc is there purely  by coincidence, since rocs have no concept of wealth. The be - longings of past victims will be found woven into the intricate  nest.'
abilities:
- heading: Special Attacks
  text: Grab. If a roc hits with either of its talons, it can pick up any prey  smaller than huge size, and fly off toward its nest to feed its  young or devour the victim at leisure. ROPER
