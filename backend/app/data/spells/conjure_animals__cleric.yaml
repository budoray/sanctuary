name: Conjure Animals
slug: conjure_animals
reversible: false
class: cleric
level: 6
school: Clerical Conjuration/Summoning
range: 30-ft
duration: 2 rounds/caster level
area_of_effect: Conjured creatures
components: V,S
casting_time: 9 segments
saving_throw: None
text: A cleric may use this spell to conjure animal allies from thin air and order them into combat. The total hit dice of summoned animals cannot exceed the cleric's level, and the animals must all be of the same type. This spell will only summon mammals, although giant or prehistoric forms of normal mammals may be conjured if these are present within a few miles of the caster. The GM determines the specific type of animal that appears.
source: wiki2_spells.txt
