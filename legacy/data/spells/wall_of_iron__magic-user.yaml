name: Wall of Iron
slug: wall_of_iron
reversible: false
class: magic-user
level: 5
school: Arcane Evocation
range: 5-ft/level
duration: Permanent
area_of_effect: 15-ft×15-ft square/level
components: V,S,M
casting_time: 5 segments
saving_throw: None
text: By casting wall of iron, the magic user creates a sheet of solid iron, one quarter of an inch thick per caster level, with dimensions of 15 square-ft/caster level. The configuration of the square footage is determined by the caster, but must be rectangular. The wall must be vertical if it is created upon the ground, but may be created horizontally in the air, falling to crush whatever is beneath. The wall is natural iron and can be affected by rust or transmutations, but its existence is magical and may be dispelled.
source: wiki2_spells.txt
