name: Candle of Truth
classes: CP
description: When burned, this pure white candle creates a zone of truthfulness in a 5ft radius around the candle for 1 hour. Within this zone any question put to a creature must be truthfully answered. A saving throw vs spells (unlisted categories) is allowed. The candle burns for 1 hour but if extinguished before that time the effects are dispelled and the candle’s magic is ruined.
source: OSRIC_3.0_Gamemaster_Guide.pdf
