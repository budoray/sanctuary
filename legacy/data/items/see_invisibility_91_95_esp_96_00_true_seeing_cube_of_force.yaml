name: See Invisibility 91-95 ESP 96-00 True Seeing Cube of Force
classes: any
description: 'This item appears as a normal-sized six-sided die of ancient yellowed ivory, or carved bone, or any one of a number of hard minerals. The cube projects a square wall of force 10ft on a side around the user, moving with him and rendering him impervious to a specific type of attack. The cube of force has 36 charges and recharges itself at midnight every 24 hours, though there have been rumours of some cubes recharging at noon. Each face of the cube generates a different type of force wall, each power uses charges at a different rate, and each wall limits movement of the user to a degree; consult the first following table. When the cube is active, attacks causing excessive damage sap charges from it at a higher rate: damage in excess of 30 points in one attack burns off 1 charge for every 10 points of damage over 30. Certain spells or magic items also drain off extra charges from the cube, see second following table. # PIPS CHARGES/ MINUTE MAX. MOVEMENT EFFECT 1 1 30ft Keeps out
  gas, wind, smoke, etc. 2 2 20ft Keeps out non-living matter 3 3 15ft Keeps out living matter 4 4 10ft Keeps out magic 5 6 10ft Keeps out everything 6 0 — Deactivates ATTACK EXTRA CHARGES USED Horn of Blasting 6 Wall of Fire 2 Passwall 3'
source: OSRIC_3.0_Gamemaster_Guide.pdf
