name: GEMCUTTERS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- DIE ROLL SKILL LEVEL
- '01-30 Questionable. Roll 1d12. 1: the stone is improved by one category, 2-9: there is no benefit, 10-12: the stone is'
- ruined and becomes worthless.
- '31-60 Average. Roll 1d12. 1-2: the stone is improved by one category, 3-11: there is no benefit, 12: the stone is ruined and'
- becomes worthless.
- '61-90 Skillful. Roll 1d12. 1-3: the stone is improved by one category, 4-11: there is no benefit, 12: the stone is ruined and'
- becomes worthless.
- '91-00 Superb. Roll 1d20. 1-5: the stone is improved by one category, 6-19: there is no benefit, 20: the stone is ruined and'
- becomes worthless.
- 'The “category” of a gem is found on Table 2.12.4a: Gemstone Val-'
- ue. Increasing the value category of a gem does not change the
- gem type, but increases the quality of the cut enough to cause
- its value to be the same as a normal gem in the higher category.
- The GM will re-roll the gem’s value using the value parameters
- for the higher category gem, with the gem’s present value as a
- minimum value.
- ENGINEER (MINER AND SAPPER)
- Indispensable for the overseeing of any mining operations, un -
- derground construction, or siege and counter-siege works that
- involve trenches, fortifications, assault towers and other similar
- siege devices. A dwarf engineer of this sort is required if dwarf
- miners are employed; a dwarf engineer will demand twice the
- standard wage, but increase the productivity of any human
- miners by one fifth.
- JEWELLER AND  GEMCUTTER
- Able to speedily and accurately appraise the value of most
- gems, jewellery and other precious objects, a jeweller is also
- capable of repairing, enhancing or newly creating ornamented
- items and jewellery. Simple tasks, such as setting a stone in the
- hilt of a sword or the forging of a plain ring, might take only a
- few days to a week, whilst more complex undertakings, such as
- producing a gem studded bracelet, could take up to a month;
- of course, truly opulent and intricate items might take a year or
- more.
- Often a jeweller is also skilled at cutting gems; just as in their
- former capacity they may increase the value of an item through
- their craft, as a gemcutter they may increase the value of poor-
- ly cut stones, usually those worth less than five thousand gold
- pieces. However, the level of proficiency an individual possess -
- es with regard to each skill varies and must be determined by
- the game master. A dwarf of this profession often possesses a
- greater degree of general ability than a human, but commands
- twice the pay. A gnome may be no better a jeweller than a hu -
- man, but they are typically of even greater skill than a dwarf
- when it comes to gemcutting, and can also ask for twice the
- standard wage.
- A character hiring a jeweller/gemcutter does not know the hire-
- ling’s skill level at either task.
