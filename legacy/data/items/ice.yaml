name: Ice
classes: DM
description: 'A wand of ice produces several spell-like effects, and may only produce one effect per round. The following effects require the expenditure of 1 charge: an ice storm (as the magic user spell) wreaks its cold havoc to a distance of 60ft, and appears in 1 segment; a wall of ice can be brought into existence, taking 2 segments to appear. It always has a thickness of 6-in, but may have any surface area as commanded by the wand wielder to a maximum of 600 square ft (for example, 25×24ft or 10×60ft). The wand of ice may produce a cone of cold with the expenditure of 2 charges. The cone is 20ft in diameter at its maximum length of 60ft. This effect manifests in 2 segments, and is present for only a moment. Nonetheless, it deals 6d6 hp damage to all within the area of effect (save vs wands for half damage). Any result of 1 on a damage die is treated as a 2. The wand of ice is rechargeable. Light (CDIM) : A wand of light produces several spell-like effects, and may only produce one
  effect per round. The following effects require the expenditure of 1 charge: dancing lights as the magic user spell, which appears in 1 segment, and light as the magic user spell, which appears in 2 segments. The wielder may spend 2 charges to create continual light , which takes 2 segments to manifest. Finally, by spending 3 charges, the wielder may create a ray of intense sunlight. This effect manifests in 3 segments. The bright golden-yellow light lasts only a moment, has a range of 120ft, and forms a 40ft diameter sphere of light. Any being within the area must save vs wands or be blinded and stunned for 2d6 segments. The golden sphere of light has a devastating effect on all undead, dealing 6d6 hp of damage, with no saving throw allowed.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
