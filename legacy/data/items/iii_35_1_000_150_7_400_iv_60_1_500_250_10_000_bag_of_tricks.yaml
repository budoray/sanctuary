name: III 35 1,000 150 7,400 IV 60 1,500 250 10,000 Bag of Tricks
classes: any
description: There are 3 known types of this particular magic item, detailed below, but all work the same way. The owner reaches into the bag and draws out the small, fuzzy ball inside. The ball can be thrown up to 20ft away and it then becomes an animal which will serve the user for 10 minutes, until slain, or until ordered back into the bag. The animal is under control of the person who drew it from the bag and will follow simple commands such as attack, stay, guard, follow, and the like. Each of the three types, differentiated by colour, produces different animals, determined randomly every time the bag is used. Only 1 animal may exist at a time and a maximum of 10 animals may be drawn from the bag in 1 week. BAG OF TRICKS GREY RUST TAN D100 ANIMAL D100 ANIMAL D100 ANIMAL 01–30 Bat 01–30 Wolverine 01–30 Brown Bear 31–60 Rat 31–60 Wolf 31–60 Lion 61–75 Cat 61–85 Boar 61–80 Heavy Warhorse* 76–90 Weasel 86–00 Black Bear 81–90 Tiger 91–00 Badger 91–00 Rhinoceros * Appears with harness and
  tack and will accept the person who drew it from the bag as a rider.
source: OSRIC_3.0_Gamemaster_Guide.pdf
