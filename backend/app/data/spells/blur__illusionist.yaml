name: Blur
slug: blur
reversible: false
class: illusionist
level: 2
school: Phantasmal Illusion
range: Caster
duration: 3 rounds+1 round/level
area_of_effect: Caster
components: V,S
casting_time: 2 segments
saving_throw: None
text: The illusionist's outline becomes blurred, as if seen through shimmering waves of heat. In consequence, the illusionist gains a bonus of +1 against any targeted magical attack. Additionally, any opponent's first attack against the illusionist will incur a penalty of -4, and subsequent attacks incur a penalty of -2 (after one attack, the opponent has become accustomed to the spell's distorting effect).
source: wiki2_spells.txt
