name: Ring of Swimming
classes: any
description: This magic jewellery bestows the ability to swim at a movement rate of 210ft, if the wearer is clad in appropriate garments. The wearer can also dive up to 50ft into the water without injury, assuming a water depth of 1-1/2 ft for every 10ft of diving distance. The wearer may hold their breath for 4 rounds, and can swim for up to 4 hours before needing an hour of rest. This rest can be gained while floating, since the ring also grants the ability to stay afloat under all but hurricane conditions.
source: OSRIC_3.0_Gamemaster_Guide.pdf
