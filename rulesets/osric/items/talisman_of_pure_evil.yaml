name: Talisman of Pure Evil
classes: C
description: Any cleric of evil alignment (LE, NE, CE) can use this artifact to banish a good cleric or paladin (LG, NG, CG) up to 100ft away to an icy prison. When the talisman is activated, the ground cracks open at the victim’s feet, chunks of ice flying upward as the victim is sent hurtling down to the very centre of the earth. The following round the ground closes and forever after, only white roses will grow on that spot. The wielder of the talisman must be relentlessly and irredeemably evil of thought and deed, or else the target of the talisman’s effect gains a saving throw vs death magic to leap aside as the crack forms. It should be also noted the target must be standing on solid ground for the talisman to function. None but an evil cleric may use the talisman of pure evil, and none but a good cleric or paladin may be banished by it. Any neutral cleric (LN, N, CN) touching the talisman takes 6d6 damage, no saving throw allowed. A good cleric touching the talisman takes 8d6 points
  of damage, no saving throw allowed. The talisman is inert to any other character. 2.13.11.2. MAJOR ARTIFACTS Unlike minor artifacts, major artifacts are unique (meaning each is one of a kind). These are the most potent magic items known to mortals. The power contained in a major artifact is capable of completely altering the balance of power in a campaign. Major artifacts are not easily unmade and each has a single and very specific means of destruction. A detailed description of major artifacts is not a fit subject for the OSRIC core rules. As with certain other parts of the First Edition system—planar travel, encounter statistics for major demons and devils, and the like—major artifacts will be dealt with in separate and subsequent volumes, on the grounds that such things are not suitable for play at the more usual character levels.
source: OSRIC_3.0_Gamemaster_Guide.pdf
