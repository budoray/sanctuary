name: Stone of Controlling Earth Elementals
classes: DM
description: A fist-sized irregular lump of rock that, on command, summons a 12HD earth elemental that appears in 1d4 rounds and fights the owner’s foes to the best of its ability. In all other respects the stone’s magic is as a conjure elemental spell. Only one elemental may be summoned at a time and another cannot be called until the first is slain, dispelled, or dismissed.
source: OSRIC_3.0_Gamemaster_Guide.pdf
