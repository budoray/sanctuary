description: 'Crabmen are amphibious humanoids. Each has a tough red - dish-brown exoskeleton and pincers in place of hands. They  have smaller, rudimentary “arms” that can work together to  manipulate very light tools. Crabmen lair in caves along the seashore and are general - ly peaceful creatures, though they are often forced to defend  themselves from raids by sahuagin and other marine predators. These creatures prize silver very highly and will attack, on sight,  anyone openly carrying silver objects or items which appear to  be made of silver. Another oddity of the species is that they oc- casionally undergo some sort of group frenzy, forming a band  of 1d10+30 individuals to march inland, raiding any settlements  they find.  Unarmed Combat. Crabmen can be overborne or grappled, and  they may overbear. If not fended off, they score an unarmed  hit with a 2+ on 1d20. Hit Mods: ATK/DEF +6/-10. Overbear Re- sults Mods: ATK/DEF +2/-2. Grappling Result Mods: ATK/DEF  na/-2.'
