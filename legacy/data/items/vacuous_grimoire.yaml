name: Vacuous Grimoire
classes: any
description: 'This vile tome is thought by some sages to be the prison for a low level malevolent entity, an imp or quasit, perhaps. When the book is placed with other books it tends to alter appearance to blend in with the surrounding volumes and the title, scribed in gold on the spine and on the front, tends to appear as a subject of interest to the person viewing it at the time. This, the sages conclude, indicates some sort of evil intelligence. Anyone opening this infernal manual and reading even one word must immediately roll two saves against petrifaction. The first is to prevent a permanent –1 to intelligence, and the second to prevent a permanent -2 to wisdom. The book may be freely discarded either before or after reading, but the effects of the curse are permanent. One wishing to destroy the book must cast a remove curse upon it while it is being burned. 2.13.11. ARTIFACTS Artifacts are the relics of ancient civilisations which the combination of age, long–forgotten magics, and
  otherplanar influences have elevated beyond the power of even the most potent magic items. As one might deduce, the power of an artifact is potentially destructive to the campaign in which it is introduced and artifacts should therefore never be randomly generated or lightly placed. Artifacts are divided into two groups: minor and major. Major artifacts are unique items of great power, to rival that of the gods. Minor artifacts are not unique, though still quite rare, and of somewhat lesser power than major artifacts. Any artifact, major or minor, is nearly impossible to destroy. 2.13.11.1.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
