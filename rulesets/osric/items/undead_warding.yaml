name: Undead Warding
classes: CP
description: 'This scroll of warding takes 4 segments to read, and has a duration of 10d8 rounds. The area of effect is a 5ft radius from the scroll reader. It wards off 35 HD (or levels) of undead, but any excess creatures are able to pass into the protected area and attack creatures within. Otherwise undead cannot pass through the protective barrier, but can employ ranged attacks or spells into the area from outside. Most scrolls that ward off undead are effective against all forms of undead, but the GM may decide to make some scrolls specific to a form of undead. Refer to the potion of undead control for a table to determine an undead type if this option is used. 2.13.4. RODS, STAVES AND WANDS These devices are relatively similar in nature, but vary in appearance and effect. Wands are the smallest of these, usually being about 1ft long and narrow. Rods are the next largest, about 3ft long and 3/4-in thick. Staves are the largest, usually being 6ft long and about 2 inches thick. Wands
  and rods can be made of wood, metal, ivory, or any combination of these materials, and are most often found inside of a special case. Any staff will be made of wood, unless otherwise noted, with ornate carving and complex shape. Most of these devices use charges, which can be restored by high level magic users. Should a device reach zero charges, it will disintegrate, thus rendering recharging impossible. These devices are found with the following charges, which should not be revealed to the players unless they are somehow able to divine this information: TABLE 2.13.4A: CHARGES IN A ROD, STAFF, OR WAND DEVICE TYPE CHARGES Wands 101–1d20 Rods 51–1d10 Staves 26–1d6 Unless noted otherwise, these devices require a command word or magical phrase to trigger a magical effect. As such, the spell silence and similar effects can prevent these devices’ use. 2.13.4.1.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
