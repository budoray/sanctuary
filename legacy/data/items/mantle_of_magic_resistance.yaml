name: Mantle of Magic Resistance
classes: any
description: An overgarment, suitable for wearing over clothing or armour, which grants 50% magic resistance. The target can still make normal saving throws and magic resistance applies only to spells and spell-like abilities; an attack from a +3 weapon would still have an attack and damage bonus of 3.
source: OSRIC_3.0_Gamemaster_Guide.pdf
