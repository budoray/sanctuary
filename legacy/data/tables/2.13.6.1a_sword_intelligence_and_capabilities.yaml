id: 2.13.6.1a
name: SWORD  INTELLIGENCE AND CAPABILITIES
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100 INT CAPABILITIES COMMUNICATION
- 01–75 None None None
- 76–83 13 1 minor power Low Empathy
- 84–89 14 2 minor powers High Empathy
- 90–94 15 2 minor powers Speech
- 95–97 16 3 minor powers Speech
- 98–99 17 3 minor powers Speech
- 00 18 3 minor powers
- and 1 major power Telepathy
- 'Low Empathy:  Wielder will feel heat, cold, or tingling from'
- sword hilt and an urge to act when ability functions.
- 'High Empathy:  Wielder will feel emotional emanations from'
- the sword.
- 'Speech: Sword will speak its alignment tongue plus 1 or more'
- additional languages determined according to Table 2.13.6.1g.
- 'Telepathy: The sword can communicate telepathically with its'
- owner in any language, over any distance, and may broadcast
- telepathic communication to all creatures within 30ft, in any
- language of its choice. The sword understands all spoken lan -
- guages and can read non-magical text.
