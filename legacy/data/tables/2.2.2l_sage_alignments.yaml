id: 2.2.2l
name: SAGE ALIGNMENTS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100 RESULT
- 01–05 Chaotic Evil
- 06–10 Chaotic Good
- 11–20 Chaotic Neutral
- 21–30 Lawful Evil
- 31–40 Lawful Good
- 41–60 Lawful Neutral
- 61–80 Neutral
- 81–90 Neutral Evil
- 91–00 Neutral Good
- 'Special Skills: Sages have limited ability in spell-casting granted'
- to them by the sheer volume of knowledge they have accu -
- mulated and the type of spell is usually related to their field
- of speciality. The GM should determine whether the sage’s
- spell-casting ability is arcane, phantasmal, divine or druidic
- when the sage is created, based on a judgement call rather
- than a random roll. Expertise in the field of magic, for instance,
- would indicate arcane spell ability. On the other hand a sage
- with extensive knowledge of trees would have druidic spell
- ability. Phantasmal magic might be associated with psychology
- and divine ability with astronomy.
- Roll 1d4+2 to determine the maximum level of the spells the
- sage knows and 1d4 to generate the maximum number of
- spells known for each level. Spells memorised by the sage will
- 'normally be of utility to non-adventurers: unseen servant, read'
- magic, locate object, tongues, etc. The sage will cast the spell
- at the minimum level required for a member of that class to
- cast the spell. Tongues, to take an instance from the above list,
- would be cast by the sage as a 5th level magic-user. A sage will
- regard their spell knowledge as a closely kept secret and will
- not divulge this ability lightly.
