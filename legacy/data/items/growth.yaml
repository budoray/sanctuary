name: Growth
classes: any
description: The drinker increases in size up to a maximum of an additional 24ft. This potion can be imbibed in one–quarter increments such that each one–quarter portion increases size by 6ft. Note that although the enlarged person gains enough strength to conduct normal movement, gained strength does not apply in any way to combat. However, movement does increase to that of a giant of equivalent size.
source: OSRIC_3.0_Gamemaster_Guide.pdf
