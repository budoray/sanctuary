description: Dread wraiths are insubstantial undead creatures that exist  partially in the negative material plane, giving them the power  to drain one level of experience when they score a hit upon an  opponent.
abilities:
- heading: Immunities and Resistances
  text: 'Turned as Undead: Dread wraiths are turned as type 10 Undead. Immune to Mundane Non-Silver Weapons.  The wraith is immune  to piercing, blunt, or cutting damage, unless the weapon caus- ing that damage is magical or silver. Non-magical silver weap - ons inflict half damage. Immune to Cold. Dread wraiths are immune to cold damage. Undeath. This creature is immune to all mind control (including  charm) and hold spells. It cannot be affected by sleep, gases,  poison, or disease.'
- heading: Special Attacks
  text: 'Level Drain. With a successful hit, a dread wraith drains 1 level of  experience from the target. In sunlight, the dread wraith can - not drain levels. Hammer of Thunderbolts (CFPR):  This powerful weapon ap - pears as a square-headed, 15 lb warhammer with a shorter  than normal haft. The hammer of thunderbolts  strikes as a  +3 weapon and deals 4d6 damage, and can also be hurled as  a missile weapon (30ft range bands) which will return to the  wielder after the attack is resolved. Note that this is the maxi - mum power the item can attain if wielded by a cleric; only one  who can wear the belt of giant strength can unlock its full po - tential. If the wielder is wearing both gauntlets of ogre power and a  belt of giant–strength the slumbering power of the hammer of  thunderbolts is revealed to the wearer. First, the owner knows  the weapon for what it is. Second, the weapon gains a full +5  attack bonus, all damage bonuses from the hammer, gaunt - lets, and belt stack, and the
    weapon will strike dead any giant  on a successful hit. The giant is allowed a saving throw vs death  magic to avoid the instant death but not the damage. Further, when hurled the weapon gains a new power. On a  successful attack the hurled weapons emits a clap of thunder  which stuns all living creatures within 90ft (saving throw vs pet- rifaction to avoid). Chiselled into the base of the stone hammerhead are the  words “Æsir Hammers, Ltd.” Philosopher’s Stone (any): Produced by an alchemist of some  long-forgotten civilisation, the philosopher’s stone appears as  an unremarkable, dull black rock of irregular shape and about  the size of a clenched fist. Upon inspection the stone seems  heavy for its size and, if spun on a flat surface the stone wobbles  about its axis as if the centre were liquid. Breaking the stone  open will reveal the hollow centre is filled with alchemist’s quick- silver, a wonderful substance able to transmute base metals  such as lead or iron into pure gold or
    silver. The amount of al - chemist’s quicksilver in the philosopher’s stone is sufficient to  convert 5,000 lbs of iron into pure silver, or 1,000 lbs of lead  into gleaming, pure gold. The potent magic of the stone also has  another use. The quicksilver can be mixed with a curative potion  to create oil of life. When applied to a corpse the oil acts as a  resurrection spell. The quicksilver is sealed into the stone because it breaks down  rapidly when exposed to air. The quicksilver must be used  within 24 hours of breaking the stone or it loses its potency  forever. Any use of the quicksilver uses all the contents of the  stone, so one must decided beforehand whether to produce  silver, gold, or the oil of life. Sphere of Annihilation (IM): This “object” is not so much some- thing as pure nothing, a spherical wound in reality consisting  of a malignant absence of matter. Any matter from the Prime  Material Plane coming into contact with the sphere is sucked  into its utter blackness,
    instantly and irrevocably destroyed. A  wish cannot restore the unfortunate victim; only the direct in - tervention of a deity may do so. A sphere of annihilation can be moved without touching it, us- ing only the power of the mind. The character must roll a save  vs death magic, modified by +1 for each point of intelligence  over 15, to move the sphere 10ft per round plus 5ft for each  point they exceeded their save. Initial control of the sphere  can be attempted from as far away as 40ft and once control  is gained the distance the sphere can be controlled increases  to 40ft+10ft per controlling character’s level. If a control check  fails the sphere slides 10ft in the direction of the controller  who was attempting to move it. Controlling a sphere uses all of  a character’s actions for that round. Control of the sphere can be challenged. All creatures attempt- ing to gain control of the sphere roll their saves as above, and  the rolls are compared. If all fail their saving throws
    the sphere  moves 10ft toward the one who rolled the lowest number. If  only one saves, they gain control of the sphere for 1 round.  If more than one (or all) vying for control of the sphere of an- nihilation make their saving throws, the person exceeding  their saving throw by the most number of points gains control.  Should the contest for control of the sphere come out exactly  equal, control should pass to the person with the highest in - telligence score or, failing that, have the players roll d100 and  give control to the random winner. The sphere of annihilation  cancels most magic in the same  way it absorbs matter. Therefore spells such as dispel magic   and the various protections from magic have no effect on the  sphere. There are, however, two exceptions. First, if a rod of  cancellation touches the sphere, the incompatibility of the re- spective connections to the Negative Material Plane will can - cel each other with great vigour. The resulting explosion will  inflict
    2d6×10 damage on everything within a 60ft radius, no  saving throw allowed. Second, a gate spell has a 50% chance  of destroying the sphere (roll 01–50 on d100), a 35% chance  of having no effect at all (51–85), or a 15% chance (86–100) of  ripping a hole into the very fabric of reality and sucking every - thing within 180ft of the now-destroyed sphere into the tear  and depositing it on an alternate plane of existence. See also: Talisman of the Sphere. Talisman of Pure Good (CP):  Any cleric or paladin of good  alignment (LG, NG, CG) can use this artifact to damn an evil  cleric (LE, NE, CE) up to 100ft away to a fiery judgment. When  the talisman is activated, the ground cracks open at the cler - ic’s feet, flames shooting upward as the victim is sent hurtling  down to the very centre of the earth. The following round the  ground closes and forever after, nothing will grow on that spot. The wielder of the talisman must be exceptionally pure of  thought and deed, or else the target
    of the talisman’s effect  gains a saving throw vs death magic to leap aside as the crack  forms. It should be also noted the target must be standing on  solid ground for the talisman to function. None but a good pal- adin or cleric may use the talisman of pure good, and none but  an evil cleric may be damned by it. Any neutral cleric (LN, N,  CN) touching the talisman takes 6d6 damage, no saving throw  allowed. An evil cleric touching the talisman takes 8d6 points  of damage, no saving throw allowed. The talisman is inert to  any other character. Talisman of the Sphere (IM):  This item is only usable by ar - cane or phantasmal spell casters. Any character unable to cast  arcane or phantasmal spells cannot use the talisman and, in  fact, will take 5d6 points of damage if they attempt to pick it  up. The talisman, consisting of a braided gold and adamantine  cable forming a loop closed by an adamantine handle, allows a  magic user to exert greater control over a sphere of annihila- tion
    (see above) by increasing the character’s modifier on the  control check (double intelligence bonus and character level).  A character using the talisman to exert influence on a sphere  of annihilation need only check for maintaining control every  other round after initial control is established. If the wielder  fails to establish initial control or subsequently loses con - trol, the sphere will move toward him or her at a rate of 10ft  per round. Though spells such as dispel magic are ineffective  against a sphere of annihilation, these spells function normal- ly when used on the talisman of the sphere—which counts as  20th level for the purposes of dispel magic attempts. Talisman of Reluctant Wishes (any): This nondescript artifact  causes any character touching it to try to roll their charisma or  less on 1d20. If they fail the roll by exceeding their charisma score, the tal - isman acts as a stone of weight (detailed in the “Cursed Magic  Items” section). Discarding or destroying
    the talisman results  in 5d6 damage, no save allowed, and the talisman disappears. Success means the talisman will remain with the character for  5d6 hours or until they make a wish with it. When one or the  other event occurs, the talisman disappears. If they roll a natural 20 the character and talisman become  bound together for a number of months equal to their cha - risma score and they will be unable to get rid of the talisman  during that time. The artifact will grant the owner one wish for  every six points of charisma during this time, but as above all  wishes must be used before the time expires. During this time  the talisman, if held, will grow warm and vibrate whenever the  owner comes within 20ft of a magical or mechanical trap. The  talisman must be held in order to receive this benefit. No matter which result is rolled, when the talisman of re - luctant wishes  disappears, a flawless white diamond worth  10,000 gp is left in its place. Talisman of Pure Evil (C):  Any cleric
    of evil alignment (LE, NE,  CE) can use this artifact to banish a good cleric or paladin (LG,  NG, CG) up to 100ft away to an icy prison. When the talisman is  activated, the ground cracks open at the victim’s feet, chunks  of ice flying upward as the victim is sent hurtling down to the  very centre of the earth. The following round the ground closes  and forever after, only white roses will grow on that spot. The wielder of the talisman must be relentlessly and irredeem- ably evil of thought and deed, or else the target of the talis - man’s effect gains a saving throw vs death magic to leap aside  as the crack forms. It should be also noted the target must be  standing on solid ground for the talisman to function. None  but an evil cleric may use the talisman of pure evil, and none  but a good cleric or paladin may be banished by it. Any neu - tral cleric (LN, N, CN) touching the talisman takes 6d6 damage,  no saving throw allowed. A good cleric touching the talisman  takes 8d6 points
    of damage, no saving throw allowed. The tal - isman is inert to any other character. 2.13.11.2. MAJOR  ARTIFACTS Unlike minor artifacts, major artifacts are unique (meaning each  is one of a kind). These are the most potent magic items known  to mortals. The power contained in a major artifact is capable of  completely altering the balance of power in a campaign. Major  artifacts are not easily unmade and each has a single and very  specific means of destruction. A detailed description of major artifacts is not a fit subject for  the OSRIC core rules. As with certain other parts of the First  Edition system—planar travel, encounter statistics for major  demons and devils, and the like—major artifacts will be dealt  with in separate and subsequent volumes, on the grounds that  such things are not suitable for play at the more usual character  levels.  CHAPTER FOURTEEN: HIGH LEVEL PLAY  2.14.1.  STRONGHOLDS STRONGHOLD CONSTRUCTION When the time comes for high level characters to finally
    design  and construct their fortified strongholds, the GM may consult  the following table to arrive at an estimate of the costs involved.  In terms of total building time, a month per 2,000 gold pieces’  worth of construction (or fraction thereof) is not unreasonable.  Some GMs allow clerics to build their strongholds at half the  standard cost, owing to support they receive from religious  organisations. Also included here are the structural hit points (SHP) for the  structures in question. These function similarly to the regular  hit points of characters and monsters, except that only  large-scale attacks such as stones hurled by catapults and  other siege machines are effective at damaging structures.'
