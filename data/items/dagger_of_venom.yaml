name: Dagger of Venom
classes: AFT
description: A +1 dagger which, on a natural hit roll of 20, injects a dose of lethal poison into its victim, though the target gets a saving throw vs poison to negate. The dagger can hold six doses of poison in a tiny compartment in the hilt and can be refilled. Use of this weapon by good-aligned characters should be closely monitored.
source: OSRIC_3.0_Gamemaster_Guide.pdf
