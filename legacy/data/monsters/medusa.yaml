description: 'Medusae resemble the monster from Greek myth: women with  snakes for hair, whose gaze turns people to stone. One of the  most effective weapons against a medusa is a mirror, for a me- dusa that sees her own reflection may be turned to stone her - self if she fails her save.'
abilities:
- heading: Special Attacks
  text: 'Poison Snakebite.  The medusa attacks by drawing near to the  victim, allowing her snakes to lash out and bite. In addition to  the 1d6 piercing damage, anyone bitten must make a saving  throw vs. poison or die. Petrifying Gaze.  Any creature meeting the gaze of a medusa  must successfully save vs petrifaction or instantly be turned to  stone (save each time the gaze is met). The gaze effects extend  into both the astral and ethereal planes. This applies to anyone  who is generally in front of the medusa, and not using an indi- rect method of sight such as a mirror. Attacking the creature  by looking at a reflection incurs a to-hit penalty of -2. Attacking  blindly incurs a to-hit penalty of -4. Unarmed Combat. Medusae can be targeted with grappling or  overbearing attacks. If not fended off, they score an unarmed  hit with a 2+ on 1d20. Hit Mods: ATK/DEF +6/-6. Overbear Re - sults Mods: ATK/DEF +1/-1. Grappling Result Mods: ATK/DEF  +0/+0.'
- heading: Languages
  text: Medusae speak the common tongue. MEPHIT
