name: Barbed Devil
frequency: uncommon
no_encountered: 1d2 or 3d4
size: medium
alignment: lawful evil
move: 120ft
armour_class: 0 [20]
hit_dice: '8'
melee_attacks: 2 claws (2d4) and 1 tail (3d4)
senses: Infravision 60ft
lair_chance: 50%
intelligence: very (11-12)
morale: 85
loot: Nil
experience: 1,425 +10/hp
description: These devils are quite common on the 3rd and 4th planes of  Hell. They are typically used as guards and sentries, a task at  which they excel. Any trespassers will be quickly imprisoned in  one of their many iron cells to await torture. Barbed devils do not need any hand-held weapons. They are  quite proficient at using their hard, sharply-barbed claws and  tail to beat their victims into submission.
abilities:
- heading: Immunities and Resistances
  text: 'Magic Resistance (35%).  Any magic spell or effect has a 35%  chance (at caster level 11) to have no effect on this creature;  but if it does, the magic takes full effect. Immunities. This creature is immune to fire damage. Damage Resistances  (all half damage): Cold, Poison (including  gases).'
- heading: Special Features
  text: 'Spell-Like Abilities. At Will: animate dead (as the 5th level magic-user spell), charm  person (as the 1st level magic-user spell), fear (effect varies,  as the 4th level magic-user spell), know alignment (as the 2nd  level cleric spell), spectral force  (as the 3rd level illusionist  spell), suggestion (as the 3rd level magic-user spell), teleport  (no chance of error, otherwise as the 5th level magic-user  spell), pyrotechnics (as the 2nd level magic-user spell), produce  flame (as the 2nd level druid spell), hold person  (as the 3rd  level magic-user spell), or summon an additional barbed devil  to their aid (30% chance of success).'
- heading: Special Attacks
  text: 'Fear. Whenever a barbed devil hits an opponent, they cause fear  (as the 4th level magic-user spell) if the victim fails a saving  throw against spells. Unarmed Combat.  Barbed devils can make grappling or over - bearing attacks. If not fended off, they score an unarmed hit  with a 2+ on 1d20. Hit Mods: ATK/DEF +8/-8. Overbear Results  Mods: ATK/DEF +1/-1. Grappling Result Mods: ATK/DEF +0/+0.'
