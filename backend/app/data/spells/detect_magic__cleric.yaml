name: Detect Magic
slug: detect_magic
reversible: false
class: cleric
level: 1
school: Clerical Divination
range: Caster
duration: 1 turn
area_of_effect: Path 10-ft wide, 30-ft long
components: V,S,M
casting_time: 1 round
saving_throw: None
text: 'Detect magic creates a tunnel of magical vision in a path 10-ft wide and 30-ft long, in which the cleric sees the aura of any magic item as a glowing blue nimbus. The spell''s effect is blocked by solid wood 3-ft thick, by stone 1-ft thick, and by solid metal 1 inch thick. The cleric can only scan a 60° arc during the course of a round: turning more quickly does not allow magic auras enough time to form in the cleric''s vision.'
source: wiki2_spells.txt
