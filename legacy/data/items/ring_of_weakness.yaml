name: Ring of Weakness
classes: any
description: This dreadful ring reduces the strength and constitution ability scores of the wearer by 1 point per round until both are at 3. This cursed effect is disguised by the ring granting the wearer the ability to become invisible at will as per the ring of invisibility , but becoming invisible doubles the rate of ability score drain. The loss of strength and constitution will not become apparent until the wearer attempts some action, such as combat or bending bars, that requires strength or endurance. When both abilities reach 3 the victim will be unable to function in their class. The ring of weakness can only be removed if a remove curse followed by dispel magic is cast upon the ring. After removal, the victim of the curse will regain 1 point each of strength and constitution for every complete day of rest. There is a 5% chance the curse will be reversed, causing the ring to instead be a ring of the berserker . In such a case the victim will gain, rather than lose, one point each
  to strength and constitution each round (double that rate if the ring’s invisibility power is used). If a fighter, roll for percentile score above 18 for strength when 18 is reached. When both ability scores are at 18, the ring-wearer will melee any opponent they see, regardless of any other circumstances. Removing the ring of the berserker will cause immediate loss of gained strength and constitution bonuses and the victim’s ability scores will be returned to normal. The ring of the berserker will work only once on each wearer.
source: OSRIC_3.0_Gamemaster_Guide.pdf
