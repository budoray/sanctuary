name: Carpet of Flying
classes: any
description: 'Allows unlimited flight or hovering, and is activated by speaking the command word. The owner need only be within voice range to activate the rug and it may be controlled with spoken directions. There are 3 common sizes of rugs (see table, below) with varying weight capacities but all travel at 400ft. Overweight movement is reduced to 30ft but no carpet may carry more than double its capacity. Although the carpet can hover, its aerial agility level is only IV (see Section 2.4.1.5: Aerial Agility). SIZE CAPACITY VALUE (GP) 5ft×5ft 200 lbs 20,000 5ft×10ft 400 lbs 53,000 10ft×10ft 800 lbs 60,000'
source: OSRIC_3.0_Gamemaster_Guide.pdf
