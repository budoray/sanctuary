id: 2.2.1a
name: STANDARD   HIRELINGS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- HIRELING DAILY RATE MONTHLY RATE
- Carpenter 3 sp 40 sp
- Cook 1 sp 20 sp
- Groom 1 sp 20 sp
- Labourer 1 sp 20 sp
- Leatherer 2 sp 30 sp
- Limner 10 sp 200 sp
- Mason 4 sp 60 sp
- Pack Handler 2 sp 30 sp
- Servant 3 sp 50 sp
- Tailor 2 sp 30 sp
- Teamster 5 sp 100 sp
- Torchbearer 1 sp 20 sp
- 'Carpenter: Skilled in the working of wood, a carpenter might be'
- retained to construct anything from a table to a palisade. Their
- expertise is also invaluable for the manufacturing of shields
- and similar items.
- 'Cook: Familiar with the preparation of various types of food, a'
- good cook sometimes also knows a little of herb lore.
- 'Groom: Proficient in the care of horses, an attentive groom can'
- usually tell a good mount from a bad; also known as an ostler
- or stable hand.
- 'Labourer: Essentially unskilled, labourers are suitable for only'
- the most menial sorts of work; this category includes bearers
- and porters, each of which is able to carry up to fifty pounds or
- twice that if a pole or other contrivance is utilised.
- 'Leatherer: Capable of producing a wide range of leather goods,'
- such as packs, belts or riding gear; a leatherer is indispensible
- for the making of scabbards, sheaths, shields and the other
- leather components of arms and armour.
- 'Limner: Adept in the painting of signs and the illumination of'
- heraldic devices, amongst other similar tasks.
- 'Mason: Expert in the working of stone or plaster, masons are'
- essential for the construction of many significant buildings and
- fortifications.
- 'Pack Handler: Practiced in the burdening, handling and unbur-'
- dening of various pack animals.
- 'Servant: Typically serving as valets, butlers, maids, messen -'
- gers or simple lackeys, servants take care of the daily work in
- a stronghold.
- 'Tailor: Accomplished in the repair and making of clothes or oth-'
- er cloth items, such as surcoats, capes or hats; the services of
- a tailor are also required for the production of various types of
- textile based armour and coverings.
- 'Teamster: Experienced drivers of carts and wagons, teamsters'
- are usually experts at loading and unloading their vehicles, as
- well as handling the animals with which they are familiar.
- 'Torchbearer: Usually hired to bear a lantern or torch in a city.'
- Hiring a torchbearer for a dungeon expedition is much more
- expensive (triple daily wage plus 1/4 of an equal share of the
- treasure).
