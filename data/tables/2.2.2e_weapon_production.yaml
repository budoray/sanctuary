id: 2.2.2e
name: WEAPON PRODUCTION
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- WEAPON TYPE DAYS TO PRODUCE
- Arrow Head 1
- Quarrel Tip 1
- Spear 2
- Morning Star 2
- Flail 5
- Pole Arm 5
- A dwarf blacksmith is three times as efficient as a human, but
- will demand ten times the ordinary pay. A gnome blacksmith is
- twice as efficient as a human, but will demand four times the
- usual wage.
- ENGINEER (ARCHITECT)
- Necessary for the successful construction of any but the most
- simple of surface structures. An architect requires payment by
- the month, even for short projects, and expects to receive an
- additional sum equal to one tenth of the building costs. Unless
- the construction site was approved by an architect, there is a
- three in four chance that any structure will collapse within a
- month to a few years of completion.
- ENGINEER (ARTILLERIST)
- Mandatory for the construction and correct operation of siege
- weapons, such as the trebuchet or ballista. Any attempt to build
- or use such weapons correctly without the aid of such an engi -
- neer will surely fail. If retained for only a few months at a time,
- this specialist demands higher pay, perhaps as much as sixty per-
- cent above the standard wage.
