name: Striking
classes: CDIM
description: A rod of striking deals 1d8+3 hp damage, and functions as a +3 weapon of magical nature. When this rod is used against golems, it always costs 1 charge per successful hit in combat, and deals 2d8+6 hp damage. Note that when employed in this way against a golem, a successful roll of 20 will instantly annihilate the target. In addition, this rod may deal increased damage to night hags, devils, demons, and other infernal beings from the outer planes. When attacking these monsters, a successful attack roll of 20 causes the expenditure of a charge and the rod deals triple normal damage. 2.13.4.2. STAVES Unless otherwise noted, all staves perform spell-like effects as if cast by a character of the 8th level of experience. Further, a staff may be used to effect in 2 segments when first used, but requires 8 segments for additional uses, as the staff gathers its energies for a new discharge.
source: OSRIC_3.0_Gamemaster_Guide.pdf
