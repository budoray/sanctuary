name: Paralysation
classes: CDIM
description: A wand of paralysation may fire a ghoulish green beam of energy once per round, to a range of 60ft. The beam will paralyse any one victim who fails a save vs wands. The effect has a duration of 5d4 rounds. The beam of energy manifests after 3 segments. This wand is rechargeable.
source: OSRIC_3.0_Gamemaster_Guide.pdf
