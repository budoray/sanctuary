name: Iron Flask
classes: CDM
description: This cold iron container is inscribed around with runes of great power and is sealed with a brass stopper inlaid with arcane symbols and ancient sigils. The owner of the flask can command any extra-planar creature short of demigod power within 60ft into the flask by speaking the command word. Only one creature at a time can be so contained. The various magic symbols on the flask negate any magic resistance the creature may have, but there is a slight chance (1 in 20) the creature can evade entrapment. Loosing the stopper on the flask frees the creature inside. If the command word is not spoken when the stopper is removed, the creature will react to being freed according to its natural inclination, probably attacking the user. If the command word is spoken when the stopper is removed the creature is bound into the remover’s service for the period of 1 hour, after which it is banished back to its home plane for the period of a year and a day. It is unwise to attempt to recapture
  the creature at the end of its service; the creature gains a cumulative +2 to its saving throw and will be implacably hostile to the user. This means at the end of its year and a day banishment it will return to deal with its tormentor in any way it sees fit. A newly-discovered bottle may already have a being imprisoned.
source: OSRIC_3.0_Gamemaster_Guide.pdf
