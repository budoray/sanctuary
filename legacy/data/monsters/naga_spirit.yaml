description: 'SPIRIT NAGA The evil and corrupt spirit naga dwells in deep ruins and
  other  subterranean places. Its scales are black with blood red bands,  and its
  human-like head is large and misshapen. Spells. A spirit naga can use divine and
  arcane spells to 4th and  5th levels respectively: DIVINE ARCANE 1st level: 3 1st
  level: 4 2nd level: 2 2nd level: 2 3rd level: 1 Poison Bite.  In addition to piercing
  damage, the naga’s bite is  poisonous. Anyone hit by the naga’s bite must make a
  saving  throw vs. poison or die. Gaze Attack (Charm). Any creature meeting the naga’s
  gaze must  successfully save vs paralysation or be charmed (as per a  charm person
  spell). A saving throw is required each time the  gaze is met. This applies to anyone
  who is generally in front of  the naga, and not using an indirect method of sight
  such as a  mirror. Attacking the creature by looking at a reflection incurs  a to-hit
  penalty of -2. Attacking blindly incurs a to-hit penalty  of -4.'
