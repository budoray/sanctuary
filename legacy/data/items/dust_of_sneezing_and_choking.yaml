name: Dust of Sneezing and Choking
classes: any
description: To any test, this fine white powder appears to be dust of appearance. When thrown into the air this powder causes all living beings within 20ft to be disabled by choking, treat as stunned for 5d4 rounds. Each person must save vs breath weapon or take 2d6 damage from the body wracking coughs. One minute later a second save must be made to avoid an additional 1d6 points of damage. Whether one or both saves are made, each person within the area of effect will be disabled by the choking effect of the powder for 2 rounds.
source: OSRIC_3.0_Gamemaster_Guide.pdf
