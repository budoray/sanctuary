name: Incense of Obsession
classes: C
description: 'These faintly magical cones or blocks of incense appear to be an aid to divine spell memorisation in like manner to incense of meditation. In essence the incense of obsession causes any cleric using it as an aid to acquiring spells to become completely convinced the incense has granted him or her superior divine magic using ability. The user will seek the flimsiest of excuses to use a spell at every opportunity, even if unneeded or useless. This obsession lasts until all memorised spells have been expended or 24 hours has elapsed. Mace of Blood (ACFPR): Functions as a mace +3 but only if coated with the blood of an opponent it has slain every day. If it is not, the +3 bonus fades away until it is again bathed in blood. Any character wielding the mace must save vs aimed magic items once every 24 hours or become chaotic evil.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
