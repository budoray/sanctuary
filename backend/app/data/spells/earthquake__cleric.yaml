name: Earthquake
slug: earthquake
reversible: false
class: cleric
level: 7
school: Clerical Transmutation/Alteration
range: 120-ft
duration: 1 round
area_of_effect: 5-ft diameter/level
components: V,S,M
casting_time: 1 turn
saving_throw: None
text: 'The cleric invokes a small but intensely powerful earthquake within this spell''s area of effect. The spell may be used to create landslides, drain marshes, cave in tunnels, and collapse buildings. Yawning cracks in the earth have a good chance to swallow creatures in the area: the chance of falling into such a crevice (by creature size) is 1 in 4 (small), 1 in 6 (medium) and 1 in 8 (large). Being swallowed up in such fashion is, of course, fatal. Trees standing in the area of an earthquake spell have a 1 in 3 chance of being uprooted.'
source: wiki2_spells.txt
