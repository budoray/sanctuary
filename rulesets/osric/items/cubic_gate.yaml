name: Cubic Gate
classes: CDIM
description: 'This 3/4-in square magic item is a six-sided die of the finest carnelian and adorned with gold inlaid pips. Each of the sides of the Cubic Gate can be activated by pressing it, opening a gate to random point on a specific plane. Side #1 of the cube is always keyed to the Prime Material Plane, the other sides will be assigned or randomly generated by the GM. Any time a gate is opened to any plane besides the Prime Material, there is a non-cumulative 10% chance per round a denizen of that plane sees the gate and comes through to investigate, and depending upon the plane contacted, such creatures will rarely have a favourable reaction to the PCs. Pressing a cube side twice in rapid succession will instantly transport the user and all creatures adjacent to him to a random point on the plane to which that side is keyed. Unwilling beings gain a saving throw vs petrifaction to avoid this plane-shift.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
