name: Oil of Slipperiness
classes: any
description: This oil is applied to the character in the same way as oil of etherealness. Any character so coated cannot be restrained or grabbed, and neither wrapped in the grip of constrictor snakes or any other magical or otherwise. Simply put, nothing can get a grip on a character coated in this oil. Further, objects can be coated with the oil, and if a floor is coated any individual even standing on the floor will have a 95% probability each round of falling due to slipping. The effects of the oil last 8 hours, but the oil can be cleaned off early with liquid containing alcohol, such as whiskey, wine, or stout beer.
source: OSRIC_3.0_Gamemaster_Guide.pdf
