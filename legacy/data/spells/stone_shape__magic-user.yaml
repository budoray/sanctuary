name: Stone Shape
slug: stone_shape
reversible: false
class: magic-user
level: 5
school: Arcane Transmutation/Alteration
range: Touch
duration: Instantaneous
area_of_effect: 1 cubic-ft/level
components: V,S,M
casting_time: 1 round
saving_throw: None
text: The magic user moulds stone by the power of his or her will, shaping it into whatever object or form he or she desires, from a weapon to a sculpture to an ornate stone footstool. Whether used to decorate the wizard's tower with gargoyles or to make an escape hole from a stone prison, this spell is extremely versatile and useful.
source: wiki2_spells.txt
