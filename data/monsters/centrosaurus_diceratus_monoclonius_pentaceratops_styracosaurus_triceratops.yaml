description: 'Ceratopsians are quadrupedal beasts with horns and bony head  armour. They fill the rhinoceros’ ecological niche. Ceratopsians  are bad-tempered and prone to charge, making them among  the most dangerous of the dinosaur herbivorous species. They  were extremely common during the late cretaceous period. The  best known and most common of these creatures, triceratops,  was probably about twice as heavy as an elephant.  Pentaceratops: Cretaceous herbivore, resembling a triceratops  with a longer neck-frill and two extra horns protruding from  under its eyes. Triceratops: Cretaceous herbivore. Unlike most  other ceratopsians it does not seem to have lived in herds. Dic- eratops: Cretaceous herbivore; extremely rare compared to tric- eratops. Styracosaurus: Cretaceous herbivore with a distinctive  spiky neck-frill; about half the size of triceratops. Monoclonius:  Cretaceous herbivore with only one horn. Centrosaurus: Creta- ceous herbivore that seems to have lived in very large
  herds.'
abilities:
- heading: Special Features
  text: 'Segmented Armour Class. Ceratopsians have two AC scores: one  for their armoured heads, the other for their bodies.'
- heading: Special Attacks
  text: Stomp. If a ceratopsian attacks (other than with a charge) and  exceeds its required “to hit” roll by 4 or more, it has knocked  down its target and will stomp on it for an additional 1d10  points of damage. Charge. If a ceratopsian charges and hits, it inflicts triple dam - age. OTHER DINOSAURS I
