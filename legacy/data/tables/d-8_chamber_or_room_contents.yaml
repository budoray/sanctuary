id: d-8
name: CHAMBER OR ROOM CONTENTS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D20 RESULT
- 1–7 Empty
- 8–11 Monster (determine randomly)
- 12–17 Monster and Treasure (refer to GM monster tables
- 'and see Table D-9: Treasure)'
- '18 Stairs (see Table D-13: Stairs)'
- 19  Trick or Trap (see Section 2.7.2)
- '20 Treasure (see Part Three: Treasure and Table D-9)'
- 'Proceed to Table D-9: Treasure Container'
