size: large (13ft)
alignment: chaotic evil
move: 120ft
armour_class: 3 [17]
hit_dice: '10'
melee_attacks: 1 club (2d8) and 1 other club (3d6)
senses: Infravision 60ft
lair_chance: 20%
intelligence: low (5-7)
morale: 95
loot: Cache 1 each; Hoard 3 and Cache 11  in lair
