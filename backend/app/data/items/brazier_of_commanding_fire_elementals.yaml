name: Brazier of Commanding Fire Elementals
classes: DM
description: When a fire is lit in this black iron brazier, and the words of summoning chanted for 1 round, a 12 HD fire elemental appears and behaves as if called by a conjure elemental spell. If brimstone is added to the fire before chanting, the fire elemental will be of 16 HD. Only one fire elemental may be summoned at a time; a new one cannot be called forth until the previous elemental is dismissed, slain, or dispelled.
source: OSRIC_3.0_Gamemaster_Guide.pdf
