name: Bowl Commanding Water Elementals
classes: DM
description: A stoneware bowl 1ft in diameter, 6 inches deep, and usually made of a semi-precious stone; malachite, jade, or lapis lazuli are particularly favoured for this purpose. Filling the bowl with water and chanting the summoning words for 1 round causes a 12 HD water elemental to appear. The creature summoned behaves as if called by a conjure elemental spell. Only one water elemental may be summoned at a time; a new one cannot be called forth until the previous elemental is dismissed, slain, or dispelled. If salt water is used instead of fresh water, the summoned elemental will have 16 HD rather than 12.
source: OSRIC_3.0_Gamemaster_Guide.pdf
