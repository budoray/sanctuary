description: Tropical relatives of the common boar, warthogs will only attack  if threatened or cornered. If more than two are indicated, they  will consist of a mated pair and young. Young warthogs have 2 hit  dice rather than 3, but are otherwise the same as adults.
abilities:
- heading: Special Features
  text: Die Hard. All warthogs will fight for 1–2 rounds below 0 hit points,  or to -6 hp. Unarmed Combat. Warthogs cannot be overborne or grappled,  and do not employ these tactics.
