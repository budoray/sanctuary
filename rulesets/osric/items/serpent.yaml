name: Serpent
classes: CD
description: Two forms of this staff are known to exist, a python form (60%) and a viper form (40%). Neither form uses charges. The python strikes as a +2 quarterstaff. If the user throws the staff to the ground, it grows to become a giant (25ft long) constrictor snake by the end of the round (90ft move, AC 3 [17], 49 hp). The python obeys all commands of the owner, and constricts any opponent it successfully attacks for 1d6+3 hp damage per round. The serpent returns to staff form (a full-round action) whenever the wielder desires. If the snake form is killed the staff is irreparably lost. The viper strikes as a +1 weapon for 1d4+1 hp damage. Once per day, upon command, the head of the staff becomes that of an actual serpent for 1 turn (20 hp, AC 9 [11]). During this period, any successful strike with the rod deals its usual damage and also poisons the creature hit. A victim must succeed in a saving throw vs poison or die. The viper only functions if its possessor is evil.
source: OSRIC_3.0_Gamemaster_Guide.pdf
