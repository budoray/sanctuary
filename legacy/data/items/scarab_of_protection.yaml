name: Scarab of Protection
classes: any
description: A beetle shaped pin that, if held or worn for at least 1 round, communicates its ability to the person holding it. The scarab will absorb any death magic (being magic that directly causes death, such as a death spell—petrifaction effects, for example, or effects that kill through hp loss rather than instant death, are unaffected), energy draining attacks, or negative energy effects directed at the wearer. After absorbing 12 such attacks, the scarab crumbles into worthless powder.
source: OSRIC_3.0_Gamemaster_Guide.pdf
