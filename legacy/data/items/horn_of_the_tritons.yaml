name: Horn of the Tritons
classes: DM
description: 'When sounded, the horn of the tritons grants one of the following three powers, per the user’s choice. • Calm Waters: Rough waters within a 1 mile radius of the horn will immediately be calmed. This power can also be used to dispel a water elemental, though the elemental gets a saving throw vs magic wands. • Summon Monsters: Summons nearby fish and other aquatic creatures to serve the user (typically 2d6 sharks of up to 8HD). Summoned creatures will obey the summoner to the best of their ability. User must, of course, be in a body of water where such creatures dwell. • Fear: All aquatic creatures within a 500ft radius of the horn with an intelligence of “animal” or less must save vs wands or be afflicted with fear as per the magic user spell. A successful save means the horn had only partial effect and the creature makes all attacks and subsequent saving throws at -2. The horn can be magically sounded once per day, or three times per day by a triton. Any sounding of the horn
  can be heard by all tritons within 3 miles of the horn. Horn of Valhalla (special): When the command word is spoken and the horn sounded, human fighters appear to fight on behalf of the summoner. There are four variations of this item listed below, along with their specific powers and prerequisites. A horn of Valhalla may only be magically sounded once a week. If the horn is used by someone lacking the proper prerequisites the summoned fighters will attack the user. The summoned fighters are equipped with mail shirts, shields, helms, spears, and hand or battle axes. They will obey the orders of the summoner and fight until they or their opponents are slain, or 1 hour has elapsed. D100 TYPE SUMMONS USER REQUIREMENT 01-40 Copper 2d4+1, level 2 None 41-75 Brass 2d4+1, level 3 Spellcaster 76-90 Bronze 2d4, level 4 Fighter or Thief 91-00 Iron 1d4+1, level 5 Fighter or Thief Horseshoes of Speed (any hoofed animal): An animal shod with four of these magic items increases land travelling speed
  by 30ft with a proportional increase to jumping distances. Horseshoes of the Zephyr (any hoofed animal): An animal shod with four of these magic items moves approximately 4–6 in above any roughly horizontal surface. This allows travel over water or other unstable or non-solid surfaces. An animal shod with the horseshoes of the zephyr leaves no tracks.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
