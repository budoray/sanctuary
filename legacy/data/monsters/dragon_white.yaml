name: Dragon, White
frequency: uncommon
no_encountered: 1d4
size: varies by age
alignment: chaotic evil
move: 120ft; 300ft flying (AA:II)
armour_class: 3 [17]
hit_dice: 5 to 7
melee_attacks: 2 claws (1d4) and 1 bite (2d8)
senses: Infravision 60ft, Detect  invisibility by age category
lair_chance: 30%
intelligence: low (5-7)
morale: 70, 75, or 80 (by HD)
loot: Hoard 5, Cache 1 and 5
experience: Varies by hit dice and age
description: Almost the antithesis of the fiery red dragon is the frost-rimed  white dragon of the frigid north. Although lesser than their red  cousins in size, power and intelligence, they are at least as evil.
abilities:
- heading: Special Features
  text: Sleeping Dragon.  A white dragon encountered in its lair has a  60% chance to be sleeping when the adventurers approach. If  the dragon is asleep, there is a 1 in 6 chance that it will awaken  from the mere presence of adventurers. Dragons also some - times feign sleep. Spellcasting Dragon. Only 5% of white dragons are spellcasters.  If it can cast spells, it does so as a magic-user, half the dragon’s  age category in level (age category 1-2= level 1, category 3-4=  level 2, etc.).
- heading: Special Attacks
  text: Breath Weapon. White dragon breath is a cone of deadly frost,  50ft long and 25ft diameter at the base. It does damage equal  to the dragon’s (uninjured) hit points to all in the area of effect,  but a save vs breath weapons reduces the damage to half. The  dragon may use this breath weapon up to three times per day.
- heading: Languages
  text: All dragons speak the draconic tongue, and there is a 20%  chance that a white dragon will also be able to speak common.
