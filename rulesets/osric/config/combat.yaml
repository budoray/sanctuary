# Combat-resolution constants.

# Death and unconsciousness thresholds (HP).
death_threshold: -10
unconscious_threshold: 0

# Automatic success/failure on a d20 attack roll.
auto_hit: 20
auto_miss: 1

# Damage used when no weapon is equipped.
unarmed_damage: 1d2

# Ranged attack penalty per range increment beyond the first.
range_penalty_per_increment: -2

# Sell-back ratio for equipment (fraction of purchase price returned).
sell_back_ratio: 0.5

# Thief backstab: bonus to hit and damage multiplier.
backstab:
  to_hit_bonus: 4
  damage_multiplier: 2

# Surprise chance for each side when combat begins or a new group is met (1-6).
surprise:
  chance_in_6: 2

# Initiative: side-based d6 plus this modifier. Uses the acting side's average
# dexterity missile adjustment (OSRIC reaction/attacking adjustment).
initiative:
  dex_modifier_per_point: 1

# Encumbrance tiers (weight in lb). Movement penalty is applied to base movement.
encumbrance:
  light:
    max_weight: 75
    movement_penalty: 0
    label: Light
  medium:
    max_weight: 100
    movement_penalty: 30
    label: Medium
  heavy:
    max_weight: 150
    movement_penalty: 60
    label: Heavy
  very_heavy:
    max_weight: 999999
    movement_penalty: 90
    label: Very Heavy

# Minimum movement rate regardless of encumbrance.
min_movement: 30

# Rest and recovery. All values are moddable via combat.yaml.
rest:
  # HP healed per character level when taking a short rest.
  short_rest_heal_per_level: 1
  # A short rest consumes the player's action for the round.
  consumes_action: true
  # Only safe to rest when no hostile monsters are adjacent/alive.
  require_safe_area: true
  # Chance in 6 of a wandering monster if resting in a non-safe area (disabled by require_safe_area).
  wandering_monster_chance_in_6: 1

# Death saves (optional death's-door rule).
death_saves:
  enabled: true
  # Saving throw used: "death_poison_save" maps to the character's Death/Poison/Paralysis save.
  target: "death_poison_save"
  # HP set on a successful save (stabilise). Use 0 to remain unconscious, 1 to wake with 1 HP.
  success_stabilize_at: 0
  # HP lost on a failed save.
  failure_hp_loss: 1
