name: Philosopher’s Stone
classes: any
description: Produced by an alchemist of some long-forgotten civilisation, the philosopher’s stone appears as an unremarkable, dull black rock of irregular shape and about the size of a clenched fist. Upon inspection the stone seems heavy for its size and, if spun on a flat surface the stone wobbles about its axis as if the centre were liquid. Breaking the stone open will reveal the hollow centre is filled with alchemist’s quicksilver, a wonderful substance able to transmute base metals such as lead or iron into pure gold or silver. The amount of alchemist’s quicksilver in the philosopher’s stone is sufficient to convert 5,000 lbs of iron into pure silver, or 1,000 lbs of lead into gleaming, pure gold. The potent magic of the stone also has another use. The quicksilver can be mixed with a curative potion to create oil of life. When applied to a corpse the oil acts as a resurrection spell. The quicksilver is sealed into the stone because it breaks down rapidly when exposed to air. The quicksilver
  must be used within 24 hours of breaking the stone or it loses its potency forever. Any use of the quicksilver uses all the contents of the stone, so one must decided beforehand whether to produce silver, gold, or the oil of life.
source: OSRIC_3.0_Gamemaster_Guide.pdf
