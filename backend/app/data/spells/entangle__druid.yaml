name: Entangle
slug: entangle
reversible: false
class: druid
level: 1
school: Druidic Transmutation/Alteration
range: 80-ft
duration: 1 turn
area_of_effect: 20-ft radius
components: V,S,M
casting_time: 3 segments
saving_throw: Half (see below)
text: The druid casts this spell upon a particular spot, whereupon all plants in a 20-ft radius of the enchanted location immediately begin to writhe violently about, whipping around and entangling any creature in the area. Creatures threatened in this manner are entitled to a saving throw. If the saving throw succeeds, the creature's movement rate is slowed to half normal; if the saving throw fails, the creature is so securely held in the plants that it cannot move, attack, or cast spells for the duration of the spell.
source: wiki2_spells.txt
