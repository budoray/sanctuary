name: Augury
slug: augury
reversible: false
class: cleric
level: 2
school: Clerical Divination
range: Caster
duration: Instantaneous
area_of_effect: Caster
components: V,S,M
casting_time: 2 rounds
saving_throw: None
text: Casting an augury allows the cleric to discern minor omens, indications of what might be in the future. The spell requires a focal point that will allow the omens to manifest–a set of sticks made from dragon's bone or gold is the most common focus for the spell. It is possible to derive omens from tea leaves, but a pearl worth 100 gp must be crushed into the infusion. The divination power of an augury is not strong; it will only gather omens from the pattern of the next 3 turns (30 minutes), and can only indicate whether a future action will result in weal or woe to the party. The base chance for correctly interpreting the omens is 70% plus an additional 1% per level of the caster.
source: wiki2_spells.txt
