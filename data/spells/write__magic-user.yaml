name: Write
slug: write
reversible: false
class: magic-user
level: 1
school: Arcane Evocation
range: Caster
duration: 1 hour/level
area_of_effect: Caster
components: V,S,M
casting_time: 1 round
saving_throw: None
text: This spell enables the magic user to make a written copy of a spell he or she cannot yet cast, a somewhat dangerous proposition. In order to succeed in this task, the caster must make a saving throw vs spells, with a modifier determined by the difficulty of the spell being transcribed. If the spell is up to one level higher than the magic user can cast, the saving throw is made at +2. If the spell is two levels higher than the magic user can cast, there is no bonus or penalty to the saving throw. If the spell is more than 2 levels higher than the magic user can cast, each additional level adds a -1 penalty. If the magic user fails this saving throw, the spell is not successfully copied, the caster takes 1d4 points of damage for each level of the spell, and he or she is knocked unconscious for 1 turn per hit point sustained thereby. The damage sustained cannot be healed more quickly than 4 hp per day, even with the assistance of magical healing. If the saving throw is successful, the
  magic user may copy the spell, which takes one hour per level of the spell. The material component is ink costing at least 200 gp. Illusionist Spells Unlike clerical and druidic spells, illusionist spells (also known as Phantasmal spells in the OSRIC system) do not require any special material components. There are some illusionist spells that can be cast within the area of effect of a silence spell, since they have no verbal component.
source: wiki2_spells.txt
