name: Compulsion
classes: CM
description: A staff of compulsion affects all creatures within 120ft, causing them to obey the wielder of the staff. So long as the commands are not physically detrimental to the listener, the listener will follow orders. A saving throw is allowed to creatures with INT 14+ or more than 10 hit dice. Using the staff expends a charge, and the staff cannot be recharged.
source: OSRIC_3.0_Gamemaster_Guide.pdf
