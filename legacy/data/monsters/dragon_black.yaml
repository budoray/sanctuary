name: Dragon, Black
frequency: uncommon
no_encountered: 1d4
size: varies by age
alignment: chaotic evil
move: 120ft; 240ft flying (AA:II)
armour_class: 3 [17]
hit_dice: 6 to 8
melee_attacks: 2 claws (1d4) and 1 bite (3d6)
senses: Infravision 60ft, Detect  invisibility by age category
lair_chance: 30%
intelligence: average (8-10)
morale: 75, 80, or 85 (by HD)
loot: Hoard 8
experience: Varies by hit dice and age
description: Viking champions such as Ragnar Lodbrok and Sigurd the  Volsung fought fearsome dragons that spewed a corrosive ven- om, deadly to the touch. These dragons are the deadly black  dragons. Black dragons are found mostly in swamps, marshes  and deep, dark caves.
abilities:
- heading: Special Features
  text: Sleeping Dragon.  A black dragon encountered in its lair has a  50% chance to be sleeping when the adventurers approach. If  the dragon is asleep, there is a 1 in 6 chance that it will awaken  from the mere presence of adventurers. Dragons also some - times feign sleep. Spellcasting Dragon. Only 10% of black dragons are spellcasters.  If it can cast spells, it does so as a magic-user, half the dragon’s  age category in level (1-2=1, 3-4=2, etc.).
- heading: Special Attacks
  text: Breath Weapon.  Black dragon breath is a stream of corrosive,  acidic venom, 50ft long×5ft wide. It does corrosion damage  equal to the dragon’s (uninjured) hit points to everyone in the  area of effect, but a saving throw vs dragon breath reduces this  amount to half damage. The dragon may use this breath weap- on up to three times per day.
- heading: Languages
  text: All dragons speak the draconic tongue, and there is a 30%  chance that a black dragon will also be able to speak common.
