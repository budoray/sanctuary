id: 2.13.6.1d
name: SWORD  MAJOR POWERS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- To use a sword’s major power, the weapon must be drawn and
- the owner concentrating on the desired effect. Saving throws
- for major powers are permitted as applicable. If the same pow-
- er is rolled more than once, double or triple the range of ability
- as appropriate.
- D100 POWER
- 01–07 Charm person on contact, thrice per day
- 08–15 Clairaudience 30ft range for 1 round, thrice per day
- 16–22 Clairvoyance 30ft range for 1 round, thrice per day
- 23–28 Determine direction and depth, thrice per day
- 29–34 Esp 30ft range for 1 round, thrice per day
- 35–41 Flying for 1 hour per day, 120ft move
- 42–47 Heal, once per day
- 48–54 Illusion (as per the wand of illusions), twice per day
- D100 POWER
- 55–61 Levitate up to 600 lbs for 1 turn, thrice per day
- 62–67 Strength as the spell, once per day (wielder only)
- 68–75 Telekinesis up to 250 lbs for 1 round, once per day
- 76–81 Telepathy 60ft range, twice per day
- 82–88 Teleport as the spell, 600 lbs max, once per day
- 89–94 X-ray vision 40ft range for 1 turn, twice per day
- 95–97 Roll twice, ignoring this result
- 98–99 Player may choose 1 power
- 00 Roll on special purpose table
- SPECIAL PURPOSE SWORDS
- The purpose of a sword must always suit its alignment. Killing
- must be restricted to evil if the sword is of good alignment (ex-
- 'ample: a good-aligned sword which rolls a result of “21–30 slay'
- clerics or druids” on the following table will only seek to kill evil
- clerics). Good swords dedicated to slaying monsters will always
- slay neutral or evil monsters, while evil swords dedicated to
- slaying monsters will always slay neutral or good monsters.
