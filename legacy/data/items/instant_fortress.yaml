name: Instant Fortress
classes: any
description: A small metal cube approximately the size of a standard d6. When activated with the command word the cube takes 1 round to grow into a metal tower 20ft square at the base and walls that are 30ft high and extend another 10ft into the ground. The tower will have arrow slits on all four sides and a crenellated battlement at the top. The door of the fortress will face the user and will easily open to their command; no other force of strength or magic will cause the door to open. The tower has 100 hit points and resists the first 20 points of damage from each attack. Damage to the fortress can only be repaired by means of a wish, up to 50 points per spell. Anyone standing near the cube at activation and struck by the rapid growth of the fortress takes 10d6 points of damage, save allowed vs petrifaction for half damage. Deactivation of the fortress is by means of a command word, separate from the activation command word, and the fortress cannot be deactivated unless empty.
source: OSRIC_3.0_Gamemaster_Guide.pdf
