name: Shocking Grasp
slug: shocking_grasp
reversible: false
class: magic-user
level: 1
school: Arcane Transmutation/Alteration
range: Touch
duration: 1 round
area_of_effect: One creature
components: V,S
casting_time: 1 segment
saving_throw: None
text: This spell imbues the caster's hand with a powerful electrical charge that the magic user may use to deliver a deadly shock. The electrical charge can be delivered either by a direct touch (requiring a successful attack roll) or through a conductive material such as metal. This spell is not powerful enough to deliver a dangerous shock through any significant volume of water, but a small quantity of water (a shallow puddle, for instance) could be used as a suitable conductor. The shocking grasp inflicts 1d8 hp of damage, +1 hp per level of the caster.
source: wiki2_spells.txt
