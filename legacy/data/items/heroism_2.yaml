name: Heroism
classes: FPR
description: Unlike the potion of heroism, the effects of this potion last 5d6 rounds. Extra levels and their accompanied benefits to combat are temporarily granted to the imbiber, determined by their experience level as shown in the table below. Characters above 12th level receive no benefit. IMBIBER LEVEL LEVELS GRANTED ADDITIONAL HIT DICE (D10) 0 6 5 1–3 5 4+1 4–6 4 3+2 7–9 3 2+3 10–12 2 1+4
source: OSRIC_3.0_Gamemaster_Guide.pdf
