id: 2.1.4a
name: EXPERIENCE POINT AWARDS FOR MONSTERS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- HIT DICE BASE VALUE SPECIAL EXCEPTIONAL PER HP
- Less than 1–1 5 3 25 1
- 1–1 to 1 10 5 35 1
- 1+1 to 2 30 10 50 1
- 2+1 to 3 50 15 60 2
- 3+1 to 4 75 30 70 3
- 4+1 to 5 110 45 80 4
- 5+1 to 6 160 70 120 6
- 6+1 to 7 225 120 200 8
- 7+1 to 8 350 200 300 10
- 8+1 to 9 600 300 400 12
- 9+1 to 10 700 400 500 13
- 10+1 to 11 900 500 600 14
- 11+1 to 12 1,200 700 850 16
- 12+1 to 13 1,500 800 1,000 17
- 13+1 to 14 1,800 950 1,200 18
- 14+1 to 15 2,100 1,100 1,400 19
- 15+1 to 16 2,400 1,250 1,600 20
- 16+1 to 17 2,700 1,400 1,800 23
- 17+1 to 18 3,000 1,550 2,000 25
- 18+1 to 19 3,500 1,800 2,250 28
- 19+1 to 20 4,000 2,100 2,500 30
- 20+1 to 21 4,500 2,350 2,750 33
- 21+1 and up 5,000 2,600 3,000 35
- HOW TO USE THIS TABLE
- Start with the Base XP value of a monster, which
- comes straight from its hit dice. Find the Hit Die
- value in the left column, and trace along that row
- to find the “Base Value”.
- Then, add to that Base XP value an additional
- amount for any and all Special or Exceptional abil -
- ities the monster might have (staying on the same
- row). Finally, for each individual monster, add the
- “per hit point” bonus. The bonus per hit point stays
- the same based on the monster’s hit dice.
- 'Example: You have created a 3 hit die monster with'
- one ability you estimate to be “Special,” and one
- you estimate to be “Exceptional” (see below for a
- discussion of “Special” versus “Exceptional” abili -
- ties). Since it has 3 hit dice, its Base XP is 50. The
- special ability is worth an additional 15 XP (you are
- staying on the 3HD row to find this), and the ex -
- ceptional ability is worth an additional 60 XP. This
- monster has an XP value of 50 (base) + 15 (one Spe-
- cial Ability) + 60 (one Exceptional Ability) for a total
- of 125 + 2/hp.
- Special Abilities
- Examples of special abilities are use of spells (cast-
- ing spells like a 1st to 3rd level character), a single
- spell-like power that’s equivalent to a spell of level
- 1-3, invulnerability to non-magical weapons, three
- or more attacks, and so on.
- Exceptional Abilities
- These are more powerful abilities such as a drag -
- on’s fiery breath, casting spells like a level 4+ char -
- acter, a single spell-like power that’s equivalent
- to a spell over level 4, very low armour class, very
- high damage potential, or unusual powers such as
- a gaze which petrifies its victims.
- Obviously, assigning XP values to monsters is very
- imprecise, and is an art more than a science.
