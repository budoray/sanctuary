id: 1.6.8a
name: MORALE CHECK MODIFIERS
source: OSRIC-3.0-Player-Guide-FINAL.v.7.pdf
lines:
- (ALL CUMULATIVE)
- SITUATION MODIFIER
- Per friend killed, surrendered or fled +5%
- Own side experienced 25% casualties +5%
- Numerical inferiority +10%
- Own side taken 50% casualties +15%
- Own side greatly outnumbered (2:1 or more) +20%
- Own leader defeated or downed +25%
- Per foe killed, surrendered or fled -5%
- Own side inflicted 25% casualties -5%
- Numerical superiority -10%
- Own side has inflicted 50% casualties on the
- other side -15%
- 1.6.9.  POISON, DISEASE AND INSANITY
- 1.6.9.1.  POISON
- Poisons commonly encountered in OSRIC-compatible games
- include animal venoms (such as snake and spider bites), vege -
- table toxins (often used to coat poison needles or similar devic-
- es on traps), and essentially magical poisons such as clouds of
- poisonous gas. Generally, when a creature or character ingests
- or inhales the poison, or it otherwise enters their bloodstream,
- they must roll a saving throw against poison (sometimes with
- a modifier—up to +2 for a relatively weak toxin such as that of
