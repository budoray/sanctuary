name: Helm of Underwater Action
classes: any
description: This helm has two lenses which slide down into place in front of the wearer’s eyes. These thick lenses bestow the ability to see five times further underwater than normally possible for land-dwelling humans and demi-humans. A command word creates a magical bubble of air around the wearer’s head and allows normal breathing underwater until the command word is spoken again.
source: OSRIC_3.0_Gamemaster_Guide.pdf
