name: Eyes of the Eagle
classes: IM
description: Wearing both of these crystal lenses allows the user to detect secret and concealed doors and similarly hidden objects as an elf. These lenses work best in pairs. Wearing only 1 will cause a person to become dizzy, drop anything carried in the hands, become unable to take any action, lose any dexterity bonus to AC, and incur a -2 AC penalty. Covering the unlensed eye will prevent this effect.
source: OSRIC_3.0_Gamemaster_Guide.pdf
