name: Bag of Devouring
classes: any
description: This item appears as an everyday sack and mystical means of identification will indicate it is a bag of holding. The bag of devouring actually has the same capacity for storage as a regular bag of holding but in fact the bag is a lure and feeding orifice for an extra-dimensional creature. Some say this horror is the result of an evil mage’s twisted experiment on a trapped mimic, or perhaps a doppelgänger, but even the wisest of sages cannot say with any certainty. The bag of devouring senses any intrusion of vegetable or animal matter, such as an adventurer’s arm, into the bag—though 90% of the time it will ignore the initial intrusion. With each subsequent introduction of living material the bag is 60% likely to grab the offending member and attempt to draw the victim inside. The bag is quite strong and the rows of teeth revealed in the attack are designed to allow a struggling creature to move inward easily but outward only with great difficulty. Treat attempts to break free
  as a Major Test of Strength. The character gets three such attempts; the first when initially grabbed, the second at -10% when halfway inside, the last at -20% before disappearing into the creature’s maw. Any living material drawn into the bag of devouring is entirely consumed in 1 round and thus attempts to raise or resurrect the victim which require a part of the corpse are disallowed. Due to the chaotic and other planar nature of the beast, there is only a 50% chance a wish, miracle, or resurrection (if a part of the person was retained outside the bag) will succeed and if that check fails, the victim is irrevocably destroyed. Though the bag of devouring can function somewhat as a bag of holding there is a cumulative 5% chance per hour of the bag swallowing its contents and spitting them out onto some randomly determined plane of existence.
source: OSRIC_3.0_Gamemaster_Guide.pdf
