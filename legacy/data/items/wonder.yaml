name: Wonder
classes: any
description: 'A wand of wonder is a strange and unpredictable device that randomly generates any number of weird effects each time it is used. Each use costs 1 charge. In some cases a saving throw is appropriate. The effects should be considered typical of those possible, but the GM may adjust these or create new effects depending on the situation. Typical powers of the wand (roll each time it is used) include the following: D100 WONDROUS EFFECT 01–05 Slow creature pointed at for 1 turn. 06–10 Faerie fire surrounds the target. 11–15 Deludes wielder for 1 round into believing the rod functions as indicated by a second die roll (no save). 16–20 Gust of wind, but at twice the power. 21–25 Wielder learns target’s surface thoughts (as with ESP) for 1d4 rounds. 26–30 Stinking cloud at 30ft range. 31–33 Heavy rain falls for 1 round in 60ft radius centred on wand wielder. 34–36 Summon an animal—a rhino (01–25), elephant (26–50), or mouse (51–00). 37–46 Lightning bolt (70ft long, 5ft wide), 6d6 damage.
  47–49 Stream of 600 large butterflies pours forth and flutters around for 2 rounds, blinding everyone (including wielder). 50–53 Enlarge victim if within 60ft of wand. 54–58 Darkness, 30ft diameter hemisphere, centred 30ft away from wand. 59–62 Grass grows in 160ft square area before the wand, or grass existing there grows to ten times normal size. D100 WONDROUS EFFECT 63–65 Vanish any nonliving object of up to 1,000 lb mass and up to 30ft cubed in size. 66–69 Reduce wielder to 1/12 height. 70–79 Fireball, 6d6 damage, as wand. 80–84 Invisibility covers wand wielder. 85–87 Leaves grow from target if within 60ft of wand. 88–90 10–40 gems, value 1 gp each, shoot forth in a 30ft long stream. Each gem deals 1 point of damage to any creature in its path: roll 5d4 for the number of hits. 91–95 Shimmering colours dance and play over a 40ft×30ft area in front of wand. Creatures therein are blinded for 1d6 rounds. 96–97 Wielder (50% chance) or target (50% chance) turns permanently blue, green, or
  purple. 98–00 Flesh to stone (or stone to flesh if target is stone already) if target is within 60ft. 2.13.5. MAGIC ARMOUR AND SHIELDS In addition to benefiting armour class, magic armour also lends its bonus to the wearer’s saving throws against disintegration, falling, corrosive damage, fire damage, and magical damage. Non-metal magic armour extends this protection to electrical damage as well. Sometimes magic armour and shields go beyond a simple bonus to armour class. Presented here are a few examples to spur the imagination.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
