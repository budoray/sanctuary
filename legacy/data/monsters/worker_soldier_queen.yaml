description: Giant ants are a dangerous threat to dungeon adventurers, but  they can also be encountered above ground. The population of a giant ant colony is determined by rolling for  the number of workers (1d100). There will also be one soldier  for each five workers (round fractions up). The queen can’t move or fight, and lives at the heart of the col - ony. It takes twelve workers to carry her, moving at 30ft. If the  queen’s chamber is invaded, twelve workers will try to carry her  to safety while the rest of the colony (workers and soldiers alike)  attacks the intruders. If the queen is killed, the entire colony will be confused (as the  7th level druidic spell) for 1d6 rounds. They will then leave the  colony in search of a new one.
abilities:
- heading: Immunities and Resistances
  text: Many-legged. A giant ant cannot be knocked prone, overborne,  or grappled.
- heading: Special Features
  text: Climber. Giant ants can move on walls and ceilings as if they  were floors.
- heading: Special Attacks
  text: 'Melee Attack: Poison (Soldiers only).  Anyone bitten by a soldier  ant will take 3d4 hit points of damage from poison in addition  to the piercing damage unless they succeed at a saving throw  vs poison, in which case the poison damage is 1d4 hit points. Unarmed Combat. Giant ants cannot be overborne or grappled,  and do not employ these tactics.'
- heading: Languages
  text: None. APE
