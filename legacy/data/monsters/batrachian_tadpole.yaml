description: Batrachians are humanoid frog-people of several different varieties. The more  advanced batrachian species/cultures use javelins, spears (or harpoons) and  armour.  There is a 25% chance that batrachians will have 2d4 giant frogs (75%) or poi - sonous giant frogs (25%) in their lair. Advanced batrachians with poisonous gi- ant frogs available may (50% chance) have anointed their spears or harpoons  with poison. Batrachian tadpoles spend most of their time in water, and usually dwell in a  large, central pool, but they can emerge and fight if threatened. Rumours persist of batrachian ghouls, which may be under a tribal priest or  witch-crafter’s command. If 30 or more batrachians are encountered at once, there will be 1d6 batra - chian leaders with 2 HD. These larger batrachians have a strength bonus of  +1 to damage. Batrachians can have witch-priests (maximum of 5th level) or witch-crafters  (maximum of 5th/4th level).
abilities:
- heading: Immunities and Resistances
  text: Hold Breath. This creature can go for up to an hour between breaths.
- heading: Special Features
  text: Ambush. Batrachians are well-camouflaged and  can remain motionless for long periods. They  are also cold-blooded and hence hard to see  with infravision. As a result, they surprise oppo- nents on a 1-3, and on a 1-5 if hopping. Clumsy. If not armed with a long weapon like a  spear or harpoon, a batrachian will always lose  initiative due to its clumsy movements on land.
- heading: Special Attacks
  text: 'Hop. A hop counts as a charge, with an additional  +1 “to hit” bonus with a weapon. A batrachian  making a hop attack with a spear or harpoon  inflicts double damage.  Ranged Attack. Adult batrachians can attack with  javelins. 1 javelin (1d6 piercing). Range incre - ment 20ft (-2 at 21+ft, -4 at 41+ft). Unarmed Combat.  Batrachians can choose to  overbear or grapple instead of making a regu - lar melee attack. If not fended off, they score an  unarmed hit with a 2+ on 1d20 (6+ if wearing  armour). Hit Mods: ATK/DEF +2/-2. Overbear  Results Mods: ATK/DEF +0/-0. Grappling Result  Mods: ATK/DEF +0/-0. BEAR, LESSER'
