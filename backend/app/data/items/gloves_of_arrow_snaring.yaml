name: Gloves of Arrow Snaring
classes: any
description: Extremely light leather gloves that twice per day allow the wearer to snatch a missile out of the air. Both gloves must be worn and at least one hand must be free for the magic to work. Huge missiles, such as a giant-thrown boulder, are unaffected and the wearer must be aware of the attack for the gloves to function. Casting a spell using a somatic component will negate the benefit of these gloves during the round the spell is cast.
source: OSRIC_3.0_Gamemaster_Guide.pdf
