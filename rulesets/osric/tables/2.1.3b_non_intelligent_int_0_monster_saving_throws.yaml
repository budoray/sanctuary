- 2.1.3. MONSTER  SAVING THROWS
- Non-intelligent monsters use a different saving throw table than
- monsters with INT 1 or better. Usually, you’ll be rolling monster
- saving throws on Table 1.2a for all monsters with an intelligence
- other than “Non- (0)”, so that table comes first.
- All of the hit die numbers are “up to” that number. A monster
- with hit dice of 1+1 (1d8+1) is treated as a monster with 2 hit
- dice on this table because 1+1 is greater than 1.
