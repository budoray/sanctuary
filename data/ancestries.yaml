# OSRIC 3.0 Player Guide, Chapter Two: Ancestry (§1.2.1-1.2.7).
#
# `minimums`/`maximums` only carry an ability when Table 1.2.0A's range for
# that ancestry differs from the default 3-18 (e.g. a dwarf's default INT
# 3-18 is omitted; its STR floor of 8 and CON ceiling of 19 are not).
# `level_limits` collapses a Strength/Intelligence/Dexterity-conditioned cap
# to the best-case (highest qualifying score) ceiling, since the schema
# holds one integer per class; 0 means unlimited.
dwarf:
  ability_adjustments: {constitution: 1, charisma: -1}
  minimums: {strength: 8, constitution: 12}
  maximums: {dexterity: 17, constitution: 19, charisma: 16}
  infravision_ft: 60
  allowed_classes: [assassin, cleric, fighter, thief]
  level_limits: {assassin: 9, cleric: 8, fighter: 9, thief: 0}
elf:
  ability_adjustments: {dexterity: 1, constitution: -1}
  minimums: {dexterity: 7, constitution: 6, intelligence: 8, charisma: 8}
  maximums: {dexterity: 19}
  infravision_ft: 60
  allowed_classes: [assassin, cleric, fighter, magic-user, thief]
  level_limits: {assassin: 10, cleric: 7, fighter: 7, magic-user: 11, thief: 0}
gnome:
  ability_adjustments: {}
  minimums: {strength: 6, constitution: 8, intelligence: 7}
  maximums: {}
  infravision_ft: 60
  allowed_classes: [assassin, cleric, fighter, illusionist, thief]
  level_limits: {assassin: 8, cleric: 7, fighter: 6, illusionist: 7, thief: 0}
half-elf:
  ability_adjustments: {}
  minimums: {dexterity: 6, constitution: 6, intelligence: 4}
  maximums: {}
  infravision_ft: 60
  allowed_classes: [assassin, cleric, druid, fighter, magic-user, ranger, thief]
  level_limits: {assassin: 11, cleric: 5, druid: 14, fighter: 8, magic-user: 8, ranger: 8, thief: 0}
halfling:
  ability_adjustments: {dexterity: 1, strength: -1}
  minimums: {strength: 6, dexterity: 8, constitution: 10, intelligence: 6}
  maximums: {strength: 17, constitution: 19, wisdom: 17}
  infravision_ft: 60
  allowed_classes: [druid, fighter, thief]
  level_limits: {druid: 6, fighter: 4, thief: 0}
half-orc:
  ability_adjustments: {strength: 1, constitution: 1, charisma: -2}
  minimums: {strength: 6, constitution: 13}
  maximums: {dexterity: 17, constitution: 19, intelligence: 17, wisdom: 14, charisma: 12}
  infravision_ft: 60
  allowed_classes: [assassin, cleric, fighter, thief]
  level_limits: {assassin: 15, cleric: 4, fighter: 10, thief: 7}
human:
  ability_adjustments: {}
  minimums: {}
  maximums: {}
  infravision_ft: 0
  allowed_classes: [assassin, cleric, druid, fighter, illusionist, magic-user, monk, paladin, ranger, thief]
  level_limits: {}
