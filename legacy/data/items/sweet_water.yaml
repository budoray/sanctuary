name: Sweet Water
classes: any
description: This sweet-tasting liquid can be used to cleanse water (including turning salt water into fresh water) or otherwise transform poisons, acid, etc. into drinkable liquid. Further, sweet water will destroy other potions. For most liquids, this potion will affect up to 100,000ft cubed. However, only 1,000ft cubed of acid can be neutralised. The effects of sweet water are permanent, and once treated, liquid will resist spoilage or contamination for 5d4 rounds after which it can be contaminated once again.
source: OSRIC_3.0_Gamemaster_Guide.pdf
