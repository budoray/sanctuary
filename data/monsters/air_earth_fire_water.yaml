description: Elementals are formless (but material) manifestations of a spir- it from one of the elemental planes of existence, which takes  shape as a pure and animate form of the element. They are usu- ally summoned by a spell, but can also form in places of high  magic or with a close connection to the elemental plane. Unarmed Combat. Elementals cannot be overborne or grappled,  and do not usually employ these tactics other than occasionally  overbearing.
abilities:
- heading: Languages
  text: Each of the elemental planes has its own language. Elementals  understand the speech of their home plane and the common  tongue. They can speak only in the tongue of their native planes,  and even this is only a very rudimentary skill; they do not have  the same kind of thoughts as most sapient beings, which makes  communication difficult. AIR ELEMENTALS Air Elementals are creatures from the Elemental Plane of Air,  though they may sometimes be found elsewhere. When en - countered on the Prime Material Plane, usually as a result of  summoning magic, they take the form of billowing air, visible  only because of the dust or vapour blown around by the air col- umn.
- heading: Immunities and Resistances
  text: Immune to Mundane and +1 Weapons.  This creature is immune  to piercing, blunt, and slashing damage from weapons and un- armed attacks, unless the weapon causing that damage has a  magical bonus of +2 or more.
- heading: Special Attacks
  text: Airborne Combat.  The air elemental’s great airborne speed  makes it a swift and formidable opponent. Against an airborne  opponent it gains +1 “to hit” and +4 to damage. Whirlwind. Air Elementals may also use a whirlwind attack if so  commanded. To do this, the Air Elemental must assume the  form of a small cyclone, which takes one full turn (10 combat  rounds). Typically, this appears to be 30ft in diameter at the  top and funnels down to 10ft in diameter at its base; the cone  extends 20ft in height for every 4 HD the elemental possesses.  This whirlwind attack lasts for only one round, but any crea - tures with less than 3 hit dice that find themselves within it are  slain; creatures with 3 HD or more take 2d8 damage. Should  the cyclone for some reason be unable to reach its full height,  only creatures with less than 2HD will suffer immediate death,  whilst all others take only 1d8 damage. EARTH ELEMENTALS Earth Elementals are creatures from the Elemental Plane of  Earth, though
    they may sometimes be found elsewhere. When  encountered on the Prime Material Plane, usually as a result of  summoning magic, they seem to be vaguely humanoid mounds  of stone, earth, metal and crystal. Whilst they may have a dis - cernible head and face, it is usually devoid of expression.
- heading: Immunities and Resistances
  text: Immune to Mundane and +1 Weapons.  This creature is immune  to piercing, blunt, and slashing damage from weapons and un- armed attacks, unless the weapon causing that damage has a  magical bonus of +2 or more.
- heading: Special Features
  text: Pass Through Stone.  Earth elementals pass through rock and  earth without hindrance, as they do along the ground, but they  cannot travel through the air nor in (or over) water unless they  remain in contact with the earth. Destroy Structures.  The power of Earth Elementals against  ground-built structures and fortifications is truly devastating;  they are capable of reducing small structures to rubble in a  matter of minutes and even the largest will eventually collapse  if the Elemental is free to work against it. If need be, this can  be measured as an automatic 2d4 points of structural damage  (see “Strongholds”) per round.
- heading: Special Attacks
  text: Earth Contact. When an earth elemental attacks opponents who  are also in contact with the earth, their great limbs strike for  4d8 points of damage; against foes who are not in contact with  ground, the Earth Elemental strikes for only 4d6 points of dam- age. FIRE ELEMENTALS Fire Elementals are creatures from the Elemental Plane of Fire,  though they may sometimes be found elsewhere. When en - countered on the Prime Material Plane, usually as a result of  summoning magic, they take the form of a great flickering sheet  of flame, which occasionally seems to have a somewhat human- oid shape.  Fire Elementals may not travel across or enter non-flammable  liquids; they cannot, for instance, cross broad rivers without the  aid of a bridge or a similar contrivance, though they can leap  narrow streams.
- heading: Immunities and Resistances
  text: Immune to Mundane and +1 Weapons.  This creature is immune  to piercing, blunt, and slashing damage from weapons and un- armed attacks, unless the weapon causing that damage has a  magical bonus of +2 or more.
- heading: Special Attacks
  text: Fists of Flame.  Those unlucky enough to be struck by the fiery  appendages of these elementals not only suffer 3d8 points of  damage, but any combustible items exposed will be set alight if  they fail a saving throw against magical fire, which is subject to  a -2 penalty. Creatures capable of innately controlling or oth - erwise making use of fire are somewhat resistant to the Fire  Elementals, taking only 3d6 points of damage if struck by one.  WATER ELEMENTALS Water Elementals are creatures from the Elemental Plane of  Water, though they may sometimes be found elsewhere. When  encountered on the Prime Material Plane, usually as a result of  summoning magic, they take the form of a great wave of water  or other liquid, constantly in motion, but retaining an almost  humanoid shape. Some claim that they have sea green eyes, of  a sort, and others that they were able to discern a mouth.
- heading: Immunities and Resistances
  text: Immune to Mundane and +1 Weapons.  This creature is immune  to piercing, blunt, and slashing damage from weapons and un- armed attacks, unless the weapon causing that damage has a  magical bonus of +2 or more.
- heading: Special Attacks
  text: Melee Combat.  Water Elementals forced to fight on land can - not do so more than sixty yards from the place at which they  entered the plane they are currently on, which on the Prime  Material Plane is generally the place of summoning. Addition - ally, when fighting on land they strike opponents for only 5d4  points of damage. If surrounded by water (including marshy  terrain), they attack for 5d6 blunt damage. Sink Ships. Ships are particularly vulnerable to Water Elementals,  which are capable of overturning any vessel with a tonnage  equal to or less than their HD, and of stopping the movement  of those with a tonnage equal or less than the Water Elemen - tal’s hit points. Ships with a greater tonnage than the Elemen - tal has hit points total can travel at 1% of their speed for each  point by which tonnage exceeds the elemental’s hit points. ELEPHANT
