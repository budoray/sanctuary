name: MINOR ARTIFACT DESCRIPTIONS Book of Infinite Spells
classes: any
description: 'This ancient tome appears to be a nondescript and well used travelling spellbook of the type favoured by adventuring wizards. This artifact grants to any player of any class the ability to cast the spells contained within its pages, though any character of a class unable to cast spells will function at one level lower while in possession of the artifact. The book of infinite spells contains 2d6+20 pages (22–32 pages) and the nature of the spell scribed on each page is determined randomly using 1d10, with a die roll of 1–5 indicating an arcane magic spell and a roll of 6–10 indicating divine magic. GMs may use the following table to assist with random selection of spells. D100 SPELL LEVEL D100 SPELL LEVEL 01–05 4th 71–85 7th 06–50 5th 86–95 8th 51–70 6th 95–00 9th This artifact book has a rather curious property—the pages may only be turned from front to back. Once a page has been turned, it may never be unturned, and the book always opens to the page it was on when last used.
  When the last page is turned the book vanishes and if the player lost a level when first opening the book that level is restored to the player. The owner can cast the spell scribed upon the active page once per day and if the spell is one usable by the user’s class it can be cast up to four times per day. The book’s owner need not have the book on their person to use its power. The spells inscribed therein may not be copied into a spellbook, for the magic is bound up within the artifact itself, nor may a page be ripped from the book without destroying it. Any casting of a spell from the book creates an energy feedback which has a chance of causing the page to magically turn. This turning of the page will occur in spite of any precautions taken to prevent from it doing so. Of course, due to the random nature of the book’s content, the turning of the page to a new spell may actually benefit the owner. The owner knows the newly-available spell as soon as this occurs. The book of infinite
  spells is treated as a scroll in terms of actual casting time, effects, saving throws, material components and so on. Condition and Chance of Page Turning: • Caster employing a spell usable by class and level: 10% • Caster employing a spell not usable by class and level: 20% • Non-spellcaster employing a divine or druidic spell: 25% • Non-spellcaster employing an arcane or phantasmal spell: 30%'
source: OSRIC_3.0_Gamemaster_Guide.pdf
