name: Glove of Storing
classes: AT
description: A single plain-appearing leather glove. Any item up to 20 lbs of weight held in the hand wearing the glove can be commanded to disappear. The item is actually shrunk down into the palm of the glove and held there in stasis and weightless, though spell effects will continue to accrue expiration time. The item can be commanded to reappear by snapping the fingers. Only one item may be stored at a time.
source: OSRIC_3.0_Gamemaster_Guide.pdf
