name: Blessed Book
classes: IM
description: An exceptionally made travelling spell book with magical properties, the blessed book is about 12-in×8-in and 1-in thick, with 1,000 pages. The book is quite durable; iron-bound and inlaid with silver protective runes and a sturdy lock. A magic user or illusionist can write spells into the blessed book without incurring the costs normally associated with inscribing spells in a spell book or travelling spell book. When found as a randomly generated treasure, this book is usually empty of spells.
source: OSRIC_3.0_Gamemaster_Guide.pdf
