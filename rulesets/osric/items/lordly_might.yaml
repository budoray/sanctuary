name: Lordly Might
classes: FPR
description: 'This rod has functions that are spell-like, and it can also be used as a magic weapon of various sorts. It also has several more mundane uses. The rod of lordly might is metal, thicker than other rods, with a flanged ball at one end and six stud-like buttons along its length. It weighs 10 lbs, and a strength of 16 or greater is necessary to wield this weapon. Any character with less than 16 strength suffers an attack penalty of -1 per point below 16. The rod has the following spell-like functions, each of which costs 1 charge: • Fear upon all enemies viewing it, if the wielder so desires (60ft maximum range). The target is allowed a save vs magic. • Paralyse upon touch, if the wielder so commands. The wielder must choose to use this power and then succeed on a melee touch attack to activate the power. If the attack fails, the effect is lost. The target is allowed a save vs magic. • Deal 2d4 hp of damage to an opponent on a successful touch attack (no save) and cure the wielder
  of a like amount of damage. The following weapon functions of the rod do not require the use of charges: • In its normal form, the rod can be used as a +2 mace. • When button #1 is pushed, the rod becomes a +1 flaming sword. A blade springs from the ball, with the ball itself becoming the sword’s hilt. The weapon lengthens to an overall length of 3ft. • When button #2 is pushed, the rod becomes a +4 battle axe. A blade springs forth at the ball, and the whole lengthens to 4ft. • When button #3 is pushed, the rod becomes a +3 spear. The spear blade springs forth, and the handle can be lengthened up to 12ft (wielder’s choice), for an overall length of from 6ft to 15ft. At its 15ft length, the rod is suitable for use as a lance. The following other functions of the rod do not employ charges: • Climbing pole/ladder. When button #4 is pushed, a spike that can anchor in granite is extruded from the ball, while the other end sprouts three sharp hooks. The rod lengthens to anywhere between 5 and
  50ft in a single round, stopping when button 4 is pushed again. Horizontal bars 3-in long fold out from the sides, 1ft apart, in staggered progression. The rod is firmly held by the spike and hooks and can bear up to 4,000 lbs. The wielder can retract the pole by pushing button #5. • The ladder function can be used to force open doors. The wielder plants the rod’s base 30ft or less from the portal to be forced and in line with it, then pushes button #4. The force exerted has a strength equal to that of a storm giant. • When button #6 is pushed, the rod indicates magnetic north and gives the wielder a knowledge of their approximate depth beneath the surface or height above it. This rod may never be recharged. When the charges are expired, functions that require charges may not be used again, and neither may the rod be employed as a +1 flaming sword nor a +4 battle axe. These attributes are lost.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
