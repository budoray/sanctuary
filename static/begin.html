<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary — Begin</title>
  <link rel="stylesheet" href="/css/sanctuary.css">
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
  <script src="/js/icons.js"></script>
</head>
<body>
  <header>
    <h1>Sanctuary</h1>
    <a href="/">About</a>
  </header>

  <main class="app">
    <section id="auth-check" class="panel">
      <p>Checking session…</p>
    </section>

    <section id="create-panel" class="panel hidden">
      <h2>Create Character</h2>
      <form id="create-form">
        <label>
          Name
          <input type="text" name="name" required maxlength="32">
        </label>
        <label>
          Ancestry
          <select name="ancestry" id="ancestry-select" required></select>
        </label>
        <label>
          Class
          <select name="class" id="class-select" required></select>
        </label>
        <label>
          Alignment
          <select name="alignment" id="alignment-select" required></select>
        </label>
        <button type="submit">Roll 3d6 & Create</button>
      </form>
      <div id="create-result"></div>
    </section>

    <section id="roster-panel" class="panel hidden">
      <h2>Your Characters</h2>
      <ul id="character-list"></ul>
    </section>

    <section id="inventory-panel" class="panel hidden">
      <h2>Equipment</h2>
      <div id="inventory-summary"></div>
      <form id="add-item-form">
        <label>
          Item
          <select name="item_id" id="item-select" required></select>
        </label>
        <label>
          Quantity
          <input type="number" name="quantity" value="1" min="1" max="99" required>
        </label>
        <label>
          <input type="checkbox" name="equipped" value="true">
          Equip immediately
        </label>
        <button type="submit">Add Item</button>
      </form>
      <ul id="inventory-list"></ul>
    </section>

    <section id="dice-panel" class="panel hidden">
      <h2>Dice</h2>
      <form id="dice-form">
        <label>
          Roll
          <input type="text" name="expression" id="dice-expression" value="3d6" required pattern="[0-9dD\\+\\- ]+">
        </label>
        <button type="submit">Roll</button>
      </form>
      <div class="quick-dice">
        <button data-expr="3d6">3d6</button>
        <button data-expr="1d20">d20</button>
        <button data-expr="1d100">d100</button>
        <button data-expr="1d6">d6</button>
        <button data-expr="1d8">d8</button>
        <button data-expr="1d4">d4</button>
      </div>
      <ul id="dice-log"></ul>
    </section>

    <section id="ground-panel" class="panel hidden">
      <h2>Test Ground</h2>
      <p id="ground-status">Loading…</p>
      <div id="ground-canvas"></div>
      <div class="controls square-controls">
        <div></div>
        <button data-dir="3">↑</button>
        <div></div>
        <button data-dir="2">←</button>
        <div></div>
        <button data-dir="0">→</button>
        <div></div>
        <button data-dir="1">↓</button>
        <div></div>
      </div>
      <p class="hint">Click a direction to move the selected token. 3x3 tiles = 10ft x 10ft.</p>
    </section>
  </main>

  <script src="/js/sanctuary.js"></script>
</body>
</html>
