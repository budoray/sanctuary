name: ESP
slug: esp
reversible: false
class: magic-user
level: 2
school: Arcane Divination
range: Caster
duration: 1 round/level
area_of_effect: 5-ft radius/level, maximum 90-ft
components: V,S,M
casting_time: 2 segments
saving_throw: None
text: This spell allows the caster to overhear the surface thoughts of any thinking being in the spell's radial area of effect. The caster need not be able to see the creature whose thoughts he is reading; the spell can be used to listen beyond a closed door. The spell cannot penetrate more than two feet of stone or more than two inches of any metal, and it is foiled by even a thin sheet of lead.
source: wiki2_spells.txt
