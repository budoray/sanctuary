name: Ring of Free Action
classes: any
description: This magic item permits the wearer to move freely under any conditions. This applies even if the wearer is attacked by a hold person, slow, or web spell; and also negates environmental effects such as the individual being underwater. The individual can move at normal movement rates and do full damage with melee weapons, though missile and hurled weapons will be subject to the spell or environmental effects as appropriate. Though the ring of free action grants freedom of movement underwater, it should be noted the ring does not grant the ability to breathe underwater.
source: OSRIC_3.0_Gamemaster_Guide.pdf
