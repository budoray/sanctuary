name: Caterwaul
frequency: rare
no_encountered: '1'
size: medium
alignment: chaotic evil
move: 180ft or 240ft
armour_class: 6 [14] (see below)
hit_dice: 4+2
melee_attacks: 2 claws (1d4) and 1 bite (1d6)
senses: Infravision 60ft
lair_chance: 20%
intelligence: low (5-7)
morale: 70
loot: Individual 5, Cache 4, 5 and 7
