name: Goggles of Night
classes: any
description: 'Dark, opaque crystal lenses which do not impede normal vision in any way. They grant 60ft infravision. Must be used in pairs. Golem Manual (C or M): Allows creation of the type of golem specified in the book’s title. Each manual contains detailed instructions and all necessary spells for creation of a golem, though the cost of the materials to assemble the construct must still be borne by the maker. When the user reaches the final step in the golem creation process the book will burst into flame. Sprinkling the ashes from this magical fire onto the golem activates the construct. There are four kinds: Clay, Flesh, Iron and Stone (roll 1d4 to determine the type found).'
source: OSRIC_3.0_Gamemaster_Guide.pdf
