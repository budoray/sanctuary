name: Summon Insects
slug: summon_insects
reversible: false
class: druid
level: 3
school: Druidic Conjuration/Summoning
range: 30-ft
duration: 1 round/caster level
area_of_effect: See below
components: V,S,M
casting_time: 1 round
saving_throw: None
text: When the druid completes the intonations and gestures of this spell, a swarm of insects appears from nearby or from the thin air to attack the druid's enemies. There is a 70% chance that the swarm will be composed of flying insects, 30% chance that the insects will be ants or other non-airborne biting vermin. A flying swarm can move tremendously fast, but a crawling swarm is limited to movement of 12-ft/round. In either case, the insects automatically inflict 2 hp damage per round against their target, and the unfortunate victim will be so thickly covered as to be incapable of any action, including movement. The druid may redirect the swarm to attack another opponent, but the command will cause 1 round of confusion within the swarm as it reorients itself toward the new target.
source: wiki2_spells.txt
