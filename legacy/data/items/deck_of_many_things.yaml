name: Deck of Many Things
classes: any
description: 'This artifact is the ultimate two– edged sword, conferring effects both beneficial and baneful. It consists of a deck of 22 finely-carved ivory plaques in an intricately–carved box of polished ebony. There have also been reports of versions of the deck consisting of fine vellum cards in a leather bag. The individual carvings on the plaques or cards are composed mainly of an archetypal character derived from ancient human lore and a variety of runes of power. The owner of the deck draws as many plaques as they wish from the deck and whatever effect is bestowed takes place instantly, whether for weal or woe. The following conditions apply to using this artifact. First, the owner must declare beforehand exactly how many cards they wish to draw from the deck before they begin; otherwise they will be unable to draw from the deck. Once the number of cards is declared they must be drawn from the deck within an hour of each other. If the character does not draw the declared number
  of cards from the deck, either willingly or unwillingly, at the end of one hour the specified number of cards will flip out of the deck automatically at the rate of one per turn. Each time a card is drawn it is returned to the deck before drawing again, making it possible to draw the same card multiple times. The table on the following page is a listing of the various plaques and their effects, following the table is a more complete description. Included is a corresponding card, both Tarot and common playing card, so the GM can have the player actually draw from a deck. Dice may also be used to generate a random result. PLAQUE TAROT CARD PLAYING CARD SUMMARY OF EFFECT Balance XI. Justice Two of Spades Change alignment. Comet Two of Swords Two of Diamonds Defeat the next monster you encounter to gain one level. Donjon Four of Swords Ace of Spades You are imprisoned. Euryale Ten of Swords Queen of Spades Permanent –1 to all saving throws. The Fates Three of Cups Ace of Hearts Avoid, one
  time, any situation of your choosing. Flames XV. The Devil Queen of Clubs Enmity between you and an outsider. Fool 0. The Fool Joker (with TM) Lose 10,000 experience points and you must draw again. Gem Seven of Cups Two of Hearts Gain your choice of 25 pieces of jewellery or 50 gems. Idiot Two of Pentacles Two of Clubs Lose intelligence permanently, you may draw again. Jester XII. The Hanged Man Joker (no TM) Gain 10,000 experience points, or, two more draws from the deck. Key V. The Hierophant Queen of Hearts Gain a major magic weapon. Knight Page of Swords Jack of Hearts Gain the service of a 4th level fighter. Moon XVIII. The Moon Queen of Diamonds You are granted 1d4 wishes. Rogue Five of Swords Jack of Spades One of your friends turns against you. Ruin XVI. The Tower King of Spades Immediately lose all wealth and real property. Skull XIII. Death Jack of Clubs Defeat dread wraith or forever be destroyed. Star XVII. The Star Jack of Diamonds Immediately gain a +2 permanent bonus to
  one ability score. Sun XIX. The Sun King of Diamonds Gain beneficial magic item and 50,000 experience points. Talons Queen of Pentacles Ace of Clubs All magic items you possess disappear. Throne Four of Staves King of Hearts Gain a +1 to charisma. Vizier IX. The Hermit Ace of Diamonds Know the answer to your next dilemma. The Void Eight of Swords King of Clubs Body functions but soul is trapped elsewhere. • Balance: The character must immediately change to a radically different alignment. Failure to act in accordance with this new outlook on life will result in the player losing a level. • Comet: To gain the xp and level raise benefit, the character must defeat the next monster or monsters encountered with no aid or assistance of any kind. If successful, the character gains enough experience to gain the next level of advancement. • Donjon: The character is imprisoned, either by some powerful being or as the ninth level magic user spell. The character appears in a cell or holding area with
  absolutely nothing except their skin. All additional card draws are forfeit if this card is drawn. • Euryale: The -1 penalty is immediate and permanent, save by the intervention of a deity or by The Fates card in this same deck. • Fates: The skein of reality, the actual fabric of space-time will be rewoven by the Fates on behalf of the player drawing this plaque. This card will prevent something from happening or undo a past event but the Fates cannot cause an event to happen. Note well this alteration of fate only applies to the player actually drawing the card. The remainder of their party may or may not reap the benefit with him or her. • Flames: The flames of wrath are kindled between the player and an outsider. The slight may be real or imagined on the part of the outsider but the enmity will burn brightly until either the player or the outsider is slain. Determine the exact nature of the foe randomly; roll 1d20 for number of days until it attacks or otherwise begins to vex the player.
  • Fool: Both the redraw and the experience point penalty are immediate and mandatory. Discard this plaque before redrawing. • Gem: The jewellery is exquisitely made and set with dazzling gems; each piece is worth 2,000 gp. The gems are flawless and worth 1,000 gp apiece. • Idiot: Roll 1d4+1 to generate the total number of points deducted from intelligence ability, imposed on the spot. The redraw is optional, but once the player declares a decision out loud it cannot be changed. • Jester: The redraw is optional, but once the player declares a decision out loud it cannot be changed. This card is discarded before any redraws take place. • Key: A powerful magic weapon of a type the player can use materialises in their hand. • Knight: The fighter is equipped with non-magical armour, equipment and weapons and is of the same gender and ancestry as the character. This henchman appears from nowhere and offers their sword to the character, serving loyally until death. • Moon: The wishes expire in
  a number of minutes equal to the number of wishes. Any wishes remaining unused at the end of this time period will be lost forever. • Rogue: The traitor is preferably an NPC in the player’s employ, and will forever after be completely hostile to them. If the player has no cohorts in their employ, the enmity of an NPC at the player’s home base area, a powerful political or religious figure, can be substituted. The traitorous former friend will do all in their power to ruin the player financially, socially, and politically. • Ruin: As stated, all nonmagical items possessed (not just carried) by the player immediately and irrevocably vanish. • Skull: An unturnable dread wraith appears and attacks the character. The wraith warns any companions not to interfere, the only time it will speak, and anyone helping the victim will find themselves facing their own dread wraith in a fight to the death. If the player is slain he cannot be revived, even by means of a wish or miracle. Stats for the dread
  wraith are included here (and not in the monster section—because this is the only situation in which such a beast can appear.) • Star: The player may choose the ability increased by this card but the points may not be divided between two abilities. • Sun: Roll on the magic items table until an item usable by the player is generated. • Talons: Immediately upon drawing this plaque, all magical items owned by the character (not just those carried) disappear. They cannot be recovered by any means. • Throne: The character becomes a charismatic and powerful leader of the people. The castle will appear in any open area of the player’s choosing but the decision must be made within an hour of drawing the card. • Vizier: The player acquires the ability to query a deity and receive a truthful answer once, within one year of drawing the card. The information received will be useful for solving the player’s dilemma in question but the player may not always be able to act upon what they learn. • The
  Void: When this completely black card is drawn, an intangible something visibly passes from the player’s face into the card. The character’s comatose body will continue to function at a minimal level but the psyche will be trapped in a prison in another plane or other impossibly remote location. The player cannot be restored with a wish, though this spell will reveal the plane of entrapment. A player drawing this card forfeits all further draws. DREAD WRAITH FREQUENCY Very rare NO. ENCOUNTERED 2d6 SIZE Large ALIGNMENT Lawful Evil MOVE 120ft; 240ft flying ARMOUR CLASS 1 [19] HIT DICE 16 MELEE ATTACKS 1 (2d6 + level drain) SENSES Standard LAIR CHANCE 25% INTELLIGENCE Very (11-12) MORALE 125 LOOT Hoard 5 EXPERIENCE 9/5,900 +23/hp Dread wraiths are insubstantial undead creatures that exist partially in the negative material plane, giving them the power to drain one level of experience when they score a hit upon an opponent. Immunities and Resistances Turned as Undead: Dread wraiths are turned
  as type 10 Undead. Immune to Mundane Non-Silver Weapons. The wraith is immune to piercing, blunt, or cutting damage, unless the weapon causing that damage is magical or silver. Non-magical silver weapons inflict half damage. Immune to Cold. Dread wraiths are immune to cold damage. Undeath. This creature is immune to all mind control (including charm) and hold spells. It cannot be affected by sleep, gases, poison, or disease. Special Attacks Level Drain. With a successful hit, a dread wraith drains 1 level of experience from the target. In sunlight, the dread wraith cannot drain levels.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
