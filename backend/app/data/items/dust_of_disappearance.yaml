name: Dust of Disappearance
classes: any
description: 'This fine white powder makes things invisible, as per the 4th level illusionist spell improved invisibility but with a duration of 2d6 rounds, though the affected creature will not know when the invisibility ends. A creature coated with dust of disappearance cannot be seen by any means mundane or magical with but one exception: dust of appearance (see above) will negate the invisibility caused by dust of disappearance. Note also an invisible creature may be detected by other means, such as sound or smell. This item is typically found stored in sets of 1d4+2 hollowed bone tubes or silk packets.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
