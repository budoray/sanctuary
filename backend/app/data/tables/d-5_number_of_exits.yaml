id: d-5
name: NUMBER OF EXITS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- 'Each die roll on this table shows the number of exits based on room/chamber size. Example: A die roll of 3 indicates that if the room'
- is smaller than 500 square feet, there is one exit. If the room is larger than 500 square feet, then there are 2 exits.
- 'D20 ROOM AREA (SQUARE FT) # EXITS ROOM AREA (SQUARE–FT) # EXITS'
- 1–4 < 500 1 > 500 2
- 5–7 < 500 2 > 500 3
- 8–9 < 500 3 > 500 4
- 10–12 < 1,000 0* > 1,000 1
- 13–15 < 1,500 0* > 1,500 1
- 16–19 Any 1d4 Any 1d4
- 20 Any 1** Any 1**
