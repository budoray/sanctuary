- 29–30 flame jets
- 31–32 flooding room
- 33–34 gas, blinding
- 35–36 gas, fear
- D100 RESULT
- 37–38 gas, flammable
- 39–40 gas, sleep
- 41–42 gas, slowing
- 43–44 greased chute
- 45–46 lightning bolt
- 47–48 log trap, swinging
- 49–50 obscuring fog
- 51–52  oil–filled pit with dropping lit torch
- 53–54 pit trap triggered by false  door
