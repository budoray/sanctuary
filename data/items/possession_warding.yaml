name: Possession Warding
classes: CP
description: This scroll is read in 1 round. Most of these scrolls (1–9 on 1d10) have a duration of 10d6 rounds. The remaining scrolls have a duration of 10d6 turns, but the protection is rooted to one 10ft radius location when cast from the scroll. This scroll wards off all effects that can control the mind, including spells such as magic jar . This scroll prevents any form of mental energy drain, whether magical or some other form. The protection offered by this scroll of warding is extended to all beings, living or dead, within the radius.
source: OSRIC_3.0_Gamemaster_Guide.pdf
