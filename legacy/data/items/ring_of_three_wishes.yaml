name: Ring of Three Wishes
classes: any
description: This rare and powerful magic ring grants the wearer 3 wishes, as per the 9th level magic user spell. On a roll of 01–25 on d100 the ring will instead contain 3 limited wish spells as per the 7th level magic user spell of the same name.
source: OSRIC_3.0_Gamemaster_Guide.pdf
