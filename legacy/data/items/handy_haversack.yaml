name: Handy Haversack
classes: any
description: A well-made but otherwise plain leather haversack with two side pouches and brass hardware. Each side pouch functions as a bag of holding and both will hold up to either 20 cubic ft of material or 20 lbs in weight. The main part of the haversack can hold up to 80 cubic ft of material or 80 lbs of weight. No matter how much material is placed into the handy haversack it will never weigh more than 5 lbs. When the user reaches into the pack for a specific item, that item will always be on top.
source: OSRIC_3.0_Gamemaster_Guide.pdf
