name: Boots of the Winterlands
classes: any
description: These boots allow movement at normal rates across snow and the wearer will leave no tracks to mark their passage. Boots of the winterlands also allow normal movement across ice and icy surfaces without slipping or falling, though the surface must be horizontal. The boots also affect the wearer as a resist cold spell as long as they are worn, with no time limit.
source: OSRIC_3.0_Gamemaster_Guide.pdf
