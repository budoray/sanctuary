description: Will-o-the-wisps are strange, fey creatures that resemble danc - ing lights or torches. Living in desolate and dangerous locations,  they seek to draw unwary travellers into bogs or quicksand. If a  will-o-the-wisp is clearly faced with death in combat, it will bar- gain the location of its treasure in exchange for freedom.
abilities:
- heading: Immunities and Resistances
  text: Magic Immunity. Will-o-the-wisps are immune to all spells with  the exception of protection from evil, magic missile, and maze.
- heading: Special Attacks
  text: Electric Shock. The will o the wisp can deliver its electric shock at  a range of up to 10ft. WOLF
