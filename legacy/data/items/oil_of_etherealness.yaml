name: Oil of Etherealness
classes: any
description: This potion is not imbibed, but the thin oil is applied to a character and all of their belongings in order to achieve an ethereal state for 1d4+4 turns. It takes 3 rounds for the potion to take effect, and it can be negated earlier than the duration by applying a mildly acidic liquid. When ethereal, a character is invisible and can pass through any objects that are not also ethereal.
source: OSRIC_3.0_Gamemaster_Guide.pdf
