name: Erase
slug: erase
reversible: false
class: magic-user
level: 1
school: Arcane Transmutation/Alteration
range: 30-ft
duration: Instantaneous
area_of_effect: Scroll or two pages of writing
components: V,S
casting_time: 1 segment
saving_throw: See below
text: 'This spell may be used to erase normal or magical writing from an area about two pages wide. The base chance to erase a magical writing is 50%+2%/caster level, and the base chance to erase non- magical writing is 50%+4%/caster level. Obviously, the main benefit of this spell is that the erasure can be made at a distance. The spell does not remove such magical rune-traps as symbol, glyph of warding or explosive runes (exception: the caster may use it to remove such spells if he or she originally cast them him- or herself).'
source: wiki2_spells.txt
