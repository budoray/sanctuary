name: Plant Control
classes: any
description: The imbiber of a potion of plant control is able to control plants or plant-like creatures (including fungi and moulds) within an area of 20ft squared, to a distance of 90ft. This ability lasts for 5d4 rounds. Plants and plant-like creatures will obey commands to the best of their capacity. For instance, vines can be controlled to wrap around targets, and intelligent plants can be given orders. However, intelligent plant beings (5 or greater intelligence) receive a saving throw vs magic. Similar to other charm-like abilities, one cannot directly control an intelligent plant creature to inflict harm upon itself.
source: OSRIC_3.0_Gamemaster_Guide.pdf
