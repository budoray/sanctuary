id: 2.13.2a
name: POTION ADMIXTURE RESULTS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100 RESULT
- '01'
- Eldritch blast! A catastrophic release of magical energies. This massive energy discharge does 6d10 points of
- internal damage and 1d10 points of damage to anyone with 10ft of the imbiber. If mixed externally, all persons
- within 10ft of the epicentre of the blast take 4d6 points of damage, no saving throw allowed.
- 02–03  Poison, causing instant death if mixed internally, no save. External admixtures create a poisonous cloud 10ft in
- diameter. Anyone within the cloud must save versus poison or die.
- 04–07 A strange brew results and imbiber sickens, losing 1d4 each strength and  dexterity for 4d6 rounds, no saving throw.
- One potion is completely nullified and the other works at 50% strength and duration, determined randomly.
- 08–12 The potions cancel each other out.
- 13–20 One potion is cancelled and the other works at 50% strength and duration, determined randomly.
- 21–30 Both potions work but only at 50% strength and duration.
- '31–90 Successful admixture: both potions work normally.'
- '91–99 Extraordinary success: one potion, determined randomly, works at 150% strength and duration while the other is'
- cancelled.
- 00 Spectacular success! One of the imbibed potions, determined randomly, has bestowed its effect permanently. Of
- course, this may not always be a good thing! Consider, for instance, a permanent potion of gaseous form effect.
- 2.13.2. POTIONS
- Although potions can be found in a variety of containers, includ-
- ing glass, ceramic, or metal flasks, most contain only one dose
- that imbues their potion’s particular effects for one individual.
- Most potions bear no label and require a small amount to be
- sampled in order to attempt to identify the potion type. This is
- not without error, and potions of the same type may differ in
- their aroma or taste depending on how they were made.
- As a standard rule, potions take effect 1d4+1 segments after
- consumption, and last for 1d4 turns. This principle is supersed-
- ed where the specific potion description indicates otherwise.
- Potions can normally be consumed in half doses, so that half
- the potion is consumed and operates for half the duration.
- The creation of potions requires the joint efforts of magic users
- and alchemists unless the magic user is over 11th level. A sam -
- ple of the potion to be created must be obtained at some point
- in order to learn the formula for the particular potion.
- ADMIXTURE OF POTIONS
- Magic potions store a great deal of eldritch energy and, as any
- alchemist or mage can attest, require a lot of careful prepara -
- tion. The random admixture of potions can have unpredictable
- results and only the foolish or desperate will undertake such an
- action. Admixture of two or more potions has occurred when the
- liquid of one potion is mixed with that of another, or a potion is
- consumed while a previously consumed potion remains in effect.
- The former is considered an external admixture and the latter an
- internal one.
- Presented here for the GM’s consideration are a set of guide -
- lines for handling these situations. A particularly industrious
- referee might wish to map out a complete matrix of effects to
- be used any time a potion is mixed with another. While this
- would be of use, the matrices would have to be updated with
- each introduction of a new potion. Additionally, the different
- formulations of a potion are not accounted for in such a matrix.
- OSRIC uses a set of guidelines combined with a random table to
- 'achieve a similar result with far less effort, as follows:'
- Mixing a potion of clairaudience or clairvoyance with any other
- potion will stun anyone drinking the potion for 1d4 days, due
- to massive sensory overload from uncontrolled telepathic in -
- put. The individual must be closely observed during this peri -
- od to prevent harm to themselves or to others. An admixture
- containing a potion of longevity  as an ingredient will act as a
- slow spell upon the imbiber for 1 hour.
- A potion of polymorph admixture
- always yields a poison of stron -
- gest toxicity and the person
- drinking it must save at -4 or
- die. A potion of delusion  ad-
- mixed with any other potion
- will always produce a potion
- of delusion . Thus, a potion
- of delusion mixed with a po -
- tion of invisibility will cause
- the drinker to believe they
- are truly invisible, even in the
- face of overwhelming evidence
- to the contrary.
- 'Animal Control (any): Anyone taking this potion gains the abil-'
- ity to relate to, understand, and manipulate the emotions of a
- particular type of animal. The type of animal is determined by
- a die roll (see below).
- The number of animals affected depends on the size of the an-
- 'imal. The following general sizes and quantities apply: wolf size'
- or smaller, 5d4; up to human size, 3d4; animals up to 1,000
- lbs, 1d4.
- D20 RESULT
- 1–4 Avian
- 5–7 Fish
- 8–11 Mammal, including marsupial
- 12–13 Any mammal and avian
- 14–17 Amphibians and reptiles
- 18–19 Amphibians, reptiles, and fish
- 20 All listed above
- Note that unless the potion-drinker has some other means of
- directly communicating with the animals influenced by the po -
- tion, only general emotions or inclinations may be manipulated.
- Humanoids are unaffected by this potion, and any creature with
- low intelligence (5) or higher may make a saving throw to resist
- its effects.
- 'Clairaudience (any): This potion lasts for 2 turns and grants the'
- drinker clairaudience (per the third level magic-user spell). This ef-
- fect can be used further to hear what is happening out of sight
- within 30ft.
- 'Clairvoyance (any): This potion lasts for 1 turn and grants the'
- drinker clairvoyance (per the third level magic-user spell). Un -
- like the spell, this potion grants the ability to see what is hap -
- pening outside of the known area within 30ft.
- 'Climbing (any):  This potion lasts for 1 turn + 5d4 rounds,'
- during which time the drinker gains the ability to climb like
- a thief with 99% ability (a roll of 00 means failure). However,
- the odds of failure increase by 1% for every 1,000 gp worth
- of weight carried. Furthermore, the type of armour worn will
- influence climbing ability by decreasing the percentage chance
- 'of success as follows:'
- -1% Any type of magical  armour
- -1% Studded leather
- -2%  Ring mail
- -4% Scale mail
- -7% Chain mail
- -8% Banded and splinted  armour
- -10% Plate mail
- 'Cursed: A cursed potion may be generated with reference to'
- section 2.13.10, or might just be poison.
- 'Delusion (any): This potion convinces the drinker that the po -'
- tion is of another type. If more than one person tastes this po -
- tion, there is a 90% chance they all will believe the potion to be
- of the same type. An example of how the potion might oper -
- 'ate: if it mimics a potion of clairaudience, it might convince the'
- drinker there are sounds in the distance that do not truly exist.
- 'Diminution (any):  This potion lasts for 1d4+7 turns. When it'
- is drunk, the drinker and everything carried shrinks to 5% of
- original size. If only half of the potion is consumed, it will shrink
- the imbiber 50% of their original size.
- 'Dragon Control (any): Drinking this potion grants power equiv-'
- alent to a charm monster upon a dragon of a type determined
- by the table below. Each potion affects only one type of dragon
- unless otherwise indicated. The drinker is able to control a drag-
- on within 60ft for the duration of 5d4 rounds. Roll on the table
- below for the specific type of dragon control potion.
- D20 RESULT VALUE (GP)
- 1–2 Black dragon control 12,000
- 3–4 Blue dragon control 14,000
- 5–6 Brass dragon control 12,000
- 7 Bronze dragon control 14,000
- 8–9 Copper dragon control 13,000
- 10 Gold dragon control 16,000
- 11–13 Green dragon control 13,000
- 14 Red dragon control 15,000
- 15 Silver dragon control 15,000
- 16–17 White dragon control 10,000
- 18–19 All evil dragons 20,000
- 20 All good dragons 20,000
- A saving throw is allowed, and if only one dragon is to be af -
- fected it receives -4 to this roll. If two dragons are to be affect-
- ed they receive +2 to this roll.
- 'ESP (any): This potion grants a spell-like ability equivalent to the'
- magic-user spell ESP for the duration of 5d8 rounds.
- 'Extra-Healing (any): Imbibing the full dose of this potion heals'
- damage up to 3d8+3 hit points. Unlike most other potions, this
- can be imbibed in three equal portions for 1d8 hp of healing
- each.
- 'Fire Resistance (any): The drinker of this potion is impervious'
- to all forms of ordinary flame, whether as small as a torch or
- as large as a raging bonfire, for 1 turn. Further, this potion re -
- duces damage from other kinds of fire by -2 per die of damage.
- These kinds of fire include fireball, wall of fire, and the intense
- heat of molten rock. If exposure to these flames requires a sav-
- ing throw, it is made at +4 to the die roll. Half of the potion can
- be quaffed for resistance lasting 5 rounds, and other bonuses
- provided are halved (-1 damage and +2 to saving throws).
- 'Flying (any): This potion grants the spell-like ability equivalent'
- to the magic-user spell of the same name.
- 'Gaseous Form (any): The drinker, in addition to all items they'
- carry, takes on a translucent, gaseous consistency and floats
- at 30ft per round. This speed can be different depending on
- natural wind speed in the environment or due to the effects
- of wind–altering spells. While in gaseous form, the person can
- flow below doors and other small spaces not sealed airtight.
- Although magical lightning and fire do the gaseous form full
- damage, while in gaseous form the imbiber is otherwise im -
- pervious to other attacks. However, double the normal dam -
- age is inflicted by a whirlwind. This potion must be fully im -
- bibed to have effect.
- 'Giant Control (any):  The drinker is able to control up to two'
- giants in the same manner as the spell charm monster for 5d6
- rounds. A saving throw is allowed, and if only one giant is af -
- fected it receives -4 to this roll. If two giants are affected they
- receive +2 to this roll. Each potion of giant control affects only
- one type of giant. Consult the following table.
- GIANT CONTROL TABLE
- D20 RESULT VALUE (GP)
- 1–2 Cloud giant 5,000
- 3–6 Fire giant 4,000
- 7–10 Frost giant 3,000
- 11–15 Hill giant 1,000
- 16–19 Stone giant 2,000
- 20 Storm giant 6,000
- 'Giant Strength (FPR): There is a separate potion for each type'
- of giant, and the drinker of this potion temporarily gains the
- strength score of the appropriate type of giant. This bonus in
- strength is accompanied by the giant ability to toss rocks at
- opponents (range of 10-200ft). Consult the table below for the
- giant types and strength abilities granted. Giants are listed in
- order of ascending strength.
- D20 GIANT STRENGTH MELEE DMG WT ALLOW. ROCK DMG MAJOR TEST VALUE (GP)
- 1-6 Hill +1d8 +450 1d6 50% 900
- 7-10 Stone +1d10 +500 1d12 60% 1,000
- 11-14 Frost +1d12 +600 1d8 70% 1,100
- 15-17 Fire +2d6 +750 1d8 80% 1,200
- 18-19 Cloud +2d8 +900 1d10 90% 1,300
- 20 Storm +2d10 +1200 1d12 99% 1,400
- 'Growth (any): The drinker increases in size up to a maximum of'
- an additional 24ft. This potion can be imbibed in one–quarter
- increments such that each one–quarter portion increases size
- by 6ft. Note that although the enlarged person gains enough
- strength to conduct normal movement, gained strength does
- not apply in any way to combat. However, movement does in-
- crease to that of a giant of equivalent size.
- 'Healing (any):  The imbiber of this potion regains 2d4+2 hp.'
- This potion can’t be divided into partial doses.
- 'Heroism (FPR): Extra levels and their accompanied benefits to'
- combat are temporarily granted to the imbiber, determined
- by their experience level. Characters above ninth level receive
- no benefit.
- IMBIBER LEVEL LEVELS GRANTED ADDITIONAL HIT
- DICE (D10)
- 0 4 4
- 1-3 3 3+1
- 4-6 2 2+2
- 7-9 1 1+3
- 'Human Control (any):  Once quaffed, this potion grants the'
- spell-like ability of charm person to the drinker for 5d6 rounds.
- Many kinds of humanoids, demi-humans, and humans can be
- affected by this potion (see the table below), and 32 hit dice/
- levels of these beings are affected. Only whole hit dice are con-
- sidered when calculating how many individuals are affected,
- and any bonuses are dropped (3+1, 4+2 are treated as 3, 4).
- The specific kind of human–like being affected for each potion
- is determined on the table below.
- D20 RESULT
- 1–2 dwarfs
- 3–4  elves and  half- elves
- 5  elves,  half- elves, and humans
- 6–7 gnomes
- 8–9  halflings
- 10–11 half-orcs
- 12–17 humans
- 18–20 other humanoids (orcs, gnolls, goblins, etc.)
