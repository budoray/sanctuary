name: Robe of Useful Items
classes: IM
description: 'An enchanted robe bearing a variety of tokens visible to and recognisable only by the wearer. One token can be detached per round, causing the token to become the item depicted. A removed patch cannot be reattached. A complete robe always has 2 of each of following items: • Bullseye lantern, filled and lit • Steel mirror, 2ft×4ft • Pole, 10ft • Rope, 50ft hemp • Sack The robe will also have a random selection of 4d4 additional patches. Use the following table. Multiple items of the same type are possible. D100 RESULT 01–07 Ash tree, 40ft high 08–16 Bag of 100 gold pieces 17-18 Bonfire 19–21 Cask: d8, 1–2 empty, 3–5 water, 6–7 wine, 8 brandy 22–25 Coffer, silver (6-in×6-in×12-in) value: 500 gp 26–30 Dagger, silver 31–37 Door, iron* 38–41 Gems, 10 (100 gp each) 42–45 Ladder, 12ft long 46–50 Mule with saddle bags 51–55 Pick, standard mining 56–59 Pit, open (10ft×10ft×10ft) 60–66 Portable ram 67–74 Potion of extra-healing 75–80 Rations, standard, for 1 week 81–82 Rowing boat, 12ft
  long 83–86 Spade and bucket 87–91 Spell Scroll** 92–96 War dogs, pair 97–00 Window (2ft×4ft and up to 2ft deep) *Door is iron, up to 10ft×10ft in size, and barred on one side. It must be placed upright, after which it attaches and hinges itself automatically. **One randomly-determined spell of 1st–3rd level.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
