name: Hammer of Thunderbolts
classes: CFPR
description: This powerful weapon appears as a square-headed, 15 lb warhammer with a shorter than normal haft. The hammer of thunderbolts strikes as a +3 weapon and deals 4d6 damage, and can also be hurled as a missile weapon (30ft range bands) which will return to the wielder after the attack is resolved. Note that this is the maximum power the item can attain if wielded by a cleric; only one who can wear the belt of giant strength can unlock its full potential. If the wielder is wearing both gauntlets of ogre power and a belt of giant–strength the slumbering power of the hammer of thunderbolts is revealed to the wearer. First, the owner knows the weapon for what it is. Second, the weapon gains a full +5 attack bonus, all damage bonuses from the hammer, gauntlets, and belt stack, and the weapon will strike dead any giant on a successful hit. The giant is allowed a saving throw vs death magic to avoid the instant death but not the damage. Further, when hurled the weapon gains a new power.
  On a successful attack the hurled weapons emits a clap of thunder which stuns all living creatures within 90ft (saving throw vs petrifaction to avoid). Chiselled into the base of the stone hammerhead are the words “Æsir Hammers, Ltd.”
source: OSRIC_3.0_Gamemaster_Guide.pdf
