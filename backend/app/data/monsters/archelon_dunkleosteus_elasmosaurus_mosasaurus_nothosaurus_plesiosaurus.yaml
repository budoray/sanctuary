description: 'None of these creatures are technically dinosaurs, though all  are found in “Lost World” areas. Dunkleosteus can swallow prey  whole on a roll of “20” “to hit” and actually preceded the dino - saurs by many millions of years. Elasmosaurus can also swallow  whole, needing only 18–20 on its “to hit” roll to do so but oth - erwise as dunkleosteus. Mosasaurus filled the same ecological  niche as sharks. Plesiosaurs may have preferred smaller prey  than a man but would still be dangerous. Nothosaurs were am- phibious, like huge seals. Archelon was a kind of gigantic turtle. Dunkleosteus: Formerly known as dinichthys; Huge Devonian  carnivore. Elasmosaurus: Huge Cretaceous carnivore. Mosasau- rus: Huge Cretaceous carnivore. Plesiosaurus: Huge Jurassic car- nivore. Nothosaurus: Large Triassic carnivore. Archelon: Huge  Cretaceous carnivore.'
abilities:
- heading: Special Attacks
  text: Dunkleosteus can swallow prey whole on a to-hit roll of 20.  Elasmosaurus can also swallow whole, needing only 18–20 on  its “to hit” roll. Swallow Whole. On a bite attack that rolls a natural 20, the dino- saur swallows the victim. If the victim is not rescued, they will  die at the end of 6 rounds spent in the creature’s stomach.  It is possible for the victim to cut their way out (the inside  is armour class 10 [10]). For each round the victim is inside,  subtract 1 from their damage that they inflict. This penalty is  cumulative for each round, so after four rounds the damage  inflicted is at -4. FLYING DINOSAURS
