<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanctuary</title>
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body>
    <div id="splash">
      <div class="splash-content">
        <h1>Sanctuary</h1>
        <p id="splash-status">Entering the room...</p>
        <div class="splash-spinner" id="splash-spinner"></div>
        <div class="splash-error" id="splash-error" style="display: none;">
          <p id="splash-error-message"></p>
          <button id="splash-retry" class="splash-retry">Retry</button>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
