name: Atonement
slug: atonement
reversible: false
class: cleric
level: 5
school: Clerical Abjuration
range: Touch
duration: Instantaneous (permanent)
area_of_effect: 1 person
components: V,S,M
casting_time: 1 turn
saving_throw: None
text: The atonement spell is a form of spiritual cleansing, removing the stain of actions contrary to a character's moral alignment, but only for actions that the penitent took unwillingly or unwittingly. The penitent must be truly repentant of the deed, unless he or she is affected in such a way that would preclude repentance (such as in the case of someone whose alignment has been magically altered, or who is unconscious, charmed, or insane). In addition to removing the effects and supernatural consequences of evil actions, this spell may be used to negate, undo, or dispel a magical alignment change. Intentional misdeeds cannot be cleansed away by this spell. A cleric can, of course, use this spell to perform atonements for unintentional acts of goodness as well as evil, or for violations of neutral alignment. However, unless the GM rules otherwise based on circumstances, a cleric who is not true neutral cannot perform atonements for an alignment that the cleric does not, in some part,
  share.
source: wiki2_spells.txt
