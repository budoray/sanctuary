description: Vulchlings are a type of intelligent bird that resemble a vulture,  but with facial features that look rather like a human with a  beak. Vulchlings are weak fliers, tending to swoop upon their  prey with 2 claw attacks, then fighting on the ground (where  they can only bite). Vulchlings can be found in desolate areas or underground, and  they have been known to ally themselves with harpies or Class  A demons. Vulchlings are attracted to shiny objects and a care - ful search of their nest usually yields a few coins. Unarmed Combat. Vulchlings cannot be targeted with overbear- ing or grappling attacks, and do not use these tactics.
