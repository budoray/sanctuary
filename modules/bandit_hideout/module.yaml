id: bandit_hideout
name: The Bandit Hideout
ruleset: osric
description: >-
  A crumbling forest stronghold where the Thornwood bandits stash their plunder.
  Their leader, a scarred reaver called Gristle, does not tolerate trespassers.
map:
  width: 20
  height: 16
  tile_size: 40
  theme: forest
  tiles:
    - "11111111111111111111"
    - "10000000000000000001"
    - "10000000010000000001"
    - "10000000010000020001"
    - "10001111011111011101"
    - "10000000000000000001"
    - "10111011101110111001"
    - "10000000000000000001"
    - "10000000000000000001"
    - "11111011111011111001"
    - "10000000000000000001"
    - "10011101110111011101"
    - "10000000000000000001"
    - "10000000000000000001"
    - "10000000000000000001"
    - "11111111111111111111"
player_start:
  x: 1
  y: 1
monsters:
  - id: gristle
    name: Gristle the Reaver
    monster: orc
    x: 10
    y: 7
    color: "#8b4513"
    boss: true
    phases:
      - hp_threshold: 0.5
        damage_bonus: 2
        to_hit_bonus: 1
        spawn:
          - id: bandit_minion_1
            name: Bandit
            monster: goblin
            x: 9
            y: 6
            color: "#556b2f"
          - id: bandit_minion_2
            name: Bandit
            monster: goblin
            x: 11
            y: 8
            color: "#556b2f"
  - id: bandit_1
    name: Bandit
    monster: goblin
    x: 3
    y: 3
    color: "#556b2f"
  - id: bandit_2
    name: Bandit
    monster: goblin
    x: 16
    y: 3
    color: "#556b2f"
  - id: bandit_3
    name: Bandit
    monster: goblin
    x: 3
    y: 13
    color: "#556b2f"
  - id: bandit_4
    name: Bandit
    monster: goblin
    x: 16
    y: 13
    color: "#556b2f"
events:
  - id: loot_cache
    x: 10
    y: 5
    message: >-
      A heavy chest sits beneath a rotting tarp. Open it for supplies, or leave
      it be and avoid any trap?
    choices:
      open: Open the chest
      leave: Leave it
branches:
  open:
    - id: cache_guard_1
      name: Bandit
      monster: goblin
      x: 12
      y: 5
      color: "#556b2f"
    - id: cache_guard_2
      name: Bandit
      monster: goblin
      x: 13
      y: 5
      color: "#556b2f"
  leave:
    - id: lone_wolf
      name: Wolf
      monster: wolf
      x: 8
      y: 9
      color: "#7f8c8d"
