name: Periapt of Foul Rotting
classes: any
description: 'This item is a semi-precious, ornately-engraved gem of little apparent value beyond the artistic. Any character retaining possession of this pestilential stone for more than 24 hours, however, contracts a horrible rotting skin disease. The disease inflicts a permanent cumulative penalty of -1 each to the user’s charisma, constitution, and dexterity each week the disease progresses. When the character’s constitution reaches 0, they are in a coma. The following week the character will die. The periapt and the disease it caused can only be removed from the victim by an application of a remove curse spell, then cure disease, then one of the following: heal, limited wish, or wish. An alternate method of undoing this foul curse involves crushing a periapt of health and sprinkling the dust upon the cursed character. After 1 round, the character will be completely healed and the periapt of foul rotting will crumble to dust.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
