description: Swift-moving burrowers, badgers will defend their territory to  the death. They mate for life, and when more than one is indi - cated, the encounter will be with a family. Adult badger pelts  will usually bring 1d3×10 gold each, and juvenile pelts are worth  one-half normal. The giant badger is simply a larger version of the regular bad - ger. They are very rare, even in badger-rich areas, but may be  encountered in prehistoric “lost world” environments. Their  pelts are worth 1d3 x20 gold each.  Unarmed Combat.  Badgers cannot be overborne or grappled,  and do not employ these tactics.
