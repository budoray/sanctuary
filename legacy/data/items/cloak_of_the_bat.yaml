name: Cloak of the Bat
classes: any
description: This black or dark brown cloth robe allows the user to fly for up to 7 minutes, followed by a like number of minutes resting during which the cloak recharges itself. The cloak of the bat actually allows flying in 2 different modes, but both require darkness or a near lightless environment in which to operate. The wearer can a 20% bonus to hide in shadows checks.
source: OSRIC_3.0_Gamemaster_Guide.pdf
