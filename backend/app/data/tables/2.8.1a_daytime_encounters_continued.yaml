id: 2.8.1a
name: DAYTIME  ENCOUNTERS CONTINUED
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100  ENCOUNTER
- 23 Demon. GM’s discretion. Only 1 encountered.
- 24 Devil. GM’s discretion. Only 1 encountered.
- 25 Doppelgängers, 1d4+2. See Urban Professions Sub-table for their  disguise.
- 26 Druid.* A d6+5–lvl Druid with (1–5) 1d4-1 d4–lvl Lesser  Druids or
- (6–10) 1d4 d6–lvl Fighters.
- 27–31 Drunk. See Urban Professions Sub–table for exact type.
- 32–33  Fighter.* A 2d4+4–lvl  Fighter with 1d4–1 d4–lvl  Henchmen.
- '34–35 Gentry (landowners). Roll 1d10: (1–4) Foppish Dandy and d4 Sycophants (5–6) Lone gentleman/woman on a secret'
- errand or tryst (7–10) d4+6–lvl  Fighter and d4 similar friends.
- '36 Roll 1d10: (1–3) 2d4 Ghasts,'
- (4–10) 4d4 Ghouls
- 37 Ghost (1)
- 38–42 Giant Rats, 4d6
- 43 Townsperson (0-level)
- 44–50
- 'Expert Hireling. Roll 1d10: (1)  Alchemist, (2)  Armourer, (3 or 4)  Blacksmith, (5)  Engineer (Architect), (6)  Jeweller'
- ( Gemcutter), (7)  Sage, (8)  Scribe, (9) Spy, or (10)  Weaponer. The expert is accompanied by 1d4 bodyguards (level 0
- soldiers).
- 51 Illusionist.* A d4+6–lvl Illusionist with (1–5) d4–1 d4–lvl Apprentice Illusionists or (6–10) 1d3 d6–lvl  Fighter
- Bodyguards.
- 52 Labourers. 3d4 rough workmen
- 53 Magic-User.* A d6+6–lvl Magic-user with (1–4) d4 d6–lvl Apprentice Magic-users (5–7) d4 d4+3–lvl  Fighter
- Bodyguards or (8–10) d2 Apprentices and d2 Bodyguards as above.
- 54–58  Mercenaries. 3d4 d6-1–lvl Fighters.
- 59–60 Merchants. 1d3 Merchants (0–lvl normal Humans) with 2d4 0-lvl Mercenary Guards and 1 d4-lvl Mercenary Leader
- 61 Troubadours. 1d4 Travelling bards, musicians or actors.
- 62 Night Hag (GM’s discretion. Only 1 encountered).
- 63–64 Noble.** Noble and 1d4 d4–lvl  Fighter Bodyguards.
- 65 Paladin.* A d4+5–lvl Paladin.
- 66 Pilgrims. 3d4 Pilgrims (normal Humans).
- 67 Press Gang. 2d8 1st–lvl Fighters and a d4+1–lvl Leader all wielding clubs.
- 68–72 Ruffians. 1d4+1 d6+4–lvl Fighters.
- 73 Rakshasas. (GM’s discretion. 1d3 encountered.)
- '74–80 Roll 1d10: (1–8) Muggers, 1d6+6 2nd-lvl Fighters armed with clubs, or'
- (9–10) 1d6+6 Humanoids (Orcs, Kobolds, Goblins, etc. GM’s discretion.)
- 81 Shadows, 2d4.
- 82 Spectres (GM’s discretion). 1d3 encountered. Otherwise 2d4 shadows.
- 83–88  Thieves.* A d4+7–lvl Thief and 1d3–1 d4–lvl Apprentice  Thieves.
