id: volcanic_depths
name: The Volcanic Depths
ruleset: osric
description: >-
  Beneath a sleeping mountain, molten halls glow with ember light. Cultists of
  the Cinder Circle chant around a flame altar, and their fire-blessed champion
  waits in the heart of the caldera.
map:
  width: 22
  height: 16
  tile_size: 40
  theme: lava
  tiles:
    - "1111111111111111111111"
    - "1000000000000000000001"
    - "1000000000000000000001"
    - "1000000000200000000001"
    - "1001110111011101110001"
    - "1000000000000000000001"
    - "1000000000000000000001"
    - "1011101111101110111001"
    - "1000000000000000000001"
    - "1000000000000000000001"
    - "1001111101110111110001"
    - "1000000000000000000001"
    - "1000000000000000000001"
    - "1000111011101110100001"
    - "1000000000000000000001"
    - "1111111111111111111111"
player_start:
  x: 1
  y: 1
monsters:
  - id: cinder_champion
    name: Cinder Champion
    monster: orc
    x: 11
    y: 7
    color: "#e67e22"
    boss: true
    phases:
      - hp_threshold: 0.5
        damage_bonus: 2
        to_hit_bonus: 1
        spawn:
          - id: cultist_minion_1
            name: Cinder Cultist
            monster: goblin
            x: 10
            y: 6
