name: Stone of Weight, or, Loadstone
classes: any
description: 'A egg-shaped, dark, and smoothly polished stone. The loadstone frequently appears as onyx, hematite, pyrite, or lapus lazuli. Anyone picking up the loadstone will immediately suffer a 50% reduction in movement speed. Once picked up the stone cannot be discarded by any means either mundane or magical. No matter the method of disposal: thrown off a cliff, smashed into dust, sold to a greedy merchant, or given away; it always reappears somewhere on the person of the cursed individual. A remove curse will allow the victim to forever rid themselves of the stone, but there are no known means of permanently destroying the stone or the curse it contains. Sword +1, Cursed (AFPRT): This weapon appears to be a normal sword of the magic +1 variety until the weapon is drawn in combat. At that time the owner of the sword will find the cursed weapon magically fastened into their hand and unable to disengage from combat until either he or the opponent is dead. After combat is resolved the
  owner will be able to let go of the sword but unable to discard it by any means. Even if the owner throws the weapon away or attempts to fight with a different weapon, the cursed sword will magically reappear when combat is engaged, once again welded to their hand, and again the wielder must attack until dead or the opponent is slain. An exorcism by a good aligned cleric is the only way to rid oneself of the weapon. Sword –2, Cursed (AFPRT): This exceptionally beautiful and well made weapon performs as a +2 weapon in practice. When employed in actual combat, however, the sword inflicts -2 on all attack and damage rolls. The sword’s ego is very powerful and it will cause its owner to always use it in combat over any other weapon, including missile weapons. Even if the owner intends to draw a different weapon they will involuntarily find the cursed sword in hand. Only a remove curse, limited wish, or wish will rid the unlucky owner of this sword -2. Sword of the Berserker +2 (AFPRT): This
  rather plain looking longsword is not particularly eye-catching, but anyone with a knowledge of weapons will immediately recognise this ancient blade to be of high strength and durability. The sword of the berserker grants a +2 bonus in combat but also causes the wielder to enter a berserk frenzy and attack the nearest creature, whether friend or foe, and continue fighting until no living creatures is within 30ft. While in their berserk rage, the wielder of the sword is +2 to strength and constitution, +2 to saves, -2 to AC, and moves at double speed. The increased constitution grants 2 temporary hit points per level and any damage inflicted is subtracted from these points first. The extra hit points fade away after the rage runs its course. It should be noted that the more violent civilisations scattered throughout the realm see this weapon as blessed rather than cursed.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
