name: Gem of Brightness
classes: CDIM
description: 'An ordinary prism-shaped crystal with three powers, activated by command words. The gem’s number of charges is determined in the same way as a rod (see “Rods, Staves and Wands”). It may not be recharged. • Light: 30ft radius, requires no charges to activate. • Ray of light: A ray 1-in in diameter and 50ft long. Blinds a single target for 1d4 rounds; a save vs wand negates. Requires 1 charge. • Flare: A 30ft cone of bright light; creatures within the cone must save vs wands or be blind for 1d4 rounds. Requires 5 charges.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
