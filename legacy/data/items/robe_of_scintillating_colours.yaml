name: Robe of Scintillating Colours
classes: IM
description: An iridescent magical garment that provides constant 30ft radius illumination. Upon command, the colours of the robe begin scintillating and after 1 round the swirling colours create an effect similar to a gaze attack; anyone within 30ft of the robe’s wearer will be dazed 1d4+1 rounds (saving throw vs staves allowed to negate effects). Undead and mindless creatures are immune to this effect. The scintillation effect can be used a total of 10 rounds per day.
source: OSRIC_3.0_Gamemaster_Guide.pdf
