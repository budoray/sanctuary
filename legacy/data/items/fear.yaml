name: Fear
classes: CDIM
description: Once per round, by spending 1 charge, this wand will emit a ray of sinister purple light that takes 1 segment to appear. The ray is shaped as a cone 20ft wide at its terminal end and 60ft long. Any being within the area of effect must succeed in a saving throw vs wands or fall under effects identical to the cleric spell fear. A wand of fear is rechargeable.
source: OSRIC_3.0_Gamemaster_Guide.pdf
