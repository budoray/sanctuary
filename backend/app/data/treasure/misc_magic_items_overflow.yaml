source: OSRIC_3.0_Gamemaster_Guide.pdf
note: >
  Supplements data/tables/2.13.1r, 2.13.1s and 2.13.1t (LESS-COMMON,
  UNCOMMON and RARE MISCELLANEOUS MAGIC ITEMS) - the same shared-extractor
  page-break gap that truncated data/tables/2.12.5a (see
  jewellery_types.yaml's note) also truncated these three: each stops partway
  through its d100 range (1r at 26, 1s at 31, 1t at 46) because the table
  crosses a "=== PAGE ===" marker and tools/extract.py closes a block there.
  Do not hand-edit data/tables/ to fix that - out of this chapter's file
  scope. This file transcribes each table's REMAINING rows directly from the
  source, in the same [range, ...name words, value] shape
  sanctuary.tables.rows() would have produced, so
  sanctuary.treasure._flat_item can use tables.rows(id) + this file's rows
  for id as one continuous table without a second code path.
  A "meta" row (e.g. "99 Roll Twice on Table 1") is a re-roll instruction,
  not a named item - sanctuary.treasure returns its instruction text as the
  MagicItem name rather than resolving it recursively.
