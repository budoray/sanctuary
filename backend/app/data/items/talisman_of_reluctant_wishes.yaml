name: Talisman of Reluctant Wishes
classes: any
description: This nondescript artifact causes any character touching it to try to roll their charisma or less on 1d20. If they fail the roll by exceeding their charisma score, the talisman acts as a stone of weight (detailed in the “Cursed Magic Items” section). Discarding or destroying the talisman results in 5d6 damage, no save allowed, and the talisman disappears. Success means the talisman will remain with the character for 5d6 hours or until they make a wish with it. When one or the other event occurs, the talisman disappears. If they roll a natural 20 the character and talisman become bound together for a number of months equal to their charisma score and they will be unable to get rid of the talisman during that time. The artifact will grant the owner one wish for every six points of charisma during this time, but as above all wishes must be used before the time expires. During this time the talisman, if held, will grow warm and vibrate whenever the owner comes within 20ft of a magical
  or mechanical trap. The talisman must be held in order to receive this benefit. No matter which result is rolled, when the talisman of reluctant wishes disappears, a flawless white diamond worth 10,000 gp is left in its place.
source: OSRIC_3.0_Gamemaster_Guide.pdf
