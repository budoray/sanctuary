description: 'A miscellany of other kinds of dinosaur, including some (ank - lyosaurus and stegosaurus) with bony, armoured backs. Both  these creatures have an effective attack by clubbing with their  tails. GMs who are fans of Jurassic Park may wish to increase the  velociraptor’s intelligence score to “semi-” or even “low”. Anklyosaurus: Huge Cretaceous herbivore. Ceratosaurus: Large  Jurassic carnivore. Plateosaurus: Large Triassic herbivore. Igua- nodon: Large Cretaceous herbivore. Stegosaurus: Huge Jurassic  herbivore. Velociraptor: Large Cretaceous carnivore.'
abilities:
- heading: Special Attacks
  text: Velociraptor Rake. If a velociraptor hits with its bite, it can bring  its rear claws into action as well as its foreclaws. It gains an  immediate follow-up attack with the 2 rear claws (2d4), and  can continue to attack with the rear claws for as long as it con- tinues to attack the target it bit (as well as normal biting and  foreclaws). OTHER DINOSAURS II
