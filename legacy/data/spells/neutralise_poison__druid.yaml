name: Neutralise Poison
slug: neutralise_poison
reversible: true
class: druid
level: 3
school: Druidic Transmutation/Alteration
range: Touch
duration: Instantaneous
area_of_effect: Creature touched
components: V,S
casting_time: 5 segments
saving_throw: None (Negates)
text: This spell detoxifies any sort of venom in a creature or object touched by the caster. An opponent (a venomous spider, for example) must be successfully touched by the caster, but is not entitled to a saving throw if the attack succeeds. Note that if the venomous creature produces new venom (normally a process that takes time), the new venom will be toxic, but any venom that is stored up in the creature will be affected and detoxified. The spell may also be used to prevent a poisoned character from suffering the poison's effects. The reverse of the spell allows the caster to deliver a lethally poisonous touch, requiring a successful roll to hit, and allowing a saving throw against the poison.
source: wiki2_spells.txt
