description: Although rot grubs can be found in animal waste and other foul  refuse, they prefer to consume tissue that is still alive.
abilities:
- heading: Special Attacks
  text: Burrow. Upon contact with a living being, rot grubs attempt a to- hit roll, and if successful will begin to vigorously burrow deep  into the body. Fire must be applied to the site of contact at  once (within 3 rounds) in order to prevent the rot grub from  burrowing further. This application of flame inflicts 1d6 hit  points of damage per rot grub burrow. If not stopped imme - diately, within 1 to 3 turns the rot grub will find the heart and  kill the victim.
