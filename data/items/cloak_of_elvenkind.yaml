name: Cloak of Elvenkind
classes: any
description: This neutral grey or green cloak appears normal until the hood is drawn up over the head. At that point the wearer becomes 100% invisible in natural outdoor settings, with effectiveness decreasing as natural growth decreases, down to about 95% in open fields. In most darkness or low-light conditions in non-natural settings invisibility is still quite good, around 90% for dark urban settings and 95% for torchlit or dungeon settings. A wearer attempting to move stealthily in a brightly-lit area still gains 50% invisibility. 90% of these cloaks are sized for elf-size to man-size wearers. The remaining 10% are sized for halfling-sized creatures (about 4ft tall). This item requires careful adjudication by the GM.
source: OSRIC_3.0_Gamemaster_Guide.pdf
