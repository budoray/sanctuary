name: Polymorph Object
slug: polymorph_object
reversible: false
class: magic-user
level: 8
school: Arcane Transmutation/Alteration
range: 5-ft/level
duration: See below
area_of_effect: One object or creature
components: V,S,M
casting_time: 1 round
saving_throw: See below
text: 'This spell allows the magic user to transform one thing, living or not, into another sort of thing. If the spell is used simply to duplicate the effects of a polymorph other spell or a stone to flesh spell, it will function in the same manner as these spells but with a -4 penalty to the victim''s saving throw. Otherwise, the spell''s duration depends upon the degree of change involved in the transformation. The calculation is made using a “duration factor” found on table 1, and the explanation of the resulting duration factor is found on table 2. Polymorph Object–Table 1 (magic user level 8) Changed Subject Is: Increase to Duration Factor Same kingdom (animal, vegetable, mineral) +5 Same class (mammals, fungi, metals, etc .) +2 Same size +2 Related (twig is to tree, wolf fur is to wolf, etc .) +2 Same or lower intelligence +2 Add all that apply. Look up the total on the next table. Polymorph Object–Table 2 (magic user level 8) Duration Factor Duration Example 0 20 rounds Pebble to
  human 2 1 hour Marionette to human 4 3 hours Human to marionette 5 12 hours Lizard to manticore 6 48 hours Sheep to woolen cloak 7 1 week Shrew to manticore 9+ Permanent Manticore to shrew This spell can be dispelled.'
source: wiki2_spells.txt
