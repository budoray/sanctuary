name: NIGHTTIME  ENCOUNTERS CONTINUED
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- 'CHAPTER NINE:  WILDERNESS  ENCOUNTER TABLES'
- RANDOM WILDERNESS  ENCOUNTERS
- For the purposes of Wilderness Encounter Tables it is recom -
- mended the most prevalent terrain within the party’s current hex
- be used. This means a party in the foothills of a mountain range,
- a hex with mostly hills and a few mountains, would use the “Hills”
- encounter table.
- Unlike dungeon encounters, wilderness encounters are not keyed
- to party level or strength. As a rule of thumb, the GM should use
- the “No. Encountered” entry in the rulebook to generate specific
- numbers. Players, for their part, should learn and develop the
- fine art of running away. Wandering about the wilderness of
- most campaign milieus is a hazardous pastime.
- The number of monsters encountered on these
- tables is found in the Monster section, as
- “NO. ENCOUNTERED.”
- The NPC Tables,  explained more fully below, may be used to
- generate lone NPCs or complete adventuring NPC parties . Ta-
- bles are provided for generating NPCs and NPC parties  in the
- Dungeon Encounter Tables section of these rules.
- REGARDING THE LOST WORLD  ENCOUNTER TABLES
- Lost World settings are chaotic places. OSRIC adds a little chaos
- into the tables but feel free to expand upon this idea. You may
- wish to add encounters with UFO aliens, present day humans
- from non-magical and high science worlds, even a giant ape
- which fancies itself a King.
- The past, present, and future time travellers are labels relative
- to the player character’s “normal” time.
- Cavemen are roughly equivalent to Neanderthal proto-humans.
- The advanced cavemen referred to by the tables are akin to
- Cro-Magnon proto-humans.
- The Time–Lost Village encounter refers to a settlement of hu -
- mans or demi-humans that is “unstuck in time” and randomly
- relocates to various eras, perhaps even changing physical loca-
- tion when time–shifting. One may look to various sources for
- inspiration, including the musical Brigadoon, the UK television
- series Dr. Who, and the US television series The Time Tunnel.
- EXPLANATION OF NPC TYPES
- Decoys serve either to distract the party from something else,
- or put the party at ease and lure them into a dangerous situ -
- 'ation. For example: a group of charmed humans who seek to'
- lure the PC party into the den of a rakshasa.
- Escapees have escaped from imprisonment by some nearby
- entity. The NPCs may have little or no equipment or weap -
- ons and are either under pursuit from their captors or will be
- shortly.
- Joiners seek to join the PCs. The GM is free to manufacture mo-
- tivation appropriate to their needs, either malevolent or be -
- nevolent.
- Runners are fleeing or avoiding an encounter. Whatever they
- are fleeing is probably chasing them, whatever they are avoid-
- ing may or may not be aware of their presence. Unlike escap -
- ees, these NPCs will be appropriately armed, armoured, and
- equipped.
- Searchers are looking for something, usually an item or per -
- 'son. The possibilities are myriad, a few examples are: seeking'
- a powerful artifact, weapon, stolen item; or, seeking a friend,
- arch-enemy, or kidnapped daughter of the local woodcutter.
- Survivors are 1 or 2 demoralised survivors of an otherwise
- wiped-out adventuring party. They may have limited equip -
- ment and be in need of healing.
- Wolves (in sheep’s clothing) are creatures that appear human
- but are not. This category includes were-creatures, doppel -
- gängers, polymorphed creatures, and the like. The disguised
- creature may not necessarily mean the party harm, the avatar
- of a benevolent deity who doesn’t wish to reveal their divinity
- to the party is one example that comes to mind.
