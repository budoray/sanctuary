name: Plentiful Vessel
classes: any
description: The magic of this item is usually contained in a metallic flask that vaguely resembles a cornucopia if turned on its side. If its contents are drunk, or poured into another container, a random potion will be dispensed. Usually this item can be used but 1d6+1 times per week. Excessive use will drain the item of its potency, typically reducing the 1d6+1 usage per week by one until no weekly charges remain.
source: OSRIC_3.0_Gamemaster_Guide.pdf
