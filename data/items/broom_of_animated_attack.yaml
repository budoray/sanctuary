name: Broom of Animated Attack
classes: any
description: Appears as a broom of flying to all attempts to identify. When used by speaking the command word, usually found engraved on the handle, the cursed nature becomes obvious. The broom will loop into the air and dump the rider on the ground, then begin attacking them relentlessly as a 4HD monster. The broom gets four attacks at +5 per round, striking twice at the body with the handle and twice in the face with the straw end. All attacks deal 1d6 damage and a successful hit to the face with the straw end also blinds the target for 1 round. The broom is AC -2 [22] and absorbs 18 hit points before breaking into pieces, losing all magic in the process.
source: OSRIC_3.0_Gamemaster_Guide.pdf
