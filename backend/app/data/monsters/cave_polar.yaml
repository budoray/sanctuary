description: 'Unarmed Combat. Greater bears may attempt to overbear a lone  opponent, and can (technically) grapple and be grappled. If not  fended off, they score an unarmed hit with a 2+ on 1d20. Hit  Mods: ATK/DEF +8/-8. Overbear Results Mods: ATK/DEF +5/-5.  Grappling Result Mods: ATK/DEF +2/-2. CAVE BEAR The cave bear, a giant relic of past ages, is particularly carnivo - rous, in contrast to its more omnivorous relatives.'
