name: Giant Control
classes: any
description: The drinker is able to control up to two giants in the same manner as the spell charm monster for 5d6 rounds. A saving throw is allowed, and if only one giant is affected it receives -4 to this roll. If two giants are affected they receive +2 to this roll. Each potion of giant control affects only one type of giant. Consult the following table. GIANT CONTROL TABLE D20 RESULT VALUE (GP) 1–2 Cloud giant 5,000 3–6 Fire giant 4,000 7–10 Frost giant 3,000 11–15 Hill giant 1,000 16–19
source: OSRIC_3.0_Gamemaster_Guide.pdf
