id: 2.12.5a
name: JEWELLERY TYPE AND VALUE
source: OSRIC_3.0_Gamemaster_Guide.pdf
note: >
  Supplements data/tables/2.12.5a_jewellery_type_and_value.yaml, whose
  extraction only kept the table's first page (Amulet through Chain, d100
  01-25) - the book's own continuation caption ("TABLE 2.12.5A ... CONTINUED")
  prints AFTER its rows rather than before them, so tools/extract.py's
  page-break rule (a table block closes at "=== PAGE ===") drops rows 26-100
  as ownerless prose. Do not hand-edit data/tables/ to fix that - it is
  someone else's extractor and out of this chapter's file scope. This file
  transcribes the full d100 form roll (2.12.5a) directly from the source so
  jewellery() has the whole range; the composition dice per tier (Silver
  1d10x100gp, Silver&Gold 2d6x100gp, Gold 3d6x100gp, Silver&Gems 5d6x100gp,
  Gold&Gems 2d4x1000gp, Exceptional 2d6x1000gp) are fixed for every row and
  live in sanctuary/treasure.py as TIER_DICE, matching the table's own header.
  Each row's `tiers` list is the d10 breakpoint (or null if that tier is out
  of reach for this form) for [silver, silver_gold, gold, silver_gems,
  gold_gems, exceptional], in that order. The book prints its last range as
  "98-00" (d100's own zero-means-100 convention); this file spells that
  endpoint "100" instead, since sanctuary.tables.in_range has no way to read
  a range that wraps through 00.

rows:
