name: Dragon, Red
frequency: rare
no_encountered: 1d4
size: varies by age
alignment: chaotic evil
move: 90ft; 240ft flying (AA:II)
armour_class: -1 [21]
hit_dice: 9 to 11
melee_attacks: 3 (1d8/1d8/3d10)
senses: Infravision 60ft, Detect  invisibility by age category
lair_chance: 60%
intelligence: exceptional (15-16)
morale: 90, 95, or 100 (by HD)
loot: Hoard 8, Cache 5 and 6
experience: Varies by hit dice and age
description: The archetypal red dragon is Smaug from The Hobbit.
abilities:
- heading: Special Features
  text: Sleeping Dragon. A red dragon encountered in its lair has a 20%  chance to be sleeping when the adventurers approach. If the  dragon is asleep, there is a 1 in 6 chance that it will awaken  from the mere presence of adventurers. Dragons also some - times feign sleep. Spellcasting Dragon. Roughly 40% of red dragons are spellcast - ers. If it can cast spells, it does so as a magic-user with a level  equal to the dragon’s age category.
- heading: Special Attacks
  text: Breath Weapon. Red dragon breath is a cone of flame, 90ft long  and 15ft radius at the base, emanating from the mouth of the  creature. It does fire damage equal to the dragon’s (uninjured)  hit points to everyone in the area of effect, but a saving throw vs  dragon breath reduces this amount to half damage. The dragon  may use this breath weapon up to three times per day.
- heading: Languages
  text: All dragons speak the draconic tongue, and there is an 80%  chance that a red dragon will also be able to speak common.
