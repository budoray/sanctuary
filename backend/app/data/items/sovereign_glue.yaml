name: Sovereign Glue
classes: any
description: Simply put, this glue will stick anything to anything else, permanently. A vial of sovereign glue will contain 1d8-1 (minimum 1) ounces of glue. A single ounce will coat up to 1 square ft of surface and once items are glued together the bond requires a round to set. Before the binding is set the items can be separated, rendering that application of sovereign glue worthless. After the bond is allowed to set the bond is permanent, though the glue can be dissolved with universal solvent (see below). When glue is removed from the vial 1-oz. of oil of slipperiness must be added to the glue container within 1 round, or the glue will set inside the container and be useless.
source: OSRIC_3.0_Gamemaster_Guide.pdf
