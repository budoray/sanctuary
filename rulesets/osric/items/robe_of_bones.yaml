name: Robe of Bones
classes: IM
description: 'An enchanted robe bearing a variety of tokens visible to and recognizable only by the wearer. One token can be detached per round, causing the token to become the type of undead it resembles. The created monster will not automatically be under the control of the wearer but will be subject to normal forms of control or command. A complete robe of bones will have two of each of the following tokens attached: Goblin skeleton Goblin zombie'
source: OSRIC_3.0_Gamemaster_Guide.pdf
