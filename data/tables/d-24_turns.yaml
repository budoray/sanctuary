- 11–19 right 90 degrees
- 20 right 45 degrees (d6, 1–3 ahead, 4–6 behind)
- USING THE RANDOM DUNGEON GENERATOR FOR
- SOLO PLAY
- OSRIC is not really designed for solo play, but it is possible to
- use this random dungeon generator for such a purpose.
- 'Start with Table D-1:  Starting locations in the middle of a'
- sheet of graph paper. Use the charts from the OSRIC random
- encounters section to resolve the various monster encounters
- and generate treasure. You can appeal to your friends at your
- local gaming club or on–line for sealed information to use with
- special encounters and areas.
- To resolve listening at doors, roll 1d12 and treat a result of 1–5 as
- 'a monster encounter. Use Table D-8: Chamber or Room Contents'
- but treat any result as including a monster encounter. Otherwise,
- any monster encounters rolled should be ignored unless the crea-
- tures would be silent (undead, bugbears, etc.).
- ESP, scrying, and other means of magical detection can be re -
- solved in the following manner. A roll of 1 on 1d6 indicates a
- monster in the area being checked. Roll the encounter using
- the relevant GM table and ignoring any monster type not de -
- tectable by method of detection used. If a 6 is rolled, the player
- should reroll when entering the room. If a 6 is rolled again a
- non-detectable monster is encountered and player’s chance to
- be surprised increases by +1.
- 'Stocking the Dungeon:  Use Section 2.7.3: Random Encounters'
- to stock your dungeon, or you may wish to design specific areas
- without reference to random tables. Many GMs use a mixture
- of the two methods, with designed areas surrounded by ran -
- domly-generated areas.
- The degree to which dungeon “ecology” matters is up to the
- individual GM. Some GMs give thought to food sources, water
- sources and latrine facilities; others do not bother. The authors
- 'recommend the following golden rule: dungeons don’t have to'
- make sense, but they do need to be full of variety. Having said
- this, a little thought on the placement of creatures doesn’t go
- amiss—if there’s some logic behind the dungeon, then it’s eas -
- ier for skilled players to work out what’s going on and use it
- to their advantage, and rewarding player skill is an important
- aspect of the OSRIC system.
