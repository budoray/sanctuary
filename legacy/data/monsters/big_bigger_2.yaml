- heading: Special Attacks
  text: Drain Blood. The bite of a giant weasel drains blood (automatic  damage after the first successful attack). The drain is 1d8 hp  per round for “big” giant weasels, and 2d6 hp per round for  the bigger version. Unarmed Combat. Giant weasels cannot be targeted with grap - pling or overbearing attacks, and they do not use these tactics.
