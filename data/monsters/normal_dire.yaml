  text: 'Howl. A wolf pack’s howling may panic horses and other herbi - vores (50% chance per animal). Unarmed Combat. Wolves cannot be targeted with grappling or  overbearing attacks. They may choose to overbear a lone op - ponent. If not fended off, they score an unarmed hit with a 2+  on 1d20. Hit Mods: ATK/DEF +10/na. Overbear Results Mods:  ATK/DEF +0/na. Unarmed Combat.  Dire wolves cannot be targeted with grap - pling or overbearing attacks. They may choose to overbear. If  not fended off, they score an unarmed hit with a 2+ on 1d20.  Hit Mods: ATK/DEF +10/na. Overbear Results Mods: ATK/DEF  +2/na.'
