description: 'Walruses are large, flippered animals with long ivory tusks. They  are carnivorous and very aggressive in defending their territory,  and are made every more dangerous due to their great size and  the fact several are usually encountered. The largest males can  weight as much as 4,400 lbs. In combat a walrus attacks with its clawed front flippers and its  tusks. Males will primarily defend the herd from intruders but  the females, who are also tusked, will fight if necessary. Treasure: The ivory tusks of this animal can be sold for 1d4+1×100  gp on the market.'
