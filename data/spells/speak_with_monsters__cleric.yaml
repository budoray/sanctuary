name: Speak with Monsters
slug: speak_with_monsters
reversible: false
class: cleric
level: 6
school: Clerical Transmutation/Alteration
range: Caster
duration: 1 round/caster level
area_of_effect: 30-ft radius
components: V,S
casting_time: 9 segments
saving_throw: None
text: Within the spell's area of effect, the caster becomes capable of communicating with any kind of creature provided it has some form of intelligence. The spell does not make the target friendly to the caster; for this, the caster must rely upon his or her charisma.
source: wiki2_spells.txt
