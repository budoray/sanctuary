name: Conjure Fire Elemental
slug: conjure_fire_elemental
reversible: true
class: druid
level: 6
school: Druidic Conjuration/Summoning
range: 80-ft
duration: 1 turn/caster level
area_of_effect: See below
components: V,S,M
casting_time: 6 rounds
saving_throw: None
text: It is within the power of a high-level druid to summon forth an elemental being from the plane of fire. The elemental will ordinarily be of 16 HD, but there is a 5% chance that it will be of 24 HD and a 1% chance that an afreet, rather than an elemental, will appear. The elemental will act as the druid's ally, remaining for the spell's duration to assist him or her however possible, including engaging in combat with his or her enemies. Druids need no protective circle to summon fire elementals and need not concentrate upon the elemental in any way.
source: wiki2_spells.txt
