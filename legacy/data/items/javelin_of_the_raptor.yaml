name: Javelin of the Raptor
classes: AFPR
description: Like a hunting bird of prey, the command word will cause this missile weapon to launch itself from the wielder’s hand. The attacking javelin is +5 “to hit” and damage, and strikes up to 60ft away with no “to hit” penalty. The hunting cry of a hawk can be heard when this weapon launches. Hit or miss, the javelin vanishes after its attack is resolved. This item is usually found in sets of 1d6+2.
source: OSRIC_3.0_Gamemaster_Guide.pdf
