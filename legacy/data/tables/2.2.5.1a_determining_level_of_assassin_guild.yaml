lines:
- MEMBERS
- DIE ROLL (D100) ASSASSIN LEVEL
- 01-20 1
- 21-45 2
- 46-65 3
- 66-80 4
- 81-90 5
- 91-95 6
- 96-00 7
- 2.2.5.2.  FOLLOWERS FOR RANGERS
- If the player decides to assemble a Band of Merry Folk, then
- 6d6 followers come to the character’s banner. They are of hu -
- man and demi-human ancestry. Half are 0-level characters. The
- others begin as first level characters of various classes. Impor -
- tantly, these character types may be used as henchmen without
- affecting the character’s limit on henchmen.
- If the ranger chooses to assemble a Band of Magical Creatures,
- 'the GM decides exactly which creatures join:'
