description: These horrible creatures are the result of crossbreeding trolls  with hill giants, resulting in a monster that looks mostly like a  troll, but even larger.
abilities:
- heading: Immunities and Resistances
  text: Effect of Regeneration. Giant trolls regenerate all damage except  fire damage and corrosive damage ( acid) while they are alive.  Unlike true trolls, they do not regenerate once killed. It is thus  possible to kill a giant troll without using acid or fire, but the  creature will be regenerating damage up until the point it dies.
- heading: Special Features
  text: 'Catch Missiles. Giant trolls have extremely fast reflexes and are  able to snatch a missile from the air 25% of the time. If it is a  missile suitable for throwing (example: spear, rock) the giant  troll will throw it back as its next attack. Regeneration. Giant trolls regenerate 2 hp per round but unlike  their smaller cousins, they are not capable of rebonding sev - ered limbs, and severed limbs will not attack independently. Unarmed Combat. Giant trolls cannot be targeted with overbear- ing or grappling attacks, and do not use these tactics.'
