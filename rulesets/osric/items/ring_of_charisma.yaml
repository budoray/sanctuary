name: Ring of Charisma
classes: any
description: 'When worn, this ring increases the wearer’s charisma ability score to 18. Note this is not a permanent increase; if the ring is removed the wearer’s charisma returns to its normal value. This magical ring also bestows two spell-like abilities, each usable once per day and requiring 3 segments of casting time. First, during the course of conversation the wearer can make a suggestion, as per the 3rd level magic user spell, to any human or demi-human or humanoid. Second, the wearer of the ring of charisma can also charm up to 21 levels/hit dice or humans or humanoids as per the 1st level magic user spell charm person . This is an exceptionally powerful item and fires such as red dragon breath or fireballs inflict -2 points of damage per die (but always inflict at least 1 point of damage) and saving throws are rolled at +4. The following rule of thumb should assist with determining damage reduction: “very hot” fires inflict up to 24 points of maximum damage, “exceptionally hot”
  fires cause 25 or more points of maximum damage. The GM may limit the ring of charisma by giving it a limited number of charges.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
