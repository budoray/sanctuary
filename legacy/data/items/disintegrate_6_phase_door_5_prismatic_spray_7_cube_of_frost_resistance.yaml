name: Disintegrate 6 Phase Door 5 Prismatic Spray 7 Cube of Frost Resistance
classes: any
description: A crystalline but featureless cube about 3/4-in square. Activating this device creases a cubeshaped wall of force with 10ft sides centred around the user and moving with him or her unless they place the device on a surface after activation. The temperature inside the cube is always 65°F no matter the surroundings, and the force wall absorbs all coldbased attacks, whether natural or magical. If the field absorbs more than 50 total points of cold-based damage in 1 round the force wall collapses and the cube cannot be reactivated for a period of 1 hour. Additionally, if the cube of frost resistance absorbs more than 100 points of cold damage in 10 rounds it is destroyed.
source: OSRIC_3.0_Gamemaster_Guide.pdf
