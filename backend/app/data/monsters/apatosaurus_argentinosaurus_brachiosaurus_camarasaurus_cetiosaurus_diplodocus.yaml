description: 'Large quadrupedal herbivores with elephantine bodies and ex- tremely longnecks and tails, the sauropods are herd animals.  They can bite, but are only really dangerous when they trample.  Trampling automatically kills any creature weighing less than a  ton in their path—saving throw vs death to avoid. A whole herd  stampeding is an impressive sight, best viewed from a safe dis- tance. In fantasy gaming environments sauropods might make  good meat animals or beasts of burden. Apatosaurus: Jurassic herbivore, once called brontosaurus. Di- plodocus: Jurassic herbivore, famously long. Brachiosaurus: Ju- rassic herbivore; long thought to be the largest land dinosaur.  Argentinosaurus: Cretaceous herbivore, relatively recently dis - covered, twice as massive as brachiosaurus. Camarasaurus:  Very common Jurassic herbivore. Cetiosaurus: Jurassic herbi - vore, earlier relative of the other types.'
abilities:
- heading: Special Attacks
  text: Trample. Any sauropod listed here can trample as well as bite if  the dinosaur can move across the victim’s location. Trampling  requires no to-hit roll and requires the target (if the target is  smaller than size Huge) to make a saving throw vs. death or be  crushed to death under the sauropod’s feet. CERATOPSIANS
