name: Insect Plague
slug: insect_plague
reversible: false
class: druid
level: 5
school: Druidic Conjuration/Summoning
range: 320-ft
duration: 1 turn/caster level
area_of_effect: Cloud of 160-ft radius, 40-ft high
components: V,S,M
casting_time: 7 segments
saving_throw: None
text: While casting this spell, the caster designates a central point for the spell's origin up to 360-ft from where he or she stands. When the caster utters the final words of the incantation, this focal point belches forth a massive cloud of stinging insects, which boils outward almost instantly to fill the spell's area of effect. Within the area of this massive cloud, visibility is limited to 30-ft, and all creatures automatically sustain 1 hit point of damage per round from the stings and bites of the numberless flying vermin. All creatures caught in the cloud with 4 or fewer hit dice must check morale, and those with 2 or fewer hit dice will automatically flee until they are 240-ft away from the edge of the roiling cloud. Fire and smoke will keep the swarm at bay (as will walls of force, etc.), but virtually the only way to disperse a swarm before the spell duration expires is to cast dispel magic upon the swarm's focal point. Even a fireball or flame strike will do nothing other than
  temporarily (1 turn) to clear the insects out of the area affected by their flames.
source: wiki2_spells.txt
