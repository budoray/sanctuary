name: Candle of Invocation
classes: C
description: These candles come in 9 different types, each specific to an alignment. Any individual within 30ft of a burning candle of like alignment is at +2 “to hit” and saving throws. A cleric of like alignment to a candle of invocation will determine the number of divine spells knowable as if they were 2 levels higher, if they burn the candle immediately prior to their daily meditation. They will even be granted and use spells of the higher level, although these spells are usable only so long as the candle is burning. The candle of invocation normally burns for about 4 hours. The candle can also be used to cast a gate spell and the being responding will be of the same alignment as the candle. When casting gate the candle is completely and instantly consumed. The candle can be blown out as easily as any ordinary candle. Thus, the user may sometimes place the candle in a lantern to protect the flame—this does not interfere in any way with the magical effects.
source: OSRIC_3.0_Gamemaster_Guide.pdf
