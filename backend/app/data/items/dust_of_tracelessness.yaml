name: Dust of Tracelessness
classes: any
description: 'One application of dust of tracelessness can cause up to 100 square ft of floor space to become dusty and cobwebbed as if abandoned for years, concealing all evidence of anyone passing through the area. The dust can be used on outdoor trails as well, concealing for 250ft of back-trail the passage of up to a dozen troops and their mounts. The dust works instantly and leaves no magical aura to betray its use. Any creature with tracking skills, a ranger for instance, will be severely disadvantaged following a path concealed by dust of tracelessness, allow only a 5% chance of a ranger successfully tracking their quarry in such a case. This item comes in 1d4+2 silk packets, and can easily be sprinkled along a trail or applied all at once to a larger area. Efficient Quiver (AFPRT): An ordinary-appearing quiver with three compartments, each of which can magically hold many more objects than would seem possible at first look. The first compartment can hold up to 60 arrows or similar
  objects such as wands. The second compartment can hold up to 18 javelins or magic rods. The third compartment can hold six bows or similarly sized objects such as spears or staves. When the wearer reaches into the quiver, whatever object is desired will be produced.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
