name: Dust of Illusion
classes: IM
description: When this magic dust is applied to a living creature, the creature alters appearance as per the 1st level illusionist spell change self according to the user’s whim, lasting for 2 hours. An unwilling target may save vs spells to negate. The dust comes in 1d4+1 hollow bone tubes; each tube is one application.
source: OSRIC_3.0_Gamemaster_Guide.pdf
