name: Blindness
slug: blindness
reversible: false
class: illusionist
level: 2
school: Phantasmal Illusion
range: 30-ft
duration: Permanent
area_of_effect: One creature
components: V,S
casting_time: 2 segments
saving_throw: Negates
text: This spell causes the subject to become blind, but causes no damage to the eyes themselves. The effect cannot be removed by any spell that restores physical health (such as a healing spell, cure disease, etc), but may be dispelled normally. The caster can end the condition at will.
source: wiki2_spells.txt
