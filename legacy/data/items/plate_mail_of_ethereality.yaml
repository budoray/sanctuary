name: Plate Mail of Ethereality
classes: CFPR
description: '+5 plate mail that will cause the wearer and everything non-living thing they are wearing or carrying to become ethereal when the command word is spoken. Every time the wearer becomes ethereal, a charge is used. The plate mail holds 20 charges and every 5 uses reduces the AC bonus by 1. Therefore, five uses of a fully charged plate mail of etherealiality reduces the AC bonus to +4, but note the AC bonus is always at least +1, even if all charges are expended. This magical armour cannot be recharged by any means. Large Shield +1, Missile Deflector (CDFPR): This shield grants +1 to AC against melee weapons but a +4 AC bonus vs missiles or hurled weapons. The shield also grants a 20% magic resistance against magic missiles provided, of course, the magic missile attack originates from in front of the wielder of the shield. 2.13.6. MAGIC SWORDS Magic Swords in General All magic swords receive their bonus in both increased chances “to hit” and increased damage. A longsword +1 would
  therefore be 5% more likely to hit its target (+1 on all “to hit” rolls) and cause an additional 1 point of damage (+1 to damage rolled) to every successful attack. The section below details magical swords that go beyond simple bonuses applying “to hit” probabilities and damage inflicted. Last of all, this section also deals with the rarest of magic weapons: intelligent swords. The GM is free, of course, to apply the principles of unusual or intelligent swords to any weapon they choose. Some basic points concerning magical swords: most magical bladed weapons shed light when drawn, even though this property may not always be desirable. There are exceptions to the rule as noted in the individual descriptions but unless otherwise stated, the sword will glow. All holy swords are lawful good in alignment. Some weapons, including some of these swords, do double or even triple damage when fighting certain types of opponents. The GM must remember to double the damage from the attack before adding
  the damage bonus. Example: A longsword striking a large opponent in combat deals 1d12 damage. If the longsword was a +3 weapon and attacking a creature to which it magically dealt double damage, the GM would determine damage using the following formula: (1d12×2)+3—and NOT (1d12+3)×2. Bleeding Sword (AFPRT): A feared weapon, the bleeding sword is a +1 blade with a terrible power. Any wound caused by this weapon is progressive for 10 melee rounds, causing an additional 1 hit point of damage per round up to a total of 10 points. Hit point damage can be halted by binding wounds. All hits from this blade do damage the same way. Wounds caused by this magic sword can only be healed with rest and time; no curative magic of any type will be effective. Even creatures capable of regenerating cannot heal themselves thus, whether this is a natural ability (trolls) or magical ability ( ring of regeneration). Dancing Sword (AFPRT): An unusual weapon. During the first round the dancing sword is used in
  combat it performs as a +1 blade. Each subsequent round the sword adds an additional +1 bonus up to the maximum of +4 in the fourth round. In round 5 the process begins again, and at this point the blade can “dance.” A dancing sword can then be loosed from the wielder’s hand to fight on its own for 4 rounds, up to 30ft away. The dancing sword will fight as if still being held by the owner and gains the successive bonuses to its attack and damage each round. When the dancing sword cycles from +4 back to +1 it will return to its owner’s hand, where it must be wielded for 4 rounds before being released to dance again. If the owner declines to grasp the sword when it returns to him or her, or if they move more than 30ft away from the dancing sword, the weapon will fall inanimate to the ground. The sword cannot be physically attacked by its opponent while dancing, though it is subject to magical attacks and effects (examples: fireball, transmute metal to wood ). While the sword is dancing,
  the wielder can perform any other action they wish, including fighting with another weapon. Defender (AFPRT): This sword is +4, but the wielder of this sword has the option each round of adding all or part of the bonus to improve armour class. Thus, a fighter could increase their current AC of 2 [18] (plate mail with shield) to AC 0 [20] by deducting 2 points from the sword’s +4 bonus and making the sword +2 “to hit” for that round. Dragonbane (AFPRT): The dragonbane sword is +2 against most opponents,+4 vs all dragons and against one specific type of dragon (determined randomly) deals triple damage. If one of these swords should be determined to be intelligent (see below), it will in no way allow the player to slay a dragon of the same alignment. A chart is included to assist the GM with selecting a dragon type for triple damage. Since a campaign may include other types of dragons, the GM may wish to modify this list. D10 RESULT 01 Black 02 Blue 03 Brass 04 Bronze 05 Copper 06 Gold 07
  Green 08 Red 09 Silver 10 White Flaming Blade (AFPRT): The blade of this weapon bursts into flame when its command word is spoken, giving illumination as a torch. The sword does not otherwise glow as most other magic swords do. The flame tongue’s fiery blade can easily ignite paper, oil, kindling, webs, or dry wood. The sword is normally +1, but gives a +2 as a trollbane does, a +3 bonus against creatures that are inflammable, bird-like or have a special attack involving cold, and a +4 against undead. These bonuses do not stack; only the highest bonus should be counted. (Thus, if attacking a skeletal roc, the sword is +4 not +7.) Frost Brand (AFPRT): The frost brand is normally +3, granting a +6 bonus against any creature using fire as its attack (e.g. red dragons) or dwelling in fire such as fire elementals. This weapon grants special defence against fire; treat the wielder as if they were wearing a ring of fire resistance . The cold-based magic of the blade also has a 50% chance of extinguishing
  fire for a 10ft radius, including magical fires such as a wall of fire but not fire-based attacks such as hell hound breath attacks or fireballs. Note: this blade does not shed light when drawn unless the ambient temperature is below freezing. Giantbane (AFPRT): This sword will be +2 when fighting most foes. Against giant-like humanoids such as ettin or ogres, the giant slayer functions as a +3 blade. Against true giants such as hill giants or storm giants, the sword also does double damage.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
