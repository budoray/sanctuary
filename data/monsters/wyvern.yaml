size: huge (30ft to 40ft long)
alignment: neutral evil
move: 60ft; 240ft flying (AA:III)
armour_class: 3 [17]
hit_dice: 7+7
melee_attacks: 1 bite (1d6) and 1 sting (2d8 +poison)
senses: Infravision 60ft
