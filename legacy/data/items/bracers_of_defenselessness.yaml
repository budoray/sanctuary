name: Bracers of Defenselessness
classes: any
description: These serve as bracers of defence +5 until the wearer is engaged in actual combat with an enemy of equal or greater level. At once the bracers lose the +5 bonus and immediately and permanently become –5 to AC. A remove curse is required to remove them once this has occurred.
source: OSRIC_3.0_Gamemaster_Guide.pdf
