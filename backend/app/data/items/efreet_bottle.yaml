name: Efreet Bottle
classes: CDIM
description: An ornate bronze or brass bottle sealed with a lead stopper engraved with many runes of power, though often a thin stream of smoke can be seen leaking from the seal. Once per day the command word can be spoken, allowing the bottle to be opened. Doing so frees an efreet imprisoned within. Roll d100; 01–10 means the freed efreet is insane and immediately attacks anyone near the bottle, though it will not fight to the death. Unless the efreet clearly outmatches the party it will likely melee a few rounds and then flee to its home plane. On a result of 91–00 the efreet grants the owner 3 wishes then immediately disappears forever. The rest of the time (11–90) the efreet will agree to serve the owner of the bottle for up to 10 minutes that day and follow all commands to the best of its ability. Every time the efreet is freed from its prison this result must be rechecked.
source: OSRIC_3.0_Gamemaster_Guide.pdf
