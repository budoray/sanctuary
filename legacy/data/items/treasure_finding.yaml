name: Treasure Finding
classes: any
description: For 5d4 rounds, the imbiber of this potion can sense any treasure within 240ft containing valuable metals or gems. In order to be detected, the total value of the treasure must meet or exceed any combination of 50gp or 100 gems. Any valuable metal meeting this value in quantity is detectable, and any gems, including those in jewellery, are detectable. Although the direction of the treasure can be sensed, the precise distance cannot. No physical barrier will impede detection, except some magical wards or lead.
source: OSRIC_3.0_Gamemaster_Guide.pdf
