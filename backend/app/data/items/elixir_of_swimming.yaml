name: Elixir of Swimming
classes: any
description: Anyone drinking this liquid ignores all clothing, armour, equipment, or any other type of encumbrance while swimming for a period of 1 hour. Thus, an individual wearing plate armour and wearing a fully loaded backpack can swim as if in their small clothes. Note that this potion does not grant any magical ability to breathe underwater.
source: OSRIC_3.0_Gamemaster_Guide.pdf
