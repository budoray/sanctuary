name: Warp Wood
slug: warp_wood
reversible: false
class: druid
level: 2
school: Druidic Transmutation/Alteration
range: 10-ft/caster level
duration: Instantaneous (permanent)
area_of_effect: See below
components: V,S,M
casting_time: 4 segments
saving_throw: None
text: This spell permanently warps wood and may be used to destroy arrows, spears, doors, etc. The druid may affect a volume of wood roughly fifteen inches long by one inch thick per caster level, about the volume of an axe handle. Multiple items may be affected; four arrows have about the same volume as an axe handle. A fifth-level druid could effectively destroy a normal door with this spell.
source: wiki2_spells.txt
