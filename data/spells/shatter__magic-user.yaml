name: Shatter
slug: shatter
reversible: false
class: magic-user
level: 2
school: Arcane Transmutation/Alteration
range: 60-ft
duration: Instantaneous
area_of_effect: One object
components: V,S,M
casting_time: 2 segments
saving_throw: Negates
text: This spell causes an item to shatter into pieces. It can affect objects of up to 10 lbs weight per caster level. Only brittle materials are affected by the spell (glass, earthenware, etc.) excluding magical items of any kind. The item is permitted a saving throw against a crushing blow to avoid destruction.
source: wiki2_spells.txt
