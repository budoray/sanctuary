name: Deck of Illusions
classes: any
description: A set of 34 parchment cards often found in a leather bag or wooden box. Drawing a card from the deck and casting it to the ground creates a convincing illusion of a creature or creatures. The illusion lasts until dispelled or the card is picked up; in both cases the card becomes blank and cannot be used again. The illusory monster moves and acts as if real and obeys the will of the card drawer, though it cannot move more than 30ft away from the card. A randomly-generated deck has a 90% chance of being complete, otherwise 1d20 cards are missing from the deck. A table is provided below with values for both mundane playing cards and tarot cards, and the illusion the card will generate when used. PLAYING CARD TAROT CARD CREATURE(S) Ace of Hearts IV. The Emperor Red Dragon King of Hearts Knight of Swords Male Human Fighter & 4 Guards Queen of Hearts Queen of Staves Female Human Magic User Jack of Hearts King of Staves Male Human Druid Ten of Hearts VII. The Chariot Cloud Giant Nine
