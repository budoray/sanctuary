name: Bottle of Air
classes: any
description: An ordinary-appearing stoppered glass bottle. When uncorked in an airless environment, however, the bottle will produce a steady stream of air until it is again within a breathable atmosphere or the bottle is recapped. This allows the holder to breathe underwater by “drinking” from the bottle. The bottle may even be passed among multiple users.
source: OSRIC_3.0_Gamemaster_Guide.pdf
