- For the purposes of evil clerics turning paladins, paladins are
- treated as Type 8 if they are level 1–2, Type 9 if level 3–4, Type
- 10 if level 5–6, Type 11 if level 7–8, Type 12 if level 9–10 and Type
- 13 if level 11 or higher. However, paladins cannot be destroyed
- by turning.
- Once a creature is turned, it can’t be turned again until it recov-
- ers.
- 'Experience: You do not receive XP for undead that are de -'
- stroyed by turning (such a relatively weak creature presents no
- challenge). If a turning attempt is used in such a way that the
- monsters are completely bypassed, the GM may rule that this
- means they were “defeated”, and award XP, half XP, or some
- other benefit.
