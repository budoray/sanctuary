name: Cloak of Arachnida
classes: any
description: A black garment of silk, woven in patterns reminiscent of spider webs. This magic cloak grants the wearer immunity to entrapment by mundane or magical webs, allows movement at half speed through any webbed area, and allows the owner to cast web as a 10th level magic user once per day. The cloak also allows the user to spider climb as per the spell up to 10 rounds cumulative per day. Finally, the wearer of the cloak of arachnida gains a +2 bonus on all saves vs spider poisons.
source: OSRIC_3.0_Gamemaster_Guide.pdf
