- heading: Immunities and Resistances
  text: Death Stamina. If reduced to zero hit  points, the cave bear will  continue to fight until either 1d4 rounds have elapsed or it is  reduced to -9 hit points.
- heading: Special Attacks
  text: 'Melee Attack: Bear Hug. Any claw attack with a to-hit roll of 18 or  more results in the target being hugged for an additional 2d8  hit points. POLAR BEAR Polar bears have white fur and are excellent swimmers. They do  not have a bear hug attack.'
- heading: Immunities and Resistances
