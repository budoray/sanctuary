name: Armour of Arrow Attraction
classes: CFPR
description: This armour appears to both mundane and magical inspection as a strongly magicked suit of plate armour. Only in actual use, however, will its cursed nature be revealed. The armour will function as a magical set of armour +3 against melee attacks but against any ranged attack it imposes -3 penalty to AC. After the armour reveals its true nature a red and white set of three concentric circles appear on the breastplate, over the wearer’s heart.
source: OSRIC_3.0_Gamemaster_Guide.pdf
