name: Charm Person or Mammal
slug: charm_person_or_mammal
reversible: false
class: druid
level: 2
school: Druidic Enchantment/Charm
range: 80-ft
duration: See below
area_of_effect: One person or mammal
components: V,S
casting_time: 4 segments
saving_throw: Negates
text: 'The powerful enchantment woven by this spell will affect any “person,” meaning character races (with the exception of elves) and other small to medium-sized bipeds analogous to persons (orcs, goblins, etc.). The spell also affects mammalian animals of any kind, even those that are supernatural, giant, or monstrous. If the target creature fails a saving throw, it will view the druid as a trusted friend, interpreting his or her every word in its most positive light. Charmed creatures will place themselves into moderate danger, including combat, on the druid''s behalf, but will not undertake risks beyond those the creature might ordinarily take. The druid must be able to talk to the charmed creature if he or she is to make any sort of complex “request.” Charmed creatures are allowed periodic saving throws to break the charm, based on intelligence: 19+ one saving throw/day 18 one saving throw/2 days 17 one saving throw/3 days 15-16 one saving throw/week 13-14 one saving throw/2 weeks
  10-12 one saving throw/3 weeks 7-9 one saving throw/month 4-6 one saving throw/2 months 3 or less one saving throw/3 months The charm will be broken automatically if the druid obviously tries to harm the charmed creature.'
source: wiki2_spells.txt
