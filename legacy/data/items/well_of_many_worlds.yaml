name: Well of Many Worlds
classes: any
description: This item looks just like a portable hole (see above) but instead of creating a hole it creates an opening into another plane of existence, determined randomly each time the well is opened. The well is two-way, meaning creatures or objects from whatever plane it contacts can enter the Prime Material Plane just as easily as objects pass through to the other plane from the Prime Material.
source: OSRIC_3.0_Gamemaster_Guide.pdf
