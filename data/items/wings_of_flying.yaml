name: Wings of Flying
classes: any
description: Upon command, this cape will transform itself into a pair of wings, allowing the wearer to fly at 60ft movement rate (aerial agility level IV—see Chapter 3). When in cape form the wings of flying take on a variety of styles and appearances and the wings formed can be either feathered or bat-wing style 2.13.9. RINGS Magic rings appear indistinguishable from ordinary finger jewellery of varying types, though a detect magic spell cast upon them will cause them to radiate a magic aura. With the exception of a wish spell, the only way to determine the function of a magic ring is to put it on. A maximum of two rings can be worn by any PC or NPC at a time; only one ring may be worn per hand. Attempting to wear additional magic rings will render all worn magical rings useless. Magic rings worn on toes or as earrings will not function. Unless noted otherwise, the abilities a ring grants function as if cast by a 12th level spell caster, or the minimum level required to cast the spell
  if greater than 12th. Because of the innate magical resistance of dwarfs, gnomes, and halflings; magic rings have a 20% chance per use of not working at all and, if cursed, the curse will fail. In such a case the wearer recognises the cursed properties of the ring and can easily remove it from their finger.
source: OSRIC_3.0_Gamemaster_Guide.pdf
