id: 2.8.1b
name: NIGHTTIME  ENCOUNTERS CONTINUED
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100  ENCOUNTER
- 89–90 Tradesmen. 2d4 Artisans, craftsmen or skilled workers (normal humans).
- 91–93 Wererats. 2d4 encountered (1–9) in human form (10) in giant rat form.
- 94 Weretigers. 1d2 encountered in human (90%) or tiger (10%) form.
- 95–96 Werewolves. 2d4 encountered, 50% chance to be in wolf form.
- 97 Wights, 1d4+1
- 98 Will-o-the-Wisp, 1 (GM Discretion) otherwise 1 wraith
- 99 Wraiths, 1d4
- '00 Roll 1d10: (1–8) 1 Vampire (Roll 1d6 for form: 1–2 giant bat, 3–6 gaseous form),'
- (9–10) 1 Lich
