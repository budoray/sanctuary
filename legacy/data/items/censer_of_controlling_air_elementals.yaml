name: Censer of Controlling Air Elementals
classes: DM
description: A 6-in wide, 1-in high golden vessel. When filled with incense and lit, chanting the words of summoning for 1 round causes a 12 HD air elemental to appear as if summoned by a conjure elemental spell. If incense of meditation is used the air elemental will be of 16 HD. Only one elemental may be summoned at a time and another cannot be called until the first is slain, dispelled, or dismissed.
source: OSRIC_3.0_Gamemaster_Guide.pdf
