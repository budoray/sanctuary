loot: 'Nil Nil Nil Nil Nil  EXPERIENCE 855+10/hp 550+6/hp 550+6/hp 320+5/hp 650+8/hp The manalishi, also known as “scaly devils” and “abyssai,” are  quite common on the upper planes of Hell. Most manalishi  serve the five-headed dragon queen of Hell. Manalishi are humanoid-shaped with horns, bat-like wings,  a long spiked tail, and vaguely draconic features. Their scaled  hide varies, as there are five distinct breeds of manalishi: black,  blue, green, red, and white. Immunities and Resistances Magic Resistance.  See summary stats for individual levels of  magic resistance. Damage Resistances  (all half damage): Cold, Poison (including  gases). Special Features Regeneration. Manalishi regenerate at a rate of 1 hit point per  round unless the damage was caused by holy water, a silver  weapon, or a blessed weapon. Spell-Like Abilities. At Will: change self (as the 1st level illusionist spell), command  (as the 1st level cleric spell), produce flame (as the 2nd level  druid spell), pyrotechnics
  (as the 2nd level magic-user spell),  or scare (as the 2nd level magic-user spell).  1/day: Once per day, a manalishi can attempt to summon an - other manalishi (20% chance of success). Unarmed Combat. Varies by type.'
