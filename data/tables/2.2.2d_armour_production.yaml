name: ARMOUR PRODUCTION
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- ARMOUR TYPE DAYS TO
- PRODUCE
- SKILL
- LEVEL
- REQUIRED
- HIRELINGS
- Helmet, Small 2 days High  Armourer
- Helmet, Great 10 days High  Armourer
- Padded Armour 30 days Low Tailor
- Leather Armour 10 days Low  Armourer,
- Leatherer
- Ring Armour 20 days Low  Armourer,
- Leatherer, Tailor
- Studded
- Armour 15 days Low  Armourer,
- Leatherer, Tailor
- Scale Armour 30 days Low  Armourer,
- Leatherer, Tailor
- Mail Armour 45 days Average  Armourer
- Splint Armour 20 days Low
- Armourer,
- Blacksmith,
- Leatherer
- Banded Armour 30 days High  Armourer
- Plate Armour 90 days High  Armourer
- Shield, Large 2 days High  Armourer,
- Carpenter
- Shield, Small 1 day High  Armourer,
- Carpenter
- A dwarf armourer is more likely to have a higher level of skill
- and is twice as efficient, but also demands three times the stan-
- dard wage; furthermore, a dwarf is unlikely to serve for more
- than a year at a time. A gnome armourer is slightly more likely
- to have a higher level of skill and increases efficiency by half, but
- requires twice the ordinary wage. The services of an elf armour-
- er can only be obtained for five times the usual wage, but will
- produce mail of the highest quality and reduce the production
- time by half.
