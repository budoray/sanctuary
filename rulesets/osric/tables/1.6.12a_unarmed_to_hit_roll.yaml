id: 1.6.12a
name: UNARMED  TO-HIT ROLL
source: OSRIC-3.0-Player-Guide-FINAL.v.7.pdf
lines:
- ATTACKER’S ARMOUR TARGET
- NUMBER TO HIT
- Attacker is unarmoured (this includes
- most monsters that aren’t human-like,
- even if they have a better AC than 10 [10])
- '2'
- AC 9 [11] 4
- AC 8 [12] 6
- AC 7 [13] 8
- AC 6 [14] 10
- AC 5 [15] 12
- AC 4 [16] 14
- AC 3 [17] 16
- AC 2 [18] 18
- AC 1 [19] 20
- AC 0 [20] or better 22
- Optionally, the GM may choose to reduce the Target Number to
- Hit by two points per “plus” of magical armour, but in no case
- may the target number be reduced below 2.
- Modifiers to the Unarmed Attack Die Roll
- Both the attacker and the defender have a modifier to the un -
- armed attack to-hit roll. For monsters, the number is precalcu -
- lated in the Game Master Guide, but it is derived from these
- tables.
- ATTACKER MODIFIERS
- Dexterity Modifiers
- '• Attacker’s Dexterity 15-18: +1'
- • Attacker’s Dexterity 19:+ +2
- Attacker’s Movement Rate (if free to move, including
- 'encumbrance if encumbered):'
- Less than 30 +0
- 30 +2
- 60 +4
- 90 +6
- 120 +8
- 150+ +10
- 'DEFENDER MODIFIERS:'
- Armour Modifiers
- Defender is unarmoured (this includes most
- monsters that aren’t human-like, even if they
- have a better AC than 10 [10])
- '+0'
- Defender AC 9 [11] +0
- Defender AC 8 [12] +2
- Defender AC 7 [13] +2
- Defender AC 6 [14] +2
- Defender AC 5 [15] +4
- Defender AC 4 [16] +4
- Defender AC 3 [17] +5
- Defender AC 2 [18] +5
- Defender AC 1 [19] +5
- Defender AC 0 [20] or better +7
- Defender  Movement Rate
- '(including encumbrance if encumbered):'
- Less than 30 +0
- 30 -2
- 60 -4
- 90 -6
- 120 -8
- 150+ -10
- Other Modifiers
- Any attack modifier stemming from a condition (prone, held,
- invisible, etc.) is applied to unarmed attack rolls, just like they
- are applied to ordinary attack rolls.
- 'THIRD STEP: CALCULATE RESULTS'
- If the result is a hit, the result depends on whether the attack
- was an attempt to grapple or to overbear. Roll on the appropri-
- ate results table depending on the type of attack.
