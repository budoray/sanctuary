name: Necklace of Strangulation
classes: any
description: 'This extravagantly beautiful necklace appears to be made with the finest craftsmanship and flawless gems, usually diamonds. Short of extraordinary means such as a wish, this necklace appears innocuous until worn. Once placed around a character’s neck the gems turn a ghastly purple as the necklace constricts around the wearer’s neck, inflicting 6 points of damage per round. This infernal necklace can only be removed with a limited wish, wish, or miracle. Otherwise it will remain clamped around the victim’s throat, even after death. After about a month, when the victim has decayed into a dry skeleton, the necklace will resume its normal appearance and loosen its hold on the victim’s skeleton in order to await the next victim. Net of Snaring (AFPRT): While not technically a cursed item, the net of snaring may only be used underwater, thus rendering it less than useful to most adventurers. The net grants a +3 bonus to underwater attacks and can be commanded to launch from the user’s
  hand and ensnare a creature up to 30ft away (as the 1st level druid spell entangle).'
source: OSRIC_3.0_Gamemaster_Guide.pdf
