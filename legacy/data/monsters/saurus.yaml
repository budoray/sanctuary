description: 'Herbivores who foraged on all fours and ran on hind legs, there  are two main families of the duck–billed dinosaurs known as  hadrosaurids: hadrosaurines and lambeosaurines. In game  terms there is no difference. Some could be interpreted as  Semi-amphibious swamp or wetland dwellers, in which case  they should have a swimming move, but many, perhaps all, are  fully terrestrial. Trachodon and Anatosaurs are now–supersed - ed names for kinds of hadrosaurid. Edmontosaurus: Cretaceous herbivore, formerly “anatosaurus”.  Charonosaurus: Cretaceous herbivore. Shantungosaurus: Creta- ceous herbivore. Saurolophus: Cretaceous herbivore. Hypacro- saurus: Cretaceous herbivore. Telmatosaurus: Smaller Creta - ceous herbivore. SAUROPODS'
