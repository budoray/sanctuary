name: Barkskin
slug: barkskin
reversible: false
class: druid
level: 2
school: Druidic Transmutation/Alteration
range: Touch
duration: 4 rounds+1 round/caster level
area_of_effect: Creature touched
components: V,S,M
casting_time: 3 segments
saving_throw: None
text: The barkskin spell magically toughens a creature's skin, making it as strong as tree bark. The recipient of the spell improves his or her armour class by one point and also gains a +1 bonus on all saving throws, with the exception of saving throws against Spells (unlisted categories).
