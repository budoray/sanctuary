name: Gaseous Form
classes: any
description: The drinker, in addition to all items they carry, takes on a translucent, gaseous consistency and floats at 30ft per round. This speed can be different depending on natural wind speed in the environment or due to the effects of wind–altering spells. While in gaseous form, the person can flow below doors and other small spaces not sealed airtight. Although magical lightning and fire do the gaseous form full damage, while in gaseous form the imbiber is otherwise impervious to other attacks. However, double the normal damage is inflicted by a whirlwind. This potion must be fully imbibed to have effect.
source: OSRIC_3.0_Gamemaster_Guide.pdf
