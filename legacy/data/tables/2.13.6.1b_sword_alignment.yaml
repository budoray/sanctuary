id: 2.13.6.1b
name: SWORD  ALIGNMENT
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- Intelligent swords will always have an alignment. Use the table
- below to generate this randomly, if needed. Holy swords are
- always lawful good.
- D100 ALIGNMENT D100 ALIGNMENT
- 01–05 Chaotic Good 31–55 Lawful Good
- 06–15 Chaotic Neutral 56–60 Lawful Neutral
- 16–20 Chaotic Evil 61–80 True Neutral
- 21–25 Neutral Evil 81–00 Neutral Good
- 26–30 Lawful Evil
- Any neutral sword will permit itself to be wielded by a character
- matching the non-neutral part of sword’s alignment (so a Cha -
- otic Good or Lawful Good character could wield a Neutral Good
- sword, for instance). True Neutral swords will allow themselves
