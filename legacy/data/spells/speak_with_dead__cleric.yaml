name: Speak with Dead
slug: speak_with_dead
reversible: false
class: cleric
level: 3
school: Clerical Necromancy
range: 10-ft
duration: See below
area_of_effect: One dead creature
components: V,S,M
casting_time: 1 turn
saving_throw: None
text: By casting speak with dead, the cleric opens a mystical channel to the afterworld, permitting him or her to ask a dead creature several questions. As with most spells that concern the afterlife, the length of time that the soul has departed is a factor–the longer the creature has been dead, the more powerful the casting cleric must be to initiate contact. The cleric must be able to speak the dead creature's language and must have some portion of its bodily remains available as the focus of the spell. Caster level Spell duration Max number of questions Max time since death 5-6 1 round 2 1 week 7-8 3 rounds 3 1 month 9-12 1 turn 4 1 year 13-15 2 turns 5 1 decade 16-20 3 turns 6 1 century 21+ 1 hour 7 1 æon
