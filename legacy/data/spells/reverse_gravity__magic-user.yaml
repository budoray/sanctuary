name: Reverse Gravity
slug: reverse_gravity
reversible: false
class: magic-user
level: 7
school: Arcane Transmutation/Alteration
range: 5-ft/level
duration: 1 second ( 1 /6 segment)
area_of_effect: 30-ft×30-ft×1 mile
components: V,S,M
casting_time: 7 segments
saving_throw: None
text: The caster momentarily reverses gravity in the area of effect, which is a 30 square-ft area, extending a mile into the air. Any object or creature in this area will “fall” upwards for a distance of 20-ft, striking intervening objects as per a normal, downward fall. When the duration ends, of course, they will fall downward again.
source: wiki2_spells.txt
