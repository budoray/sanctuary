name: Bracers of Armour
classes: any
description: When worn, this pair of armoured wrist guards grant from +1 to +8 magical enhancement to the wearer’s AC—but only when the wearer wears no other armour, nor a shield. These bracers are therefore highly prized by magic users. Determine gp value by squaring the AC bonus (i.e., +1 = 1,000, +2 = 4,000, +3 = 9,000, and so on).
source: OSRIC_3.0_Gamemaster_Guide.pdf
