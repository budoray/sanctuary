description: Animated objects are temporary creatures created by the level  6 Cleric spell animate object.
abilities:
- heading: Immunities and Resistances
  text: Immunities. Animated objects are immune to blindness, psychic  damage, charm, domination, sleep, gases, poison, and disease.
- heading: Special Attacks
  text: Unarmed Combat.  Some animated objects might be able to  choose to overbear or grapple instead of making a regular me- lee attack. Because they vary in shape and size, pre-calculated  stats for unarmed attacks will vary.
- heading: Languages
  text: The animated object magically understands its creator’s spoken  commands, no matter what language its creator is speaking. It  doesn’t understand anyone else.
