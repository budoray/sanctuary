description: An ornery beast of burden, the camel comes in two types, both  of which have the same stats in game terms. The dromedary has  only one hump and prefers warm climates. The bactrian camel  has two humps, is adaptable to a wider range of temperatures  and environments, and moves 30ft more slowly. Regardless of the type, all camels can be domesticated, can car- ry immense loads (up to 6,000 gp). Between 4 and 6 thousand  gp, speed is reduced to half.
abilities:
- heading: Special Attacks
  text: Spit. Their usual attack is a bite, but they may also spit. Spitting  requires no to-hit roll, and has a 25% chance to blind the oppo- nent for 1d3 rounds (no saving throw).
