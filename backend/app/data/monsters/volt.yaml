description: Volts are peculiar, magical creatures that attack almost any - thing that ventures near their lair. They appear as little balls of  grey fur with two protruding eyes and a long, whip-like tail that  crackles with electricity. Volt lairs usually smell slightly of ozone.
abilities:
- heading: Immunities and Resistances
  text: Immune to Electricity.  Volts are immune to electricity and light - ning damage.
- heading: Special Attacks
  text: Latch, Bite, and Shock.  If the volt’s bite attack succeeds, it has  latched onto its target and will do normal bite damage (1d4  hp) automatically every round. At the same time it will lash its  foe with its tail (not an automatic hit). The tail attack inflicts  a strong electric shock (2d6 hp damage) with a hit. Only vic - tims not wearing metal armour receive a saving throw (for half  damage), and any victim wearing metal armour is treated as  unarmoured (AC 10 [10]) for the purposes of the volt’s attack.  Unarmed Combat. Volts cannot be targeted with overbearing or  grappling attacks, and do not use these tactics.
