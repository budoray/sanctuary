name: Berserker 00 Vacuous Grimoire Amulet of Inescapable Location
classes: any
description: Identify will falsely indicate this item grants the wearer immunity from detection, location, and mind-reading. Once donned, however, the item changes from a normal appearing gold amulet with gemstone inlay into a rather large and garish piece of cheap costume jewellery. Anyone wearing the amulet of inescapable location will be 50% less likely to save vs scrying and divination spells.
source: OSRIC_3.0_Gamemaster_Guide.pdf
