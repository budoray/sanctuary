name: Rulership
classes: FPR
description: This rod looks like a royal sceptre. The wielder can command the obedience and fealty of creatures within 120ft when they activate the device. Creatures totalling (1d4×100)+100 hit dice can be ruled, but creatures with intelligence scores of 15 or higher and levels or HD equal to or greater than 12 are entitled to a save vs magic to negate the effect. Ruled creatures obey the wielder as if they were their absolute sovereign. Still, if the wielder gives a command that is contrary to the nature of the creatures commanded, the magic is broken. The rod can be used after 5 segments from activation, and each charge expended allows the rod to be used for 1 turn. The rod crumbles to dust once all charges are expended. It may not be recharged.
source: OSRIC_3.0_Gamemaster_Guide.pdf
