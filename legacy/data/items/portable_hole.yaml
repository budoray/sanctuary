name: Portable Hole
classes: any
description: A deep black cloth that, when unfolded onto a flat surface, forms a 6ft diameter and 10ft deep hole. Items placed in the hole are stored safely and the cloth is of negligible weight when folded up, regardless of the weight of its contents. The portable hole can be closed by taking the edges of the cloth and folding it up. This can be done from without or within the hole. Folded up, there is enough air for 1 medium or 2 small creatures for about 10 minutes. The extra-planar space of a portable hole is not compatible with similar devices, such as a bag of holding. If either of these items is placed within the other, see the entry under bag of holding to determine the effects.
source: OSRIC_3.0_Gamemaster_Guide.pdf
