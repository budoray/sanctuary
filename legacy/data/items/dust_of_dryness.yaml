name: Dust of Dryness
classes: any
description: One application of this wonderful substance will absorb up to 100 gallons of water (fresh, salt, or alkaline) and forming as mall 1-in pellet, either floating or resting where it was cast. This pellet can be forcibly hurled, causing it to break open and release the same volume of water in a most energetic fashion. Dust of dryness will only affect water, it has no affect on other liquids. This magic dust can also be used to destroy a water elemental, though the monster is allowed a saving throw vs death magic at -5 for 5d6 damage. Dust of dryness comes packaged in a similar fashion to dust of appearance.
source: OSRIC_3.0_Gamemaster_Guide.pdf
