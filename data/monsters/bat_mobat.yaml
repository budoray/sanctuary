name: Bat, Mobat
frequency: rare
no_encountered: 1d8
size: medium
alignment: neutral evil
move: 30ft; 150ft flying (AA:IV)
armour_class: 2 [18] or 10 [10]
hit_dice: 4-6
melee_attacks: 1 bite (2d4)
senses: Echolocation
lair_chance: 15%
intelligence: low (5-7)
morale: 65, 70 or 75
loot: Hoard 3
experience: '4HD: 135 +3/hp 5HD: 190 +4/hp 6HD: 300 +6/hp'
description: The very large mobat is found in warm regions where a plentiful  supply of warm-blooded prey is available. These evil creatures  may work with other evil species of any kind that can commu - nicate with them.
abilities:
- heading: Surprise and Initiative
  text: Surprise Attack. Mobats surprise opponents on a 1-3 (on 1d6).
- heading: Immunities and Resistances
  text: Echolocator. Sight isn’t this creature’s primary sense. Silence  affects it in the same way that darkness affects sighted crea - tures.
- heading: Special Features
  text: Armour Class. When mobats are airborne their AC is 2 [18], but  when grounded or attacking their AC is 10 [10].
- heading: Special Attacks
  text: Shriek. Mobats can emit a terrifying shriek. If a saving throw  vs paralysis is failed, the victims (all within a 20ft radius) are  forced to cover their ears, and are thus rendered defenceless.  The mobat can do this in any round, but cannot shriek and  attack in the same round.
- heading: Languages
  text: Mobats do not have a language other than the neutral evil align- ment speech. They can (and do) cooperate with other evil crea- tures—on a disorganised basis if there is no communication,  or in more organised fashion if they can communicate by align- ment tongue or by spells. BATRACHIAN
