name: Exorcise
slug: exorcise
reversible: false
class: cleric
level: 4
school: Clerical Abjuration
range: 10-ft
duration: Instantaneous (permanent)
area_of_effect: One creature or object
components: V,S,M
casting_time: See below
saving_throw: None
text: Exorcism is a powerful abjuration that casts out demons, devils, or any supernatural inhabitant or influence from a creature or object that has been possessed or otherwise controlled. Exorcism banishes all charms and enchantments, removes curses, and will cast any possessing demon or other creature back into its nearest physical body other than the one being exorcised. The base chance for the cleric to perform a successful exorcism is randomly determined on a d% if the GM has not previously assigned a specific number to represent the relative difficulty of the exorcism. To the base chance is added a modifier of +1/-1 for each level of difference between the cleric's caster level and the level or hit dice of the opposing supernatural force (determined by the GM in the case of supernatural forces with no stated level or HD). The cleric begins the exorcism, rolling a d% for each turn. If the cleric's die roll is equal to or less than the modified chance of success, the exorcism is successful.
  The process cannot be halted once it has begun, and if the cleric is forced to pause before successfully casting out the supernatural force, the spell will fail.
source: wiki2_spells.txt
