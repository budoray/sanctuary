description: In medieval Arabic literature, Al-Mi’raj (or just Mi’Raj) are yellow  hares with black horns, like miniature unicorn horns. In OSRIC  they are fey creatures that live in temperate and subtropical  woodlands. Their horns are useful to alchemists, and some wiz- ards use wands made of Al-Mi’raj horns.
