name: Charm Person
slug: charm_person
reversible: false
class: magic-user
level: 1
school: Arcane Enchantment/Charm
range: 120-ft
duration: See below
area_of_effect: One person
components: V,S
casting_time: 1 segment
saving_throw: Negates
text: 'The powerful enchantment woven by this spell will affect any “person,” meaning character races (but note that elves are 90% resistant), and humanoids (as defined in Chapter 5) up to a ceiling of one hit die of charmed creatures per character level at any one time. If the target creature fails a saving throw, it will view the magic user as a trusted friend, interpreting his or her every word in its most positive light. Charmed creatures will place themselves into moderate danger, including combat, on the caster''s behalf, but will not undertake risks beyond those the creature might ordinarily take. The magic user must be able to talk to the charmed creature if he or she is to give it any sort of complex “request.” Charmed creatures are allowed periodic saving throws to break the charm, based on intelligence: 19+ one saving throw/day 18 one saving throw/2 days 17 one saving throw/3 days 15-16 one saving throw/week 13-14 one saving throw/2 weeks 10-12 one saving throw/3 weeks 7-9 one
  saving throw/month 4-6 one saving throw/2 months 3 or less one saving throw/3 months The charm will be broken automatically if the magic user obviously tries to harm the charmed creature.'
source: wiki2_spells.txt
