name: Conjure Animals
slug: conjure_animals
reversible: false
class: illusionist
level: 6
school: Phantasmal Conjuration/Summoning
range: 30-ft
duration: 1 round/level
area_of_effect: Conjured creatures
components: V,S
casting_time: 6 segments
saving_throw: None
text: A caster may use this spell to conjure animal allies from thin air and order them into combat. The total hit dice of summoned animals cannot exceed the caster's level, and the animals must all be of the same type. This spell will only summon mammals, although giant or prehistoric forms of normal mammals may be conjured if these are present within a few miles of the caster. The GM determines the specific type of animal that appears.
source: wiki2_spells.txt
