name: Wizardry
classes: M
description: 'The staff of wizardry is a powerful device, granting several spells at the wielder’s disposal. The staff may be used to effect the following spell-like abilities: detect magic, enlarge, hold portal, light, and protection from good (evil) . These abilities do not require the expenditure of charges. In addition, the staff has the following abilities that cost 1 charge per use: dispel magic , fireball, ice storm , invisibility, knock, lightning bolt, passwall, pyrotechnics, wall of fire, and web. The following powerful abilities cost 2 charges per use: conjure elemental, plane shift, telekinesis, and whirlwind (as a genie). The wielder of the staff receives a bonus of +2 for saving throws vs magic. This staff may be recharged, but only by absorbing magical energies that are cast at the wielder. When a spell is cast at the wielder, he may choose to absorb these energies, at a rate of 1 charge per spell level of the spell directed at him. Note that taking this manoeuvre is the sole
  action of the staff for that round, and it may not be used for other effects in the same round it absorbs energy. Each staff has a maximum number of possible charges, and it will only safely absorb charges to this limit. The wielder will not know the limit, or how many charges have been used, unless some magical means is employed to discover this. The staff does not reveal this information. Should the staff collect energy in excess of its limit, it detonates in the same manner as in a retributive strike, as described below. A staff of wizardry can be used for a retributive strike, requiring it to be broken by its wielder. The breaking of the staff must be intentional and declared by the wielder. All charges currently in the staff are instantly released in a 30ft radius. All within 10ft of the broken staff take points of damage equal to 8× the number of charges in the staff, those 10ft to 20ft away take 6× the number of charges in damage, and those 20ft to 30ft distant take 4× the number
  of charges in damage. All those affected can make saving throws vs magic to reduce the damage by half. The character breaking the staff has a 50% chance of travelling to another plane of existence, but if they do not, the explosive release of spell energy destroys him or her. Only the staff of wizardry and the staff of power may be used for a retributive strike. After all charges are used up from the staff, it remains a +2 quarterstaff. Once empty of charges, it cannot be used for a retributive strike. 2.13.4.3. WANDS For the purposes of calculating duration, damage, range, and other effects, wands function as if a character of 6th level produces their magical effects. Some small percentage of wands, at the GM’s discretion, are cursed to either direct their effects at the user or produce some other misleading or harmful effect.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
