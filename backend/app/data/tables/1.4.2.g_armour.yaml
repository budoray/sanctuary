- ARMOUR TYPE± WEIGHT (IN POUNDS)  MOVEMENT CAP  ARMOUR CLASS COST
- Banded 35 90ft 4 [16] 90 gp
- Chain mail 30 90ft 5 [15] 75 gp
- Elfin mail 15 120ft 5 [15] Not sold*
- Leather 15 120ft 8 [12] 5 gp
- Helmet n/a n/a n/a Free
- Padded 10 90ft 8 [12] 4 gp
- Plate mail 45 60ft 3 [17] 400 gp
- Ring mail 35 90ft 7 [13] 30 gp
- Scale or lamellar 40 60ft 6 [14] 45 gp
- Shield, large 10 — -1 [+1]** 15 gp
- Shield, medium 8 — -1 [+1]** 12 gp
- Shield, small 5 — -1 [+1]** 10 gp
- Splint 40 60ft 4 [16] 80 gp
- Studded leather 20 90ft 7 [13] 15 gp
- '*Elfin mail isn’t sold. The elven smiths who make elfin mail occasionally'
- gift it to those who do great deeds for the elven folk.
- '** Shields improve your armour class by 1 point (an unarmoured'
- person with a shield is AC 9 [11]). You can only use a shield if your
- attacker is in front of you or if they’re attacking from your shield side,
- and you can’t use your shield against an attacker you aren’t aware
- of. If you have a small shield, you can only choose to use its bonus
- against one incoming attack in each combat round. If you have a
- medium shield, you can use its bonus against two attacks, and if you
- have a large shield, you can use its bonus against three attacks. You
- decide whether to use your shield just before your attacker makes
- their attack roll.
- ± All purchased armour comes with a helmet included in the price.
