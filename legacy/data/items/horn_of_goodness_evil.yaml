name: Horn of Goodness/Evil
classes: CP
description: Depending on the owner’s alignment, blowing this brass horn will produce either a protection from evil, 10ft radius for good-aligned users or protection from good, 10ft radius for evil-aligned users. In either case, the duration of the spell-like effect is 1 hour. A neutral individual gains no benefit from sounding the horn.
source: OSRIC_3.0_Gamemaster_Guide.pdf
