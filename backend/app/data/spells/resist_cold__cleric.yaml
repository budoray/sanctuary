name: Resist Cold
slug: resist_cold
reversible: false
class: cleric
level: 1
school: Clerical Transmutation/Alteration
range: Touch
duration: 1 turn/level
area_of_effect: Creature touched
components: V,S,M
casting_time: 1 round
saving_throw: None
text: By touching the spell's intended recipient and casting the spell, the cleric instills the recipient with a supernatural resistance to the effects of extreme cold. Normal cold, temperatures ranging down to zero degrees Fahrenheit, is perceived as normal temperature. The subject also gains a saving throw bonus of +3 against magical cold, taking one half damage if the save is not successful and one quarter damage if the save is successful. The saving throw is permitted even against attacks that would not ordinarily permit a saving throw (such as a magically cold sword).
source: wiki2_spells.txt
