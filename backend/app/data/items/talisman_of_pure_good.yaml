name: Talisman of Pure Good
classes: CP
description: Any cleric or paladin of good alignment (LG, NG, CG) can use this artifact to damn an evil cleric (LE, NE, CE) up to 100ft away to a fiery judgment. When the talisman is activated, the ground cracks open at the cleric’s feet, flames shooting upward as the victim is sent hurtling down to the very centre of the earth. The following round the ground closes and forever after, nothing will grow on that spot. The wielder of the talisman must be exceptionally pure of thought and deed, or else the target of the talisman’s effect gains a saving throw vs death magic to leap aside as the crack forms. It should be also noted the target must be standing on solid ground for the talisman to function. None but a good paladin or cleric may use the talisman of pure good, and none but an evil cleric may be damned by it. Any neutral cleric (LN, N, CN) touching the talisman takes 6d6 damage, no saving throw allowed. An evil cleric touching the talisman takes 8d6 points of damage, no saving throw
  allowed. The talisman is inert to any other character.
source: OSRIC_3.0_Gamemaster_Guide.pdf
