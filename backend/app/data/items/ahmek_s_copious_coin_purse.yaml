name: Ahmek’s Copious Coin Purse
classes: any
description: 'Ahmek was a wizard turned sage who, legends say, was always forgetting to put money in his purse. This magic item is an exquisitely-crafted leather poke sewn from four leather panels, alternating black with a golden yellow colour. When found, the purse will contain the following: 5 cp, 5 sp, 2 ep, 15 gp, 3 pp. No matter how many coins are removed from or added to the poke, the number of coins will always reset to these amounts at midnight.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
