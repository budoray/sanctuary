name: Robe of Powerlessness
classes: IM
description: This magical robe appears to be a beneficial magic item, usually a robe of protection +2 . As soon as the robe is worn the character takes a penalty of -3 to strength and intelligence, possibly forgetting spells and magic knowledge or becoming over-encumbered accordingly. Note that neither attribute may be reduced to less than 1. The robe may be removed at will but the effects may only be dispelled by a remove curse followed by heal.
source: OSRIC_3.0_Gamemaster_Guide.pdf
