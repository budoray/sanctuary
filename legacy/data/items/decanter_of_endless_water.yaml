name: Decanter of Endless Water
classes: any
description: 'A leathern flask of ordinary workmanship and appearance. When the user removes the stopper and speaks the proper command word, often inscribed on the bottom of the flask, the decanter produces fresh or salt water in various volumes and at different velocities, with separate command words for each. A command word also stops water flow. • Stream: Pours 1 gallon per round. • Fountain: Emits a 5ft long stream of water flowing at 5 gallons per round. • Geyser: Emits a 20ft long, 1ft wide blast of water flowing at 30 gallons per round. The geyser function creates considerable back pressure and a character with unsteady or precarious footing may be knocked to the ground. Geyser creates enough force with its blast of water to inflict 1d4 points of damage to a target within the 20ft range but only one creature per round may be targeted.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
