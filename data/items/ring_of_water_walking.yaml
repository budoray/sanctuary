name: Ring of Water Walking
classes: any
description: This ring grants the ability to walk upon the surface of any liquid without sinking into it at the wearer’s normal rate of movement. This includes but is not limited to running water, snow, quicksand, oil, mud, or even lava (though heat damage would still apply). The wearer’s feet do not actually contact the surface of the liquid but semi-solid liquids such as snow or mud will show vaguely footprint-like depressions evidencing the wearer’s passing. The ring has a weight limit of 1,250 lbs.
source: OSRIC_3.0_Gamemaster_Guide.pdf
