name: Elixir of Hiding
classes: any
description: Imbibing this potion grants a non-thief character the hide in shadows ability of a 10th level thief for 1 hour. A thief character of 10th level or above drinking the potion gains a 20% bonus to hide in shadows checks for the same period.
source: OSRIC_3.0_Gamemaster_Guide.pdf
