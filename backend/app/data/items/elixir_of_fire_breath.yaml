name: Elixir of Fire Breath
classes: any
description: This potion enables the drinker to breathe fire up to thrice, targeting a single creature up to 25ft away for 4d6 damage per attack. The target gets a saving throw vs dragon breath for half damage. The ability to breathe fire dissipates after 3 breath attacks or 1 hour, whichever comes first.
source: OSRIC_3.0_Gamemaster_Guide.pdf
