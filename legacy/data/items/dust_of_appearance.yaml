name: Dust of Appearance
classes: any
description: 'Simply put, this fine white powder makes things visible. A handful of this substance projected into the air coats all objects within a 10ft radius and lasts 5 minutes, making even invisible objects appear in plain sight. Within the area of effect the dust negates: invisibility, blur, displacement, phantasms, mirror images, projected images, and illusions— even a hiding creature incurs a -30% penalty on its chance to hide in shadows. Dust of appearance is typically found stored in sets of 1d4+2 hollowed bone tubes or silk packets.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
