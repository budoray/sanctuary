name: Control Weather
slug: control_weather
reversible: false
class: magic-user
level: 6
school: Arcane Transmutation/Alteration
range: '0'
duration: 4d6 hours
area_of_effect: 4d4 square miles
components: V,S,M
casting_time: 1 turn
saving_throw: None
text: The control weather spell brings about a rapid change in the weather for several square miles surrounding the point where the spell is cast. It requires no more than 10-40 minutes for the spell to take its full effect across the vast area it covers. The spell affects precipitation, temperature, and wind speed. Existing weather conditions cannot be utterly changed by the force of this spell; a clear day cannot be made cloudy, for instance, but it can be made partly cloudy. Hot weather can be made merely warm, and only a light breeze can be raised from calm weather. This spell may be cast successively to bring about a dramatic change, moving, for example, from a calm to a light breeze, from the breeze to a strong wind, and on the third casting to transform the strong wind into a gale.
source: wiki2_spells.txt
