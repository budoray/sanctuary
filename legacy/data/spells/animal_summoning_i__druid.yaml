name: Animal Summoning I
slug: animal_summoning_i
reversible: false
class: druid
level: 4
school: Druidic Conjuration/Summoning
range: 120-ft/level
duration: See below
area_of_effect: See below
components: V,S,M
casting_time: 6 segments
saving_throw: None
text: 'A druid may use this spell to summon normal or giant animals of a specified type. The animals must be within the spell''s range to be summoned. Up to three summoning attempts may be made if animals of the specified type do not appear. Assuming that the summoned type of animal is within the spell''s range, up to 8 animals will appear, of no more than 4 hit dice each. These animals will assist the druid with a specific mission: winning a battle, travelling to a specific location, etc.'
source: wiki2_spells.txt
