- FREEHOLDS
- A stronghold is eligible to become a freehold if there is enough
- land around it. The character must clear out monster lairs from
- at least a 20-mile radius of surrounding wilderness. Regular
- weekly patrols will also need to be made, to keep the area as
- safe as possible. The newly minted freehold will then attract set-
- tlers seeking to establish hamlets and villages under the char -
- acter’s protection.
- So long as monsters are kept under control and the hold’s pop-
- ulation is not abused to the point of open revolt, the character
- will receive a monthly income of 7 silver pieces per inhabitant,
- from taxes and trade duties.
- The possibility of new monster incursions always looms, howev-
- er, and there is a 1 in 12 chance of such an incursion each week
- (roll as per a random wilderness encounter). Depending on the
- severity, some of these encounters may be resolved simply by
- dispatching hired troops, while others may require the charac -
- ter’s personal attention.
- 2.14.2. SPELL  RESEARCH
- Higher-level magic-users and illusionists can discover new
- spells by developing magic words, components, and gestures
- that evoke magical effects. Clerics and druids may also attempt
- to “create” new spells using the same procedure, although the
- actual process is more a matter of religious research and divine
- inspiration than scientific-magical research. Any proposed spell
- can unbalance the game, so the GM’s approval is required.
- 'The basic process for researching a new spell:'
- A minimum of one full week of research time per spell level,
- plus one additional week, is required for the process.
- Cost is equal to 200 gp per spell level, plus an additional 1d4 x
- 100 gp per week (see above). This cost assumes access to a full
- laboratory (magic-users, illusionists) or shrine (clerics, druids). If
- no such facility is available, the base cost increases to 2,000 gp
- per spell level plus an additional 1d4 x 100 gp per week.
- Once the minimum time and cost are met, a die roll is made to
- see if there is immediate success. The success chance is 10%
- (the “base success chance”), plus the character’s intelligence
- score (for magic-users and illusionists) or wisdom score (for
- clerics or druids) plus the level of the researcher, minus two
- times the level of the new spell. Paying an additional 2,000 gp
- per level of the spell during the research phase increases the
- base success chance from 10% to 20% (adding 10% to the base
- success chance), and this optional price may be paid up to four
- times, resulting in a maximum base success chance of 50%
- (10% plus four increments of 10%) at the cost of 8,000 gp per
- spell level (2,000 gp per additional 10%).
- If the first success roll fails, a new attempt can be made after an
- additional week of research, at the usual cost (200 gp per spell
- level plus 1d4 x100 gp). The process can be continued with a
- new attempt every week for as long as the character has time
- and resources to continue research.
