name: Belt of Dwarfkind
classes: any
description: This magical girdle grants anyone putting it on a +4 to charisma when dealing with dwarfs, +2 charisma when dealing with halflings or gnomes, and -2 for all other ancestries. If the wearer is not a dwarf, they also gain all the engineering-based ancestral abilities of a dwarf (slanting passages, detect traps, et al.); +1 constitution; and +2 on saves vs poison, spells, or spell-like effects.
source: OSRIC_3.0_Gamemaster_Guide.pdf
