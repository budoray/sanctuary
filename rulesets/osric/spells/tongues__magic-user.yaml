name: Tongues
slug: tongues
reversible: true
class: magic-user
level: 3
school: Arcane Transmutation/Alteration
range: '0'
duration: 1 round/level
area_of_effect: 30-ft radius
components: V,M
casting_time: 3 segments
saving_throw: None
text: Within the radius established by this spell, the caster, and the caster alone, will be able to speak and understand any verbal language, including alignment tongues. Note that the spell's area of effect does not move with the caster. The reverse of the spell makes any verbal communication impossible for any person (not just the caster) in the spell's area, or may be used to cancel out the effects of the tongues spell.
source: wiki2_spells.txt
