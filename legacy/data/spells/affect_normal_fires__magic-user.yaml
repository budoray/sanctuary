name: Affect Normal Fires
slug: affect_normal_fires
reversible: false
class: magic-user
level: 1
school: Arcane Transmutation/Alteration
range: 5-ft/caster level
duration: 1 round/caster level
area_of_effect: 11⁄2-ft radius fire
components: V,S
casting_time: 1 segment
saving_throw: None
text: With arcane words and gestures, the magic user may command small fires, up to a limit of 11⁄2-ft in radius, to grow smaller or larger. Any fire within the spell's size limitations may be made as small as a candle flame or turned into a bonfire up to 3-ft in diameter. An affected fire only consumes fuel appropriate to its new size, but will continue to radiate the same heat as a fire of its original size.
source: wiki2_spells.txt
