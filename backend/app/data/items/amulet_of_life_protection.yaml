name: Amulet of Life Protection
classes: any
description: The wearer of this brooch is protected against attacks on their soul. The charm completely safeguards its wearer from possession, whether as the result of a spell or through the efforts of a demon, devil or like being. Furthermore, should the wearer be slain, their soul will enter the amulet and be protected for up to 1 week. If the amulet is destroyed during that time, however, the soul is destroyed along with it.
source: OSRIC_3.0_Gamemaster_Guide.pdf
