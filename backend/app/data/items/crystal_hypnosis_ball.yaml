name: Crystal Hypnosis Ball
classes: IM
description: This item appears as a typical crystal ball, used by many mages to assist with scrying and communication across long distances. Anyone looking into the ball will be hypnotised for 1d6 minutes, during which time they will do nothing but stare into the ball, enthralled by what is seen therein. When the viewer is released, they should roll a save vs petrifaction or be convinced they viewed the desired scene or individual. Further, failing to save indicates the viewer has become mentally enslaved by the actual object of the viewing, a powerful lich, arch-mage, or perhaps even a powerful other-planar figure who is secretly controlling the device. With each use of the hypnosis ball the unlucky individual falls deeper and deeper under the influence of the controlling figure, until eventually the viewer becomes an extension of its will. The viewer, of course, is completely unaware of their waning individuality.
source: OSRIC_3.0_Gamemaster_Guide.pdf
