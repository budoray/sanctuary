name: Mirror of Life Trapping
classes: CM
description: A magical trap in the guise of a 4ft square mirror activated by hanging it on a wall and speaking the command word. Any creature within 30ft of the activated mirror and unaware of the mirror’s true nature will see their reflection and be pulled bodily into the mirror. A saving throw vs petrifaction is allowed to avoid imprisonment. The trapped character leaves all carried and worn items behind and will be imprisoned in 1 of 15 extra–planar cells. While imprisoned, the character is in stasis and requires no food, drink or air. They lose any innate powers or spell-like abilities. Creatures aware of the mirror’s true nature and seeking to avoid being trapped can approach the mirror and attempt to avoid seeing their reflection with a 50% chance of success; a blindfold or similar increases the chance to 100%. Size is not a factor to the mirror’s trapping ability, but golems and unintelligent undead, as well as any other inanimate matter, cannot be trapped. There are various command
  words for the mirror of life trapping. Besides the activation command, there is a deactivation command which allows the owner to safely approach the mirror. Each imprisoned creature has two further command words associated with it. One will call the creature’s reflection to the surface of the mirror and allow the owner to converse with the powerless captive. The second command word will free the prisoner. If the number of prisoners held within the mirror exceeds 15, a randomly determined captive will be freed to make room for the new one. Breaking the mirror will free all captives held within—but it should be noted here that not all liberated prisoners may be kindly disposed towards those who granted them freedom. The GM should determine the quantity and nature of prisoners held by the mirror of life trapping before placing it into the campaign world.
source: OSRIC_3.0_Gamemaster_Guide.pdf
