id: 2.8.1a
name: DAYTIME  ENCOUNTERS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100  ENCOUNTER
- 01 Assassins.* 1d3 encountered, possibly in  disguise.
- 02 Bandits. 3d4 plus a Leader
- 03–12 Beggars. 1d2 0 level NPCs.
- 13 Brigands. 3d4 plus a Leader
- 14–18 Town Guards. 2d8 plus a Leader.
- '19–21 Town Official: roll 1d10: (1–9) Minor Official (10) Major Official and 2d4 Guardsmen.'
- '22–23 Town Watch: 5 Men–at–Arms (0–lvl) and Sergeant (lvl 1d3) and a Cleric (lvl d4+1).'
- 24–25 Cleric.* A d6+5–lvl Cleric with 1d6–1 d4–lvl Assistant Clerics.
- 26 Druid.* A d6+5–lvl Druid with (1–5) 1d4-1 d4–lvl Lesser  Druids or
- (6–10) 1d4 d6–lvl Fighters.
- 27 Drunk. See Urban Professions Sub–table for exact type.
- 28–29  Fighter.* A 2d4+4–lvl  Fighter with 1d4–1 d4–lvl  Henchmen.
- '30–33 Gentry (landowners). Roll 1d10: (1–4) Foppish Dandy and d4 Sycophants (5–6) Lone gentleman/woman on a secret'
- errand or tryst (7–10) d4+6–lvl  Fighter and d4 similar friends.
- 34 Giant Rats, 2d4.
- 35–39 Townsperson. A 0–lvl normal Human
- D100  ENCOUNTER
- 40–41
- 'Expert Hireling. Roll 1d10: (1)  Alchemist, (2)  Armourer, (3 or 4)  Blacksmith, (5)  Engineer (Architect), (6)  Jeweller'
- ( Gemcutter), (7)  Sage, (8)  Scribe, (9) Spy, or (10)  Weaponer. The expert is accompanied by 1d4 bodyguards (level 0
- soldiers).
- 42 Illusionist.* A d4+6–lvl Illusionist with (1–5) d4–1 d4–lvl Apprentice Illusionists or (6–10) 1d3 d6–lvl  Fighter
- Bodyguards.
- 43-46 Labourers. 3d4 rough workmen
- 47–50 Peddlers. 1d3 peddlers selling simple goods on the street
- 51 Magic-User.* A d6+6–lvl Magic-user with (1–4) d4 d6–lvl Apprentice Magic-users (5–7) d4 d4+3–lvl  Fighter
- Bodyguards or (8–10) d2 Apprentices and d2 Bodyguards as above.
- 52–55  Mercenaries. 3d4 d6-1–lvl Fighters.
- 56–62 Merchants. 1d3 Merchants (0–lvl normal Humans).
- 63 Troubadours. 1d4 Travelling bards, musicians or actors.
- 64–65 Ranger*. A d4+6-lvl Ranger.
- 66 Noble.** Noble and 1d4 d4–lvl  Fighter Bodyguards.
- 67–69 Paladin.* A d4+5–lvl Paladin.
- 70 Pilgrims. 3d4 Pilgrims (normal Humans).
- 71–72 Press Gang. 2d8 1st–lvl Fighters and a d4+1–lvl Leader all wielding clubs.
- 73 Ruffians. 1d4+1 d6+4–lvl Fighters.
- 74–78 Rakshasas. (GM’s discretion. 1d3 encountered.)
- 79–82  Thieves.* A d4+7–lvl Thief and 1d3–1 d4–lvl Apprentice  Thieves.
- 83–97 Tradesmen. 2d4 Artisans, craftsmen or skilled workers (normal humans).
- 98 Wererats. 2d4 encountered (1–9) in human form (10) in giant rat form.
- 99 Weretigers. 1d2 encountered in human form.
- 00 Werewolves. 2d4 encountered in human form.
