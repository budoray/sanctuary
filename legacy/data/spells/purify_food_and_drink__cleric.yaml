name: Purify Food and Drink
slug: purify_food_and_drink
reversible: true
class: cleric
level: 1
school: Clerical Transmutation/Alteration
range: 30-ft
duration: Instantaneous (permanent)
area_of_effect: 1 cubic-ft/level
components: V,S
casting_time: 1 round
saving_throw: None
text: This spell removes poison, rot, and other contaminants from all food and water within the spell's area of effect, also destroying the malignant properties of unholy water. The reverse of the spell contaminates food and water and will spoil holy water.
source: wiki2_spells.txt
