description: Zombies are the risen corpses of the dead. In many cases they  have been animated by a powerful spell caster, though some - times zombies rise from other supernatural influences. Once  they begin to attack, they never flee unless turned by a cleric.  Monster zombies are the animated corpses of larger humanoid  monsters such as bugbears, ettins or ogres. They are harder for  a cleric to turn than a normal zombie.
abilities:
- heading: Surprise and Initiative
  text: Slow. These creatures shuffle slowly into combat; they are al - ways the last creatures to attack in a melee round regardless  of initiative rolls.
- heading: Immunities and Resistances
  text: 'Turned as Undead.  Normal zombies are turned as type 2 Un - dead. Monster zombies are turned as type 6 Undead. Immune to Cold. Zombies are immune to cold damage. Undeath. This creature is immune to all mind control (including  charm) and hold spells. It cannot be affected by sleep, gases,  poison, or disease. Unarmed Combat. Zombies can be targeted with grappling and  overbearing attacks (they do not initiate them, but if you want  to grapple, it will grapple you right back). They do not suffer  temporary damage, so this isn’t a winning strategy. If not fend - ed off, they score an unarmed hit with a 2+ on 1d20. Hit Mods:  ATK/DEF +4/-4. Overbear Results Mods: ATK/DEF +0/-0. Grap - pling Result Mods: ATK/DEF +0/-0.'
