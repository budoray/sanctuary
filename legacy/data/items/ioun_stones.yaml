name: Ioun Stones
classes: any
description: These are magical crystals that orbit the user’s head at a distance of 1d3ft and grant various benefits. The stones each have an AC -5 [25], 10 hp, and ignore the first 5 points of damage from all attacks. Ioun stones may be stored at will but will grant no benefits unless circling the user’s head. COLOUR SHAPE EFFECT Clear Spindle Sustains user without food or water Dusty Rose Prism +1 AC Deep Red Sphere +1 dexterity Incandescent Blue Sphere +1 wisdom Pale Blue Rhomboid +1 strength Pink Rhomboid +1 constitution Pink & Green Sphere +1 charisma Scarlet & Blue Sphere +1 intelligence Dark Blue Rhomboid +1 experience level Vibrant Purple Prism Stores 3 levels of spells* Iridescent Spindle Sustains user without air Pale Lavender Ellipsoid Absorbs 4th level spells or lower** Pearly White Spindle Regenerate 1 hp per hour Pale Green Prism User blessed as 1st level cleric spell Orange Prism +2 to all saving throws Lavender & Green Ellipsoid Absorb spells 8th level or lower*** * Spells
  can only be stored by a spell caster casting them, but once placed in the stone, a spell can be used by anybody. ** After absorbing 20 levels of spells the stone burns out, turning into an inert and worthless dull grey rock. Absorption is not automatic, the user must be aware of the spell attack and must will the spell absorption. *** After absorbing 50 levels of spells the stone burns out, turning into an inert and worthless dull grey rock. Absorption is not automatic, the user must be aware of the spell attack and must will the spell absorption.
source: OSRIC_3.0_Gamemaster_Guide.pdf
