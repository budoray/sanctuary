- 2.12.2.  MAPS
- Maps do not feature in the random tables because you would
- need to prepare them in advance (frustrating!); they should ap-
- pear in hand–crafted areas rather than randomly–rolled ones.
- They are, nevertheless, valuable treasure to a clever player char-
- acter. A map could indicate the location of a treasure outside
- the dungeon, thus becoming an adventure in its own right—or
- it could not show a treasure at all, but indicate where a power -
- ful vampire lairs, or the location of a particularly fiendish trap, in
- which case it will still be of value to the party.
- Maps can be literal maps or charts where “X” marks the spot,
- but they do not need to be. A note that says “The wand is lost—I
- dropped it somewhere in the sewers” or “The Shield of Shadows
- must lie beyond the Green Portal” is a minor map of sorts.
- 2.12.3.  COIN
- Coin is the simplest type of treasure, but should still be awarded
- intelligently. OSRIC coins are heavy, and weight is a significant
- drawback if the players locate a substantial sum in copper or
- silver. Making decisions about heavy but less-valuable treasure
- becomes important at higher level.
- In an upper dungeon level, few treasures should consist of gold
- without silver or copper, or platinum without gold and silver,
- so if the dice indicate 500 gp on dungeon level 2, the GM might
- prefer to award 200 gp, 2,000 sp and 10,000 cp instead. In deep-
- er dungeon levels, copper and silver will be relatively less fre -
- quent, although successful players will still have enormous piles
- of them on their hands.
- There is no particular reason why coin should be awarded in
- round numbers; if the dice indicate 6,000 cp, you can decide
- there are 5,573 or 6,281 of them. Some GMs prefer the round
- numbers, others hate them.
- Consider adding flavour by having some alternative monetary
- systems, such as ancient coins from a previous empire, that do
- not convert to the standard coin types of your campaign on a
- 1:1 basis. In such cases the player characters will need to pay
- conversion costs, perhaps to the local money changers (a good
- reason to go to a city!).
