name: Part Water
slug: part_water
reversible: false
class: cleric
level: 6
school: Clerical Transmutation/Alteration
range: 20-ft/caster level
duration: 1 turn/caster level
area_of_effect: See below
components: V,S,M
casting_time: 1 turn
saving_throw: None
text: This spell causes water to draw apart, forming a trench. The depth and length of the water displacement is determined by the cleric's level. For each caster level, the cleric may displace an area of water 30-ft deep and 20-ft wide. The spell can affect other liquids besides water, but the more different the physical properties of the other liquid, the less the cleric may be capable of displacing.
source: wiki2_spells.txt
