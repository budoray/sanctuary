name: Holy Mace
classes: CFPR
description: 'A +1 mace with special powers vs evil creatures and the undead. The mace has a neutral good alignment and does 5d4 points of bonus damage to any evil target it strikes. Against the undead, however, the holy mace reveals its true power. When the mace strikes a demon, devil, or undead creature, a turn undead roll is made on the Turning Undead table as the wielder were a 12th level cleric. If the creature fails its roll it is immediately blasted out of existence by the holy power of the mace. Some creatures (example: skeletons, zombies, and ghouls) are automatically destroyed. Stronger undead creatures which have a numerical result instead of a “T” or “D” on the matrix get that number as a saving throw vs disruption. Even if the undead target makes its saving throw or is immune to disruption, the mace will still deal double the damage plus double the damage bonus. Sling of the Halfling (AFPRT): Grants +2 “to hit” and damage rolls, but is figured as a +1 weapon in terms of which
  creatures it can affect. Trident/Fork (AFPRT): A shorter than normal trident with a 6ft haft, usable as a melee or missile weapon but too short in this mode to be set against a charge. When the command word is spoken, the trident lengthens into a full pole arm and can be set against a charge as a normal pole arm. In either mode, the weapon is +3 “to hit” and damage. 2.13.8. MISCELLANEOUS MAGIC The enchanting of items is in no way limited to such things as rings, wands and weapons. In fact, all manner of objects can be—and have been—made magical. Hence the need for a category devoted entirely to miscellaneous magic. As a general rule, the properties of any item will only become apparent through careful and determined examination and experimentation. Very rare indeed is an object that comes with an instruction manual! Note on Books: All magical books, tomes, volumes etc. appear on cursory inspection as non-magical volumes of arcana. The only spells that will aid in distinguishing one type
  of magical tome from another are identify and wish. All other spells or powers are useless in this regard. Two wishes are required to determine the exact nature of any book, the first revealing only the general classes or characteristics most affected (but not whether for good or ill!). Most books will immediately disappear after being read, although a GM may of course decide to have a detrimental work stay with a character until a remove curse is employed.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
