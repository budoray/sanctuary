description: Ankhegs are giant, burrowing arthropods with chitinous shells.  These predators resemble a horrible mixture of grasshopper  and lobster, but they are eight feet or more in length. To make  matters worse, they can spit digestive acid. Ankhegs often lurk underground waiting to feel the vibrations  of an approaching creature, then attack it by surprise.
abilities:
- heading: Surprise and Initiative
  text: Surprise. A burrowed-in ankheg surprises on a roll of 1-3 on a  d6. This is not an original rule of the game, but matches the  original text description.
- heading: Immunities and Resistances
  text: Many-legged. An ankheg cannot be knocked prone, overborne,  or grappled.
- heading: Special Attacks
  text: 'Spit Acid.  The ankheg can spit its digestive acid at one target  within 30ft of it. It must make an attack roll against that target.  If it hits, the target takes 4d8 corrosion damage. Whether it hits  or misses, the ankheg can’t use this attack again for 12 hours. Unarmed Combat. Ankhegs can choose to overbear instead of  making a regular melee attack. If not fended off, they score  an unarmed hit with a 2+ on 1d20. Hit Mods: ATK/DEF +8/-8.  Overbear Results Mods: ATK/DEF +5/NA. Grappling attacker/ defender modifier: NA/NA. They cannot be overborne or grap- pled.'
- heading: Languages
  text: None.
