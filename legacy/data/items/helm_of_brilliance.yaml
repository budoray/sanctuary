name: Helm of Brilliance
classes: any
description: 'An ordinary appearing helm that transforms into a brightly polished silver helm encrusted with jewels when donned and the command word spoken. The gems are imbued with magic abilities. The powers and numbers of each type of gem appear below. • 10 diamonds: prismatic spray • 20 rubies: wall of fire • 30 fire opals: fireball (10d6) • 40 opals: daylight (60ft radius, useful against creatures such as vampires or orcs). The helm can be used once per round and each jewel only functions once. As long as charged gems remain, the helm also has the following powers when activated. • Holy Aura: A bluish light causing 1d6 damage per round to any undead within 30ft. • Flaming Weapon: The wearer can command any weapon they wield to become a flaming weapon (as the flaming sword, q.v.). The transformation takes 1 round and stacks with other weapon special abilities unless the weapon already flames for some other reason. • Resist Fire: Grants resistance to fire as per the cleric spell, duration
  20 rounds. Once all jewels lose their magic, the helm of brilliance transforms back into a mundane helm and all jewels crumble into worthless dust. Any gem removed from the helm also crumbles into dust, whether it is charged or discharged. If the wearer of the helm receives damage from magical fire they must save vs breath weapons. Failure indicates a catastrophic release of all remaining charges on the helm as follows: prismatic spray will hit a randomly selected target, including the wearer; wall of fire will radiate out in randomly determined directions; fireballs will centre on the wearer. The helm and its jewels are, of course, destroyed in the process.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
