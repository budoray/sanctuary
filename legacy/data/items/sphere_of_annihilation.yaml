name: Sphere of Annihilation
classes: IM
description: 'This “object” is not so much something as pure nothing, a spherical wound in reality consisting of a malignant absence of matter. Any matter from the Prime Material Plane coming into contact with the sphere is sucked into its utter blackness, instantly and irrevocably destroyed. A wish cannot restore the unfortunate victim; only the direct intervention of a deity may do so. A sphere of annihilation can be moved without touching it, using only the power of the mind. The character must roll a save vs death magic, modified by +1 for each point of intelligence over 15, to move the sphere 10ft per round plus 5ft for each point they exceeded their save. Initial control of the sphere can be attempted from as far away as 40ft and once control is gained the distance the sphere can be controlled increases to 40ft+10ft per controlling character’s level. If a control check fails the sphere slides 10ft in the direction of the controller who was attempting to move it. Controlling a sphere
  uses all of a character’s actions for that round. Control of the sphere can be challenged. All creatures attempting to gain control of the sphere roll their saves as above, and the rolls are compared. If all fail their saving throws the sphere moves 10ft toward the one who rolled the lowest number. If only one saves, they gain control of the sphere for 1 round. If more than one (or all) vying for control of the sphere of annihilation make their saving throws, the person exceeding their saving throw by the most number of points gains control. Should the contest for control of the sphere come out exactly equal, control should pass to the person with the highest intelligence score or, failing that, have the players roll d100 and give control to the random winner. The sphere of annihilation cancels most magic in the same way it absorbs matter. Therefore spells such as dispel magic and the various protections from magic have no effect on the sphere. There are, however, two exceptions. First,
  if a rod of cancellation touches the sphere, the incompatibility of the respective connections to the Negative Material Plane will cancel each other with great vigour. The resulting explosion will inflict 2d6×10 damage on everything within a 60ft radius, no saving throw allowed. Second, a gate spell has a 50% chance of destroying the sphere (roll 01–50 on d100), a 35% chance of having no effect at all (51–85), or a 15% chance (86–100) of ripping a hole into the very fabric of reality and sucking everything within 180ft of the now-destroyed sphere into the tear and depositing it on an alternate plane of existence. See also: Talisman of the Sphere.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
