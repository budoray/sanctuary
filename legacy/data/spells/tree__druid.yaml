name: Tree
slug: tree
reversible: false
class: druid
level: 3
school: Druidic Transmutation/Alteration
range: Caster
duration: 6 turns+1 turn/caster level
area_of_effect: Caster
components: V,S,M
casting_time: 5 segments
saving_throw: None
text: 'Casting this spell causes the druid''s shape to melt and twist into that of a tree, its general appearance determined by the caster. The spell is neither an illusion nor a charm: the druid is, for all intents and purposes, a tree. However, in tree shape the druid retains human senses and will be fully aware of his or her surroundings. The druid may shift back into human shape at will, thereby ending the spell. Magical detections will reveal the druid''s true form, but ordinary inspections, no matter how minute, will not.'
source: wiki2_spells.txt
