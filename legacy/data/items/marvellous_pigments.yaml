name: Marvellous Pigments
classes: any
description: Magical paints that allow the user to draw and thereby create real three-dimensional objects. The user must concentrate as they draw, and creation of an object with the pigments takes about 10 minutes. One pot of marvellous pigments is sufficient to create a 1,000 cubic ft object. Pigments can be used to create many inanimate objects such as normal weapons, armour, even food-generally objects with a value of less than 2,000 gp. The general appearance of expensive items such as gems or gold jewellery can be created with the pigments but the objects will be only be cheap costume jewellery type imitations. The pigments cannot create magical items of any sort, and they cannot create living creatures, undead, golems, or other monsters of any kind.
source: OSRIC_3.0_Gamemaster_Guide.pdf
