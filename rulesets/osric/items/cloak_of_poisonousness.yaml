name: Cloak of Poisonousness
classes: any
description: Identify spells will reveal nothing but a rather sturdy woollen cloak. This article of clothing can be handled without harm but when worn the victim is instantly slain unless they roll a save vs death. Once worn, the cloak can only be removed with a remove curse spell, which also completely destroys the cloak. Any means of resurrecting the victim must be preceded by a neutralise poison spell or be automatically unsuccessful.
source: OSRIC_3.0_Gamemaster_Guide.pdf
