name: Meteor Swarm
slug: meteor_swarm
reversible: false
class: magic-user
level: 9
school: Arcane Evocation
range: 40-ft+10-ft/level
duration: Instantaneous
area_of_effect: See below
components: V,S
casting_time: 9 segments
saving_throw: None or Half (see below)
text: Meteor-like chunks of magical fire streak from the magic user's outstretched hand, exploding into an inferno of flame when they strike the intended targets. The caster may hurl four large meteors or eight small meteors. These missiles strike the first creature in their straight-line trajectories automatically, granting no saving throw and inflicting full damage. When the meteor strikes its target, the explosion of fire may catch other creatures in its radius. These creatures receive saving throws for half damage. Large meteors inflict 10d4 hp damage and explode in a radius of 15-ft. Small meteors inflict 5d4 hp damage and explode in a radius of 71⁄2-ft. If the explosions overlap, a creature in this area is subject to damage from all the explosions, but is entitled to a separate saving throw (halving damage) for each.
source: wiki2_spells.txt
