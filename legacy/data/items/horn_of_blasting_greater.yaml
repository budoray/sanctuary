name: Horn of Blasting, Greater
classes: FPR
description: As the horn of blasting above, but damage is increased to 10d6 points, the targets are stunned for 1 round and deafened for 4d6 rounds. A save vs wands reduces damage by half and negates stunning and deafening. If this horn explodes, 20d6 points of damage are dealt to the user (no save).
source: OSRIC_3.0_Gamemaster_Guide.pdf
