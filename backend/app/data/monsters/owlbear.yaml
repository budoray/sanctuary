description: These nightmarish creatures have the body of a large bear with  the head of an owl. They are voracious eaters and possessed of  a foul temper, fighting to the death. They are typically found in  temperate forests.
abilities:
- heading: Special Attacks
  text: Hug. If an owlbear scores a natural 18 or better on a hit with  either of its paws, it has grabbed the victim in a crushing hug.  The victim takes an additional 2d8 points of blunt damage that  round and the owlbear inflicts an automatic 2d8 points every  following round until the owlbear is slain. Unarmed Combat. Owlbears cannot effectively be targeted with  grappling or overbearing attacks, and do not use these tactics. OTYUGH
