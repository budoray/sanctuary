name: Ring of Genie Summoning
classes: any
description: This powerful magic ring can call a mighty djinn from the Elemental Plane of Air to do the wearer’s bidding. The genie takes 1 round to appear and will follow the letter (not necessarily the spirit) of the wearer’s command to the best of its ability. If the genie is killed the ring crumbles into dust. This is an exceptionally powerful item and the GM may wish to limit the ring of genie summoning by giving it a limited number of charges.
source: OSRIC_3.0_Gamemaster_Guide.pdf
