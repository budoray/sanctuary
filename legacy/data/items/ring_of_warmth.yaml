name: Ring of Warmth
classes: any
description: The wearer will be completely comfortable and can maintain normal body temperature even in conditions of extreme cold. The ring also grants the ability to regenerate cold-based damage at a rate of 1 hp per turn, grants a +2 to all saving throws vs cold-based attacks, and reduces damage from cold-based attacks by -1 per die (minimum damage of 1 point per die).
source: OSRIC_3.0_Gamemaster_Guide.pdf
