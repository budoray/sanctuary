name: Bracelet of Friends
classes: CDIM
description: 'A finely-made silver charm bracelet with four charms. The wearer may key each charm to a specific person and thereafter when the charm is grasped and the keyed individual’s name spoken, that person is summoned to the wearer’s location, along with all of their equipment. The summoned person must be on the same plane as the wearer, and must willingly answer the call (the keyed individual knows who is issuing the summons). Each individual charm has 1 use and disappears afterwards, if separated from the bracelet the charm becomes worthless. Bracers of Archery, Greater (AFPRT): This pair of items grants proficiency in the use of any bow or crossbow. If the wearer is already proficient in the use of a bow they will gain +2 to attack and +1 damage when using that weapon. Bracers of Archery, Lesser (AFPRT): Similar to the greater bracers of archery, but these only grant +1 “to hit” and no damage bonus for wearers already proficient with a bow or crossbow.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
