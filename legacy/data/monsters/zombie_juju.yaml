name: Zombie, Juju
frequency: very rare
no_encountered: 1d6
size: medium
alignment: neutral (evil)
move: 90ft
armour_class: 6 [14]
hit_dice: 3+12hp
melee_attacks: 1 strike (2d6+1)
senses: Infravision 60ft
lair_chance: Nil
intelligence: low (5-7)
morale: N/A
loot: Nil
experience: 115 +4/hp
description: Juju zombies are a particularly powerful type of zombie creat - ed by foul magics different from the normal means of creating  zombies. Their eyes glow with a hellish light because they are  “powered” by the negative material planes, but otherwise they  resemble ordinary zombies.
abilities:
- heading: Immunities and Resistances
  text: Turned as Undead. Juju Zombies are turned as type 9 Undead. Immune to Mundane Weapons.  The juju zombie is immune to  piercing, blunt, or cutting damage, unless the weapon causing  that damage is magical. Magic piercing or blunt weapons do  half damage, although magic slashing weapons do full dam - age. Immunities. This creature is immune to all mind control (includ - ing charm) and hold spells. It cannot be affected by illusions,  cold, electricity, sleep, gases, poison, or disease. Resistance (Fire).  Fire damage does only half damage to juju  zombies.
- heading: Special Features
  text: Climbing. Juju zombies climb as a thief, with a 96% chance of  success.
- heading: Special Attacks
  text: 'Uncanny Combat Abilities. Juju zombies attack as a 6HD monster. Ranged Weapons. Juju zombies can attack with missile weapons. Unarmed Combat. Juju Zombies can be targeted with grappling  and overbearing attacks (they do not initiate them, but if you  want to grapple, they will grapple you right back). They do not  suffer temporary damage, so this isn’t a winning strategy. If not  fended off, they score an unarmed hit with a 2+ on 1d20. Hit  Mods: ATK/DEF +6/-6. Overbear Results Mods: ATK/DEF +0/-0.  Grappling Result Mods: ATK/DEF +0/-0. MONSTERS Achaiyerai .......................................................................88 Aerial Servant .................................................................88 Al-Mi’raj ...........................................................................89 Aluu-Demon (Half-Demon) ....................................... 124 Animated Object ............................................................89 Ankheg ............................................................................90
