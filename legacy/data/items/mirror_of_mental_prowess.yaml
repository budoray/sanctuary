name: Mirror of Mental Prowess
classes: M
description: 'A powerful scrying device in the form of a 5ft tall and 2ft wide mirror. Through the use of command words, the following powers are available. • Mind Reading: If the owner is within 25ft of the mirror, he can read the thoughts of any living creature reflected therein as with the magic user spell ESP regardless of whether they understand the being’s language. • Distance Viewing: The owner can view distant locations as with a clairvoyance spell. This includes other planes of existence if the user is familiar with them. • Portal: The mirror can be used as a direct portal to locations seen in the mirror. The user merely steps through the mirror and into the other location. Any companions of the owner may accompany him or her. An invisible door remains open for 24 hours, until the owner steps back through, or until the owner uses the command word to close it. Any being in the presence of the invisible portal with an intelligence of 12 or better has a chance of detecting it with
  the same probability of detecting a scrying attempt. • Sage Advice: Once a week the mirror can accurately answer a short question about any creature looking into the mirror.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
