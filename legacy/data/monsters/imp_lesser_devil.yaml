name: Imp (lesser Devil)
frequency: very rare
no_encountered: '1'
size: tiny
alignment: lawful evil
move: 60ft; 180ft flying (AA:V)
armour_class: 2 [18]
hit_dice: 2+2
melee_attacks: Tail (1d4 + poison)
senses: Infravision 60ft
lair_chance: Nil
intelligence: average (8-10)
morale: 60
loot: Cache 1
experience: 275 +3/hp
description: 'Imps are formed from soul worms, created by archdevils to  spread evil through service to a lawful evil priest or sorcerer.  They are very rarely encountered on the Prime Material Plane,  but are commonly seen in the lower planes. They have only av- erage intelligence, but in their role as familiars they are able to  rely on the knowledge of their archdevil master. When serving as a familiar to an evil magic-user or cleric, the  Imp imparts the following benefits to its master: Constant  full-sensory telepathic contact between the Imp and the master  up to 1 mile in range. If the master is within 25ft of the imp, the  former gains the Imp’s 25% magic resistance and its regenera - tion ability (1 hp/round). If the master is within 1 mile of the Imp,  the former gains an additional level of ability. However, if the  imp is killed, the master immediately loses four ability levels.'
abilities:
- heading: Immunities and Resistances
  text: Magic Resistance (25%).  Any magic spell or effect has a 25%  chance (at caster level 11) to have no effect on this creature;  but if it does, the magic takes full effect. Immune to Mundane Non-Silver Weapons.  This creature is im - mune to piercing, blunt, and slashing damage from weapons  and unarmed attacks, unless the weapon causing that damage  has a magical bonus of +1 or more, or is a silver weapon. Other Immunities. Imps are also immune to cold, fire, and elec - trical damage.
- heading: Special Features
  text: 'Polymorph. Imps are created with the innate ability to polymorph  self. The GM should choose two of the following forms (giant  rat, goat, large spider, raven). In their polymorphed form, imps  are limited to that animal’s natural attacks.  Spell-Like Abilities. At Will: detect good (as the 2nd level magic-user spell), detect  magic (as the 1st level magic-user spell), and invisibility (as the  2nd level magic-user spell).  1/day: Once per day, an imp can cast a suggestion (as the 3rd  level magic-user spell). 1/Week: Once per week it can commune with the lower planes  (6 questions maximum, otherwise as the 5th level cleric spell).'
- heading: Special Attacks
  text: 'Poison Sting.  In their natural form, imps attack with their poi - son–tipped tail stingers. Any victim struck must save vs poison  or die. Unarmed Combat. Imps can be targeted with grappling or over - bearing attacks, although they do not use these tactics. If not  fended off, they score an unarmed hit with a 2+ on 1d20. Hit  Mods: ATK/DEF +4/-4. Overbear Results Mods: ATK/DEF -4/+4.  Grappling Result Mods: ATK/DEF -3/+3.'
