name: Thunder Spear
classes: AFPR
description: A +2 melee weapon with a blue steel head. When hurled as a missile the spear becomes a bolt of blue lightning and incurs no “to hit” penalty for up to 70ft. If the spear strikes its target it inflicts 1d6+2 points of physical damage and 22 points of electrical damage, no save allowed. The lightning bolt will also reflect back half the distance it was thrown, damaging any creature within 5ft of the bolt for 10 points of damage, saving throw vs aimed magic items for half damage allowed. These weapons get their name from the sound of far away thunder heard when they are thrown. Thunder spears are usually found in pairs.
source: OSRIC_3.0_Gamemaster_Guide.pdf
