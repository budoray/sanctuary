name: Polymorphing
classes: DM
description: By pointing the wand and giving a command, the wielder may fire a crackling beam of pure black energy at a target. If the victim fails a saving throw vs wands, they are affected as if by the magic user spell polymorph other, to transform into any creature the wielder desires. Instead, the wielder may strike a being with the wand, which surrounds the subject in flickering black shadows and causes him or her to be affected as if by the magic user spell polymorph self. In this case, the wielder pronounces the name of the creature into which the victim will transform as they touch the opponent. A saving throw is permitted, but a willing subject may choose to forgo the save. This wand cannot be recharged.
source: OSRIC_3.0_Gamemaster_Guide.pdf
