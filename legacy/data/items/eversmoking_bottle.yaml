name: Eversmoking Bottle
classes: any
description: This item looks exactly like an efreet bottle (see above) but, when unstoppered, thick grey smoke begins to issue forth from the bottle. Vision within 50ft of the bottle will be impossible in 1 round, and each consecutive round the radius of the smoke cloud increases 10ft until a maximum of 100ft has been reached. The smoke cannot be dispelled until the bottle is restoppered and the command word is spoken. The smoke dispels in about an hour, although a moderate wind will disperse the smoke in 5 rounds, and a gust of wind spell will remove it in 1 round.
source: OSRIC_3.0_Gamemaster_Guide.pdf
