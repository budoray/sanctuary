# OSRIC 3.0 starting funds, extracted from Player Guide 1.4.2.1.
# Values are expressed as "NdS" dice plus a multiplier.
# Minimums are raised slightly so a new hero can afford their class starter kit
# and still have a few gold pieces left for a torch, a potion, or a mercenary.
assassin:    {dice: "2d6", multiplier: 10, min_gold: 45, unit: "gp"}
cleric:      {dice: "3d6", multiplier: 10, min_gold: 55, unit: "gp"}
druid:       {dice: "3d6", multiplier: 10, min_gold: 45, unit: "gp"}
fighter:     {dice: "5d4", multiplier: 10, min_gold: 130, unit: "gp"}
illusionist: {dice: "2d4", multiplier: 10, min_gold: 55, unit: "gp"}
magic_user:  {dice: "2d4", multiplier: 10, min_gold: 55, unit: "gp"}
monk:        {dice: "5d6", multiplier: 1,  min_gold: 30, unit: "gp"}
paladin:     {dice: "5d4", multiplier: 10, min_gold: 130, unit: "gp"}
ranger:      {dice: "5d4", multiplier: 10, min_gold: 90, unit: "gp"}
thief:       {dice: "2d6", multiplier: 10, min_gold: 50, unit: "gp"}
