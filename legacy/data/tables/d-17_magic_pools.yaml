id: d-17
name: MAGIC POOLS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- In order to learn the secret of a magic pool, adventurers must actually enter the water.
- D20 RESULT
- 1–8 Roll 1d20. Pool turns gold pieces into platinum pieces (1–12) or lead (13–20); after doing this once, pool is non-
- magical.
- 9–15
- Characters in pool will either lose (01–50 on d100) or gain (51–00) 1 point from a randomly–determined attribute.
- 'Roll 1d6: 1=strength, 2= dexterity, 3= constitution, 4=intelligence, 5= wisdom, 6=charisma. One time only effect, each'
- character checked separately for loss or gain and affected characteristic.
- 16–17 Talking pool, will grant 1 wish to any characters of like  alignment and damage all others (1d20 points). Wish must be
- 'used within 24 hours. Roll 1d20 for pool’s  alignment: 1–6 LG; 7–9 LE; 10–12 CG; 13–17 CE; 18–20 TN.'
- 18–20
- 'Transporter pool. Roll 1d20: 1–7 back to surface; 8–12 elsewhere on level; 13–16 1 level down; 17–20 many miles'
- away for wilderness or outdoor adventure. This one can be especially fiendish if not all characters in the party are
- standing in the pool.
