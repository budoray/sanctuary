name: Pearl of the Sirines
classes: any
description: 'An expensive-appearing pearl which, when grasped in the hand or held to the breast, grants the ability to breathe underwater, swim at movement rate 60ft, and speak or cast spells underwater without penalty. Periapt of Health (any) : A magical necklace granting immunities to all diseases, including magical or supernatural diseases.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
