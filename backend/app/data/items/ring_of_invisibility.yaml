name: Ring of Invisibility
classes: any
description: When donned, this ring grants the wearer the ability to become instantly invisible at will as per the 2nd level magic user spell. There is a 10% chance the ring has the secondary effect of making the user inaudible as well. Just as attacking while invisible negates invisibility, so does speaking while inaudible break the inaudibility feature.
source: OSRIC_3.0_Gamemaster_Guide.pdf
