name: Mask of the Skull
classes: AIMT
description: 'An ivory mask skilfully carved to resemble a human skull. Once per day the wearer can command the mask to attack a target up to 50ft away. The mask attacks with the same hit probability of the wearer and the target must save vs death magic or be slain on the spot. Even if the target makes their saving throw they must still take 3d6+13 points of damage. After resolving its single attack the mask flies back to the owner. The mask of the skull is AC 0 [20], hp 10, and must be worn for a minimum of one hour before it can be commanded to attack. Mattock of the Titans (any giant): This sturdy digging tool is 10ft long and can only be properly wielded by creatures at least 20ft tall or long. In the hands of such a being the mattock can dig earth or knock down earthen works such as ramparts, taking 10 minutes to move 10 cubic ft of earth. It can also serve as a weapon, attacking as a warhammer and dealing 4d6 points of base damage on a successful hit. Maul of the Titans (any giant):
  An 8ft long mallet which serves as a +3 weapon (base 1d10 damage) and can be used to attack inanimate objects, such as a castle wall. The maul can break through a mortared–stone structure in 1 turn, or an un–mortared one in 1 round. The maul of the titans requires a minimum strength of 18 to wield properly or else the user suffers a -4 to attack rolls.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
