name: Holy Sword
classes: FPRT
description: 'In the hands of anyone but a paladin, this is a +2 weapon in every way, with no additional features. In the hands of a paladin the true power of this holy weapon is revealed, acting as +5. The holy sword will also inflict +10 damage against all chaotic evil opponents, dispel magic with a 5ft radius as if the paladin were casting the spell as a magic user equal to their own experience level, and create 50% magic resistance in a 5ft radius on command. Note the +10 damage bonus is instead of, not in addition to, the sword’s natural +5 damage. Keenblade (AFPRT): This is a +1 blade regarding “to hit” and damage bonuses, but the keenblade is a +3 weapon for purposes of determining who or what it can hit. When wielded in combat and a high “to hit” roll is thrown, this powerful blade will sever a random extremity or appendage, including the neck/head. When used in combat, the GM should assign a value to each extremity and dice the result randomly. A lizard man, for example, would have
  six extremities and a successful hit to sever could be resolved by assigning a value of 1 to the neck, 2 to the left arm, 3 to the right arm, 4 to the left leg, 5 to the right leg, and 6 to the tail; then rolling 1d6 and observing the result. When using the keenblade in combat, the chances of severing some appendage are as follows: OPPONENT IS: NATURAL (UNADJUSTED) “TO HIT” ROLL Medium or smaller 18–20 Large 19–20 Solid metal or solid stone 20 The keenblade is an exception to the glowing magic sword rule. The wielder of the sword can decide whether the blade will shed no light at all, dim light in a 5ft radius circle, light in a 15ft circle, or a bright light as a light spell with a 30ft radius. Luck Blade (AFPRT): In addition to +1 to AC and damage, the luck blade also grants its wielder +1 to all saving throws. Additionally, the luck blade grants 1d4+1 wishes, though the blade does nothing to communicate the number of wishes it holds to its owner. Magebane (AFPRT): This weapon will always
  function as at least a +1 sword. When fighting against magic users, spell-casting monsters, monsters with spell-like abilities, gated or extra-planar creatures, conjured monsters, or summoned monsters, the sword will be +2 “to hit” and damage. Note that a non-magical creature which is granted spell casting powers by artificial means, a human fighter wearing a ring of spell storing for example, does not qualify as magic-using. Nine Lives Stealer (AFPRT): This weapon is +2. On a “to hit” roll of natural 20 the nine lives stealer will draw the life force from its target, slaying it instantly. This ability can be used 9 times before it is lost forever, though the sword will retain its +2 bonus thereafter. The victim is allowed a saving throw vs magic and, if successful, there is no effect and the sword does not expend a charge. Trollbane (AFPRT): This weapon is normally +1, but gives a +3 bonus against creatures that regenerate hit points, including those that do so by magical means such as
  a ring of regeneration. Vampire Blade (AFPRT): This +2 sword allows the wielder to drain life force from the target. When a natural 20 is rolled the target loses a level of experience along with the appropriate hit die and abilities, as if they had been struck by an undead creature such as a wraith. The absorbed hit points will cure any damage the wielder of the sword has sustained, up to their normal hit point total. Vorpal Blade (AFPRT): An even deadlier variant of the keenblade, the vorpal blade is a +3 weapon and on a high attack roll will always decapitate its target. (Not all opponents have heads, nor is every opponent necessarily slain by decapitation.) To determine the chance of this, consult the table below. OPPONENT IS: NATURAL (UNADJUSTED) “TO HIT” ROLL Medium or smaller 17–20 Large 18–20 Solid metal or solid stone 19–20 Werebane (AFPRT): This weapon is normally +1, but gives a +2 bonus against: were-creatures, any creature capable of assuming another creature’s form (such as
  druids or vampires), or a creature which has been polymorphed or shape changed. Wyrmbane (AFPRT): The sword is normally +1, but gives a +4 against any reptile including but not limited to: dinosaurs, dragons, hydras, lizards, lizard men, snakes, and wyverns. 2.13.6.1. UNUSUAL MAGIC SWORDS OSRIC defines an “unusual” sword as one which is both selfaware and intelligent. Unusual swords manifest their intelligence in a variety of ways, but they all share the following basic traits: intelligence of 13–18, the ability to communicate, an alignment, a variety of powers, perhaps a special purpose, and an ego. This section will allow the GM to create unusual swords for use in their campaign. At first glance, a perusal of the various abilities special swords may possess may make them seem like unbalancing items. Worry not. A properly-played intelligent sword can be a mixed blessing and may often turn out to be far more trouble than it is worth. TABLE 2.13.6.1A: SWORD INTELLIGENCE AND CAPABILITIES
  D100 INT CAPABILITIES COMMUNICATION 01–75 None None None 76–83 13 1 minor power Low Empathy 84–89 14 2 minor powers High Empathy 90–94 15 2 minor powers Speech 95–97 16 3 minor powers Speech 98–99 17 3 minor powers Speech 00 18 3 minor powers and 1 major power Telepathy Low Empathy: Wielder will feel heat, cold, or tingling from sword hilt and an urge to act when ability functions. High Empathy: Wielder will feel emotional emanations from the sword. Speech: Sword will speak its alignment tongue plus 1 or more additional languages determined according to Table 2.13.6.1g. Telepathy: The sword can communicate telepathically with its owner in any language, over any distance, and may broadcast telepathic communication to all creatures within 30ft, in any language of its choice. The sword understands all spoken languages and can read non-magical text. TABLE 2.13.6.1B: SWORD ALIGNMENT Intelligent swords will always have an alignment. Use the table below to generate this randomly, if needed. Holy
  swords are always lawful good. D100 ALIGNMENT D100 ALIGNMENT 01–05 Chaotic Good 31–55 Lawful Good 06–15 Chaotic Neutral 56–60 Lawful Neutral 16–20 Chaotic Evil 61–80 True Neutral 21–25 Neutral Evil 81–00 Neutral Good 26–30 Lawful Evil Any neutral sword will permit itself to be wielded by a character matching the non-neutral part of sword’s alignment (so a Chaotic Good or Lawful Good character could wield a Neutral Good sword, for instance). True Neutral swords will allow themselves to be wielded by any character with “Neutral” in their alignment (so CN, LN, NG, or NE as well as TN). Note: Except for neutral-aligned as swords noted above, any character attempting to hold, draw or use an unusual sword of differing alignment will incur damage equal to the sword’s ego (see Table 2.13.6.1g). TABLE 2.13.6.1C: SWORD MINOR POWERS Minor powers only function when the weapon is drawn and the owner is concentrating on the desired power. A sword can only perform one special ability at a time, and the
  sword cannot fight and perform an ability. If the same ability is rolled more than once, double or triple the range of ability as appropriate. D100 MINOR POWER 01–11 Detect evil/good within 10ft radius 12–22 Detect gold or silver within 20ft radius 23–33 Detect shifting rooms or walls within 10ft radius 34–44 Detect sloping passages within 10ft radius 45–55 Detect traps 10ft within radius 56–66 Detect type and number of gems within 5ft radius 67–77 Detect magic within 10ft radius 78–82 Detect secret doors within 5ft radius 83–87 See invisible within 10ft radius 88–92 Locate object with 120ft range 93–98 Roll twice on this table, ignoring results 93–100 99–00 Roll once on major power table instead TABLE 2.13.6.1D: SWORD MAJOR POWERS To use a sword’s major power, the weapon must be drawn and the owner concentrating on the desired effect. Saving throws for major powers are permitted as applicable. If the same power is rolled more than once, double or triple the range of ability as appropriate.
  D100 POWER 01–07 Charm person on contact, thrice per day 08–15 Clairaudience 30ft range for 1 round, thrice per day 16–22 Clairvoyance 30ft range for 1 round, thrice per day 23–28 Determine direction and depth, thrice per day 29–34 Esp 30ft range for 1 round, thrice per day 35–41 Flying for 1 hour per day, 120ft move 42–47 Heal, once per day 48–54 Illusion (as per the wand of illusions), twice per day D100 POWER 55–61 Levitate up to 600 lbs for 1 turn, thrice per day 62–67 Strength as the spell, once per day (wielder only) 68–75 Telekinesis up to 250 lbs for 1 round, once per day 76–81 Telepathy 60ft range, twice per day 82–88 Teleport as the spell, 600 lbs max, once per day 89–94 X-ray vision 40ft range for 1 turn, twice per day 95–97 Roll twice, ignoring this result 98–99 Player may choose 1 power 00 Roll on special purpose table SPECIAL PURPOSE SWORDS The purpose of a sword must always suit its alignment. Killing must be restricted to evil if the sword is of good alignment (example:
  a good-aligned sword which rolls a result of “21–30 slay clerics or druids” on the following table will only seek to kill evil clerics). Good swords dedicated to slaying monsters will always slay neutral or evil monsters, while evil swords dedicated to slaying monsters will always slay neutral or good monsters. TABLE 2.13.6.1E: SPECIAL PURPOSE D100 PURPOSE 01–10 Defeat good or evil 11–20 Defeat law or chaos 21–30 Slay clerics or druids 31–40 Slay diametrically opposed alignment* 41–50 Slay fighters, paladins or rangers 51–60 Slay magic users or illusionists 61–90 Slay non-human monsters 91–00 Slay thieves or assassins * The True Neutral version of this sword would seek to promote and maintain balance by defeating beings of extreme alignments TABLE 2.13.6.1F: SPECIAL POWER The special power generated by this table will only work to forward pursuit of the sword’s special purpose. The listed power manifests itself on a hit with the weapon unless the target makes a saving throw vs magic. D100
  POWER 01–10 Blindness for 2d6 rounds 11–15 Cause disease as the spell (evil aligned swords only) 16–25 Confusion for 2d6 rounds 26–30 Disintegrate 31–35 Dispel magic (single-target) 36–55 Fear for 1d4 rounds 56–65 Insanity for 1d4 rounds 66–80 Paralysis for 1d4 rounds 81 Petrifaction 82–90 Silence for 1d4 rounds 91–00 Slow for 2d6 rounds TABLE 2.13.6.1G: NON-ALIGNMENT LANGUAGES SPOKEN BY SWORD Languages should be carefully selected by GM to reflect the purpose of the sword and its abilities. D100 NUMBER OF LANGUAGES 01–40 1 41–70 2 71–85 3 86–95 4 96–99 5 00 6 TABLE 2.13.6.1H: SWORD EGO This is the final step in the creation of an intelligent sword. Each attribute the sword possesses is worth ego points, which are totalled to provide an ego rating for the weapon. The ego and intelligence of a weapon are a combination of factors which can lead to the player and their unique weapon struggling for dominance (detailed below). When using the chart below, round 1/2 points upward. ATTRIBUTE EGO
  POINTS Each + of Sword* 1 Each Language Spoken 1/2 Each Major Power** 2 Each Minor Power** 1 Special Purpose 6 Telepathic Ability 2 * A +1 sword has 1 ego point but if it has a second, higher bonus, those points are added. Example: a trollbane would have 1 ego point for its basic bonus, plus 3 more for its higher bonus vs regenerating creatures for a total of 4 ego points. Swords with additional powers but no higher bonuses, such as a nine lives stealer , double their bonuses for determining ego. The nine lives stealer, to return to that example, would have 4 ego points. ** For double abilities, double ego points. If triple ability, triple the ego points. A BATTLE OF THE WILLS: SWORDS VS CHARACTERS Each unusual sword has a personality score, determined by adding its intelligence score to its ego points. These swords will be very conscientious in following their alignment and if the sword owner is not, a personality conflict arises. If the sword has a substantial ego, 19 or higher, the
  weapon will consider itself superior to its wielder and if they do not agree with the sword’s decisions a personality conflict will arise. A player character’s personality is determined by the formula: Character Level+Intelligence+ Charisma = Personality Score. This score will be modified by damage they have taken, reducing Personality Score by 1 point for each group of hp equivalent to the character average hp per level. For example, Paula the Paladin is 8th level with a constitution score of 15 (+1 hp bonus per die) and 54 total hp. Average hp per level are 54 ÷ 8 = 6.75 and results are rounded off to 7. For every 7 hp of damage Paula sustains in combat, her personality level is reduced by 1. Whenever personality conflict occurs, the sword will struggle with the player for dominance. The more often the conflict, the greater the struggle and the more unreasonable the demands the sword will make before being mollified. Such a sword might insist the player fight a foe they would prefer
  to avoid or parley with—and perhaps seek to bring a fight about, calling out to reveal the character’s hiding place, or shouting insults amidst delicate negotiations. In addition, some swords might insist on gemstones or filigree platinum inlay being added to their blade or pommel, or demand a scabbard made from the hide of a dragon or demon. If the personality score of the sword should ever become greater than that of the wielder, the sword will be able to dominate the player. The sword will be able to force any or all of the above upon the unfortunate player and, in addition, may refuse to strike a particular foe, or turn a swing so it strikes a comrade or even the sword’s own wielder. The above should be carefully adjudicated by the GM. A holy sword with a powerful personality in the hands of a dedicated paladin would be a dynamic force for good. A neutral good sword with a powerful personality in the hands of the same character might argue with the paladin constantly about how best
  to approach a situation. An especially dominant or evil sword might even seek to pass into the possession of a weaker character, in order to more completely dominate him or her and be better able to seek its own ends. Unusual magic swords are like other creatures with a large ego: they will seek to become a force to be reckoned with in their world by being heavily involved in all party activities and especially in combat. These weapons will also feel a strong sense of rivalry with other powerful magic weapons within 60ft and will attempt to lead their wielder into dealing with the rival as the sword’s alignment and the alignment of the rival dictates. A chaotic evil sword would seek the destruction of the rival weapon, but a lawful good sword would seek to rescue and recruit a rival weapon to serve its own cause. Swords of unusual nature are never completely dominated or silenced. Even if greatly outweighed by the owner’s personality the sword will be quick to inject its opinion into any
  discussion, always attempting to gain influence over the player and their companions. GMs should be ready to play the personality of these swords to the (ahem) hilt, enforcing the quirks and selfish demands of the weapon upon the player at every chance. Play this sword as if it is your very own character, an especially greedy and egotistical one, and strive to the utmost for every gain you can garner for the sword. The role-playing possibilities are endless. 2.13.7. MISCELLANEOUS WEAPONS Like swords, miscellaneous weapons add their bonus to both the “to hit” probability and damage die rolls. Weapons from the table which are not self-explanatory (e.g. a simple mace +1) are detailed here. Magic arrows that hit their intended target are destroyed; those that miss have a 50% chance of being broken or otherwise rendered unusable. Magic hand axes and hammers can be hurled up to 30ft with the benefit of the attack bonus but losing the damage bonus. Magic spears may be used as either melee or
  missile weapons. When thrown at a very strong (18.99) or very massive creature, there is a 50% chance the spear will break. Intelligent creatures, if struck by the thrown spear, have a 70% chance of using it against the attacker if struck by the weapon, or 25% likely to attempt to break the spear (spear must save vs a crushing blow). Unintelligent creatures are 25% likely to attempt to break the spear. Missile weapons (pulled bows, crossbows, slings, etc.) grant their “to hit” and damage bonus to missiles launched from them. Bonuses from magic ammunition are cumulative with bonuses from enhanted missile weapons. Arrow of Slaying (AFPRT): A +3 arrow particularly deadly to a certain type of creature. There is always some mark, usually a rune or pictograph, to denote the type of target the arrow will instantly slay on a successful attack. A chart is included for random determination but the GM is advised to modify the chart to fit their unique milieu. One should note the type can be as general
  as “humanoid” or as specific as “hobgoblin.” D100 RESULT 01–02 Clerics 03–04 Demi-humans 05–06 Demons 07–08 Devils 09–10 Dinosaurs 11–12 Dragons 13–14 Druids 15–16 Dwarfs 17–18 Elementals 19–20 Elves 21–22 Ettin 23–24 Fighters 25–26 Ghouls 27–28 Giants 29–30 Gnolls 31–32 Gnomes 33–34 Goblins D100 RESULT 35–36 Golems 37–38 Griffons 39–40 Halflings 41–42 Harpies 43–44 Hell Hounds 45–46 Hippogriffs 47–48 Hobgoblins 49–50 Humanoids 51–52 Humans 53–54 Hydras 55–56 Illusionists 57–58 Kobolds 59–60 Liches 61–62 Lizard Men 63–64 Lycanthropes 65–66 Magic Users 67–68 Mammals D100 RESULT 69–70 Medusae 71–72 Mummies 73–74 Naga 75–76 Ogres 77–78 Orcs 79–80 Paladins 81–82 Rangers 83–84 Reptiles 85–86 Skeletons 87–88 Spiders 89–90 Thieves 91–92 Troglodytes 93–94 Trolls 95–96 Undead 97–98 Vampires 99–00'
