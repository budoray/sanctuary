name: Robe of Stars
classes: IM
description: Dark-coloured robes embroidered with silver or white stars. This magical garment allows the wearer, and everything they are wearing or carrying, to enter the Astral Plane. The robes also grant a +1 bonus to all saving throws. Last, the wearer can use up to 6 of the embroidered stars as +5 darts and can throw them as if proficient in their use. A dart so used disappears after the attack is resolved.
source: OSRIC_3.0_Gamemaster_Guide.pdf
