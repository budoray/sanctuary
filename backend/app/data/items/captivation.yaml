name: Captivation
classes: CDIM
description: With the expenditure of 1 charge, all monsters and characters within a 20ft radius are charmed by the wielder for 1 turn so long as they are at least minimally intelligent. All charmed beings will hold nothing but respect and awe for the wielder, and will seek to please him or her by doing nearly anything short of harming themselves or violating their alignment.
source: OSRIC_3.0_Gamemaster_Guide.pdf
