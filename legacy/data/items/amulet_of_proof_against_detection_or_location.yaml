name: Amulet of Proof Against Detection or Location
classes: any
description: This amulet provides protection against all forms of scrying. Thus spells such as clairvoyance or clairaudience, devices such as crystal balls, and mental or magical powers such as ESP or telepathy (or, in fact, anything short of consulting a major extra-planar power) are completely ineffective in locating its wearer.
source: OSRIC_3.0_Gamemaster_Guide.pdf
