id: 2.13.1j
name: SPELL  SCROLLS
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D20 RESULT VALUE (GP)
- 01–03 Cleric 300/level
- 04–05 Druid 300/level
- 06–07 Illusionist 300/level
- 08–20 Magic User 300/level
- Spells scrolls contain 1d4 spells.
- Roll independently for each
- spell. Note that the “too high
- level” is treated differently for
- the two higher rolls on the fol -
- lowing table.
