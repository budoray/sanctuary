name: Detecting Traps and Secret Doors
classes: any
description: The wielder of this wand may choose, each round, to detect traps (range of 30ft) or a secret door (range of 15ft). The wand will vibrate and point to the desired object. Each round of use requires 1 charge, and it is rechargeable.
source: OSRIC_3.0_Gamemaster_Guide.pdf
