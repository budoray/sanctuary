name: Uduk (bar-Igura)
frequency: uncommon
no_encountered: 1d3 or 1d6 (in the Abyss)
size: medium
alignment: chaotic evil
move: 90ft; 150ft in trees
armour_class: -3 [23]
hit_dice: 6+6
melee_attacks: 2 claws (1d6) and 1 bite (2d6)
senses: Infravision 60ft
lair_chance: 10%
intelligence: very (11-12)
morale: 80
loot: Hoard 3
experience: 1,725 +10/hp
description: The uduk, or the “jumping demon”, looks much like an orang– utan with a horribly twisted face. Its hands and feet are taloned  and have 6 digits each. The uduk can move on foot along the  ground, but they excel at swinging through areas of dense foli - age. They can also jump up to 40 feet in a single bound. They have a natural ability to change their colouration to match  their surroundings, which takes one melee round.  Uduk do not like the company of other demons, and generally  are found only with others of their ilk. If other kinds of demons  are present, uduk will bully weaker demons in order to under - mine their superiors.
abilities:
- heading: Immunities and Resistances
  text: 'Magic Resistance (45%).  Any magic spell or effect has a 45%  chance (at caster level 11) to have no effect on this creature;  but if it does, the magic takes full effect. Damage Resistances (all half damage): Cold, Electricity, Fire, Poi- son (including gases).'
- heading: Special Features
  text: 'Spell-Like Abilities. At Will: darkness (10ft radius), fear (as the 4th level magic-user  spell), create water (as the 1st level cleric spell), detect illusion  (as the 1st level Illusionist spell), detect invisibility (objects only,  otherwise as the 2nd level magic-user spell), dispel magic (as  the 3rd level magic-user spell), entangle (as the 1st level druid  spell), plant growth (as the 3rd level druid spell), telekinesis (as  the 5th level magic-user spell, up to 250 lbs), or gate in anoth- er uduk (25% chance of success).  2/day: change self (as the 1st level illusionist spell), invisibility  (as the 2nd level magic-user spell), and spectral force (as the  3rd level Illusionist spell). Unarmed Combat.  Bar-Igura demons can make grappling or  overbearing attacks. If not fended off, they score an unarmed  hit with a 2+ on 1d20. Hit Mods: ATK/DEF +6/-6. Overbear Re - sults Mods: ATK/DEF +1/-1. Grappling Result Mods: ATK/DEF  +0/+0. DEVILS The primary inhabitants of the planes
    of Hell are the devils.  They are the champions of lawful evil, and are the implacable  foes of chaotic demonkind and all servants of good. Devil society is organised into a strict hierarchy, which is never  compromised for fear of retribution from the archdevils, who  rule the planes of Hell. Nevertheless, squabbling and rivalries  are common amongst devils. Amongst the archdevils them - selves there also exists a hierarchy of barons, dukes, marquis - es, and princes—cause for considerable rivalry and jealousy. All devils can move between the various planes of Hell, although  this usually requires permission from the archdevil who rules the  particular plane. Devils may also move at will to Gehenna, Hades,  and Acheron. Similarly, they can also travel to the Astral Plane,  but this is rare. Devils are not allowed to enter the other planes  (e.g. the Prime Material) without a proper summoning, a gate  spell, or the invocation of their secret name (if they have one). All devils of a certain
    rank possess special, magical abilities  which may vary according to individual type. They can use these  abilities at will one at a time. These abilities are: animate dead  (as the 5th level magic-user spell), charm person (as the 1st level  magic-user spell), fear (effect varies, as the 4th level magic-user  spell), know alignment (as the 2nd level cleric spell), spectral force  (as the 3rd level illusionist spell), suggestion (as the 3rd level  magic-user spell), teleport (no chance of error, otherwise as the  5th level magic-user spell), and summoning other devils (varies,  as the 3rd level magic-user spell monster summoning I. All devils have infravision and may understand and communi - cate in any language. Only the material form of a devil may be killed. To actually slay  a devil one must do so in the planes of Hell or a neighbouring  lower plane. If its material form is slain, a devil must return to  its home plane in Hell for nine decades of servitude as a lemure  before it
    will resume its former status. Once combat is joined with devils, they can never be subdued.  In dire circumstances the major devils and archdevils may be  willing to negotiate. Lesser devils will madly fight to the death.  If it is to their advantage, devils can split their attacks among 2  or more targets. Devils are exceptionally conscious of any kind of laws or con - tracts binding them to certain behaviour, and are profoundly  adept at exploiting hidden loopholes. Negotiating with them  can be quite tedious as every minute detail and exigency must  be properly accounted for. Just as when summoning a demon, proper inscription of a mag- ical circle of protection is necessary for the conjurer’s safety  when attempting to summon a devil. These circles are type-spe- cific, with more powerful devils requiring proportionately more  complex and expensive circles. Devils are also repulsed by good  artifacts. Devils are susceptible to attack as noted in the table below; ATTACK FORM DAMAGE
    ROLLED Acid Full damage Cold Half damage Electricity (lightning bolt) Full damage Fire (dragon breath, fireball) None Gas, poisonous (cloudkill) Half damage Iron weapons No additional damage Magic missile Full damage  Poison Full damage Silver Full damage (according to  normal weapon type)'
