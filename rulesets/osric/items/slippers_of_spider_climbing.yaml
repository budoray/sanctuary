name: Slippers of Spider Climbing
classes: any
description: 'Supple footwear that grants the ability for the wearer to climb all surfaces and even move upside down across ceilings at a rate of 20ft. The wearer is “hands free” when climbing with the slippers. Any condition which would make normal walking on a horizontal surface hazardous, e.g. ice, grease, or oil of slipperiness, will render the slippers useless. The slippers can be used 10 minutes cumulative per 24 hour day. Scabbard of Keen Edges (AFPRT): This weapon scabbard will magically change size to fit an edged weapon as small as a dagger or as large as a two–handed sword. Thrice per day the scabbard can cause the weapon normally carried within it to gain +2 to attack and damage for 10 combat rounds; during the enchantment such a weapon will cause double damage on an unmodified attack roll of 19 or 20.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
