name: Broom of Flying
classes: M
description: This broom allows the user to fly up to 9 hours cumulative per day. Carrying up to 200 lbs the broom travels at 400ft and carrying up to 400 lbs the broom travels 300ft. The broom can be commanded to auto-pilot to any destination named by the owner at a speed of 40ft, so long as the owner is reasonably familiar with the location and layout of the intended destination. The broom can be summoned to its rider with a command word from as far as 300 yards away. Its aerial agility level is IV (see Chapter 3). Every known broom of flying reported has the name “Hazel” engraved upon the handle.
source: OSRIC_3.0_Gamemaster_Guide.pdf
