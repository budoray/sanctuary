name: Ring of Spell Storing
classes: any
description: 'A ring that can magically store 2–5 spells and grants the wearer the ability to cast them as if they were a spell caster of the required type. Casting a spell from the ring requires 5 segments. Roll d100, a roll of 01–70 means the ring stores magic user spells and 71–00 indicates clerical spells. 10% of magic user rings of spell storing will contain illusionist spells instead, and 25% of clerical rings of spell storing will contain druid spells instead. Roll 2d4 to determine number of spells the ring can contain. To randomly determine the spell levels of each spell, roll 1d6 (on a result of 6 re-roll for level with 1d4) for cleric, druid or illusionist spells, and 1d8 (on a result of 8 re-roll for level with 1d6) for magic user spells. Once type, number, and level of spells is determined, the GM must decide which spells the ring contains. The spells can either be hand–picked or the GM may use the OSRIC magic tables and dice for spells randomly. Once the class of spells, their
  number and level, and the exact spells to be stored are determined, that capability can never be changed. Charging the ring requires a spell caster to cast the specific spell to be stored with the ring as the target of the spell. Example of Ring of Spell Storing Creation: Jerry the GM decides to place a ring of spell storing in a red dragon’s treasure hoard. He rolls a 57 on d100, indicating the ring contains magic user spells. A second d100 roll yields a 05 and this means the ring really contains spells of the illusionist class. Jerry now rolls 2d4 and gets 1 on both dice, meaning the ring will contain 2 spells total. Jerry now rolls 1d6 twice, one for each spell to determine the level of that spell. The first result is a 2, the second is a 6. The 6 needs to be re-rolled on a 1d4 and rolling that die generates a result of 4. So, the GM now knows the ring will hold 2 illusionist spells, one of level 2 and one of level 4. Jerry decides to let fate take a hand in the selection of the exact
  spells the ring stores and takes a look at the illusionist spell tables (see Chapter 2). There are twelve level 2 illusionist spells, and eight level 4 spells, so Jerry grabs a d12 and a d8 and rolls them both. The d12 rolls a 4 so Jerry notes the result of detect magic. The d8 rolls an 8 and Jerry notes the result of shadow monsters. Now that the exact properties of the ring of spell storing have been determined, they can never be changed; the ring will ever after only hold the two illusionist spells noted. If the finder of the ring uses it to cast a detect magic spell, then an illusionist must cast a detect magic upon the ring to recharge that spell slot.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
