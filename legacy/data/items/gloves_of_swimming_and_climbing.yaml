name: Gloves of Swimming and Climbing
classes: any
description: Lightweight leather gloves granting the ability to swim at 120ft and climb walls like a 10th level thief. If the wearer is already a thief of 10th level or above, add +10% to their Climb Walls chance instead. Must be used in pairs.
source: OSRIC_3.0_Gamemaster_Guide.pdf
