name: Figurines of Wondrous Power
classes: any
description: 'Tiny and skilfully-carved statuettes of creatures in various materials and forms. When the figurine is placed or thrown on the ground and the command word spoken, the statuette becomes a living creature its form resembles. Destroying a statuette shatters the magic; killing the living creature it forms causes the creature to revert to its smaller, figurine form. 1. Bronze Griffon: Becomes a griffon under command of the user. This figurine can be used twice per week with a time of 6 hours per use. When this time expires or the command word is spoken, the griffon reverts to statuette form. Market value is 10,000 gp. 2. Ebony Fly: Becomes a fly the size of a pony with hit dice and movement rate of a hippogriff but unable to make any attacks. The fly can be used up to 3 times per week for 12 hours each use. Market value is 10,000 gp. 3. Golden Lions: These figurines always come in a pair, becoming normal adult male lions on command. The lions can be used once per day for up to 1
  hour, though if slain in combat the lions are unusable for 1 week. Market value is 16,500 gp. 4. Ivory Goats: A trio of figurines, similar but distinct from one another and filling different functions. Market value is 21,000 gp. 5. The Goat of Travelling: A goat large enough to ride, with all the statistics and attacks of a heavy warhorse. This goat can travel for a cumulative 24 hours each week. 6. The Goat of Travail: Becomes a very large goat with the statistics of a nightmare plus two horn attacks for 1d8+4 each. The goat of travail also has a charging attack in which it can use its 2 horn attacks only but adding +6 damage to damage rolls. This figurine can be used once a month for up to 12 hours. 7. The Goat of Terror: This figurine becomes a goat large enough to ride, with the statistics of a light war horse. The rider can use the goat’s horns as weapons. The left one functions as a lance +2 and the right as a +3 longsword . When ridden in combat the goat of terror radiates fear
  (as the spell) in a 30ft radius. A save vs spells negates this. This figurine can be used once a fortnight for up to 3 hours total. 8. Marble Elephant: This particular figurine is larger than the others, about the size of an adult human hand. The command word causes the statuette to become a full grown elephant. The elephant can function as a beast of burden, a mount, or a combatant and will obey the user’s command. The marble elephant is usable four times per month for a period of up to 24 hours each use. Market value is 21,000 gp. 9. Obsidian Steed: Unlike the other figurines of wondrous power, this particular figurine appears as a shapeless black rock. Close inspection, however, will reveal a vague resemblance to a horse. Upon command this statuette becomes a heavy warhorse with the following special abilities, usable at will once each per round: first, the steed can fly up to 40ft per round, 30ft if rider is wearing heavy armour. Second, the obsidian steed can plane shift. Third, the
  mount and its rider (and equipment) can become ethereal. This statuette can be used once per week for up to 24 hours. Market value is 28,500 gp. 10. Onyx Dog: This statuette becomes a large dog similar to a war dog but with an intelligence of 8, the ability to track as a 10th level ranger, 60ft infravision, and can see invisible. The onyx dog is large and strong enough to bear a small creature as a rider. This figurine may be used for up to six hours in any given week. Market value is 15,500 gp. 11. Serpentine Owl: With the proper command word, this statuette becomes either a horned owl or a giant owl. This transformation can take place once per day for up to 8 hours. The owl will communicate all it sees and hears to its owner via telepathic means but, unfortunately, after three transformations into giant owl form, the statuette crumbles into useless dust. In either form, the owl is completely silent, can see in the dark, and has keen hearing. Market value is 9,100 gp. 12. Silver Raven:
  Upon command this figurine becomes a raven but retains it silvery metallic surface, giving it an AC 0 [20]. The raven can be used as a magical messenger, capable of carrying a message or small token to a designated spot and awaiting the designated recipient of the message. The raven can maintain its animated status for up to 24 hours per week, cumulative. Market value is 3,800 gp. Gauntlets of Ogre Power (ACDFPRT): Similar to a belt of giant strength, the gauntlets of ogre power permit an additional strength bonus—but the effects are lesser than a belt of giant strength, being +1d3 “to hit” and +1d6 on damage. The effect of the gauntlets is not cumulative with a belt of giant strength (exception: hammer of thunderbolts , see below) and both gauntlets must be worn to achieve the effect. Gauntlet of Rust (ACDFPRT): A single item. On a successful hit affects metal objects like a rust monster’s special attack. Protects all metal gear on the wearer’s person from all rust whether mundane or
  magical, even from a rust monster attack.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
