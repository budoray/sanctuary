name: Ring of Regeneration
classes: any
description: 'Wearing this ring allows the user to regenerate 1 hp per turn, regrow lost limbs and organs, and even return from the dead with no constitution penalty or roll. If the cause of death was due to poison, however, the poison will need to be neutralised or a saving throw made or the wearer will die again. One should note only damage accumulated while wearing the ring can be healed by the ring’s power. Removing the ring of regeneration will naturally result in the cessation of the healing process. 10% of these rings (91–100 on d100) are a special type, called rings of vampiric regeneration. Vampiric rings do not regenerate any hp per turn, but will bestow half value of all damage (rounded down) inflicted upon one’s opponents in hand–to–hand combat to the wearer of the ring. Example: If the fighter Grabbo the Lusty inflicts 11 points of damage with his longsword upon his hobgoblin opponent while wearing a ring of vampiric regeneration , up to 5 hit points of Grabbo’s damage will
  be immediately healed. This process works only with melee weapons; the ring cannot use damage caused by missile fire, hurled weapons, or spells. Note that neither type of this ring can increase the wearer’s hit points beyond the normal total.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
