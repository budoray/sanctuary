description: GORGIMERA The gorgimera looks much like a chimera, but it has gorgon’s  head
  rather than a goat’s head beside the lion and dragon  heads. Breath Weapons. The
  gorgon head breathes a cloud of petrifying  gas in a cone 30ft long and 10ft radius
  at the base (save or be  turned to stone). The dragon head is capable of breathing
  fire  to a 60ft distance, inflicting 3d8 points of damage (save for half  damage).
  Unarmed Combat.  Chimeras and gorgimeras cannot be over - borne or grappled, and
  do not employ these tactics. Chimeric is an imperfect form of the red dragon tongue,
  and is  spoken by both chimeras and gorgimeras. It is also often used  as a code
  by those familiar with the language.
