# Combat-resolution constants.

# Death and unconsciousness thresholds (HP).
death_threshold: -10
unconscious_threshold: 0

# Automatic success/failure on a d20 attack roll.
auto_hit: 20
auto_miss: 1

# Damage used when no weapon is equipped.
unarmed_damage: 1d2

# Ranged attack penalty per range increment beyond the first.
range_penalty_per_increment: -2

# Sell-back ratio for equipment (fraction of purchase price returned).
sell_back_ratio: 0.5

# Thief backstab: bonus to hit and damage multiplier.
backstab:
  to_hit_bonus: 4
  damage_multiplier: 2

# Surprise chance for each side when combat begins or a new group is met (1-6).
surprise:
  chance_in_6: 2

# Initiative: side-based d6 plus this modifier. Uses the acting side's average
# dexterity missile adjustment (OSRIC reaction/attacking adjustment).
initiative:
  dex_modifier_per_point: 1

# Encumbrance tiers (weight in lb). Movement penalty is applied to base movement.
encumbrance:
  light:
    max_weight: 75
    movement_penalty: 0
    label: Light
  medium:
    max_weight: 100
    movement_penalty: 30
    label: Medium
  heavy:
    max_weight: 150
    movement_penalty: 60
    label: Heavy
  very_heavy:
    max_weight: 999999
    movement_penalty: 90
    label: Very Heavy

# Minimum movement rate regardless of encumbrance.
min_movement: 30
