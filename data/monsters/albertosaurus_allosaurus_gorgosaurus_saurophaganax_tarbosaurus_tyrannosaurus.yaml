description: 'Tyrannosaurids and allosaurids are not related families, but  they occupy the same ecological niche: large bipedal carnivores.  Allosaurus and saurophaganax are allosaurids, the others are  tyrannosaurids. The “Number Encountered” listing allows for  two interpretations—they could be solitary predators or pack  hunters. Tyrannosaurus: Cretaceous carnivore, long thought to be the  largest land carnivore of the dinosaur age. Gorgosaurus: Cre- taceous carnivore, smaller than tyrannosaurus. Tarbosaurus:  Cretaceous carnivore, closely related to tyrannosaurus. Alberto- saurus: Much smaller Cretaceous carnivore. Allosaurus: Jurassic  carnivore. Saurophaganax: Jurassic carnivore, may be just a very  large allosaurus. HADROSAURIDS CHARONO-  SAURUS EDMONTO-  SAURUS HYPACRO-  SAURUS SAUROLOPHUS SHANTUNGO-  SAURUS TELMATO-'
