id: 2.12.4a
name: GEMSTONE VALUE
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- D100 VALUE (GP) AVERAGE
- VALUE (GP) DESCRIPTION
- 01–30 4d4 10 Ornamental Stone
- 31–55 2d4×10 50 Semi-Precious
- Stone
- 56–75 4d4×10 100 Fancy Stone
- 76–90 2d4×100 500 Precious Stone
- 91–99 4d4×100 1,000 Gem
- 00 2d4×1,000 5,000 Jewel
- Gems can be increased in value by a gemcutter. See Table
- '2.2.2g: Gemcutters.'
- 2.12.4.2. GEM TYPES, BY VALUE
- When describing gems to the players, all they will usually know
- 'is the “type” of gem: a piece of lapis lazuli versus a blue dia -'
- mond.
- 'Ornamental: Banded, eye, or moss agate; azurite; blue quartz;'
- hematite; lapis lazuli; malachite; obsidian; rhodochrosite; tiger
- eye; turquoise; freshwater pearl.
- 'Semi-Precious: Bloodstone; carnelian; chalcedony; chryso -'
- prase; citrine; iolite, jasper; moonstone; onyx; peridot; rock
- crystal (clear quartz); sard; sardonyx; rose, smoky, or star rose
- quartz; zircon.
- 'Fancy: Amber; amethyst; chrysoberyl; coral; red or brown–'
- green garnet; jade; jet; white, golden, pink, or silver pearl; red
- spinel, red–brown or deep green spinel; tourmaline.
- 'Precious: Alexandrite; aquamarine; violet garnet; black pearl;'
- deep blue spinel; golden yellow topaz.
- 'Gem: Emerald; white, black, or fire opal; blue sapphire; fiery'
- yellow or rich purple corundum; blue or black star sapphire;
- star ruby.
- 'Jewel: Clearest bright green emerald; blue–white, canary, pink,'
- brown, or blue diamond; jacinth.
- 2.12.5.  JEWELLERY
- Where the GM wishes to determine the nature of a piece of jew-
- ellery, Table 2.12.5a may be used. Roll d100 to determine the
- form of the jewellery (whether the players have found a goblet
- or a ring, for example), and a d10 to determine its composition
- (whether it be plain silver or gem–encrusted gold, for example).
- 'Example: A die roll of 09 (Belt) and 10 (silver and gems, when'
- checking a belt) means that the piece of jewellery is a silver belt
- studded with gems, worth a total of 5d6 x100 gp.
- As with gems, the value of jewellery is not adjusted up or down
- based on the difficulty level of the monster that owned it. A
- weak monster might be in possession of a highly valuable piece
- of jewellery.
