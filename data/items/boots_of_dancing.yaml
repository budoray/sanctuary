name: Boots of Dancing
classes: any
description: Footwear which appears to be any one of a number of magicked boots. When the wearer is engaged in or fleeing from combat, however, the boots of dancing will show their true nature. The wearer will begin to dance as if the 8th magic user spell irresistible dance had been cast upon him or her for the duration of the battle. When hostilities cease, if the character survived the dancing will stop until the next battle. Up until the first time the curse is revealed the boots may be removed at will but afterwards, only a remove curse will free the user from this malign footwear.
source: OSRIC_3.0_Gamemaster_Guide.pdf
