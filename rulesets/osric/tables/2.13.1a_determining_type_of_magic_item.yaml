- Miscellaneous Weapons Type
- '10–13 Potions. Proceed to Table 2.13.1F:  Potion'
- Properties
- '14 Rings. Proceed to Table 2.13.G:  Ring Properties'
- 15  Rods,  Staves and  Wands. Proceed to Table
- '2.13.1H:  Rods,  Staves and  Wands Properties'
- '16–18  Scrolls. Proceed to Table 2.13.1I: Scroll Type'
- 19–20 Swords. Proceed to Tables 2.13.1L and M
