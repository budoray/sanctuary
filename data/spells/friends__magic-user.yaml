name: Friends
slug: friends
reversible: false
class: magic-user
level: 1
school: Arcane Enchantment/Charm
range: Caster
duration: 1 round/caster level
area_of_effect: 10-ft radius+10-ft/caster level
components: V,S,M
casting_time: 1 segment
saving_throw: See below
text: This spell increases the magic user's charisma in the eyes of all creatures within the area of effect that fail saving throws. For these creatures, the magic user's charisma will effectively be increased by 2d4 (one roll for all). For those who succeed in making the saving throw, the caster's charisma will effectively be lowered by 1d4. Unless the exact numbers are required for some purpose, the normal result of the spell will be that those who failed the saving throw will be disposed and friendly toward the caster, and those that succeeded in making the save will find him or her distasteful and somewhat suspect.
source: wiki2_spells.txt
