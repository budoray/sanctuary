name: Eyes of Doom
classes: IM
description: 'Eye lenses which cause an intense feeling of dread as a gaze attack against a single target. The target is allowed a saving throw vs petrifaction to negate. Failing the saving throw means the victim will always attack last in combat and morale checks are at -10%. The use of both lenses allows additional powers. First, the wearer can determine of anyone within 30ft whether they are: dead, undead, feigning death, neither (golems, for instance), near death (3 or fewer hit points remaining), or wounded (4 or more hit points but less than 100%). The wearer can also use fear as a gaze attack once per week, saving throw vs petrifaction allowed. The fear attack is powerful, however, and a target making its save is still -1 to all attacks, damage, and saving throws for 1 round.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
