- You only need to check once to see if you understand a spell.
- If you succeed, you understand the spell forever unless you
- choose to “drop” it from your understanding (see below).
- You’ll need to make a magical ink using special ingredients,
- which you must buy in a town or city. These ingredients cost
- 100 gp per level of the spell that you’re copying. Copying the
- spell takes one hour per level of the spell. As soon as you finish
- copying it, you know that spell, and at the same time the spell
- disappears from the source text, leaving blank space as if it had
- never been written. When you copy the last spell from a scroll or
- spell book, that scroll or spell book crumbles to dust.
