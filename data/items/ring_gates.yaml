name: Ring Gates
classes: any
description: Paired 18-in diameter iron rings. When the pair are located on the same plane of existence and within 100 miles of each other, anything pushed through one ring will at once come out of the other ring. Up to 100 lbs of material can pass through in one day, though items partially pushed through then retracted (a hand, for instance) will not count against the total. Anything small enough to pass through the gate can do so, including small living creatures. Attacks, messages, and spells, can pass through the gate as well. The entry and exit side of both rings are plainly marked.
source: OSRIC_3.0_Gamemaster_Guide.pdf
