id: 2.2.2k
name: SAGE’S CHANCE TO KNOW ANSWER
source: OSRIC_3.0_Gamemaster_Guide.pdf
lines:
- 'QUESTION IS: GENERAL SPECIFIC EXACTING'
- Out of Fields 35% 10% 1%
- In Minor Field 50% 35% 15%
- In Major Field 70% 60% 35%
- In Special Category 90% 75% 50%
- EXAMPLES OF THE DIFFERENT TYPES OF QUESTIONS
- 'General: Do humanoids inhabit the region north of the Great'
- Mountains?
- 'Specific: Do hobgoblins of the Three Skulls tribe live in the re-'
- gion north of the Great Mountains?
- 'Exacting: Do the hobgoblins of the Three Skulls tribe living in'
- the region north of the Great Mountain possess the dread
- artifact known as “The Great Spear of Kaliban”?
- Sages do not carry all their knowledge in their heads. They need
- access to a library at a minimum. Sages are scholarly, eccentric
- types and a PC offering to hire one will be expected to provide
- private living spaces far away from noise and the bustle of activ-
- ity. The minimum quarters a sage would accept consists of four
- 'separate rooms of no less than 200 square ft each: living quar -'
- ters, study, library, and workroom. Depending upon the field of
- speciality, the sage may also request various other areas, such
- as a zoo for housing living creatures for study, or a greenhouse
- for the study of plants. The average sage will see the player as
- an opportunity to acquire additional materials for study and
- categorisation and will, in all likelihood, demand far more for
- their work than they will actually need. At any rate, the busier
- the sage is kept and the more often their studies are interrupt -
- ed, the more materials and money they will likely demand.
- 'Sage Characteristics: If a sage is to be hired for a long period'
- of time, their abilities and alignment may be determined as
- follows.
- 'STRENGTH: 1d8+6 INTELLIGENCE: 1d4+14'
- 'DEXTERITY: 3d6 WISDOM: 1d6+12'
- 'CONSTITUTION: 2d6+3  CHARISMA: 2d6+3'
- 'ALIGNMENT: See following'
- 'table HIT POINTS: 4d6'
