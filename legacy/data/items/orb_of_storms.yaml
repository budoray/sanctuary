name: Orb of Storms
classes: CD
description: 'An 8-in glass sphere which enables the owner to control weather as the spell once daily. Once per month the bearer of the orb can completely change the weather into a mighty storm. A mighty storm creates a giant black thunderhead with giant flashes of lightning and booming thunder, with the following effects per round. (Note: ranged attacks and spell casting within the area of the storm are impossible due to the violent weather conditions. The owner of the orb is also protected from any natural weather conditions, including extreme heat or cold.) • 1st Round: Anyone under the cloud must save vs spells or be deafened by the thunder for 1d4×10 minutes. • 2nd Round: Acid rain pelts down upon the unlucky victims, dealing 1d6 points of damage. No save allowed. • 3rd Round: Lightning strikes, up to six 10d6 bolts. No target may be hit by more than one bolt. • 4th Round: Hailstones deal 5d6 points bludgeoning damage to targets, no save. • 5th–10th Rounds: Violent rain and wind gusts
  reduce visibility to 5ft, including all types of low light vision. Attacks upon creatures within 5ft are at -4, attacks on creatures farther away are at -10 and sight cannot be used to locate target.'
source: OSRIC_3.0_Gamemaster_Guide.pdf
