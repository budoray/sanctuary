name: Ring of Clumsiness
classes: any
description: Looks, acts, and responds to detect magic exactly like a ring of feather falling until placed on the finger, then the wearer becomes very clumsy. The victim of this curse takes a -4 penalty to dexterity, and magic spells requiring a somatic component have a 20% chance of failure when cast.
source: OSRIC_3.0_Gamemaster_Guide.pdf
